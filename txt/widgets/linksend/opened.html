<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Test link received ✓</title>
<!-- The page Send to device's Test opens (txt/widgets/linksend/). Static, no scripts beyond reading ?from=. -->
<style>
  :root { --bg: #fafaf9; --surface: #fff; --text: #1c1917; --muted: #78716c; --border: #e2e0dc; --ok: #16a34a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111110; --surface: #1a1918; --text: #e7e5e3; --muted: #8c8a87; --border: #333231; --ok: #22c55e; } }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 460px; margin: 12vh auto 0; padding: 28px 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; text-align: center; }
  .ok { width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 50%; background: var(--ok); color: #fff; font-size: 34px; line-height: 64px; animation: pop .4s cubic-bezier(.16,1,.3,1); }
  h1 { font-size: 21px; margin: 0 0 8px; }
  p { margin: 0 0 10px; color: var(--muted); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<main>
  <div class="ok" aria-hidden="true">✓</div>
  <h1>The test link arrived</h1>
  <p>Sent from <b id="from">your device</b> through Cade.txt’s Send to device.</p>
  <p>If this tab opened by itself, pop-ups are allowed and links will open here on their own. If you had to tap <b>Open</b>, allow pop-ups for this site and test again.</p>
  <p>You can close this tab.</p>
</main>
<script>
  try { var f = new URLSearchParams(location.search).get('from'); if (f) document.getElementById('from').textContent = f.slice(0, 40); } catch (e) {}
</script>
</body>
</html>
