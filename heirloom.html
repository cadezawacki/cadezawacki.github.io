 ]},

crisis:{id:"crisis",kind:"crisis",
 eyebrow:G=>"The Crisis",title:G=>G.w.threat.crisis,
 setup:G=>({score:crisisScore()}),
 text:G=>{
  const t=G.w.threat, s=G.v.score;
  let lead=P(threatOpening(t));
  lead+=P(s>=3?`You are, by accident and by four decades of unglamorous decisions, better placed than almost anyone in this county.`
        :s>=1?`You are not ready. You are less unready than most, which will have to do.`
        :`You are not ready at all. Nobody in this house is, and everybody in this house is looking at you.`);
  return lead;
 },
 choices:[
  {t:"Meet it head on, with everything.",cls:"risky",
   do:G=>resolveCrisis(G,"front")},
  {t:"Shelter what you can. Give up the rest.",
   do:G=>resolveCrisis(G,"shelter")},
  {t:"Turn it to profit. Someone will.",when:G=>G.c.stats.cunning>=5||G.c.stats.coin>=5,
   do:G=>resolveCrisis(G,"profit")},
  {t:G=>`Put it in the hands of ${G.w.faith.god}.`,when:G=>G.c.stats.faith>=5,
   do:G=>resolveCrisis(G,"faith")},
 ]},

reckoning:{id:"reckoning",kind:"crisis",
 eyebrow:G=>"The Reckoning",title:G=>"What this house is for",
 text:G=>P(`Four generations. You are the fourth, and you can feel the shape of it now the way you can feel weather in a joint: what your great-grandparent started, what your grandparent bent, what your parent paid for.`)
  +P(`The realm is being re-made — ${realmMood()} — and houses are being sorted into what they will be for the next two hundred years. There is one decision left that is genuinely yours.`),
 choices:[
  {t:"Reach for the crown, or the closest thing to it.",cls:"risky",
   when:G=>G.h.standing>=38,
   do:G=>{G.hflag("path_crown");G.hs("standing",8);
    const ok=G.h.standing+G.h.strength*3+(G.hf("allies")?15:0)+G.ri(0,20)>=80;
    if(ok){G.rank(1);G.hflag("crowned");G.legend(`${G.c.name} of ${G.h.name} took a seat among the great houses of the realm, four generations after a grant that was written small.`);
     return P(`It is done with law, marriage, and a well-timed absence of mercy, and it takes six years.`)
     +P(`When it is finished you are addressed by a title your great-grandparent could not have said aloud without being laughed out of the hall.`);}
    G.hs("standing",-14);G.loseLand(1);
    return P(`You reach, and you are seen reaching, and the great houses close over the gap like water.`)
    +P(`It costs you a holding and a decade and the last of the goodwill your parent banked. The house survives. The ambition does not.`);}},
  {t:G=>`Bind the house to ${G.w.faith.name}. Outlive the kings.`,
   when:G=>G.h.piety>=40,
   do:G=>{G.hflag("path_church");G.hs("piety",20);G.hs("coffers",-2);
    G.legend(`${G.h.name} bound itself to ${G.w.faith.name}: two of every generation given, and the ${G.w.faith.temple} at ${G.h.seat} made the greatest between the coast and the capital.`);
    return P(`You give land, you give children, you give the great hall's east wing, and you take in return the one thing the ${G.w.faith.name} actually has to give: permanence.`)
    +P(`Dynasties will fall in this realm. The ${G.w.faith.temple} at ${G.h.seat} will still be there, and your name will still be read out in it.`);}},
  {t:"Take the ports and the roads. Let others take the titles.",
   when:G=>G.h.coffers>=5||G.c.stats.coin>=5,
   do:G=>{G.hflag("path_coin");G.hs("coffers",8);G.hs("standing",3);
    G.legend(`${G.h.name} put its money into ships, bridges and warehouses rather than titles, and within a lifetime half the realm's wool moved through its hands.`);
    return P(`Warehouses at the port, a share in eleven ships, the bridge tolls, and quiet loans to three houses that outrank you and will not, in a generation, out-spend you.`)
    +P(`Nobody sings about this. Everybody borrows from it.`);}},
  {t:"Hold the valley. Nothing more. Nothing less.",cls:"tender",
   do:G=>{G.hflag("path_root");G.hs("standing",2);G.hs("coffers",2);
    G.legend(`Offered the realm, ${G.c.name} of ${G.h.name} chose the valley, and the valley knew it.`);
    return P(`You decline the summons, the marriage, and the offer, and you spend the money on the road, the mill, and the roof.`)
    +P(`Four hundred years from now there will be people farming this ground with your family's name on the deeds and no idea that anything was ever decided.`);}},
  {t:"Break the realm's hold. Rule here as your own.",cls:"risky",
   when:G=>G.h.strength>=5&&G.h.standing>=30,
   do:G=>{G.hflag("path_rebel");G.flag("spilledBlood");
    const ok=G.h.strength*4+G.h.standing+(G.hf("walls")?20:0)+G.ri(0,25)>=95;
    if(ok){G.hflag("independent");G.rank(1);
     G.legend(`${G.h.name} threw off the Crown's writ in the valley and made good on it, and was never brought back under it.`);
     return P(`Two hard summers, one siege that the walls hold, and a negotiated silence in which nobody uses the word rebellion.`)
     +P(`The Crown's writ stops at your boundary stones. It is a small country and it is entirely yours.`);}
    G.hs("standing",-20);G.loseLand(2);G.hs("strength",-4);G.hflag("attainted");
    return P(`It goes exactly as everyone warned. The Crown is slow, and then it is not slow.`)
    +P(`You keep your head, which is more than your grandfather's rival managed, and you lose two holdings and every claim you had to anything beyond this valley.`);}},
 ]},

death:{id:"death",kind:"death",
 eyebrow:G=>"The End",title:G=>"Last words",
 setup:G=>({room:S.c.spouse&&S.c.spouse.alive?S.c.spouse.name:(S.c.kids.filter(k=>k.alive)[0]||{name:"the steward"}).name}),
 text:G=>P(deathOpening())
  +P(`${G.v.room} is in the room. The fire is too high; nobody will lower it. There is time for one thing, said once, and the whole household is going to repeat it for eighty years, accurately or not.`),
 choices:[
  {t:"Speak about the land.",
   do:G=>{G.hflag("lastWords_land");
    G.legend(`${G.c.name}'s last words at ${G.h.seat}: <em>&ldquo;The lower field first, then the wall. In that order.&rdquo;</em>`);
    return P(`You get the order of works right, which is the last useful thing you do, and you die mid-sentence about drainage.`)
    +P(`The household finds this either magnificent or unbearable, and the split runs along exactly the lines you would have predicted.`);}},
  {t:"Speak to the one beside you.",cls:"tender",
   do:G=>{G.hflag("lastWords_love");if(G.c.spouse)G.bond("spouse",10);
    G.legend(`${G.c.name}'s last words were not written down, because ${G.v.room} would not repeat them to anyone, ever, including on ${G.c.g==="f"?"her":"his"} own deathbed.`);
    return P(`Whatever it is, you say it quietly and it takes a while and it is not for the room.`)
    +P(`${G.v.room} sits with you until morning and afterward refuses, politely and permanently, to tell the chronicler what was said.`);}},
  {t:"Confess.",when:G=>G.c.traits.some(t=>TRAITS[t]&&TRAITS[t].k==="dark")||G.f("spilledBlood"),
   do:G=>{G.hflag("lastWords_confess");G.flag("forgiven");G.hs("piety",8);
    G.legend(`${G.c.name} confessed at the end, at length and in front of witnesses, and the ${G.w.faith.cleric} looked increasingly unhappy.`);
    return P(`You say the true version. Not the useful one. It takes longer than anyone in the room has budgeted for and two people leave.`)
    +P(`Your heir hears all of it. That was either a gift or the worst thing you ever did to them, and you die genuinely not knowing which.`);}},
  {t:"Say nothing. Look at the window.",
   do:G=>{G.hflag("lastWords_silence");
    G.legend(`${G.c.name} said nothing at the end, and looked at the window, and the household argued for a century about what that meant.`);
    return P(`The light is doing something on the wall that you have seen ten thousand times in this room and never once looked at properly.`)
    +P(`You look at it properly. It takes about four minutes. Then you are not there.`);}},
 ]},
};

function threatOpening(t){
  return {plague:`It comes up the road the way weather comes: nothing, nothing, and then the mill-family are dead in three days and the ${S.w.faith.cleric} is burning cloth in the yard.`,
   invasion:`They come at first light with the tide behind them, and they are not raiders looking for a monastery. There are nine hundred of them and they have brought horses.`,
   war:`The King is dead in the night and three men have claimants' banners sewn already, which tells you everything about how long this has been coming.`,
   famine:`The third harvest fails and this time there is nothing underneath it. The granaries are echoing by the first frost and there are four months of winter in front of you.`,
   schism:`The hill country goes up in one week — priests dragged out of ${S.w.faith.temple}s, tithe-barns burning, and a doctrine that is spreading faster than the fires.`}[t.kind];
}
function crisisScore(){
  const t=S.w.threat,h=S.h,c=S.c;let s=0;
  const has={walls:h.flags.walls,physic:h.flags.physic,stores:h.flags.stores,
    allies:h.flags.allies,levies:h.strength>=5||h.flags.drilled,
    court:h.flags.courtFavour||h.flags.clerkFriend,coin:h.coffers>=8,piety:h.piety>=60};
  t.prep.forEach(k=>{if(has[k])s++;});
  if(h.standing>=34)s++;
  if(h.coffers>=7)s++;
  if(c.stats.cunning>=7||c.stats.iron>=7)s++;
  return s;
}
function resolveCrisis(G,mode){
  const s=G.v.score+(mode==="front"?G.c.stats.iron>=5?1:0:0)+(mode==="profit"?1:0)+(mode==="faith"?(G.h.piety>=60?2:0):0);
  const t=G.w.threat;
  G.flag("facedCrisis");
  if(s>=3){
    G.wflag("threat_"+t.id,"triumph");G.hs("standing",14);G.hs("coffers",mode==="profit"?6:-2);
    G.rank(1);
    G.legend(`When ${t.name} came, ${G.h.name} of ${G.h.seat} did not break — and three houses that did break came to ${G.c.name} afterward.`);
    return P(crisisText(t,"triumph",mode))
      +P(`When it is over the county is re-ordered, and you are further up it than you were, and everyone knows precisely why.`);
  }
  if(s>=2){
    G.wflag("threat_"+t.id,"endure");G.hs("standing",4);G.hs("coffers",-3);G.hs("strength",-1);G.peril(1);
    G.chron(`${G.h.name} came through ${t.name} thinner, poorer, and still holding ${G.h.seat}.`);
    return P(crisisText(t,"endure",mode))
      +P(`You hold. That is the whole of it: you hold, and it costs you a third of everything, and holding turns out to be the rare outcome.`);
  }
  G.wflag("threat_"+t.id,"broken");G.hs("standing",-12);G.hs("coffers",-4);G.hs("strength",-3);G.loseLand(1);G.peril(2);
  if(G.c.spouse&&G.c.spouse.alive&&G.chance(.4))G.kill("spouse","in the "+t.kind);
  else if(G.c.kids.filter(k=>k.alive).length>1&&G.chance(.5))G.kill("kid:"+(G.c.kids.length-1),"in the "+t.kind);
  G.chron(`${t.name} broke over ${G.h.seat} and the house did not hold. What came after was survival, not lordship.`,"grim");
  return P(crisisText(t,"broken",mode))
    +P(`It takes everything and gives nothing back, and afterward you are a smaller family in a smaller house, and the county knows it.`);
}
function crisisText(t,band,mode){
  const M={front:"You meet it in the open, personally, in front of everyone.",
   shelter:"You pull everyone inside the walls and the wood and let the rest of it go.",
   profit:"You find, inside the disaster, the one transaction nobody else has the stomach for.",
   faith:"You put it in the hands of the god and the ${c}, and stand behind them where the whole valley can see you standing."}
   [mode].replace("${c}",S.w.faith.cleric);
  const B={triumph:"It works. Not neatly, and not without cost, but it works, and it works visibly.",
   endure:"It half-works. Half is what there was.",
   broken:"It does not work. There was never really a version of this where it worked."}[band];
  return M+" "+B;
}
function realmMood(){
  const r=S.w.flags["threat_"+S.w.threat.id];
  if(r==="triumph")return "steadier than it has been in a century, and hungry for houses that proved themselves";
  if(r==="broken")return "half-wrecked, with three counties leaderless and the Crown's writ thin";
  return "shaken, patched, and quietly re-drawing every boundary it can get away with";
}
function deathOpening(){
  const c=S.c;
  if(c.cause==="peril")return `It is the chest, in the end, as the physician said it would be, and it takes eleven days.`;
  if(c.cause==="violence")return `It is a wound that will not close, and a fever after it, and it is quick enough that there is no time to send for anyone far away.`;
  if(c.age<45)return `You are ${c.age}. Nobody in this house has said the word yet and everybody has arranged their face.`;
  return `You are ${c.age} and the winter has settled into you and is not going to leave. There is no drama in it. There is a great deal of tidying.`;
}

/* ---- marriage helper ---- */
function wed(G,i){
  const cd=G.v.c[i];
  S.c.spouse={name:cd.name,g:cd.g,house:cd.house,bond:cd.bond,alive:true,traits:cd.traits};
  G.hs("coffers",cd.dowry);
  G.hs("standing",cd.std);
  G.hs("strength",cd.str);
  if(cd.arms){S.h.arms.impaled={field:cd.arms.field,alt:cd.arms.alt,div:cd.arms.div,metal:cd.arms.metal,charge:cd.arms.charge,augments:[]};
    G.note("The arms are impaled");}
  G.chron(`${G.c.name} of ${G.h.name} married ${cd.name} of ${cd.house}.`);
  if(cd.kind==="rich")return P(`The contract is nine pages long and the marriage is four hours long and the feast is two days long.`)
    +P(`${cd.name} arrives with money, opinions about the money, and a lasting bewilderment at how this house has been run. Within three years the accounts are unrecognisable and the mood is worse.`);
  if(cd.kind==="peace"){G.w.rival.att=Math.min(60,G.w.rival.att+45);G.hflag("rivalMarriage");
    return P(`Both families sit on their own side of the ${G.w.faith.temple} and nobody eats much. The old men will not look at each other.`)
    +P(`${cd.name} came here as a treaty. Whether ${cd.g==="f"?"she":"he"} becomes anything else is entirely up to the next forty years, and neither of you has any idea yet.`);}
  G.trait("Beloved");G.flag("marriedForLove");
  return P(`The valley is delighted. The county is appalled. Your steward asks, once, whether you have considered the standing of the house, and you say yes, and that is the end of the discussion.`)
    +P(`There is no dowry and no alliance and no advantage of any kind. You will get forty years of somebody who chose you back.`);
}
function regKids(G){
  const base=S.c.kids.length;
  S.c.kids=S.c.kids.concat(G.v.kids);
  S.pending.newKidIdx=G.v.kids.map((k,i)=>base+i);
}
function nameKidsForm(G,pre){
  S.pending.pre=pre;
  const f=(S.pending.newKidIdx||[]).map((idx,i)=>({k:"k"+i,label:"The "+["first","second","third","fourth"][i]+" is called",ph:S.c.kids[idx].name}));
  if(!f.length)return pre;
  return G.form({title:"Names",fields:f,applyId:"children"});
}

/* ================================================================
   LEGACY — the past comes to collect
   ================================================================ */
const LEGACY={
blood_debt:{eyebrow:"An Old Debt",title:sd=>`The kin of ${sd.who}`,
 text:(G,sd)=>P(`A man rides into the yard alone and asks for you by name. He is the ${G.pick(["son","nephew","grandson"])} of ${sd.who}, who died at the hands of this house ${S.c.gen-sd.gen} generation${S.c.gen-sd.gen>1?"s":""} ago.`)
  +P(`He does not want a fight. He has, he says, spent his whole life being told a story about your family, and he has come to see whether it is true.`),
 choices:[
  {t:"Tell him exactly what happened. All of it.",cls:"tender",
   do:(G,sd)=>{G.flag("forgiven");G.hs("standing",3);G.trait("Just");
    G.chron(`${G.c.name} told the kin of ${sd.who} the truth of the old killing, and was believed.`);
    return P(`You tell it as it is written in the chronicle, including the part where your ancestor was wrong, and you do not soften it.`)
    +P(`He is quiet a long time. Then he says, ${SAID("&ldquo;They told me you would lie,&rdquo;")} and rides out, and the thing that has been between these families for sixty years goes with him.`);}},
  {t:"Offer him land and silence.",
   do:(G,sd)=>{G.hs("coffers",-3);G.hs("standing",1);G.seed({type:"blood_debt",who:sd.who,house:sd.house});
    return P(`Two virgates and a house on the far edge of the holding, in exchange for the matter being closed.`)
    +P(`He takes it, because he has children. He also tells them where it came from, and why, which is not what you paid for.`);}},
  {t:"Have him removed from the land.",
   do:(G,sd)=>{G.trait("Feared");G.hs("standing",-3);G.seed({type:"blood_debt",who:sd.who,house:sd.house});
    G.chron(`The kin of ${sd.who} came to ${G.h.seat} and were put off the land at spear-point. The debt was not settled; it was postponed.`,"grim");
    return P(`Four riders escort him to the boundary and one of them is unnecessarily thorough about it.`)
    +P(`This is now a thing that gets handed down on both sides. Your great-grandchild will inherit it without ever knowing what started it.`);}},
 ]},

bitter_sibling:{eyebrow:"The Family",title:sd=>`${sd.who} has not forgotten`,
 text:(G,sd)=>P(`${sd.who} — passed over, sent away, or simply never chosen — has spent the years since building something. Not an army. Worse: a case.`)
  +P(`There are letters to the Crown's clerk, a claim on two fields, and a sympathetic ear at ${G.w.rival.name}. It is all perfectly legal and it is aimed directly at the base of this house.`),
 choices:[
  {t:"Settle. Give them the fields and a title.",
   do:(G,sd)=>{G.loseLand(1);G.hs("standing",-2);G.flag("forgiven");
    return P(`It costs you a holding and an afternoon of being talked to in a tone you have not been addressed in since childhood.`)
    +P(`The claim is withdrawn. The relationship is not repaired. But there is a version of this family in which those two things were the same, and you have just found out this is not it.`);}},
  {t:"Fight it. You have the deeds.",cls:"risky",
   do:(G,sd)=>{G.hs("coffers",-2);
    if(G.c.stats.cunning+G.ri(0,6)>=7){G.hs("standing",3);G.hflag("wonSuit");
     return P(`Four years of law and a clerk who is very good and very expensive. You win on the documents, comprehensively.`)
     +P(`${sd.who} is left with nothing and a grievance, and lives another thirty years, and every single one of them is spent within twelve miles of you.`);}
    G.loseLand(1);G.hs("standing",-6);
    return P(`Four years of law and a bad first ruling that everything afterward is built on. You lose the fields and the costs.`)
    +P(`Your own steward warned you. That is the part that will keep you awake.`);}},
  {t:"Bring them back into the house. Give them work.",cls:"tender",
   do:(G,sd)=>{G.hs("standing",2);G.hs("coffers",1);G.flag("forgiven");G.hflag("familyMended");
    G.chron(`${sd.who}'s claim was answered not in law but with an office in the house, and it ended there.`);
    return P(`You offer the stewardship of the outer holdings — real authority, real money, and a seat at your table that everyone can see.`)
    +P(`They take it in about ninety seconds, which tells you what the claim was actually about.`);}},
 ]},

church_grudge:{eyebrow:"The Temple",title:sd=>`The ${S.w.faith.temple} remembers`,
 text:(G,sd)=>P(`A visitation. Three clerics, a clerk, and a list — and on the list, in a hand that died two generations ago, is the exact weight of every sack this house has ever been short.`)
  +P(`They are not angry. That is what makes it frightening. They have simply been waiting for a generation with something to lose.`),
 choices:[
  {t:"Pay all of it. With interest.",
   do:(G,sd)=>{G.hs("coffers",-5);G.hs("piety",25);G.hflag("tithesSquared");
    return P(`It empties the chest and takes the roof money and there is no ceremony at all; a clerk writes a line and closes the book.`)
    +P(`The ${G.w.faith.name} does not thank people. It simply stops being a problem, which from an institution that old is a considerable gift.`);}},
  {t:"Dispute every entry. Line by line.",
   do:(G,sd)=>{G.stat("cunning",1);G.hs("piety",-10);
    return P(`Eleven days in the accounts room with your steward, the clerk, and a growing mutual respect. You find fourteen errors. Nine are theirs.`)
    +P(`The final figure is a third of the original and it is paid, and everyone leaves with their dignity and nobody with their goodwill.`);}},
  {t:"Give them the east manor instead. Land, not coin.",
   do:(G,sd)=>{G.loseLand(1);G.hs("piety",20);G.hs("standing",2);G.hflag("churchLand");
    return P(`A whole manor, given in perpetuity, with your name in the foundation and a chantry attached.`)
    +P(`You have converted a debt into a monument, which is the oldest trick in this kingdom and it works every time.`);}},
 ]},

debt_called:{eyebrow:"The Ledger",title:sd=>"The lenders come",
 text:(G,sd)=>P(`The loan your ${S.c.gen-sd.gen===1?"parent":"grandparent"} took has been sold twice and is now held by a consortium at the port who have never seen this valley and never intend to.`)
  +P(`They want it settled. They have been extremely polite about it for two years, and the letter in front of you is the first one that is not polite.`),
 choices:[
  {t:"Sell a holding and clear it.",
   do:(G,sd)=>{G.loseLand(1);G.hs("coffers",2);G.hflag("indebted",false);G.hs("standing",-3);
    return P(`It goes for less than it is worth because everyone knows why you are selling.`)
    +P(`The debt is gone. The house is smaller and clean, and you find you can breathe in a way your parent never could.`);}},
  {t:"Refuse. Let them try to enforce it here.",cls:"risky",
   do:(G,sd)=>{G.hs("standing",-6);G.hflag("badCredit");G.trait("Iron-willed");
    G.seed({type:"debt_called",who:sd.who});
    return P(`They cannot easily enforce it here, which is true, and which is not the same as being safe.`)
    +P(`No merchant in the port will deal with your wool at a decent price for the rest of your life. You have saved the money and lost the market.`);}},
  {t:"Marry into it.",when:G=>G.c.kids.some(k=>k.alive),
   do:(G,sd)=>{G.hflag("indebted",false);G.hs("coffers",2);G.bond("kid:0",-18);G.hs("standing",-1);
    G.chron(`The port debt was settled by marriage, and a child of ${G.h.name} went to live above a counting-house.`);
    return P(`Their eldest for your eldest, the debt written off as the dowry, and everyone at the signing pretending this is a joyful occasion.`)
    +P(`Your child is polite to you at the wedding. Your child is polite to you for the rest of your life.`);}},
 ]},

martyr:{eyebrow:"The Word",title:sd=>`The tree where ${sd.who} was taken`,
 text:(G,sd)=>P(`They still leave things at the stump. Bread, mostly, and small carved figures, and once a year in the spring a great many candles that nobody admits to lighting.`)
  +P(`${sd.who} has become, in the years since this house handed ${G.pick(["her","him"])} over, considerably more powerful dead than alive. The ${G.w.faith.cleric} wants the stump dug out. The village has views.`),
 choices:[
  {t:"Dig it out. Salt the ground.",
   do:(G,sd)=>{G.hs("piety",10);G.hs("standing",-8);G.trait("Feared");G.hflag("saltedGround");
    G.chron(`The stump above the mill was dug out and the ground salted on the order of ${G.c.name}.`,"grim");
    return P(`It takes two days and eleven men and by the second evening there is a crowd standing at the edge of the field not saying anything.`)
    +P(`They start leaving the candles at a different tree within a month. You cannot cut down a wood.`);}},
  {t:G=>`Leave it. Say nothing to the ${G.w.faith.temple}.`,
   do:(G,sd)=>{G.hs("piety",-8);G.hs("standing",4);G.hflag("tolerated");
    return P(`You write back that you have inspected the site and found only agricultural activity, which is a sentence you enjoy composing.`)
    +P(`The candles continue. The village understands exactly what you did and never mentions it, and their rents come in first, every year, without fail.`);}},
  {t:G=>`Build a chapel over it. Take the cult inside ${G.w.faith.name}.`,
   when:G=>G.c.stats.cunning>=5,
   do:(G,sd)=>{G.hs("coffers",-3);G.hs("piety",14);G.hs("standing",7);G.flag("built");G.hflag("shrine");
    G.legend(`${G.c.name} raised a chapel over the stump where ${sd.who} was taken, and the pilgrims who came to curse this house came instead to pray in it.`);
    return P(`It is the most cynical thing you ever do and it is also, arguably, a kindness. Both are true and you decline to separate them.`)
    +P(`Pilgrims come. Pilgrims spend. Within twenty years the ${G.w.faith.name} has quietly canonised the problem and this house owns the door.`);}},
 ]},

heresy_grows:{eyebrow:"The Word",title:sd=>"The new faith at your gate",
 text:(G,sd)=>P(`What was two hundred people in a wood is now most of the valley and half the county. They have their own book, their own funerals, and a strong and specific memory of which houses protected them.`)
  +P(`The Crown has begun to take an interest. So has the ${G.w.faith.temple}. Both of them are going to ask you where you stand, and soon, and once.`),
 choices:[
  {t:"Stand with them. Openly.",cls:"risky",
   do:(G,sd)=>{G.hs("piety",-30);G.hs("standing",6);G.hflag("newFaith");G.trait("Iron-willed");
    G.legend(`${G.h.name} declared for the new faith when it was still dangerous to do so, and the valley never forgot which way this house turned.`);
    return P(`You say it in your own hall, in front of the ${G.w.faith.cleric}, who leaves before the meat.`)
    +P(`The county is now divided into houses that will fight you and houses that will die for you, and you have just found out you are the second kind of lord.`);}},
  {t:G=>`Stand with the ${G.w.faith.temple}. Put it down.`,
   do:(G,sd)=>{G.hs("piety",25);G.hs("standing",-6);G.hs("strength",-1);G.trait("Feared");G.flag("spilledBlood");G.hflag("purged");
    G.chron(`${G.c.name} put down the new faith in the valley by force, at the ${G.w.faith.temple}'s request and the Crown's convenience.`,"grim");
    return P(`It takes a season and it is done thoroughly and there are eleven houses in this valley that will be empty for a generation.`)
    +P(`The ${G.w.faith.name} rewards you handsomely. Your tenants work your fields in an absolute and permanent silence.`);}},
  {t:"Refuse to answer. Both of them.",
   do:(G,sd)=>{G.hs("piety",-8);G.hs("standing",-4);G.stat("cunning",2);G.hflag("neutral");
    return P(`Two letters, four months apart, both masterpieces of saying nothing at length.`)
    +P(`You are trusted by neither and destroyed by neither. In a schism, that is a narrow road and you walk it for thirty years without once being able to relax.`);}},
 ]},

stolen_deed:{eyebrow:"The House",title:sd=>"The fields that were never ours",
 text:(G,sd)=>P(`The deed in the chest names ${sd.who}. Two generations of this family have known and two generations have put it back in the chest.`)
  +P(`This year ${sd.who} sends a clerk to search the county records for exactly this, because they have always suspected, and the clerk is thorough, and he is currently four days from finding it.`),
 choices:[
  {t:"Give the fields back.",cls:"tender",
   do:(G,sd)=>{G.loseLand(1);G.hs("standing",8);G.trait("Just");G.w.rival.att+=50;G.hflag("returnedLand");
    G.legend(`${G.c.name} of ${G.h.name} returned the two river fields to ${sd.who}, unasked, with the original deed, and the feud of four generations ended in a single afternoon.`);
    return P(`You ride over yourself with the deed in a satchel and hand it across a table to a person who has been raised to hate you and who does not, for a full minute, understand what is happening.`)
    +P(`The house is poorer. The county talks of nothing else for a year. Something that has been wrong since before you were born is simply no longer wrong.`);}},
  {t:"Burn the deed. Deny everything.",
   do:(G,sd)=>{G.stat("cunning",1);G.hflag("burnedDeed");G.w.rival.att-=20;
    G.seed({type:"stolen_deed",who:sd.who});
    return P(`Ash, a poker, and a very calm reception for the clerk when he arrives, including full access to your own records.`)
    +P(`He finds nothing. He goes home. And the thing sits in the chest of your chest, exactly where your parent kept it and their parent before them.`);}},
  {t:"Sell them the fields. At a fair price.",
   do:(G,sd)=>{G.loseLand(1);G.hs("coffers",5);G.hs("standing",2);G.w.rival.att+=20;
    return P(`A transaction, not a confession. The price is fair and the paperwork is immaculate and the word <em>deed</em> appears nowhere in the conversation.`)
    +P(`They know. You know they know. You both prefer this to the alternative, and that is what most peace actually is.`);}},
 ]},

other_branch:{eyebrow:"The Blood",title:sd=>"The other family",
 text:(G,sd)=>P(`They are forty miles away, they farm well, and they have been using a different surname for a hundred and ten years. They also have, carefully preserved, a letter of acknowledgement in your great-great-grandparent's hand.`)
  +P(`Their eldest has ridden here to show it to you. He is remarkably like your ${G.pick(["father","mother"])} about the eyes and everyone in the hall notices within about four seconds.`),
 choices:[
  {t:"Acknowledge them. Bring them in.",cls:"tender",
   do:(G,sd)=>{G.hs("standing",4);G.hs("strength",2);G.hflag("branchJoined");G.hs("coffers",2);
    G.legend(`The lost branch of ${G.h.name} was acknowledged and brought back to ${G.h.seat} after a hundred and ten years.`);
    return P(`You seat him at the high table that night, which is a sentence the whole county repeats within a fortnight.`)
    +P(`They bring land, forty fighting men, and a grievance that dissolves the instant it is answered. It is the cheapest reinforcement this house ever receives.`);}},
  {t:"Pay them to go on being someone else.",
   do:(G,sd)=>{G.hs("coffers",-3);G.stat("cunning",1);G.seed({type:"other_branch",who:sd.who});
    return P(`An annuity, paid quarterly through a third party, in exchange for the letter and a silence.`)
    +P(`You get the letter. You do not get the silence; you get a lease on it, renewable, at a price that will rise.`);}},
  {t:"Deny it. The letter is a forgery.",
   do:(G,sd)=>{G.trait("Cruel");G.hs("standing",-2);G.seed({type:"other_branch",who:sd.who,angry:true});
    return P(`You say it loudly enough for the hall to hear and you have him escorted out, and the letter stays in his hand because you cannot take it without admitting it exists.`)
    +P(`He shows it to everyone, for forty years, in every market town between here and the coast.`);}},
 ]},

bastard_grown:{eyebrow:"The Blood",title:sd=>`${sd.who}, grown`,
 text:(G,sd)=>P(`${sd.who} is thirty now, and competent, and has your family's jaw and none of its land. ${sd.angry?"They have not come to ask for anything. They have come to be seen.":"They came because they were sent for, and they have not yet decided how they feel about that."}`)
  +P(`Your steward, who has known about this since before you did, is standing very carefully out of the way.`),
 choices:[
  {t:"Give them a place in this house.",cls:"tender",
   do:(G,sd)=>{G.hs("strength",1);G.hs("coffers",1);G.hflag("bastardIn");G.flag("forgiven");
    S.c.kin.push({name:sd.who,rel:"kin",bond:64,alive:true,g:chance(.5)?"m":"f"});
    return P(`Captain of the household, which is a real job with real money and no claim on anything.`)
    +P(`They are extraordinarily good at it. They never once ask for more, and the not-asking is present in every conversation you ever have.`);}},
  {t:"Give them money and a road out.",
   do:(G,sd)=>{G.hs("coffers",-2);
    return P(`Enough to buy a holding four counties over and start something that is theirs.`)
    +P(`They take it without comment. Twenty years later you hear the name in a merchant's list and it takes you a moment to place it.`);}},
  {t:"Set them against your rival. They have nothing to lose.",cls:"risky",
   do:(G,sd)=>{G.w.rival.att-=25;G.stat("cunning",2);G.hs("standing",2);
    G.seed({type:"blood_debt",who:sd.who,house:G.h.name});
    return P(`You give them men, money, and a target, and you never write any of it down.`)
    +P(`It works. It works well. And you have made a weapon out of a person who already had every reason to resent you, which is a thing that ages badly.`);}},
 ]},

cold_heir:{eyebrow:"The Family",title:sd=>"What was done to you",
 text:(G,sd)=>P(`You were beaten in the yard at eleven, in front of the household, and you have not thought about it in twenty years and you think about it constantly.`)
  +P(`Now your own child has done something stupid and expensive, and the whole house is waiting, and your hand is already moving in a way you did not ask it to.`),
 choices:[
  {t:"Stop. Sit down. Talk to them.",cls:"tender",
   do:(G,sd)=>{if(G.c.kids[0])G.bond("kid:0",30);G.untrait("Haunted");G.trait("Merciful");G.flag("forgiven");
    G.legend(`It was said of ${G.c.name} that the chain was broken in ${G.c.g==="f"?"her":"his"} time, in a yard, in front of witnesses.`);
    return P(`You put your hand down. It costs more than anything else you do all year.`)
    +P(`Your child does not understand what has just happened. Your child's child will grow up in a house where this is simply how it is done, and will never know that somebody once had to decide it.`);}},
  {t:"Do as was done to you.",
   do:(G,sd)=>{if(G.c.kids[0])G.bond("kid:0",-30);G.trait("Cruel");G.trait("Haunted");
    G.seed({type:"cold_heir",who:(G.c.kids[0]||{name:"the heir"}).name});
    return P(`It is over quickly and you are, for about four seconds afterward, absolutely certain that you were right.`)
    +P(`It passes. What is left is a yard, a household that has seen it, and a child who now has the same thing to hand on.`);}},
  {t:"Have the steward do it. Look away.",
   do:(G,sd)=>{if(G.c.kids[0])G.bond("kid:0",-20);G.trait("Guarded");G.bond("kin:1",-10);
    return P(`It is the coward's version and everyone present grades it as such, including the steward, who does it badly on purpose.`);}},
 ]},

outlaw_ally:{eyebrow:"The Road",title:sd=>`${sd.who}'s people still hold the road`,
 text:(G,sd)=>P(`The arrangement your ${S.c.gen-sd.gen===1?"parent":"grandparent"} made was never written down, which is why it has survived three changes of Crown policy and two sheriffs.`)
  +P(`Now the Crown is appointing a new marshal for the county, and the marshal is coming here first, and there is a man on your payroll who is technically still under sentence of death.`),
 choices:[
  {t:"Make them legal. Buy the pardons.",
   do:(G,sd)=>{G.hs("coffers",-4);G.hs("strength",3);G.hs("standing",4);G.hflag("legalised");
    return P(`Four pardons, purchased at court through the clerk, at an eye-watering price and with a straight face.`)
    +P(`You now have the best-armed, most experienced, most personally loyal retinue in the county, and every one of them is legal, and every one of them knows exactly who bought that.`);}},
  {t:"Hand them to the marshal.",
   do:(G,sd)=>{G.hs("standing",3);G.hs("strength",-2);G.trait("Oathbreaker");
    G.seed({type:"blood_debt",who:sd.who,house:"the road"});
    G.chron(`${G.c.name} gave up ${sd.who}'s men to the King's marshal, having eaten with them the week before.`,"grim");
    return P(`They are taken at dawn, in your yard, having been told to be there.`)
    +P(`The marshal is delighted. The road is unsafe again within four years and nobody in this county will make an unwritten agreement with your family for three generations.`);}},
  {t:"Warn them. Let them vanish.",cls:"tender",
   do:(G,sd)=>{G.hs("strength",-2);G.hs("standing",-2);G.hflag("keptFaith");G.flag("forgiven");
    return P(`One rider, at night, with four words. By the time the marshal arrives there is nothing on the road but the road.`)
    +P(`It costs you men you needed. Somewhere in the next county there is a family that will do absolutely anything for anyone with your name.`);}},
 ]},

court_enemy:{eyebrow:"The Court",title:sd=>`${sd.who}'s heir at court`,
 text:(G,sd)=>P(`The quarrel your family started at the King's table has been inherited on both sides, and their side has been at court continuously ever since while yours has been draining fields.`)
  +P(`Now a wardship is being awarded, or a marriage, or a charter — the details change every year and the pattern does not: whatever you apply for, their word arrives first.`),
 choices:[
  {t:"Go to court and stay there. A year if necessary.",
   do:(G,sd)=>{G.hs("coffers",-4);G.hs("standing",7);G.hflag("courtFavour");G.stat("cunning",1);
    return P(`Fourteen months of standing in cold rooms being pleasant to people you despise, at ruinous expense, while your steward runs the valley by letter.`)
    +P(`It works. That is the infuriating part: it simply works, and it would have worked forty years ago, and nobody in your family was ever willing to do it.`);}},
  {t:"Marry into their faction instead.",when:G=>G.c.kids.some(k=>k.alive),
   do:(G,sd)=>{G.hs("standing",5);G.bond("kid:0",-12);G.hflag("courtFavour");
    return P(`A cousin of theirs, for your eldest, negotiated by letter and sealed before either party has met.`)
    +P(`The quarrel does not end. It merely acquires shared grandchildren, which is how most of them end.`);}},
  {t:"Stop applying. Build where they cannot follow.",
   do:(G,sd)=>{G.hs("coffers",4);G.stat("coin",2);G.hflag("noCourt");
    return P(`You withdraw every petition, stop attending, and put the money into the mill, the bridge, and the wool.`)
    +P(`They win everything at court for thirty years and cannot understand why they are, by the end of it, the poorer house.`);}},
 ]},

hoard:{eyebrow:"The House",title:sd=>"What was buried",
 text:(G,sd)=>P(`Your ${S.c.gen-sd.gen===1?"parent":"grandparent"} told you once, in detail, where it is. The mark is on a beam in the undercroft and you have checked it, quietly, more than once.`)
  +P(`It has never been needed. It is needed now, or it is about to be, or you have simply reached the age where you would like to know whether it is real.`),
 choices:[
  {t:"Dig it up.",
   do:(G,sd)=>{if(G.chance(.75)){G.hs("coffers",7);G.hflag("hoardFound");
     return P(`Two nights, one trusted man, and a lead-lined box under the third pier of the undercroft.`)
     +P(`It is all there. It is more than you were told. Whoever buried it lied about the amount, which is either modesty or a message.`);}
    G.hs("coffers",-1);G.trait("Haunted");
    return P(`The box is there. The box is empty, and it has been empty for a long time, and the earth around it was disturbed years before you were born.`)

function computeEpitaph(){
  const c=S.c,h=S.h,t=c.traits,has=x=>t.includes(x);
  if(has("Kinslayer"))return `Of whom the family does not speak in full sentences.`;
  if(c.age<38)return `Who was not given time.`;
  if(h.flags.rivalBroken)return `Who finished it.`;
  if(h.flags.returnedLand)return `Who gave back what was never ours, and was thought mad for it.`;
  if(h.flags.hoardGiven)return `Who dug up what the family buried and handed it out at the gate.`;
  if(has("Beloved")&&has("Just"))return `Who judged fairly and was loved for it, which is rarer than either.`;
  if(has("Beloved")&&has("Merciful"))return `Who could have, and did not, and was loved for that.`;
  if(has("Cruel")&&has("Feared"))return `Whom the household obeyed quickly.`;
  if(has("Feared")&&has("Iron-willed"))return `Whom nobody in this valley ever tried twice.`;
  if(has("Oathbreaker"))return `Whose word was good until it was expensive.`;
  if(has("Drunkard"))return `Who was excellent company and a poor manager of afternoons.`;
  if(has("Haunted"))return `Who carried something and never set it down.`;
  if(has("Lame"))return `Who walked badly and outlasted the ones who walked well.`;
  if(has("Beloved"))return `Whom the valley loved, and said so, unprompted, for a long time after.`;
  if(h.flags.trueChronicle)return `Who wrote it down as it happened, which nobody had asked for.`;
  if(has("Scholar")||has("Bookish"))return `Who read, and wrote, and left the accounts in better order than anyone since.`;
  if(has("Just"))return `Who kept the law the same for cousin and cottar.`;
  if(has("Iron-willed"))return `Who did not bend, whatever it cost, and it cost.`;
  if(has("Merciful"))return `Who could have, and did not.`;
  if(has("Miserly"))return `Who left the chest full and the roof unmended.`;
  if(has("Generous"))return `Who gave things away and was never able to explain the arithmetic.`;
  if(h.flags.builtSomething)return `Who built, and whose building outlasted the argument about it.`;
  if(has("Shrewd"))return `Who was never once cheated, and counted that a life.`;
  if(c.age>70)return `Who outlived everyone who had an opinion about ${c.g==="f"?"her":"him"}.`;
  return `Who held it, and handed it on, and is remembered chiefly for that.`;
}
function checkYearn(){
  const id=S.c.yearn, c=S.c, h=S.h;
  switch(id){
    case"loved":return c.traits.includes("Beloved");
    case"peace":return !c.flags.spilledBlood;
    case"sea":return !!c.flags.sawSea;
    case"name":return h.standing>=48;
    case"child":return c.kids.some(k=>k.bond>=70);
    case"truth":return !!c.flags.foundTruth;
    case"forgive":return !!c.flags.forgiven;
    case"free":return h.coffers>=10&&!h.flags.indebted;
    case"faith":return c.stats.faith>=8;
    case"revenge":return !!h.flags.rivalBroken;
    case"build":return !!c.flags.built;
    case"quiet":return h.standing>=30&&h.holdings.length>=(c.flags.startHoldings||1);
  }
  return false;
}
function archiveLife(){
  const c=S.c;
  try{SND.toll();}catch(e){}
  if(c.gen>=3&&!S.w.flags["threat_"+S.w.threat.id]){
    const s=crisisScore();
    const band=s>=4?"triumph":(s>=2?"endure":"broken");
    S.w.flags["threat_"+S.w.threat.id]=band;
    if(band==="triumph"){S.h.standing=clamp(S.h.standing+8,0,100);}
    else if(band==="broken"){S.h.standing=clamp(S.h.standing-10,0,100);S.h.coffers=Math.max(0,S.h.coffers-3);}
    S.chron.push({y:S.w.year,g:c.gen,c:band==="broken"?"grim":"",
      t:`${cap(S.w.threat.name)} came while the house was without a steady hand, and ${band==="triumph"?"was met by a household that had been left ready for it":band==="endure"?"was survived, barely, by people acting on their own judgement":"went through this house like water through a broken wall"}.`});
  }
  c.yearnMet=checkYearn();
  const epi=computeEpitaph();
  const ep=EPITHETS[Math.abs(hashSeed(c.name+c.gen))%EPITHETS.length];
  S.anc.push({name:c.name,epithet:ep,gen:c.gen,born:c.born,died:S.w.year,age:c.age,
    epi,traits:c.traits.slice(),yearn:c.yearn,met:c.yearnMet,g:c.g,
    arms:JSON.parse(JSON.stringify(S.h.arms)),deeds:c.deeds.slice(),
    kids:c.kids.map(k=>({name:k.name,bond:k.bond,alive:k.alive,traits:k.traits,g:k.g})),
    spouse:c.spouse?c.spouse.name:null});
  S.chron.push({y:S.w.year,g:c.gen,t:`${c.name} ${ep} died, aged ${c.age}. <em>${epi}</em>${c.yearnMet?" What they wanted, they got.":" What they wanted, they did not get."}`,c:"grim"});
}
function heirCandidates(){
  const alive=S.c.kids.filter(k=>k.alive);
  if(alive.length)return alive;
  return [];
}
function succeed(kid){
  // between the hands, the world moves without you
  secretsLeak();
  addMarginalia();
  worldTick(ri(1,3));
  rivalTurn();
  const parent={name:S.c.name,traits:S.c.traits,stats:S.c.stats,bond:kid?kid.bond:20,
    childTraits:kid?kid.traits:["Guarded"],siblings:[]};
  const gen=S.c.gen+1;
  if(kid){
    S.c.kids.filter(k=>k!==kid&&k.alive).forEach(k=>{
      parent.siblings.push({name:k.name,g:k.g,rel:k.g==="f"?"sister":"brother",
        bond:clamp(k.bond-(kid.bond>k.bond?15:0),0,100),alive:true});
    });
    S.w.year=S.anc[S.anc.length-1].died+ri(0,2);
    beginLife(gen,kid.name,parent);
    S.c.traits=[...new Set(S.c.traits.concat(kid.traits||[]))].slice(0,4);
    S.c.age=clamp(S.w.year-(kid.born||(S.w.year-20)),16,32);
    S.c.born=S.w.year-S.c.age;
    S.c.g=kid.g||S.c.g;
    if(S.h.heirloom&&hl().state==="held")
      hlNote(`Passed to ${S.c.name}, the ${["first","second","third","fourth"][gen-1]} of the name to hold it.`);
  } else {
    S.h.standing=Math.max(6,Math.floor(S.h.standing*0.6));
    S.h.flags.cadet=true;
    S.w.year+=ri(1,4);
    if(S.h.heirloom&&hl().state==="held"&&chance(.45))
      G.hlSet("lost","the old household",`Not found when the household changed hands. Nobody was ever accused.`);
    beginLife(gen,null,null);
    S.c.flags.cadet=true;
    S.chron.push({y:S.w.year,g:gen,t:`With no heir of the body, ${S.h.name} passed to a cousin, and half of what the last hand had built went with the change of household.`,c:"grim"});
  }
  S.w.era=gen;
  S.pending=null;
}
function lineEnds(reason){
  S.endReason=reason;
  computeEnding(true);
  MODE="ending";
  save();
}

function computeEnding(dead){
  const h=S.h,w=S.w,f=h.flags;
  const thr=w.flags["threat_"+w.threat.id]||"untested";
  let path="root",title="",body="";
  if(f.path_crown&&f.crowned)path="crown";
  else if(f.path_rebel&&f.independent)path="rebel";
  else if(f.path_church)path="church";
  else if(f.path_coin)path="coin";
  else if(f.path_rebel&&f.attainted)path="fallen";
  else if(f.path_crown)path="thwarted";
  else path="root";
  if(h.holdings.length===0||h.standing<8)path="extinct";
  if(dead)path="extinct";

  const T={
   crown:["A House of the Blood","Four generations from a grant written small to a seat among the great houses. The name is spoken at court now without anyone needing to ask where it is from."],
   rebel:["The Free Valley","The Crown's writ stops at your boundary stones and has stopped there long enough that people have begun to draw it that way on maps."],
   church:["The House That Outlived Kings","Dynasties will change four times in the next two centuries. The bell at ${seat} will be rung on the same day each year, for the same family, throughout."],
   coin:["The House of the Bridge and the Port","No songs. No titles worth the name. Half the wool of the realm, three counties in quiet debt, and a family that will still be rich when the singing houses are tenants."],
   thwarted:["The House That Reached","It was close. That will be the whole of the family memory: it was close, and the great houses closed over the gap, and afterwards there was the valley and the ledger and the long slow settling."],
   fallen:["The Attainted House","They kept their heads and lost everything else. The name survives on two deeds and a chapel wall, which is more than most rebels manage."],
   root:["The House That Kept the Valley","No crown, no cathedral, no fleet. Four generations of hands on the same ground, and the ground still in them, which was the only thing any of them was ever actually asked to do."],
   extinct:["The Name in the Floor","The holdings went to creditors, cousins and the Crown. There is a slab in the ${temple} at ${seat} with the arms cut into it, worn smooth in the middle where people have walked."],
  }[path];
  title=T[0];
  body=T[1].replace("${seat}",h.seat).replace("${temple}",w.faith.temple);

  const bits=[];
  if(thr==="triumph")bits.push(`When ${w.threat.name} came, this house held and three others did not — and the county was re-drawn around that fact.`);
  else if(thr==="endure")bits.push(`${cap(w.threat.name)} took a third of everything and left the house standing, which at the time was considered remarkable.`);
  else if(thr==="broken")bits.push(`${cap(w.threat.name)} broke over this house and what came after was survival rather than lordship. It is still, four generations on, the thing the family measures time against.`);
  if(f.rivalBroken)bits.push(`${w.rival.name} are tenants now.`);
  else if(w.rival.att>30)bits.push(`${w.rival.name} and this house intermarried in the end, which nobody who started the quarrel would have believed.`);
  else bits.push(`${w.rival.name} still hold the far bank, and still will not sell, and neither will you.`);
  if(f.returnedLand)bits.push(`The two river fields are back where the old deed said they belonged.`);
  if(f.newFaith)bits.push(`The valley keeps the new faith openly, and remembers which house turned first.`);
  if(f.purged)bits.push(`Nobody in the valley preaches in the beech woods any more, and nobody explains to their children why not.`);
  if(f.buriedHoard&&!f.hoardFound)bits.push(`There is a mark on a beam in the undercroft that no living person can now read.`);
  if(S.h.heirloom){
    const o=hl(), n=cap(hlName());
    if(o.state==="held")bits.push(`${n} is still in the chest. Four hands have held it and none of them sold it, which given the state of the accounts in at least two of those generations is the most surprising fact in this book.`);
    else if(o.state==="pawned")bits.push(`${n} is still at the port. The ticket is in the chest where the thing used to be, and the interest has long since exceeded what it was worth.`);
    else if(o.state==="stolen")bits.push(`${n} hangs in another house's hall. They know exactly what it is. That is the point of hanging it there.`);
    else if(o.state==="buried")bits.push(`${n} is under the undercroft, where the last person who knew the mark put it.`);
    else if(o.state==="lost")bits.push(`Nobody now living has seen ${n}. It is described in the book, in detail, by someone who had.`);
  }
  if(f.trueChronicle)bits.push(`And there is a chronicle in this house written by someone who did not flatter it — which is why any of this is known at all.`);

  if(dead)bits.push(`It ends here, in the ${["first","second","third","fourth"][Math.max(0,S.anc.length-1)]} hand, without an heir and without anyone willing to take it on.`);
  const met=S.anc.filter(a=>a.met).length;
  const N=S.anc.length;
  const soul=met===0?`Not one of them got the thing they privately wanted. That is not unusual. It is only unusual to have it written down.`
    :met===N?`Every one of them got the thing they privately wanted, which in ${N} generations of one family is close to unheard of.`
    :`${["None","One","Two","Three","Four"][met]||met} of the ${N} got the thing they privately wanted. The rest are in the ground with it.`;

  S.ending={title,body,bits,soul,path,threat:thr,year:w.year};
  S.finished=true;
  archiveToLibrary();
}
function archiveToLibrary(){
  try{
    const lib=JSON.parse(localStorage.getItem(LIB_KEY)||"[]");
    lib.unshift({house:S.h.name,seat:S.h.seat,seed:S.seed,year:S.w.year,
      title:S.ending.title,arms:S.h.arms,
      anc:S.anc.map(a=>({name:a.name,epithet:a.epithet,epi:a.epi,met:a.met}))});
    localStorage.setItem(LIB_KEY,JSON.stringify(lib.slice(0,12)));
  }catch(e){}
}

   return P(`You go out under a white cloth and buy them off, and it costs three years of rents and a public afternoon of being seen to do it.`)
    +P(`Everyone inside the walls lives. That is the entire argument for it, and it is a good one.`);
  }
  if(c.result==="lose"){
   G.hs("standing",-12);G.loseLand(1);G.hs("strength",-3);G.peril(2);
   if(hl().state==="held"&&chance(.5))G.hlSet("stolen",c.them.name,`Taken out of ${S.h.seat} when the wall was carried.`);
   G.chron(`${c.them.name} carried the wall at ${S.h.seat}. What could be taken was taken.`,"grim");
   return P(`The gate goes at dawn on the fourth day and after that it is not a battle, it is a household trying to get down a back stair.`);
  }
  G.hs("standing",2);G.hs("coffers",-2);G.hs("strength",-2);
  return P(`They sit outside for six weeks, eat everything within four miles, and leave when the weather turns. Nobody won. Everybody paid.`);
 },
 duel:(G,c)=>{
  if(c.result==="win"){
   G.hs("standing",8);G.trait("Feared");G.flag("spilledBlood");
   G.seed({type:"blood_debt",who:c.them.name,house:c.themHouse||G.w.rival.name});
   G.legend(`${S.c.name} met ${c.them.name} on foot before both households and walked off the ground alone.`);
   return P(`It takes less time than the arrangements did. Afterwards your hands will not stop and you keep them behind your back until you are indoors.`);
  }
  if(c.result==="parley"){
   G.hs("standing",-3);G.trait("Peacemaker");
   return P(`You put up your hands and say the thing that ends it, and half the field thinks better of you and half thinks a great deal worse.`);
  }
  if(c.result==="lose"){
   G.peril(3);G.trait("Scarred");G.hs("standing",-6);
   return P(`He is faster and you have known it since you were nineteen. You are on your back looking at the sky with a great deal of noise happening somewhere else.`)
    +P(`He lets you live. That is worse than the wound and both of you know it.`);
  }
  G.hs("standing",1);G.peril(1);
  return P(`Both households pull you apart at the fourth exchange, which is what households are for.`);
 },
 wool:(G,c)=>{
  if(c.result==="nodeal"){G.hs("coffers",-1);G.hs("standing",-1);
   return P(`The clip goes unsold and sits in the barn until it is worth less. You have made a point at your own expense, which is a thing your family does.`);}
  const gain=Math.max(1,c.price-3+(G.wf("woolBoom")?2:0));
  G.hs("coffers",gain);G.stat("coin",1);
  if(c.gave>=2)G.hs("standing",-1);
  return P(`Closed at ${c.price}. The factor writes it down without looking up, which is how you know it was a good number.`)
   +P(c.price>=8?`It is the best price anyone in this valley has had in a decade and it will be mentioned at every market for two years.`
     :`It is a fair price. Fair is what most of a life is made of.`);
 },
 landbuy:(G,c)=>{
  if(c.result==="nodeal"){G.hs("standing",-1);
   return P(`No deal. The land goes to somebody with a faster clerk and you learn the name of a new neighbour.`);}
  const cost=Math.max(2,12-c.price);
  G.hs("coffers",-cost);G.land(1);G.hs("standing",3);
  return P(`Signed at a price that took four hours and a great deal of pretending to be about to leave.`)
   +P(`It is done in a room with a clerk and a wax seal, and it takes eleven minutes to buy something your family will hold for two hundred years.`);
 },
};

/* ================================================================
   PREFERENCES — kept apart from the save, so a reset does not lose them
   ================================================================ */
const CFG_KEY="heirloom.cfg.v1";
const CFG={sound:true,music:true,musicVol:0.30,sfxVol:0.55,
           motion:true,texture:true,odds:true,deltas:true,text:"md"};
function loadCfg(){
  try{const r=localStorage.getItem(CFG_KEY);if(!r)return;
    const o=JSON.parse(r);for(const k in CFG)if(k in o)CFG[k]=o[k];}catch(e){}
}
function saveCfg(){try{localStorage.setItem(CFG_KEY,JSON.stringify(CFG));}catch(e){}}
function applyCfg(){
  const L=el("leaf");if(!L||!L.setAttribute)return;
  L.setAttribute("data-text",CFG.text);
  L.setAttribute("data-tex",CFG.texture?"on":"off");
  L.setAttribute("data-motion",CFG.motion?"on":"off");
}

   SOUND — synthesised on the fly. No files, nothing to download,

const SND=(function(){
  let ac=null, master=null, musicGain=null, sfxGain=null, noise=null;
  let drone=[], timer=null, nextT=0, step=0, mIdx=0, phrase=0, playing=false;
  const MODES={
    dorian:[0,2,3,5,7,9,10],
    aeolian:[0,2,3,5,7,8,10],
    mixolydian:[0,2,4,5,7,9,10],
    lydian:[0,2,4,6,7,9,11],
  };
  let scale=MODES.dorian, root=146.83; // D3
  const BEAT=0.62;

  function ok(){return ac&&CFG.sound;}
  function mkNoise(){
    const n=ac.sampleRate*1.2, b=ac.createBuffer(1,n,ac.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    return b;
  }
  function init(){
    if(ac)return true;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return false;
      ac=new AC();
      master=ac.createGain(); master.gain.value=1; master.connect(ac.destination);
      musicGain=ac.createGain(); musicGain.gain.value=CFG.music?CFG.musicVol:0; musicGain.connect(master);
      sfxGain=ac.createGain(); sfxGain.gain.value=CFG.sfxVol; sfxGain.connect(master);
      noise=mkNoise();
      return true;
    }catch(e){ac=null;return false;}
  }
  function resume(){try{if(ac&&ac.state==="suspended")ac.resume();}catch(e){}}
  function wake(){ if(!init())return false; resume(); if(CFG.sound&&CFG.music&&!playing)startMusic(); return true; }

  /* ---- the drone: an open fifth, the way every medieval instrument cheats ---- */
  function startDrone(){
    stopDrone();
    [1,1.5].forEach((mult,i)=>{
      const o=ac.createOscillator(), g=ac.createGain();
      const lp=ac.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=520; lp.Q.value=2;
      o.type="sawtooth"; o.frequency.value=root*mult*0.5;
      g.gain.value=0; g.gain.setTargetAtTime(i?0.045:0.06,ac.currentTime,1.4);
      const lfo=ac.createOscillator(), lg=ac.createGain();
      lfo.frequency.value=0.045+i*0.02; lg.gain.value=120;
      lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
      o.connect(lp); lp.connect(g); g.connect(musicGain); o.start();
      drone.push({o,g,lfo});
    });
  }
  function stopDrone(){
    drone.forEach(d=>{try{d.g.gain.setTargetAtTime(0,ac.currentTime,0.3);
      d.o.stop(ac.currentTime+1.2);d.lfo.stop(ac.currentTime+1.2);}catch(e){}});
    drone=[];
  }
  /* ---- a plucked note, psaltery-ish ---- */
  function pluck(freq,t,vel){
    const g=ac.createGain(), lp=ac.createBiquadFilter();
    lp.type="lowpass"; lp.frequency.setValueAtTime(2600,t); lp.frequency.exponentialRampToValueAtTime(700,t+0.9);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vel,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+1.05);
    [0,7].forEach((cents,i)=>{
      const o=ac.createOscillator();
      o.type=i?"sine":"triangle";
      o.frequency.value=freq*(i?2.004:1);
      o.detune.value=cents;
      const og=ac.createGain(); og.gain.value=i?0.28:1;
      o.connect(og); og.connect(lp); o.start(t); o.stop(t+1.15);
    });
    lp.connect(g); g.connect(musicGain);
  }
  function noteAt(i){const oct=Math.floor(i/scale.length), d=((i%scale.length)+scale.length)%scale.length;
    return root*2*Math.pow(2,(scale[d]+12*oct)/12);}

  function schedule(){
    if(!ac)return;
    while(nextT < ac.currentTime+1.3){
      const inPhrase=step%8;
      if(inPhrase===0){phrase++; mIdx=(phrase%3===0)?0:mIdx;}
      const rest=Math.random()< (inPhrase===7?0.5:0.24);
      if(!rest){
        const jump=Math.random();
        mIdx += jump<0.52?(Math.random()<0.5?1:-1) : (jump<0.78?(Math.random()<0.5?2:-2):0);
        if(inPhrase===7||inPhrase===0)mIdx=[0,2,4][Math.floor(Math.random()*3)];
        if(mIdx>9)mIdx=9; if(mIdx<-2)mIdx=-2;
        const vel=0.11+(inPhrase===0?0.05:0)+Math.random()*0.04;
        pluck(noteAt(mIdx),nextT,vel);
        if(inPhrase===0&&Math.random()<0.5)pluck(noteAt(mIdx-4),nextT+0.02,vel*0.5);
      }
      nextT+=BEAT*(inPhrase===7?1.6:1);
      step++;
    }
  }
  function startMusic(){
    if(!init())return; resume();
    if(playing)return;
    playing=true;
    startDrone();
    nextT=ac.currentTime+0.15; step=0;
    schedule();
    timer=setInterval(schedule,300);
  }
  function stopMusic(){
    playing=false;
    if(timer){clearInterval(timer);timer=null;}
    if(ac)stopDrone();
  }
  /* pick a mode and key when the hand changes — each generation sounds different */
  function setMood(gen,dark){
    const keys=[130.81,138.59,146.83,155.56,164.81,174.61];
    root=keys[(gen*2+(dark?1:0))%keys.length];
    const names=dark?["aeolian","dorian"]:["dorian","mixolydian","lydian"];
    scale=MODES[names[gen%names.length]];
    if(playing&&ac){stopDrone();startDrone();}
  }

  /* ---- effects ---- */
  function burst(dur,type,f0,f1,vol,q){
    if(!ok())return;
    const s=ac.createBufferSource(); s.buffer=noise;
    const bp=ac.createBiquadFilter(); bp.type=type||"bandpass"; bp.Q.value=q||1.1;
    const t=ac.currentTime;
    bp.frequency.setValueAtTime(f0,t);
    bp.frequency.exponentialRampToValueAtTime(Math.max(60,f1),t+dur);
    const g=ac.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(bp); bp.connect(g); g.connect(sfxGain);
    s.start(t); s.stop(t+dur+0.05);
  }
  function tone(f,dur,vol,type,slideTo){
    if(!ok())return;
    const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime;
    o.type=type||"sine"; o.frequency.setValueAtTime(f,t);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+dur+0.05);
  }
  function bellAt(f,dur,vol){
    if(!ok())return;
    [[1,1],[2.76,0.42],[5.4,0.18],[8.9,0.08]].forEach(([m,a])=>{
      const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime;
      o.type="sine"; o.frequency.value=f*m;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(vol*a,t+0.006);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur*(1-0.13*Math.log2(m+1)));
      o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+dur+0.1);
    });
  }
  const API={
    init, wake, resume,
    page(){ if(!ok())return; burst(0.20,"bandpass",1100,2600,0.16,0.8);
            setTimeout(()=>burst(0.13,"highpass",1800,900,0.09,0.7),85); },
    click(){ if(!ok())return; burst(0.05,"bandpass",2100,1500,0.10,2.2); },
    quill(){ if(!ok())return; burst(0.09,"highpass",2600,1400,0.07,1); },
    die(){ if(!ok())return;
      [0,90,165].forEach((d,i)=>setTimeout(()=>burst(0.05,"bandpass",700+i*260,420,0.13,3),d)); },
    thud(){ if(!ok())return; tone(96,0.20,0.30,"sine",46); burst(0.10,"lowpass",380,140,0.12,1); },
    toll(){ if(!ok())return; bellAt(174.61,3.4,0.26); },
    chime(){ if(!ok())return; bellAt(783.99,1.5,0.14); },
    music(on){ if(on){startMusic();}else{stopMusic();} },
    setMood,
    apply(){
      if(!ac)return;
      try{
        musicGain.gain.setTargetAtTime(CFG.sound&&CFG.music?CFG.musicVol:0,ac.currentTime,0.15);
        sfxGain.gain.setTargetAtTime(CFG.sound?CFG.sfxVol:0,ac.currentTime,0.05);
      }catch(e){}
      if(CFG.sound&&CFG.music&&!playing)startMusic();
      if((!CFG.sound||!CFG.music)&&playing)stopMusic();
    },
    playing(){return playing;},
    ready(){return !!ac;},
  };
  return API;
})();
/* every method must be harmless where there is no audio at all */
["page","click","quill","die","thud","toll","chime"].forEach(k=>{
  const f=SND[k];
  SND[k]=function(){try{return f.apply(SND,arguments);}catch(e){}};
});

/* ================================================================
   THE SETTINGS LEAF
   ================================================================ */
let CONFIRM="";
function tog(key,label,note){
  return `<div class="setrow"><div class="sl"><div class="sn">${label}</div>${note?`<div class="sd">${note}</div>`:""}</div>
    <button class="tgl ${CFG[key]?"on":""}" data-tog="${key}" role="switch" aria-checked="${!!CFG[key]}"><span></span></button></div>`;
}
function seg(key,label,opts){
  return `<div class="setrow"><div class="sl"><div class="sn">${label}</div></div>
    <div class="segs">${opts.map(o=>`<button class="sg ${CFG[key]===o[0]?"on":""}" data-seg="${key}" data-val="${o[0]}">${o[1]}</button>`).join("")}</div></div>`;
}
function sld(key,label){
  return `<div class="setrow col"><div class="sl"><div class="sn">${label}</div></div>
    <input type="range" class="rng" min="0" max="100" value="${Math.round(CFG[key]*100)}" data-rng="${key}"></div>`;
}
function panelSettings(){
  let x=`<div class="panel"><h2>Sound</h2>`;
  if(!SND.ready())x+=`<p class="small">Nothing is played until you touch one of these — browsers require it. There are no sound files; it is all made up on the spot, so it works with no connection at all.</p>`;
  x+=tog("sound","Sound","Everything below depends on this.")
    +tog("music","Music","A drone and a wandering tune. It changes key with each generation.")
    +sld("musicVol","Music volume")
    +sld("sfxVol","Page and effects volume")
    +`<h2 style="margin-top:26px">The page</h2>`
    +seg("text","Text size",[["sm","Small"],["md","Normal"],["lg","Large"]])
    +tog("texture","Vellum and stains","The fibre, the foxing, the torn corner.")
    +tog("motion","Movement","Page fades and the candle flame.")
    +`<h2 style="margin-top:26px">What is shown</h2>`
    +tog("odds","Odds on risky choices","Turn off if you would rather not know.")
    +tog("deltas","Ledger changes","The small chips after a choice.")
    +`<h2 style="margin-top:26px">This house</h2>`;
  if(S&&S.started){
    x+=`<div class="kv"><span class="k">Seed</span><span class="v" style="font-size:12px;word-break:break-all">${S.seed}</span></div>
      <div class="kv"><span class="k">Hand</span><span class="v">${ROMAN[S.c?S.c.gen:S.anc.length]} of IV</span></div>
      <button class="turn ghost" id="setCopySeed" style="margin-top:12px">Copy the seed</button>
      <button class="turn ghost" id="setSameSeed" style="margin-top:10px">${CONFIRM==="same"?"Tap again to restart this same world":"Restart this world from the beginning"}</button>
      <button class="turn warn" id="setAbandon" style="margin-top:10px">${CONFIRM==="abandon"?"Tap again to abandon this house":"Abandon this house and begin another"}</button>`;
  } else {
    x+=`<p class="small">No house in progress.</p>`;
  }
  x+=`<h2 style="margin-top:26px">Saved data</h2>
    <p class="small">Everything lives in this browser only. Nothing is sent anywhere.</p>
    <button class="turn ghost" id="setExport" style="margin-top:8px">Copy this save to the clipboard</button>
    <div class="field" style="margin-top:12px"><label>Paste a save to restore it</label>
      <input id="setImport" placeholder="paste here" style="font-size:13px"></div>
    <button class="turn ghost" id="setImportGo">Restore that save</button>
    <button class="turn warn" id="setWipe" style="margin-top:16px">${CONFIRM==="wipe"?"Tap again to erase everything":"Erase everything, including the library"}</button>
    <div class="toast" id="setToast">${TOAST}</div>
    <div class="hr"></div>
    <p class="small center">Heirloom &middot; a chronicle in four hands<br>One file, no server, no network, no accounts.</p>
    </div>`;
  return x;
}
function bindSettings(){
  const re=()=>{saveCfg();applyCfg();SND.apply();render();};
  document.querySelectorAll("[data-tog]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.tog; CFG[k]=!CFG[k];
    if(CFG[k]&&(k==="sound"||k==="music"))SND.wake();
    SND.click(); CONFIRM=""; re();
  });
  document.querySelectorAll("[data-seg]").forEach(b=>b.onclick=()=>{
    CFG[b.dataset.seg]=b.dataset.val; SND.click(); CONFIRM=""; re();
  });
  document.querySelectorAll("[data-rng]").forEach(r=>{
    r.oninput=()=>{CFG[r.dataset.rng]=(+r.value)/100;saveCfg();SND.apply();};
    r.onchange=()=>{SND.wake();SND.click();saveCfg();SND.apply();};
  });
  const cs=el("setCopySeed");if(cs)cs.onclick=()=>{TOAST=copyText(S.seed)==="copied"?"Seed copied.":"Could not copy.";render();};
  const ss=el("setSameSeed");if(ss)ss.onclick=()=>{
    if(CONFIRM!=="same"){CONFIRM="same";render();return;}
    const seed=S.seed,nm=S.h.name;CONFIRM="";TOAST="";
    newWorld(seed,nm,null);MODE="play";S.tab="story";save();render();window.scrollTo(0,0);
  };
  const ab=el("setAbandon");if(ab)ab.onclick=()=>{
    if(CONFIRM!=="abandon"){CONFIRM="abandon";render();return;}
    CONFIRM="";TOAST="";wipe();S=null;MODE="title";render();window.scrollTo(0,0);
  };
  const ex=el("setExport");if(ex)ex.onclick=()=>{
    TOAST=copyText(JSON.stringify({S,MODE}))==="copied"?"Save copied. Keep it somewhere safe.":"Could not copy.";render();};
  const ig=el("setImportGo");if(ig)ig.onclick=()=>{
    const v=el("setImport").value.trim();
    try{
      const o=JSON.parse(v);
      if(!o||!o.S||!o.S.w||!o.S.h)throw 0;
      S=o.S;MODE=o.MODE||"play";RND=mulberry(hashSeed(S.seed+"|"+S.w.year));
      S.tab="story";save();TOAST="";render();window.scrollTo(0,0);
    }catch(e){TOAST="That does not look like a Heirloom save.";render();}
  };
  const wp=el("setWipe");if(wp)wp.onclick=()=>{
    if(CONFIRM!=="wipe"){CONFIRM="wipe";render();return;}
    CONFIRM="";TOAST="";
    try{localStorage.removeItem(SAVE_KEY);localStorage.removeItem(LIB_KEY);}catch(e){}
    S=null;MODE="title";render();window.scrollTo(0,0);
  };
}
/* ================================================================
   INTERSTITIALS — the page does not always ask you a question
   ================================================================ */
function buildInter(G){
  const opts=[];
  if(S.w.events.length)opts.push("world","world");
  opts.push("accounts","rumour");
  if(S.c.kids.length||S.c.spouse||S.anc.length)opts.push("letter");
  if((S.h.secrets||[]).some(s=>s.known))opts.push("whisper");
  const k=pick(opts);
  if(k==="world"){
    const e=pick(S.w.events.slice(-8));
    return {eyebrow:"Word from elsewhere",title:e.kind==="house"?"News from the county":"News from the realm",
      body:P(e.t)+P(`<em>None of it is about you. Some of it will be, eventually.</em>`),btn:"Read on"};
  }
  if(k==="accounts"){
    const inc=houseIncome();
    const rows=S.h.holdings.map(i=>{const r=S.w.regions[i];
      return `${r.name} — ${r.type}${r.dev?", improved":""}${r.raided?", <em>burned this year</em>":""} … ${regionIncome(r)}`;}).join("<br>");
    return {eyebrow:"The Accounts",title:"What the land made",
      body:P(`Your steward reads it out in the flat voice he keeps for numbers.`)
        +`<p class="small" style="line-height:1.9">${rows||"nothing at all"}</p>`
        +P(`Total for the season: <strong>${Math.ceil(inc/2)}</strong>. It is not a fortune. It is the reason any of this continues.`),
      btn:"Take the rents",gain:Math.ceil(inc/2)};
  }
  if(k==="whisper"){
    return {eyebrow:"A Whisper",title:"Someone has been asking",
      body:P(`A man was in the village for three days asking careful questions about this family's history, and paying for beer, and writing nothing down where anyone could see.`)
        +P(`He is gone now. Your steward reports it in the tone of a person who would like to be told it does not matter.`),btn:"Say nothing"};
  }
  if(k==="letter"){
    const who=S.c.kids.filter(k2=>k2.alive)[0]||S.c.spouse||S.c.kin[0];
    const nm=who?who.name:"an old friend";
    const body=pick([
      `<p>${nm} writes. Two thirds of it is about the weather and the roads. The last four lines are the reason for the letter and are almost impossible to read.</p>`,
      `<p>A letter from ${nm}, in a hand that has got worse. It asks after the mill, the horses, and you, in that order, which is either a joke or is not.</p>`,
      `<p>${nm} has written to say nothing in particular, at length, which is what people do when they cannot say the thing.</p>`,
    ]);
    return {eyebrow:"A Letter",title:`From ${nm}`,body:body+P(`<em>You put it in the chest with the others.</em>`),btn:"Fold it away"};
  }
  const h=pick(S.w.houses.filter(x=>!x.dead))||S.w.rival;
  return {eyebrow:"A Rumour",title:"What they say at market",
    body:P(`They say ${h.name} of ${h.seat} ${pick([
      "has borrowed from the port and not told their own steward",
      "buried their eldest in the spring and have not said what of",
      "have been buying horses in numbers that do not match their land",
      "will not be at the county court this year, which has never happened",
      "sent a man to the capital in winter, which nobody does for a small reason"])}.`)
      +P(`<em>Market talk is wrong about half the time. It is the other half that gets houses killed.</em>`),btn:"Note it"};
}
ANCHORS.inter={id:"inter",kind:"inter",
 setup:G=>buildInter(G),
 eyebrow:G=>G.v.eyebrow,title:G=>G.v.title,text:G=>G.v.body,
 choices:[{t:G=>G.v.btn||"Read on",do:G=>{if(G.v.gain)G.hs("coffers",G.v.gain);return "";}}]};

/* ================================================================
   ENGINE
   ================================================================ */
const el=id=>document.getElementById(id);
const view=()=>el("view");
let MODE="title";
let TOAST="";

function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({S,MODE}));}catch(e){}}
function load(){
  try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;
    const o=JSON.parse(raw);if(!o||!o.S)return false;S=o.S;MODE=o.MODE||"play";
    RND=mulberry(hashSeed(S.seed+"|"+S.w.year+"|"+S.anc.length));return true;}catch(e){return false;}
}
function wipe(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
function txt(v,a,b){return typeof v==="function"?v(a===undefined?G:a,b):v;}
function safe(fn,d){try{return fn();}catch(e){return d;}}

function pickPool(phase){
  const c=POOL.filter(s=>s.phase.indexOf(phase)>=0
    && !(S.used[s.id+"@"+S.c.gen])
    && (!s.when||safe(()=>s.when(G),false)));
  if(!c.length){const any=POOL.filter(s=>s.phase.indexOf(phase)>=0);return pick(any);}
  const weighted=[];
  c.forEach(s=>{let w=(s.w||1)*(S.used[s.id]?0.3:1);for(let i=0;i<Math.max(1,Math.round(w*10));i++)weighted.push(s);});
  return pick(weighted);
}
function openScene(){
  const c=S.c;
  if(c.qi>=c.queue.length){toSuccession();return;}
  const item=c.queue[c.qi];
  let scene=null,seed=null,kind="scene";
  if(item.k==="pool"){scene=pickPool(item.phase);kind="pool";}
  else if(item.k==="inter"){scene=ANCHORS.inter;kind="anchor";}
  else if(item.k==="anchor"){scene=ANCHORS[item.id];kind="anchor";}
  else if(item.k==="open"){scene=ANCHORS.open;kind="anchor";}
  else if(item.k==="legacy"){
    const sd=item.seed;const tpl=LEGACY[sd.type];
    if(!tpl){c.qi++;openScene();return;}
    sd.used=true;scene=tpl;seed=sd;kind="legacy";
  }
  if(!scene){c.qi++;openScene();return;}
  const sid=scene.id||item.id||item.k;
  S.pending={kind,sceneId:sid,legacyType:seed?seed.type:null,seed:seed,
    vars:{},outcome:null,phase:item.phase||null,roll:null,contest:null,form:null};
  S.pending.vars=scene.setup?safe(()=>scene.setup(G),{}):{};
  S.used[sid]=(S.used[sid]||0)+1;
  if(sid!=="inter")S.used[sid+"@"+S.c.gen]=1;
  save();
}
function currentScene(){
  const p=S.pending;if(!p)return null;
  if(p.kind==="legacy")return LEGACY[p.legacyType];
  if(p.kind==="anchor")return ANCHORS[p.sceneId];
  return POOL.find(s=>s.id===p.sceneId)||ANCHORS[p.sceneId];
}
function visibleChoices(sc){
  return sc.choices.filter(c=>!c.when||safe(()=>c.when(G,S.pending&&S.pending.seed),false));
}
function choose(i){
  const sc=currentScene();if(!sc||!S.pending||S.pending.outcome!=null)return;
  const ch=visibleChoices(sc)[i];if(!ch)return;
  SND.wake();SND.click();
  DELTAS=[];
  const out=safe(()=>ch.do(G,S.pending.seed),"");
  S.pending.deltas=DELTAS.slice();
  if(S.pending.contest&&!S.pending.contest.finished){save();render();return;}
  if(S.pending.form&&!S.pending.form.done){save();render();return;}
  S.pending.outcome=out||"";
  syncSecrets();
  if(sc.kind==="inter"){advance();return;}
  save();render();window.scrollTo({top:0,behavior:"smooth"});
}
function submitForm(){
  const f=S.pending&&S.pending.form;if(!f||f.done)return;
  SND.wake();SND.quill();
  const vals={};
  f.fields.forEach(fl=>{const n=el("f_"+fl.k);vals[fl.k]=n?n.value:"";});
  f.done=true;
  DELTAS=S.pending.deltas||[];
  const out=safe(()=>FORMS[f.applyId](G,vals),"");
  S.pending.deltas=DELTAS.slice();
  S.pending.outcome=out||"";
  save();render();window.scrollTo({top:0,behavior:"smooth"});
}
function settleContest(){
  const c=S.pending&&S.pending.contest;if(!c||!c.finished)return;
  SND.page();
  DELTAS=S.pending.deltas||[];
  const out=safe(()=>RESOLVERS[c.resolveId](G,c),"");
  S.pending.deltas=DELTAS.slice();
  S.pending.outcome=out||"";
  syncSecrets();
  save();render();window.scrollTo({top:0,behavior:"smooth"});
}
function advance(){
  SND.page();
  const c=S.c,p=S.pending;
  const scId=p?p.sceneId:"";
  const wasDeath=(scId==="death");
  const phase=p&&p.phase;
  const wasInter=(scId==="inter");
  S.pending=null;
  if(wasDeath){archiveLife();MODE="succession";save();render();return;}
  let yrs=wasInter?0:(phase==="youth"?ri(2,3):phase==="twilight"?ri(3,4):ri(3,5));
  if(c.queue[c.qi]&&c.queue[c.qi].k==="open")yrs=0;
  c.qi++;
  c.age+=yrs;S.w.year+=yrs;
  if(c.qi===Math.floor(c.queue.length/2))secretsLeak();
  if(!wasDeath&&c.qi<c.queue.length-1){
    const risk=(c.peril*0.045)+(c.age>62?0.10:0)+(c.age>70?0.16:0)+(c.traits.includes("Sickly")?.03:0);
    if(rnd()<risk){
      c.cause=c.peril>=4?"peril":"age";
      const must=c.queue.slice(c.qi).filter(x=>x.k==="anchor"&&(x.id==="crisis"||x.id==="reckoning"));
      c.queue=c.queue.slice(0,c.qi).concat(must,[{k:"anchor",id:"death"}]);
    }
  }
  save();openScene();render();
}
function toSuccession(){MODE="succession";S.pending=null;save();}

/* ================================================================
   RENDER
   ================================================================ */
function render(){
  if(S&&MODE==="play"&&S.tab==="story"&&!S.pending&&!S.finished)openScene();
  el("crest").hidden=(MODE==="title");
  el("ledger").hidden=(MODE==="title"||MODE==="ending");
  el("nav").hidden=(MODE==="title");
  el("rail").style.display=MODE==="title"?"none":"flex";
  document.querySelector("main").style.paddingLeft=MODE==="title"?"var(--pad)":"calc(var(--rail) + 14px)";
  applyCfg();
  el("leaf").setAttribute("data-age",String(S?Math.min(4,(S.c?S.c.gen:S.anc.length||1)):1));
  if(MODE!=="title"){drawCrest();drawLedger();drawRail();}
  const t=S&&S.tab||"story";
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  if(MODE==="title"){view().innerHTML=titleScreen();bindTitle();return;}
  if(t!=="story"){view().innerHTML=panel(t);bindPanel();return;}
  if(MODE==="ending"){view().innerHTML=endingScreen();bindEnding();return;}
  if(MODE==="succession"){view().innerHTML=successionScreen();bindSuccession();return;}
  view().innerHTML=storyScreen();bindStory();
}
function drawCrest(){
  el("arms").innerHTML=armsSVG(S.h.arms);
  el("hName").textContent=(S.c?S.c.name+" ":"")+"of "+S.h.name;
  const ttl=S.c?titleFor(S.h.rank,S.c.g):"";
  el("hSub").textContent=[ttl,S.h.seat].filter(Boolean).join(" · ");
  el("hYear").innerHTML=S.w.year+"<br>"+(S.c?"aged "+S.c.age:"");
}
function drawLedger(){
  const c=S.c,h=S.h;if(!c)return;
  const rows=[["Iron",c.stats.iron],["Coin",c.stats.coin],["Faith",c.stats.faith],["Guile",c.stats.cunning],
   ["Renown",h.standing],["Coffers",h.coffers],["Levies",h.strength],["Piety",h.piety]];
  el("ledger").innerHTML=rows.map(r=>`<div class="lg"><span class="k">${r[0]}</span><span class="v">${r[1]}</span></div>`).join("");
}
function drawRail(){
  el("railNum").textContent=ROMAN[S.c?S.c.gen:1];
  const c=S.c;
  const left=c?clamp(1-(c.qi/Math.max(1,c.queue.length-1)),0,1):1;
  const px=Math.round(6+left*58);
  const gutter=c&&c.peril>=4?" guttering":"";
  const n=S.chron.filter(e=>e.g===(c?c.gen:1));
  el("railMarks").innerHTML=
    `<div class="candle${gutter}" title="About ${Math.max(1,c?c.queue.length-c.qi:1)} scenes left in this life">
       <span class="flame" style="bottom:${px+1}px"></span>
       <span class="wax" style="height:${px}px"></span></div>`
    +n.slice(-10).map(e=>`<div class="mk ${e.c==="legend"?"g":(e.c==="grim"?"b":"")}"></div>`).join("");
}

function storyScreen(){
