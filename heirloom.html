<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a2018">
<title>Heirloom — a chronicle in four hands</title>
<style>
/* ============================================================
   HEIRLOOM — visual system
   Vellum, oak-gall ink, minium (red lead), lapis, gold leaf.
   No sans-serif anywhere. The page is a manuscript leaf.
   ============================================================ */
:root{
  --vellum:      #e3d6b6;
  --vellum-lit:  #ece1c6;
  --vellum-deep: #d2c09a;
  --vellum-edge: #b9a47c;
  --ink:         #2a2018;
  --ink-soft:    #5a4a38;
  --ink-faint:   #857053;
  --minium:      #a83420;
  --minium-lit:  #c9502f;
  --lapis:       #1f3a66;
  --gold:        #a9791f;
  --gold-lit:    #d3a442;
  --verdigris:   #4a6b52;
  --rail:        44px;
  --pad:         18px;
  --maxw:        44rem;
  --display: "Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",Georgia,serif;
  --body: "Iowan Old Style",Charter,"Bitstream Charter",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:#1b1510;
  color:var(--ink);
  font-family:var(--body);
  font-size:17px;
  line-height:1.62;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
/* ---- the leaf ---- */
#leaf{
  position:relative;
  min-height:100%;
  max-width:var(--maxw);
  margin:0 auto;
  background:
    radial-gradient(120% 60% at 12% 0%, rgba(255,250,230,.55), transparent 60%),
    radial-gradient(90% 50% at 88% 100%, rgba(160,132,84,.28), transparent 65%),
    radial-gradient(40% 30% at 70% 35%, rgba(178,150,96,.18), transparent 70%),
    var(--vellum);
  box-shadow:0 0 60px rgba(0,0,0,.6);
  padding-bottom:96px;
}
#leaf::before{ /* fibre + speckle */
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4'/><feColorMatrix type='saturate' values='0'/></filter><rect width='220' height='220' filter='url(%23f)' opacity='0.35'/></svg>");
}
/* ---- marginal rail: carries generation numeral + chronicle marks ---- */
#rail{
  position:absolute;left:0;top:0;bottom:0;width:var(--rail);
  border-right:1px solid rgba(42,32,24,.22);
  display:flex;flex-direction:column;align-items:center;
  padding-top:14px;gap:10px;pointer-events:none;z-index:2;
}
#rail .gen-num{
  font-family:var(--display);font-size:15px;letter-spacing:.06em;
  color:var(--minium);writing-mode:vertical-rl;text-orientation:mixed;
  opacity:.85;
}
#rail .marks{display:flex;flex-direction:column;gap:5px;align-items:center;margin-top:6px}
#rail .mk{width:5px;height:5px;border-radius:50%;background:var(--minium);opacity:.42}
#rail .mk.b{background:var(--lapis)}
#rail .mk.g{background:var(--gold)}

main{padding:0 var(--pad) 0 calc(var(--rail) + 14px)}

/* ---- header: arms + house line ---- */
header#crest{
  display:flex;align-items:center;gap:12px;
  padding:14px 0 10px;border-bottom:1px solid rgba(42,32,24,.2);
  position:relative;
}
#arms{width:52px;height:60px;flex:0 0 auto;filter:drop-shadow(0 1px 0 rgba(255,255,255,.35))}
#arms svg{display:block;width:100%;height:100%}
.house-line{flex:1;min-width:0}
.house-name{
  font-family:var(--display);font-size:20px;line-height:1.15;letter-spacing:.01em;margin:0;
}
.house-sub{
  font-family:var(--display);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-faint);margin-top:3px;
}
.year-tag{
  font-family:var(--display);font-size:12px;letter-spacing:.1em;color:var(--minium);
  text-align:right;white-space:nowrap;align-self:flex-start;padding-top:3px;
}

/* ---- ledger of estate ---- */
#ledger{display:flex;flex-wrap:wrap;gap:2px 0;padding:9px 0 11px;border-bottom:1px solid rgba(42,32,24,.16)}
.lg{flex:1 1 25%;min-width:74px;text-align:center;padding:2px 2px}
.lg .k{font-family:var(--display);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint);display:block}
.lg .v{font-family:var(--display);font-size:17px;color:var(--ink);letter-spacing:.02em}
.lg .v.up{color:var(--verdigris)} .lg .v.dn{color:var(--minium)}

/* ---- the story page ---- */
#page{padding-top:20px;animation:leafin .5s ease both}
@keyframes leafin{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.scene-eyebrow{
  font-family:var(--display);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--minium);margin-bottom:9px;
}
.scene-title{
  font-family:var(--display);font-size:27px;line-height:1.16;margin:0 0 14px;font-weight:normal;
  letter-spacing:-.005em;
}
.prose p{margin:0 0 15px}
.prose p:first-of-type::first-letter{
  font-family:var(--display);float:left;font-size:56px;line-height:.82;
  padding:5px 9px 0 0;color:var(--minium);
}
.prose em{font-style:italic;color:var(--ink-soft)}
.prose .said{color:var(--lapis);font-style:italic}
.rubric{
  font-family:var(--display);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-faint);margin:26px 0 11px;display:flex;align-items:center;gap:9px;
}
.rubric::after{content:"";flex:1;height:1px;background:rgba(42,32,24,.2)}

/* ---- choices ---- */
.choice{
  display:block;width:100%;text-align:left;cursor:pointer;
  background:linear-gradient(180deg,rgba(255,252,240,.5),rgba(255,252,240,.16));
  border:1px solid rgba(42,32,24,.24);border-left:3px solid var(--minium);
  border-radius:2px;padding:13px 14px 13px 15px;margin:0 0 10px;
  font-family:var(--body);font-size:16.5px;line-height:1.45;color:var(--ink);
  transition:transform .16s ease,background .16s ease,border-color .16s ease;
  position:relative;min-height:48px;
}
.choice:hover{background:linear-gradient(180deg,rgba(255,252,240,.85),rgba(255,252,240,.4));transform:translateX(2px)}
.choice:active{transform:scale(.994)}
.choice:focus-visible{outline:2px solid var(--lapis);outline-offset:2px}
.choice .kx{
  font-family:var(--display);font-size:11px;color:var(--ink-faint);
  position:absolute;right:9px;top:8px;letter-spacing:.08em;
}
.choice .hint{display:block;margin-top:6px;font-size:13.5px;font-style:italic;color:var(--ink-faint);line-height:1.4}
.choice.locked{opacity:.48;border-left-color:var(--ink-faint);cursor:not-allowed}
.choice.locked:hover{transform:none;background:linear-gradient(180deg,rgba(255,252,240,.5),rgba(255,252,240,.16))}
.choice.risky{border-left-color:var(--lapis)}
.choice.tender{border-left-color:var(--verdigris)}

/* ---- outcome ---- */
#outcome{animation:leafin .42s ease both}
.outcome-mark{
  font-family:var(--display);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--minium);margin-bottom:10px;
}
.deltas{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 4px}
.dl{
  font-family:var(--display);font-size:12px;letter-spacing:.05em;
  border:1px solid rgba(42,32,24,.3);border-radius:2px;padding:3px 8px;background:rgba(255,252,240,.4);
}
.dl.up{color:var(--verdigris);border-color:rgba(74,107,82,.5)}
.dl.dn{color:var(--minium);border-color:rgba(168,52,32,.45)}
.dl.note{color:var(--lapis);border-color:rgba(31,58,102,.4);font-style:italic}

.turn{
  display:block;width:100%;margin-top:20px;padding:14px;min-height:50px;cursor:pointer;
  background:var(--ink);color:var(--vellum-lit);border:none;border-radius:2px;
  font-family:var(--display);font-size:14px;letter-spacing:.22em;text-transform:uppercase;
  transition:background .16s ease;
}
.turn:hover{background:#3b2d21}
.turn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.turn.ghost{background:transparent;color:var(--ink-soft);border:1px solid rgba(42,32,24,.3)}
.turn.ghost:hover{background:rgba(255,252,240,.4)}
.turn.warn{background:var(--minium)}

/* ---- panels ---- */
.panel{padding-top:18px;animation:leafin .4s ease both}
.panel h2{
  font-family:var(--display);font-weight:normal;font-size:13px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--minium);margin:0 0 12px;
}
.panel h3{
  font-family:var(--display);font-weight:normal;font-size:19px;margin:22px 0 8px;
}
.entry{border-left:2px solid rgba(42,32,24,.2);padding:2px 0 2px 12px;margin-bottom:14px}
.entry .yr{font-family:var(--display);font-size:11px;letter-spacing:.14em;color:var(--minium);text-transform:uppercase}
.entry p{margin:3px 0 0;font-size:15.5px;line-height:1.5}
.entry.legend{border-left-color:var(--gold)}
.entry.legend .yr{color:var(--gold)}
.entry.grim{border-left-color:var(--ink)}

.kv{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px dotted rgba(42,32,24,.28);font-size:15.5px}
.kv .k{color:var(--ink-soft)}
.kv .v{font-family:var(--display);text-align:right}

.bond{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px dotted rgba(42,32,24,.24)}
.bond .who{flex:1;min-width:0}
.bond .nm{font-family:var(--display);font-size:16.5px;line-height:1.2}
.bond .rl{font-size:12px;color:var(--ink-faint);letter-spacing:.08em;text-transform:uppercase;font-family:var(--display)}
.meter{width:74px;height:5px;background:rgba(42,32,24,.16);border-radius:3px;overflow:hidden;flex:0 0 auto}
.meter i{display:block;height:100%;background:var(--verdigris)}
.meter.cold i{background:var(--lapis)}
.meter.bad i{background:var(--minium)}
.dead{opacity:.5}
.dead .nm::after{content:" †";color:var(--minium)}

.trait{
  display:inline-block;font-family:var(--display);font-size:13px;letter-spacing:.04em;
  border:1px solid rgba(42,32,24,.3);border-radius:2px;padding:3px 9px;margin:0 6px 6px 0;
  background:rgba(255,252,240,.4);
}
.trait.dark{border-color:rgba(168,52,32,.5);color:var(--minium)}
.trait.bright{border-color:rgba(169,121,31,.6);color:var(--gold)}
.trait.inherited{border-style:dashed}

/* ---- realm map ---- */
#map{width:100%;height:auto;display:block;margin:6px 0 14px;background:rgba(255,252,240,.28);border:1px solid rgba(42,32,24,.2)}
.legendrow{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;font-family:var(--display);color:var(--ink-soft);letter-spacing:.06em}
.legendrow i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}

/* ---- tree ---- */
.gencard{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dotted rgba(42,32,24,.26)}
.gencard .sig{width:36px;height:42px;flex:0 0 auto;opacity:.9}
.gencard .bd{flex:1;min-width:0}
.gencard .nm{font-family:var(--display);font-size:18px;line-height:1.2}
.gencard .ep{font-style:italic;color:var(--ink-soft);font-size:14.5px;margin-top:3px;line-height:1.45}
.gencard .dt{font-family:var(--display);font-size:11px;letter-spacing:.14em;color:var(--minium);text-transform:uppercase;margin-top:5px}

/* ---- nav ---- */
#nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:linear-gradient(180deg,rgba(42,32,24,.94),rgba(24,18,13,.98));
  border-top:1px solid rgba(169,121,31,.35);
  padding:0 0 env(safe-area-inset-bottom);
  display:flex;
}
#nav .inner{max-width:var(--maxw);margin:0 auto;display:flex;width:100%}
#nav button{
  flex:1;background:none;border:none;color:rgba(227,214,182,.55);cursor:pointer;
  font-family:var(--display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  padding:15px 2px 14px;min-height:50px;position:relative;transition:color .16s ease;
}
#nav button.on{color:var(--gold-lit)}
#nav button.on::after{content:"";position:absolute;left:26%;right:26%;bottom:7px;height:1px;background:var(--gold)}
#nav button:focus-visible{outline:1px solid var(--gold);outline-offset:-4px}
#nav .dot{position:absolute;top:9px;right:22%;width:5px;height:5px;border-radius:50%;background:var(--minium-lit)}

/* ---- title screen ---- */
#title{padding:44px 0 20px;text-align:center}
#title .mark{width:104px;height:120px;margin:0 auto 20px}
#title h1{
  font-family:var(--display);font-weight:normal;font-size:44px;letter-spacing:.14em;
  margin:0 0 6px;text-transform:uppercase;
}
#title .tag{font-family:var(--display);font-style:italic;color:var(--ink-soft);font-size:16px;margin-bottom:30px}
#title .blurb{text-align:left;margin:0 auto 26px;max-width:32rem}

/* ---- forms ---- */
.field{margin:14px 0}
.field label{font-family:var(--display);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);display:block;margin-bottom:6px}
.field input{
  width:100%;padding:12px 12px;font-family:var(--display);font-size:19px;color:var(--ink);
  background:rgba(255,252,240,.55);border:1px solid rgba(42,32,24,.32);border-radius:2px;
}
.field input:focus{outline:2px solid var(--lapis);outline-offset:0}
.row{display:flex;gap:10px}
.row .turn{margin-top:0}

/* ---- illumination (life open / close) ---- */
.illum{text-align:center;padding:22px 0 6px}
.illum svg{width:118px;height:136px;margin:0 auto 6px;display:block}
.illum .motto{font-family:var(--display);font-style:italic;color:var(--gold);letter-spacing:.06em;font-size:15px}

.epitaph{
  border-top:1px solid rgba(42,32,24,.28);border-bottom:1px solid rgba(42,32,24,.28);
  padding:16px 0;margin:20px 0;text-align:center;font-family:var(--display);font-style:italic;font-size:19px;line-height:1.5;
}
.yearn{
  background:rgba(31,58,102,.07);border-left:3px solid var(--lapis);
  padding:11px 13px;margin:16px 0;font-size:15px;line-height:1.5;
}
.yearn .lbl{font-family:var(--display);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--lapis);display:block;margin-bottom:4px}
.yearn.met{background:rgba(74,107,82,.09);border-left-color:var(--verdigris)}
.yearn.met .lbl{color:var(--verdigris)}
.yearn.failed{background:rgba(168,52,32,.07);border-left-color:var(--minium)}
.yearn.failed .lbl{color:var(--minium)}

.small{font-size:13.5px;color:var(--ink-faint);line-height:1.5}
.center{text-align:center}
.hr{height:1px;background:rgba(42,32,24,.2);margin:20px 0}
.note{font-style:italic;color:var(--ink-soft)}

@media (min-width:560px){
  :root{--rail:60px;--pad:34px}
  body{font-size:18px}
  .scene-title{font-size:32px}
  #title h1{font-size:56px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* ---- life clock: a candle in the margin ---- */
.candle{position:relative;width:11px;height:74px;margin:4px 0 8px}
.candle .wax{position:absolute;bottom:0;left:0;width:11px;background:linear-gradient(180deg,#f4ecd6,#cdbb95);
  border:1px solid rgba(42,32,24,.35);border-radius:2px}
.candle .flame{position:absolute;left:2px;width:7px;height:11px;
  border-radius:50% 50% 50% 50%/62% 62% 38% 38%;
  background:radial-gradient(circle at 50% 70%,#ffeaa9,#d9a83c 60%,rgba(168,52,32,.9));
  box-shadow:0 0 9px rgba(217,168,60,.7);animation:flick 1.7s infinite ease-in-out}
@keyframes flick{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.16) translateX(.6px)}}
.candle.guttering .flame{animation-duration:.45s;opacity:.7}

/* ---- odds, stated before you pay ---- */
.choice .odds{display:inline-block;margin-left:8px;font-family:var(--display);font-size:11.5px;letter-spacing:.08em;
  color:var(--lapis);border:1px solid rgba(31,58,102,.42);border-radius:2px;padding:1px 6px;
  vertical-align:2px;background:rgba(31,58,102,.07)}
.choice .hint.why{font-style:normal;font-size:12.5px;color:var(--lapis);opacity:.85;margin-top:3px}

/* ---- the die ---- */
.dieline{display:flex;align-items:center;gap:11px;padding:11px 12px;margin:0 0 16px;
  border:1px solid rgba(42,32,24,.3);background:rgba(255,252,240,.5);border-radius:2px;font-size:14.5px;line-height:1.4}
.dieline .die{flex:0 0 auto;width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:19px;border:2px solid var(--ink);border-radius:4px;background:var(--vellum-lit)}
.dieline.good .die{border-color:var(--verdigris);color:var(--verdigris)}
.dieline.bad .die{border-color:var(--minium);color:var(--minium)}

/* ---- contests ---- */
.contest{margin:6px 0 4px}
.crow{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.crow .cn{flex:0 0 34%;font-family:var(--display);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .cv{font-family:var(--display);font-size:15px;width:26px;text-align:right}
.cbar{flex:1;height:9px;background:rgba(42,32,24,.14);border:1px solid rgba(42,32,24,.25);border-radius:2px;overflow:hidden}
.cbar i{display:block;height:100%;background:var(--gold);transition:width .3s ease}
.cbar.them i{background:var(--minium)}
.tell{font-style:italic;color:var(--lapis);font-size:14.5px;margin:10px 0 8px}
.clog{border-left:2px solid rgba(42,32,24,.2);padding-left:11px;margin:10px 0;font-size:14.5px;line-height:1.5;color:var(--ink-soft)}
.clog div{margin-bottom:5px}
.cround{font-family:var(--display);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--minium);margin:12px 0 10px}

/* ---- the heirloom and the things with names ---- */
.relic{border:1px solid rgba(169,121,31,.5);background:rgba(169,121,31,.07);padding:12px;border-radius:2px}
.relic .rn{font-family:var(--display);font-size:19px}
.relic .rd{font-size:14.5px;color:var(--ink-soft);margin-top:3px;line-height:1.45}
.relic .rs{font-family:var(--display);font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin-top:7px}
.relic .rs.ok{color:var(--verdigris)} .relic .rs.bad{color:var(--minium)}
.kv.dead{opacity:.5}

/* ---- what this house does not say ---- */
.secret{border-left:3px solid var(--ink-faint);padding:8px 0 8px 11px;margin-bottom:11px}
.secret.out{border-left-color:var(--minium)}
.secret .st{font-size:15px;line-height:1.45}
.secret .sk{font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-top:4px}
.secret.out .sk{color:var(--minium)}

/* ---- later hands in the margin ---- */
.marg{margin:7px 0 0 6px;padding-left:10px;border-left:1px dotted rgba(31,58,102,.5);
  font-family:var(--display);font-style:italic;font-size:13.5px;line-height:1.45;color:var(--lapis);opacity:.92}
.marg .mh{font-style:normal;letter-spacing:.1em;font-size:10.5px;text-transform:uppercase;opacity:.75}

/* ---- share ---- */
.sharebox{white-space:pre-wrap;font-family:var(--display);font-size:13px;line-height:1.55;
  background:rgba(255,252,240,.55);border:1px solid rgba(42,32,24,.28);padding:12px;border-radius:2px;
  overflow-x:auto;margin:0 0 12px;color:var(--ink)}
.toast{font-family:var(--display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--verdigris);text-align:center;margin-top:10px;min-height:14px}

/* ---- the leaf ages as the hands pass ---- */
#leaf[data-age="2"]::after,#leaf[data-age="3"]::after,#leaf[data-age="4"]::after{
  content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;
  background:
    radial-gradient(circle at 8% 14%, rgba(120,88,44,.15), transparent 11%),
    radial-gradient(circle at 92% 61%, rgba(120,88,44,.13), transparent 10%),
    radial-gradient(circle at 67% 23%, rgba(120,88,44,.10), transparent 8%);
}
#leaf[data-age="3"]::after{
  background:
    radial-gradient(circle at 8% 14%, rgba(120,88,44,.2), transparent 12%),
    radial-gradient(circle at 92% 61%, rgba(120,88,44,.17), transparent 11%),
    radial-gradient(circle at 67% 23%, rgba(120,88,44,.14), transparent 10%),
    radial-gradient(circle at 22% 82%, rgba(120,88,44,.13), transparent 10%);
}
#leaf[data-age="4"]::after{
  background:
    radial-gradient(circle at 8% 14%, rgba(120,88,44,.24), transparent 13%),
    radial-gradient(circle at 92% 61%, rgba(120,88,44,.21), transparent 12%),
    radial-gradient(circle at 67% 23%, rgba(120,88,44,.17), transparent 11%),
    radial-gradient(circle at 22% 82%, rgba(120,88,44,.17), transparent 11%),

function armsBlazon(a){
  const t=x=>x; const f=t(a.field), m=t(a.metal);
  let d="";
  if(a.div==="perPale")d=`Per pale ${f} and ${a.alt}`;
  else if(a.div==="perFess")d=`Per fess ${f} and ${a.alt}`;
  else if(a.div==="perBend")d=`Per bend ${f} and ${a.alt}`;
  else if(a.div==="chief")d=`${cap(f)}, a chief ${a.alt}`;
  else if(a.div==="chevron")d=`${cap(f)}, a chevron ${a.alt}`;
  else d=cap(f);
  let s=`${d}, ${CHARGE_WORD[a.charge]} ${m}`;
  a.augments.forEach(g=>{ s+=", "+g.blazon; });
  if(a.impaled)s=`Impaled: ${s}; and ${armsBlazon(a.impaled)}`;
  return s+".";
}
function shieldPath(){return "M4 4h92v42c0 26-20 42-46 52C24 88 4 72 4 46z";}

function armsSVG(a,opts){
  opts=opts||{};

    if(ar.div==="perPale")g+=`<rect x="50" y="0" width="50" height="120" fill="${A}"/>`;
    else if(ar.div==="perFess")g+=`<rect x="0" y="54" width="100" height="66" fill="${A}"/>`;
    else if(ar.div==="perBend")g+=`<path d="M0 0 L100 0 L0 120z" fill="${A}"/>`;
    else if(ar.div==="chief")g+=`<rect x="0" y="0" width="100" height="28" fill="${A}"/>`;
    else if(ar.div==="chevron")g+=`<path d="M50 34 L96 84 L96 100 L50 52 L4 100 L4 84z" fill="${A}"/>`;
    g+=`<g transform="translate(14,14) scale(0.72)"><path d="${CHARGES[ar.charge]}" fill="${TINCT[ar.metal]}" stroke="rgba(0,0,0,.28)" stroke-width="1.2"/></g>`;
    (ar.augments||[]).forEach(au=>{
      if(au.type==="bordure")g+=`<path d="${shieldPath()}" fill="none" stroke="${TINCT[au.tinct]}" stroke-width="9"/>`;
      if(au.type==="canton")g+=`<rect x="6" y="6" width="30" height="30" fill="${TINCT[au.tinct]}" stroke="rgba(0,0,0,.3)"/><g transform="translate(9,9) scale(0.24)"><path d="${CHARGES[au.charge||"star"]}" fill="${TINCT[au.metal||"or"]}"/></g>`;
      if(au.type==="bend")g+=`<path d="M0 10 L86 96 L74 108 L-6 24z" fill="${TINCT[au.tinct]}" opacity=".92"/>`;

    });
    return g;
  }
  let inner="";

    inner=`<g clip-path="url(#c${id}L)">${fieldFor(a)}</g><g clip-path="url(#c${id}R)"><g transform="translate(50,0)"><g transform="scale(0.5,1)">${fieldFor(a.impaled)}</g></g></g>`;

  } else {

function buildRegions(n){
  const R=[],W=300,H=212;
  for(let i=0;i<n;i++){
    let x,y,ok=false,tries=0;
    while(!ok&&tries<60){
      x=ri(28,W-28);y=ri(26,H-26);ok=R.every(r=>Math.hypot(r.x-x,r.y-y)>37);tries++;
    }
    R.push({id:i,name:placeName(),x,y,holder:null,
      type:pick(["farmland","woods","hills","fen","coast","moor","river-mouth","vineyard","quarry","pasture"])});
  }
  // roads: connect each to nearest 2
  R.forEach(r=>{
    const near=R.filter(o=>o!==r).sort((a,b)=>Math.hypot(a.x-r.x,a.y-r.y)-Math.hypot(b.x-r.x,b.y-r.y)).slice(0,2);
    r.roads=near.map(o=>o.id);
  });
  return R;
}
function mapSVG(W){
  const w=W.regions;
  let roads="",seen={};
  w.forEach(r=>(r.roads||[]).forEach(j=>{
    const k=Math.min(r.id,j)+"-"+Math.max(r.id,j);
    if(seen[k])return;seen[k]=1;
    const o=w[j];
    roads+=`<line x1="${r.x}" y1="${r.y}" x2="${o.x}" y2="${o.y}" stroke="#2a2018" stroke-opacity=".22" stroke-width="1" stroke-dasharray="3 3"/>`;
  }));
  const col=h=>h==="you"?"#a9791f":(h==="crown"?"#1f3a66":(h?"#a83420":"#b3a versus"));
  const colour=h=>h==="you"?"#a9791f":(h==="crown"?"#1f3a66":(h?"#a83420":"rgba(42,32,24,.24)"));

  const labcol=h=>h==="you"?"#8a6318":(h==="crown"?"#1f3a66":(h?"#8e2c1b":"#8a7a5e"));
  let nodes="";

    const mine=r.holder==="you";

    nodes+=`<g><circle cx="${r.x}" cy="${r.y}" r="${rad}" fill="${colour(r.holder)}" stroke="#2a2018" stroke-width="1"/>`;
    if(mine)nodes+=`<circle cx="${r.x}" cy="${r.y}" r="${rad+5}" fill="none" stroke="#a9791f" stroke-width="1" stroke-opacity=".6"/>`;
    if(r.raided)nodes+=`<path d="M${r.x-6} ${r.y-6} L${r.x+6} ${r.y+6} M${r.x+6} ${r.y-6} L${r.x-6} ${r.y+6}" stroke="#a83420" stroke-width="1.5"/>`;
    nodes+=`<text x="${r.x}" y="${r.y-rad-4}" text-anchor="middle" font-family="Palatino,Georgia,serif" font-size="8.6" fill="#2a2018" fill-opacity=".88">${r.name}</text>`;
    nodes+=`<text x="${r.x}" y="${r.y+rad+9}" text-anchor="middle" font-family="Palatino,Georgia,serif" font-size="6.9" fill="${labcol(r.holder)}">${label(r.holder)}</text></g>`;
  });
  const coast=`<path d="M6 24 C40 12, 70 30, 104 20 S170 8, 214 22 S276 14, 294 30 L294 188 C260 202, 220 190, 180 202 S96 206, 52 194 S12 190, 6 180 Z"
     fill="none" stroke="#2a2018" stroke-opacity=".3" stroke-width="1.4"/>`;
  return `<svg id="map" viewBox="0 0 300 214" xmlns="http://www.w3.org/2000/svg">${coast}${roads}${nodes}</svg>`;
}/* ================================================================

function person(who){
  const c=S.c;
  if(!who)return null;
  if(who==="spouse")return c.spouse;
  if(who==="heir")return c.kids.find(k=>k.alive)||null;
  if(typeof who==="object")return who;
  if(who.startsWith("kid:"))return c.kids[+who.slice(4)]||null;
  if(who.startsWith("kin:"))return c.kin[+who.slice(4)]||null;
  let p=c.kin.find(k=>k.name===who)||c.kids.find(k=>k.name===who);
  if(!p&&c.spouse&&c.spouse.name===who)p=c.spouse;
  return p||null;
}

/* ================================================================

   ================================================================ */
function newWorld(seedStr,houseNameIn,charName){
  RND=mulberry(hashSeed(seedStr));
  const faith=pick(FAITHS), threat=pick(THREATS);
  const regions=buildRegions(14);
  const hn=houseNameIn||houseName();
  const houses=[];
  for(let i=0;i<3;i++){
    let nm=houseName(),guard=0;
    while((nm===hn||houses.some(h=>h.name===nm))&&guard++<40)nm=houseName();
    houses.push({name:nm,seat:nm,arms:newArms(),att:i===0?ri(-45,-20):ri(-10,30),
      holdings:[],strength:ri(2,4),coffers:ri(3,6),standing:ri(15,35),dead:false});
  }
  regions.forEach(r=>{r.income=ri(1,3);r.dev=0;r.raided=false;});
  // a house and its seat share a name, so the map can be read at a glance
  regions[0].name=hn; regions[0].holder="you";
  houses.forEach((h,i)=>{const r=regions[i+1];r.name=h.name;r.holder=h.name;h.holdings.push(r.id);});
  houses.forEach(h=>{
    const near=(regions[h.holdings[0]].roads||[]).map(i=>regions[i]).filter(r=>!r.holder);
    if(near.length){near[0].holder=h.name;h.holdings.push(near[0].id);}
  });
  regions.filter(r=>!r.holder).slice(0,2).forEach(r=>{r.holder="crown";});
  const w={
    realm:"the "+pick(["Kingdom","Realm","Crown-lands","Marches"])+" of "+placeName(),
    king:gname("m"), kingHouse:houseName(), faith, threat,
    year:ri(880,1130), regions, houses, rival:houses[0], flags:{}, era:1, events:[],
  };
  const h={
    name:hn, seat:regions[0].name, motto:pick(MOTTOS), arms:newArms(),
    standing:18, coffers:5, strength:3, piety:40, rank:0,
    holdings:[0], flags:{}, legends:[],
    heirloom:newHeirloom(), things:[], secrets:[],
  };
  S={v:2,seed:seedStr,started:true,finished:false,w,h,chron:[],anc:[],seeds:[],marg:[],
     used:{},tab:"story",c:null,pending:null,ending:null,lastIncome:0};
  G.chron(`In the ${ordinal(1)} year of ${w.king}, ${h.name} was ${pick(["granted","confirmed in","left"])} the manor at ${h.seat} and its fields. The grant was written small.`,"");
  worldTick(2);
  beginLife(1,charName,null);
  return S;
}
function ordinal(n){const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}

   A LIFE
   ================================================================ */
function beginLife(gen,nameIn,parent){
  const g=chance(.62)?"m":"f";
  const name=nameIn||gname(g);
  const born=S.w.year;  // corrected below once age is known
  const stats={iron:ri(1,3),coin:ri(1,3),faith:ri(1,3),cunning:ri(1,3)};
  let traits=[];
  if(parent){
    // inheritance: traits pass down if the bond was strong, or as a wound if it was not
    (parent.traits||[]).forEach(t=>{
      if(chance(parent.bond>=60?.34:.16))traits.push(t);
    });
    if(parent.bond<30&&chance(.6))traits.push(pick(["Guarded","Ambitious","Haunted"]));
    if(parent.bond>=75&&chance(.6))traits.push(pick(["Hale","Just","Beloved"]));
    if(parent.stats){for(const k in stats)stats[k]=clamp(stats[k]+(parent.stats[k]>=7?1:0),1,5);}
    if(parent.childTraits)parent.childTraits.forEach(t=>{if(!traits.includes(t))traits.push(t);});
  }
  traits=[...new Set(traits)].slice(0,4);
  const yid=pick(Object.keys(YEARN_TEXT).filter(k=>!S.anc.some(a=>a.yearn===k)||S.anc.length>=8));
  const age0=ri(16,21);
  S.c={
    name, gen, g, born:S.w.year-age0, age:age0, title:titleFor(S.h.rank,g),
    stats, traits, flags:{startHoldings:S.h.holdings.length},
    spouse:null, kin:[], kids:[], peril:0, deeds:[],
    yearn:yid, yearnMet:false, queue:[], qi:0, phase:"youth",
    dead:false, cause:"", parentName:parent?parent.name:null,
  };
  // kin: a sibling, always. The sibling is where most family trouble lives.
  if(parent&&parent.siblings&&parent.siblings.length){
    parent.siblings.slice(0,1).forEach(s=>S.c.kin.push(s));
  } else {
    const sg=chance(.5)?"m":"f";
    S.c.kin.push({name:gname(sg),g:sg,rel:sg==="m"?"brother":"sister",bond:ri(40,70),alive:true});
  }
  if(gen===1){
    S.c.kin.push({name:gname(chance(.5)?"m":"f"),rel:"steward",bond:ri(45,65),alive:true,g:"m"});
  } else {
    S.c.kin.push({name:gname(chance(.5)?"m":"f"),rel:"steward",bond:ri(40,70),alive:true,g:chance(.5)?"m":"f"});
  }
  try{SND.setMood(gen,S.h.standing<22);}catch(e){}
  buildQueue();
}

/* queue: youth 2 → ascension 1 → prime 5-7 (incl. marriage + legacies) → twilight 1 → death */
function buildQueue(){
  const c=S.c, gen=c.gen;
  const q=[];
  q.push({k:"open"});
  q.push({k:"pool",phase:"youth"});
  q.push({k:"pool",phase:"youth"});
  q.push({k:"anchor",id:"ascend"});
  const prime=ri(5,6);
  const legacy=readySeeds().slice(0,2);
  const slots=[];
  for(let i=0;i<prime;i++)slots.push({k:"pool",phase:"prime"});
  if(!c.spouse)slots.splice(chance(.5)?0:1,0,{k:"anchor",id:"marriage"});
  legacy.forEach((sd,i)=>slots.splice(Math.min(slots.length,2+i*2),0,{k:"legacy",seed:sd}));
  if(gen>=2)slots.splice(Math.min(slots.length,3),0,{k:"anchor",id:"children"});
  else slots.splice(Math.min(slots.length,3),0,{k:"anchor",id:"children"});
  slots.splice(clamp(ri(1,slots.length-1),0,slots.length),0,{k:"anchor",id:"travel"});
  for(let i=0;i<2;i++)slots.splice(ri(0,slots.length),0,{k:"inter"});
  if(gen===3)slots.splice(Math.min(slots.length,3),0,{k:"anchor",id:"crisis"});
  if(gen===2)slots.splice(Math.min(slots.length,4),0,{k:"anchor",id:"omen"});
  if(gen===4)slots.splice(Math.min(slots.length,4),0,{k:"anchor",id:"reckoning"});
  q.push(...slots);
  q.push({k:"pool",phase:"twilight"});
  q.push({k:"anchor",id:"death"});
  c.queue=q; c.qi=0;
}
function readySeeds(){
  return S.seeds.filter(s=>!s.used&&s.gen<S.c.gen&&LEGACY[s.type]).sort((a,b)=>a.gen-b.gen);
}

/* ---------------- ODDS ---------------- */
/* Every uncertain choice states its price before you pay it. */
function oddsOf(ch){
  if(!ch.odds)return null;
  const o=safe(()=>ch.odds(G),null);
  if(o==null)return null;
  const p=clamp(typeof o==="number"?o:o.p,0.02,0.98);
  return {p,why:(typeof o==="object"&&o.why)||""};
}
function fracWord(p){
  const n=Math.max(1,Math.round(p*6));
  return n+" in 6";
}
/* roll() records the die so the outcome can show its working */
function roll(p,label){
  const die=ri(1,6), need=Math.max(1,Math.round(p*6));
  try{SND.die();}catch(e){}
  const win=die<=need;
  if(S.pending)S.pending.roll={die,need,win,label:label||""};
  return win;
}
G.roll=roll;
G.odds=oddsOf;

function syncSecrets(){

/* between generations, somebody may find one out */
function secretsLeak(){

  if(!hidden.length)return;
  const guard=(S.c&&S.c.stats.cunning>=6)?0.16:0.36;
  hidden.forEach(s=>{

function regionIncome(r){return Math.max(0,(r.income||1)+(r.dev||0)-(r.raided?2:0));}
function houseIncome(){return S.h.holdings.reduce((a,i)=>a+regionIncome(S.w.regions[i]),0);}

  d(r.name+" improved","up");G.chron(`Work was put into ${r.name}; it yields more than it did.`);};

/* ---------------- HOUSES THAT PLAY ---------------- */
function houseOf(name){return S.w.houses.find(h=>h.name===name);}
function powerOf(h){return h.holdings.length*2+h.strength+Math.floor(h.standing/12);}
function yourPower(){return S.h.holdings.length*2+S.h.strength+Math.floor(S.h.standing/12);}
function freeRegions(){return S.w.regions.filter(r=>!r.holder);}
function adjacentTo(h){
  const ids=new Set();
  h.holdings.forEach(i=>{(S.w.regions[i].roads||[]).forEach(j=>ids.add(j));});
  return [...ids].map(i=>S.w.regions[i]);
}
/* one turn per house, between generations. The map is not a picture. */
function rivalTurn(){
  const ev=[];
  S.w.houses.forEach(h=>{
    if(h.dead)return;
    h.coffers+=h.holdings.length+ri(0,2);
    const near=adjacentTo(h);
    const open=near.filter(r=>!r.holder);
    const mine=near.filter(r=>r.holder==="you");
    const weak=near.filter(r=>r.holder&&r.holder!=="you"&&r.holder!=="crown"&&r.holder!==h.name
      &&houseOf(r.holder)&&powerOf(houseOf(r.holder))<powerOf(h)-2);
    const r=rnd();
    if(open.length&&r<0.42&&h.coffers>=3){
      const t=pick(open);t.holder=h.name;h.holdings.push(t.id);h.coffers-=3;h.standing+=3;
      ev.push(`${h.name} took ${t.name}, which had been standing empty since the last plague.`);
    } else if(mine.length&&h.att<-25&&powerOf(h)>yourPower()-2&&r<0.62){
      const t=pick(mine);t.raided=true;
      ev.push(`Riders out of ${h.seat} burned ricks in ${t.name}. Nobody was killed. That was the message.`);
      S.h.coffers=Math.max(0,S.h.coffers-1);
    } else if(weak.length&&r<0.72){
      const t=pick(weak);const victim=houseOf(t.holder);
      t.holder=h.name;h.holdings.push(t.id);h.strength=Math.max(1,h.strength-1);
      if(victim){victim.holdings=victim.holdings.filter(i=>i!==t.id);
        if(!victim.holdings.length){victim.dead=true;ev.push(`${victim.name} of ${victim.seat} holds nothing at all now. The name will be gone in a generation.`);}}
      ev.push(`${h.name} took ${t.name} from ${victim?victim.name:"its holder"} by law, debt and one short afternoon of violence.`);
    } else if(r<0.86){
      h.strength+=1;h.standing+=2;h.coffers=Math.max(0,h.coffers-2);
      ev.push(`${h.name} spent the year arming and marrying, and is stronger for it than anyone likes.`);
    } else {
      h.att=clamp(h.att+ri(5,20),-100,100);
      ev.push(`${h.name} sent word to ${S.h.name}. The tone was warmer than it has been.`);
    }
  });
  // your own tenants pay, and raids stop hurting after a season
  S.w.regions.forEach(r=>{if(r.raided&&chance(.6))r.raided=false;});
  const inc=houseIncome();
  S.h.coffers+=inc;
  S.lastIncome=inc;
  pickN(ev,Math.min(2,ev.length)).forEach(t=>S.w.events.push({y:S.w.year,t,kind:"house"}));
  return ev;
}

const WORLD_EV=[

function worldTick(n){
  const out=[];
  for(let i=0;i<(n||2);i++){
    const e=pick(WORLD_EV);
    const t=safe(()=>e.t(G),"");
    if(!t||S.w.events.some(x=>x.t===t))continue;
    safe(()=>e.fx(),null);
    S.w.events.push({y:S.w.year,t,kind:"world"});
    out.push(t);
  }
  if(S.w.events.length>40)S.w.events=S.w.events.slice(-40);
  return out;
}

/* later hands write in the margins of earlier ones */
const MARG_LEGEND=["This is the version we tell.","My father told it shorter.","I have seen the field. It is smaller than the story.",
  "They still sing this. It is mostly true.","The part about the weather is invented."];
const MARG_GRIM=["Nobody in this house will say this aloud.","I was told it was necessary. I was not told by whom.",
  "This is why they will not sell to us.","We are still paying for this.","There is another account of this. It is worse."];
const MARG_PLAIN=["A good year. There were not many.","This was the year the roof was done.","I do not remember this at all.",
  "My mother's hand, this line.","Ink faded here — read it as best I can."];
function addMarginalia(){
  if(!S.marg)S.marg=[];
  const gen=S.c?S.c.gen:1;
  const older=S.chron.map((e,i)=>({e,i})).filter(x=>x.e.g<gen&&!S.marg.some(m=>m.on===x.i));
  if(!older.length)return;
  pickN(older,Math.min(2,older.length)).forEach(x=>{
    const pool=x.e.c==="legend"?MARG_LEGEND:(x.e.c==="grim"?MARG_GRIM:MARG_PLAIN);
    S.marg.push({on:x.i,gen,t:pick(pool)});
  });
}

/* ---------------- CONTESTS: several rounds, not one ---------------- */
const TACTICS={
 battle:[
  {k:"press", t:"Press the centre",  beats:"hold",   stat:"iron"},
  {k:"flank", t:"Go round the flank",beats:"press",  stat:"cunning"},
  {k:"hold",  t:"Hold and let them come",beats:"flank",stat:"iron"},
 ],
 haggle:[
  {k:"push",   t:"Push them on the price"},
  {k:"sweeten",t:"Sweeten the terms"},
  {k:"wait",   t:"Say nothing and wait"},
 ],
};
const TELLS={
 press:["Their centre is thickening.","Horns on their line — they are massing to come straight at you."],
 flank:["Dust on your right, well beyond the line.","Their light horse has drifted wide and stopped pretending otherwise."],
 hold:["They have stopped moving. They have chosen their ground.","Stakes going in along their front."],
};
function startContest(cfg){
  S.pending.contest=Object.assign({
    kind:"battle",round:1,maxR:4,log:[],finished:false,result:null,
    you:{name:S.c.name,force:10,morale:10},
    them:{name:"the enemy",force:10,morale:10},
    theirNext:null,
  },cfg);
  const c=S.pending.contest;
  if(c.kind==="battle")c.theirNext=pick(TACTICS.battle).k;
  return "";
}
G.contest=startContest;

function contestAct(k){
  const c=S.pending&&S.pending.contest;
  if(!c||c.finished)return;
  try{c.kind==="battle"?SND.thud():SND.quill();}catch(e){}
  if(c.kind==="battle")battleRound(c,k); else haggleRound(c,k);
  if(!c.finished&&c.round>c.maxR)finishContest(c,"time");
  save();render();
}
function battleRound(c,k){
  if(k==="parley"){finishContest(c,"parley");return;}
  const mine=TACTICS.battle.find(t=>t.k===k), theirs=c.theirNext;
  const bonus=Math.floor((S.c.stats[mine.stat]||0)/3);
  let line;
  if(mine.beats===theirs){
    const dmg=2+bonus+ri(0,2);
    c.them.force-=dmg;c.them.morale-=2;
    line=`Round ${c.round}: you ${mine.t.toLowerCase()}; they ${theirs}. It works — they give ground. (−${dmg} to them)`;
  } else if(TACTICS.battle.find(t=>t.k===theirs).beats===k){
    const dmg=2+ri(0,2)+Math.max(0,2-bonus);
    c.you.force-=dmg;c.you.morale-=2;
    line=`Round ${c.round}: you ${mine.t.toLowerCase()}; they ${theirs}. They read you. (−${dmg} to you)`;
  } else {
    c.you.force-=1;c.them.force-=1;
    line=`Round ${c.round}: you ${mine.t.toLowerCase()}; they ${theirs}. Nothing moves but the casualties.`;
  }
  c.log.push(line);
  c.round++;
  c.theirNext=pick(TACTICS.battle).k;
  if(c.them.force<=0)finishContest(c,"win");
  else if(c.you.force<=0)finishContest(c,"lose");
}
function haggleRound(c,k){
  if(k==="close"){finishContest(c,c.price>=c.reserve?"deal":"deal");return;}
  if(k==="walk"){
    if(c.price>=c.reserve-1&&chance(.55)){c.price=Math.max(c.price,c.reserve);c.log.push(`You get as far as the door. They call you back and meet you at ${c.price}.`);finishContest(c,"deal");}
    else{c.log.push(`You walk. Nobody calls after you.`);finishContest(c,"nodeal");}
    return;
  }
  const skill=Math.floor((S.c.stats.coin+S.c.stats.cunning)/4);
  if(k==="push"){
    if(chance(0.42+skill*0.06)){c.price+=ri(1,2);c.log.push(`Round ${c.round}: you push. They move to ${c.price}.`);}
    else{c.patience-=2;c.log.push(`Round ${c.round}: you push. They do not move, and they look at the door.`);}
    c.patience-=1;
  } else if(k==="sweeten"){
    c.price+=1;c.patience+=1;c.gave=(c.gave||0)+1;
    c.log.push(`Round ${c.round}: you give ground on the terms. They come up to ${c.price}, warmly.`);
  } else {
    if(chance(0.45)){c.price+=1;c.log.push(`Round ${c.round}: you say nothing. They fill the silence with ${c.price}.`);}
    else{c.patience-=1;c.log.push(`Round ${c.round}: you say nothing. So do they. It is a long minute.`);}
  }
  c.round++;
  if(c.patience<=0){c.log.push(`They stand up. The matter is closed.`);finishContest(c,"nodeal");}
}
function finishContest(c,result){c.finished=true;c.result=result;}

/* ---------------- SHARE ---------------- */
function shareText(){
  const e=S.ending||{title:"unfinished",year:S.w.year};
  const L=[];
  L.push(`HEIRLOOM — House ${S.h.name} of ${S.h.seat}`);
  L.push(`${S.anc.length?S.anc[0].born:S.w.year}–${e.year||S.w.year} · ${S.w.realm}`);
  L.push("");
  S.anc.forEach(a=>{
    L.push(`${ROMAN[a.gen]}. ${a.name} ${a.epithet} (${a.age}) ${a.met?"— got what they wanted":""}`.trim());
    L.push(`   ${a.epi}`);
  });
  L.push("");
  const thr=S.w.flags["threat_"+S.w.threat.id];
  L.push(`${cap(S.w.threat.name)}: ${thr==="triumph"?"held, and was raised for it":thr==="endure"?"endured":thr==="broken"?"broke this house":"never came"}`);
  if(S.h.heirloom)L.push(`${cap(hlName())}: ${hl().state}`);
  L.push(`Ending: ${e.title}`);
  L.push(`Seed: ${S.seed}`);
  return L.join("\n");
}
function doShare(){
  const t=shareText();
  if(typeof navigator!=="undefined"&&navigator.share){navigator.share({title:"Heirloom — House "+S.h.name,text:t}).catch(()=>{});return "shared";}
  return copyText(t);
}
function copyText(t){
  try{
    if(typeof navigator!=="undefined"&&navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t);return "copied";}
  }catch(e){}
  try{
    const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);
    ta.select();document.execCommand("copy");document.body.removeChild(ta);return "copied";
  }catch(e){return "failed";}
}
