/* ================================================================
   DEATH, SUCCESSION, ENDING
   ================================================================ */
function computeEpitaph(){
  const c=S.c,h=S.h,t=c.traits,has=x=>t.includes(x);
  if(has("Kinslayer"))return `Of whom the family does not speak in full sentences.`;
  if(c.age<38)return `Who was not given time.`;
  if(h.flags.rivalBroken)return `Who finished it.`;
  if(h.flags.returnedLand)return `Who gave back what was never ours, and was thought mad for it.`;
  if(h.flags.hoardGiven)return `Who dug up what the family buried and handed it out at the gate.`;
  if(has("Beloved")&&has("Just"))return `Who judged fairly and was loved for it, which is rarer than either.`;
  if(has("Beloved")&&has("Merciful"))return `Who could have, and did not, and was loved for that.`;
  if(has("Cruel")&&has("Feared"))return `Whom the household obeyed quickly.`;
  if(has("Feared")&&has("Iron-willed"))return `Whom nobody in this valley ever tried twice.`;
  if(has("Oathbreaker"))return `Whose word was good until it was expensive.`;
  if(has("Drunkard"))return `Who was excellent company and a poor manager of afternoons.`;
  if(has("Haunted"))return `Who carried something and never set it down.`;
  if(has("Lame"))return `Who walked badly and outlasted the ones who walked well.`;
  if(has("Beloved"))return `Whom the valley loved, and said so, unprompted, for a long time after.`;
  if(h.flags.trueChronicle)return `Who wrote it down as it happened, which nobody had asked for.`;
  if(has("Scholar")||has("Bookish"))return `Who read, and wrote, and left the accounts in better order than anyone since.`;
  if(has("Just"))return `Who kept the law the same for cousin and cottar.`;
  if(has("Iron-willed"))return `Who did not bend, whatever it cost, and it cost.`;
  if(has("Merciful"))return `Who could have, and did not.`;
  if(has("Miserly"))return `Who left the chest full and the roof unmended.`;
  if(has("Generous"))return `Who gave things away and was never able to explain the arithmetic.`;
  if(h.flags.builtSomething)return `Who built, and whose building outlasted the argument about it.`;
  if(has("Shrewd"))return `Who was never once cheated, and counted that a life.`;
  if(c.age>70)return `Who outlived everyone who had an opinion about ${c.g==="f"?"her":"him"}.`;
  return `Who held it, and handed it on, and is remembered chiefly for that.`;
}
function checkYearn(){
  const id=S.c.yearn, c=S.c, h=S.h;
  switch(id){
    case"loved":return c.traits.includes("Beloved");
    case"peace":return !c.flags.spilledBlood;
    case"sea":return !!c.flags.sawSea;
    case"name":return h.standing>=48;
    case"child":return c.kids.some(k=>k.bond>=70);
    case"truth":return !!c.flags.foundTruth;
    case"forgive":return !!c.flags.forgiven;
    case"free":return h.coffers>=10&&!h.flags.indebted;
    case"faith":return c.stats.faith>=8;
    case"revenge":return !!h.flags.rivalBroken;
    case"build":return !!c.flags.built;
    case"quiet":return h.standing>=30&&h.holdings.length>=(c.flags.startHoldings||1);
  }
  return false;
}
function archiveLife(){
  const c=S.c;
  if(c.gen>=3&&!S.w.flags["threat_"+S.w.threat.id]){
    const s=crisisScore();
    const band=s>=4?"triumph":(s>=2?"endure":"broken");
    S.w.flags["threat_"+S.w.threat.id]=band;
    if(band==="triumph"){S.h.standing=clamp(S.h.standing+8,0,100);}
    else if(band==="broken"){S.h.standing=clamp(S.h.standing-10,0,100);S.h.coffers=Math.max(0,S.h.coffers-3);}
    S.chron.push({y:S.w.year,g:c.gen,c:band==="broken"?"grim":"",
      t:`${cap(S.w.threat.name)} came while the house was without a steady hand, and ${band==="triumph"?"was met by a household that had been left ready for it":band==="endure"?"was survived, barely, by people acting on their own judgement":"went through this house like water through a broken wall"}.`});
  }
  c.yearnMet=checkYearn();
  const epi=computeEpitaph();
  const ep=EPITHETS[Math.abs(hashSeed(c.name+c.gen))%EPITHETS.length];
  S.anc.push({name:c.name,epithet:ep,gen:c.gen,born:c.born,died:S.w.year,age:c.age,
    epi,traits:c.traits.slice(),yearn:c.yearn,met:c.yearnMet,g:c.g,
    arms:JSON.parse(JSON.stringify(S.h.arms)),deeds:c.deeds.slice(),
    kids:c.kids.map(k=>({name:k.name,bond:k.bond,alive:k.alive,traits:k.traits,g:k.g})),
    spouse:c.spouse?c.spouse.name:null});
  S.chron.push({y:S.w.year,g:c.gen,t:`${c.name} ${ep} died, aged ${c.age}. <em>${epi}</em>${c.yearnMet?" What they wanted, they got.":" What they wanted, they did not get."}`,c:"grim"});
}
function heirCandidates(){
  const alive=S.c.kids.filter(k=>k.alive);
  if(alive.length)return alive;
  return [];
}
function succeed(kid){
  const parent={name:S.c.name,traits:S.c.traits,stats:S.c.stats,bond:kid?kid.bond:20,
    childTraits:kid?kid.traits:["Guarded"],siblings:[]};
  const gen=S.c.gen+1;
  if(kid){
    S.c.kids.filter(k=>k!==kid&&k.alive).forEach(k=>{
      parent.siblings.push({name:k.name,g:k.g,rel:k.g==="f"?"sister":"brother",
        bond:clamp(k.bond-(kid.bond>k.bond?15:0),0,100),alive:true});
    });
    S.w.year=S.anc[S.anc.length-1].died+ri(0,2);
    beginLife(gen,kid.name,parent);
    S.c.traits=[...new Set(S.c.traits.concat(kid.traits||[]))].slice(0,4);
    S.c.age=clamp(S.w.year-(kid.born||(S.w.year-20)),16,46);
    S.c.born=S.w.year-S.c.age;
    S.c.g=kid.g||S.c.g;
  } else {
    // cadet branch: a cousin. The line survives; the accumulated goodwill does not.
    S.h.standing=Math.max(6,Math.floor(S.h.standing*0.6));
    S.h.flags.cadet=true;
    S.w.year+=ri(1,4);
    beginLife(gen,null,null);
    S.c.flags.cadet=true;
    S.chron.push({y:S.w.year,g:gen,t:`With no heir of the body, ${S.h.name} passed to a cousin, and half of what the last hand had built went with the change of household.`,c:"grim"});
  }
  S.w.era=gen;
  S.pending=null;
}

/* ---- ENDING ---- */
function computeEnding(){
  const h=S.h,w=S.w,f=h.flags;
  const thr=w.flags["threat_"+w.threat.id]||"untested";
  let path="root",title="",body="";
  if(f.path_crown&&f.crowned)path="crown";
  else if(f.path_rebel&&f.independent)path="rebel";
  else if(f.path_church)path="church";
  else if(f.path_coin)path="coin";
  else if(f.path_rebel&&f.attainted)path="fallen";
  else if(f.path_crown)path="thwarted";
  else path="root";
  if(h.holdings.length===0||h.standing<8)path="extinct";

  const T={
   crown:["A House of the Blood","Four generations from a grant written small to a seat among the great houses. The name is spoken at court now without anyone needing to ask where it is from."],
   rebel:["The Free Valley","The Crown's writ stops at your boundary stones and has stopped there long enough that people have begun to draw it that way on maps."],
   church:["The House That Outlived Kings","Dynasties will change four times in the next two centuries. The bell at ${seat} will be rung on the same day each year, for the same family, throughout."],
   coin:["The House of the Bridge and the Port","No songs. No titles worth the name. Half the wool of the realm, three counties in quiet debt, and a family that will still be rich when the singing houses are tenants."],
   thwarted:["The House That Reached","It was close. That will be the whole of the family memory: it was close, and the great houses closed over the gap, and afterwards there was the valley and the ledger and the long slow settling."],
   fallen:["The Attainted House","They kept their heads and lost everything else. The name survives on two deeds and a chapel wall, which is more than most rebels manage."],
   root:["The House That Kept the Valley","No crown, no cathedral, no fleet. Four generations of hands on the same ground, and the ground still in them, which was the only thing any of them was ever actually asked to do."],
   extinct:["The Name in the Floor","The holdings went to creditors, cousins and the Crown. There is a slab in the ${temple} at ${seat} with the arms cut into it, worn smooth in the middle where people have walked."],
  }[path];
  title=T[0];
  body=T[1].replace("${seat}",h.seat).replace("${temple}",w.faith.temple);

  const bits=[];
  if(thr==="triumph")bits.push(`When ${w.threat.name} came, this house held and three others did not — and the county was re-drawn around that fact.`);
  else if(thr==="endure")bits.push(`${cap(w.threat.name)} took a third of everything and left the house standing, which at the time was considered remarkable.`);
  else if(thr==="broken")bits.push(`${cap(w.threat.name)} broke over this house and what came after was survival rather than lordship. It is still, four generations on, the thing the family measures time against.`);
  if(f.rivalBroken)bits.push(`${w.rival.name} are tenants now.`);
  else if(w.rival.att>30)bits.push(`${w.rival.name} and this house intermarried in the end, which nobody who started the quarrel would have believed.`);
  else bits.push(`${w.rival.name} still hold the far bank, and still will not sell, and neither will you.`);
  if(f.returnedLand)bits.push(`The two river fields are back where the old deed said they belonged.`);
  if(f.newFaith)bits.push(`The valley keeps the new faith openly, and remembers which house turned first.`);
  if(f.purged)bits.push(`Nobody in the valley preaches in the beech woods any more, and nobody explains to their children why not.`);
  if(f.buriedHoard&&!f.hoardFound)bits.push(`There is a mark on a beam in the undercroft that no living person can now read.`);
  if(f.trueChronicle)bits.push(`And there is a chronicle in this house written by someone who did not flatter it — which is why any of this is known at all.`);

  const met=S.anc.filter(a=>a.met).length;
  const soul=met===0?`Not one of the four got the thing they privately wanted. That is not unusual. It is only unusual to have it written down.`
    :met===4?`All four got the thing they privately wanted, which in four generations of one family is close to unheard of.`
    :`${["None","One","Two","Three","All four"][met]} of the four got the thing they privately wanted. The rest are in the ground with it.`;

  S.ending={title,body,bits,soul,path,threat:thr,year:w.year};
  S.finished=true;
  archiveToLibrary();
}
function archiveToLibrary(){
  try{
    const lib=JSON.parse(localStorage.getItem(LIB_KEY)||"[]");
    lib.unshift({house:S.h.name,seat:S.h.seat,seed:S.seed,year:S.w.year,
      title:S.ending.title,arms:S.h.arms,
      anc:S.anc.map(a=>({name:a.name,epithet:a.epithet,epi:a.epi,met:a.met}))});
    localStorage.setItem(LIB_KEY,JSON.stringify(lib.slice(0,12)));
  }catch(e){}
}

/* ================================================================
   ENGINE
   ================================================================ */
const el=id=>document.getElementById(id);
const view=()=>el("view");
let MODE="title";

function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({S,MODE}));}catch(e){}}
function load(){
  try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;
    const o=JSON.parse(raw);if(!o||!o.S)return false;S=o.S;MODE=o.MODE||"play";
    RND=mulberry(hashSeed(S.seed+"|"+S.w.year+"|"+S.anc.length));return true;}catch(e){return false;}
}
function wipe(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}

function txt(v,a,b){return typeof v==="function"?v(a===undefined?G:a,b):v;}

function pickPool(phase){
  const c=POOL.filter(s=>s.phase.indexOf(phase)>=0
    && !(S.used[s.id+"@"+S.c.gen])
    && (!s.when||safe(()=>s.when(G),false)));
  if(!c.length){const any=POOL.filter(s=>s.phase.indexOf(phase)>=0);return pick(any);}
  const weighted=[];
  c.forEach(s=>{let w=(s.w||1)*(S.used[s.id]?0.3:1);for(let i=0;i<Math.max(1,Math.round(w*10));i++)weighted.push(s);});
  return pick(weighted);
}
function safe(fn,d){try{return fn();}catch(e){return d;}}

function openScene(){
  const c=S.c;
  if(c.qi>=c.queue.length){toSuccession();return;}
  const item=c.queue[c.qi];
  let scene=null,seed=null,kind="scene";
  if(item.k==="pool"){scene=pickPool(item.phase);kind="pool";}
  else if(item.k==="anchor"){scene=ANCHORS[item.id];kind="anchor";}
  else if(item.k==="open"){scene=ANCHORS.open;kind="anchor";}
  else if(item.k==="legacy"){
    const sd=item.seed;const tpl=LEGACY[sd.type];
    if(!tpl){c.qi++;openScene();return;}
    sd.used=true;scene=tpl;seed=sd;kind="legacy";
  }
  if(!scene){c.qi++;openScene();return;}
  S.pending={kind,sceneId:scene.id||item.id||item.k,legacyType:seed?seed.type:null,seed:seed,
    vars:scene.setup?safe(()=>scene.setup(G),{}):{},outcome:null,phase:item.phase||null};
  S.used[(scene.id||item.id)]=(S.used[scene.id||item.id]||0)+1;
  S.used[(scene.id||item.id)+"@"+S.c.gen]=1;
  save();
}
function currentScene(){
  const p=S.pending;if(!p)return null;
  if(p.kind==="legacy")return LEGACY[p.legacyType];
  if(p.kind==="anchor")return ANCHORS[p.sceneId]||ANCHORS[p.sceneId];
  return POOL.find(s=>s.id===p.sceneId)||ANCHORS[p.sceneId];
}
function choose(i){
  const sc=currentScene();if(!sc||S.pending.outcome!=null)return;
  const ch=visibleChoices(sc)[i];if(!ch)return;
  DELTAS=[];
  const out=safe(()=>ch.do(G,S.pending.seed),"");
  S.pending.outcome=out||"";
  S.pending.deltas=DELTAS.slice();
  save();render();window.scrollTo({top:0,behavior:"smooth"});
}
function visibleChoices(sc){
  return sc.choices.filter(c=>!c.when||safe(()=>c.when(G,S.pending&&S.pending.seed),false));
}
function advance(){
  const c=S.c,p=S.pending;
  const scId=p?p.sceneId:"";
  const wasDeath=(scId==="death");
  const phase=p&&p.phase;
  S.pending=null;
  if(wasDeath){archiveLife();MODE="succession";save();render();return;}
  // time passes
  let yrs=phase==="youth"?ri(2,3):phase==="twilight"?ri(3,4):ri(3,5);
  if(c.queue[c.qi]&&c.queue[c.qi].k==="open")yrs=0;
  c.qi++;
  c.age+=yrs;S.w.year+=yrs;
  // early death by peril or violence
  if(!wasDeath&&c.qi<c.queue.length-1){
    const risk=(c.peril*0.045)+(c.age>62?0.10:0)+(c.age>70?0.16:0)+(c.traits.includes("Sickly")?.03:0);
    if(rnd()<risk){
      c.cause=c.peril>=4?"peril":"age";
      const must=c.queue.slice(c.qi).filter(x=>x.k==="anchor"&&(x.id==="crisis"||x.id==="reckoning"));
      c.queue=c.queue.slice(0,c.qi).concat(must,[{k:"anchor",id:"death"}]);
    }
  }
  save();openScene();render();
}
function toSuccession(){MODE="succession";S.pending=null;save();}

/* ================================================================
   RENDER
   ================================================================ */
function render(){
  if(S&&MODE==="play"&&S.tab==="story"&&!S.pending&&!S.finished)openScene();
  el("crest").hidden=(MODE==="title");
  el("ledger").hidden=(MODE==="title"||MODE==="ending");
  el("nav").hidden=(MODE==="title");
  el("rail").style.display=MODE==="title"?"none":"flex";
  document.querySelector("main").style.paddingLeft=MODE==="title"?"var(--pad)":"calc(var(--rail) + 14px)";
  if(MODE!=="title"){drawCrest();drawLedger();drawRail();}
  const t=S&&S.tab||"story";
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  if(MODE==="title"){view().innerHTML=titleScreen();bindTitle();return;}
  if(t!=="story"){view().innerHTML=panel(t);bindPanel();return;}
  if(MODE==="ending"){view().innerHTML=endingScreen();bindEnding();return;}
  if(MODE==="succession"){view().innerHTML=successionScreen();bindSuccession();return;}
  view().innerHTML=storyScreen();bindStory();
}
function drawCrest(){
  el("arms").innerHTML=armsSVG(S.h.arms);
  el("hName").textContent=(S.c?S.c.name+" ":"")+"of "+S.h.name;
  const ttl=S.c?titleFor(S.h.rank,S.c.g):"";
  el("hSub").textContent=[ttl,S.h.seat].filter(Boolean).join(" · ");
  el("hYear").innerHTML=S.w.year+"<br>"+(S.c?"aged "+S.c.age:"");
}
function drawLedger(){
  const c=S.c,h=S.h;if(!c)return;
  const rows=[["Iron",c.stats.iron],["Coin",c.stats.coin],["Faith",c.stats.faith],["Guile",c.stats.cunning],
   ["Renown",h.standing],["Coffers",h.coffers],["Levies",h.strength],["Piety",h.piety]];
  el("ledger").innerHTML=rows.map(r=>`<div class="lg"><span class="k">${r[0]}</span><span class="v">${r[1]}</span></div>`).join("");
}
function drawRail(){
  el("railNum").textContent=ROMAN[S.c?S.c.gen:1];
  const n=S.chron.filter(e=>e.g===(S.c?S.c.gen:1));
  el("railMarks").innerHTML=n.slice(-18).map(e=>
    `<div class="mk ${e.c==="legend"?"g":(e.c==="grim"?"b":"")}"></div>`).join("");
}

/* ---- title ---- */
function titleScreen(){
  const has=!!localStorage.getItem(SAVE_KEY);
  const lib=safe(()=>JSON.parse(localStorage.getItem(LIB_KEY)||"[]"),[]);
  const demo=newArms();
  return `<div id="title">
   <div class="mark">${armsSVG(demo)}</div>
   <h1>Heirloom</h1>
   <div class="tag">a chronicle in four hands</div>
   <div class="blurb prose">
    <p>You will live four lives, one after another, in the same family. Each is about twenty minutes long and ends the way lives end.</p>
    <p>What you do in the first becomes what the second inherits: the debts, the feuds, the reputation, the shape of the children. Nothing resets. The chronicle keeps everything.</p>
    <p class="note">Every world is generated fresh — the realm, the faith, the rival house, the disaster that is coming and does not know it yet.</p>
   </div>
   ${has?`<button class="turn" id="btnCont">Continue the line</button><div class="hr"></div>`:""}
   <div class="field"><label>Your house will be called</label><input id="inHouse" placeholder="${houseName()}" maxlength="22"></div>
   <div class="field"><label>The first of the name</label><input id="inName" placeholder="${gname(chance(.5)?"m":"f")}" maxlength="22"></div>
   <button class="turn" id="btnNew">Begin the first life</button>
   <p class="small center" style="margin-top:14px">Leave either blank and the chronicle will decide. Progress saves itself in this browser.</p>
   ${lib.length?`<div class="hr"></div><h2 style="font-family:var(--display);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--minium);text-align:left">Houses you have already ended</h2>
     ${lib.map(l=>`<div class="gencard"><div class="sig">${armsSVG(l.arms)}</div><div class="bd"><div class="nm">${l.house} of ${l.seat}</div><div class="ep">${l.title}</div><div class="dt">ended ${l.year}</div></div></div>`).join("")}`:""}
  </div>`;
}
function bindTitle(){
  const c=el("btnCont");if(c)c.onclick=()=>{if(load()){MODE=MODE==="title"?"play":MODE;render();}};
  el("btnNew").onclick=()=>{
    const hn=el("inHouse").value.trim(), nm=el("inName").value.trim();
    newWorld(String(Date.now())+Math.random(),hn||null,nm||null);
    MODE="play";S.tab="story";save();render();
  };
}

/* ---- story ---- */
function storyScreen(){
  const sc=currentScene();
  if(!sc)return `<div id="page"><p class="small">The chronicle has lost its place. <button class="turn ghost" onclick="location.reload()">Reopen it</button></p></div>`;
  const p=S.pending;
  const isIllum=sc.kind==="illum";
  let h="";
  if(isIllum){
    h+=`<div class="illum">${armsSVG(S.h.arms)}<div class="motto">&ldquo;${S.h.motto}&rdquo;</div></div>`;
  }
  h+=`<div id="page">
    <div class="scene-eyebrow">${txt(sc.eyebrow,G,p.seed)}</div>
    <h2 class="scene-title">${txt(sc.title,p.seed!==undefined&&p.kind==="legacy"?p.seed:G,p.seed)}</h2>`;
  if(p.outcome==null){
    h+=`<div class="prose">${txt(sc.text,G,p.seed)}</div>
      <div class="rubric">What you do</div>`;
    visibleChoices(sc).forEach((c,i)=>{
      h+=`<button class="choice ${c.cls||""}" data-i="${i}">
        <span class="kx">${i+1}</span>${txt(c.t,G,p.seed)}
        ${c.hint?`<span class="hint">${txt(c.hint,G,p.seed)}</span>`:""}</button>`;
    });
  } else {
    h+=`<div id="outcome"><div class="outcome-mark">And so</div><div class="prose">${p.outcome||"<p>It is done.</p>"}</div>`;
    if(p.deltas&&p.deltas.length)
      h+=`<div class="deltas">${p.deltas.map(d=>`<span class="dl ${d.k}">${d.t}</span>`).join("")}</div>`;
    h+=`<button class="turn" id="btnNext">Turn the page</button></div>`;
  }
  h+=`</div>`;
  return h;
}
function bindStory(){
  document.querySelectorAll(".choice").forEach(b=>{
    if(b.classList.contains("locked"))return;
    b.onclick=()=>choose(+b.dataset.i);
  });
  const n=el("btnNext");if(n)n.onclick=()=>advance();
}

/* ---- succession ---- */
function successionScreen(){
  const a=S.anc[S.anc.length-1];
  const kids=heirCandidates();
  const gen=S.c.gen;
  let h=`<div id="page"><div class="scene-eyebrow">The ${["First","Second","Third","Fourth"][gen-1]} Hand closes</div>
   <h2 class="scene-title">${a.name} ${a.epithet}</h2>
   <div class="epitaph">${a.epi}<br><span style="font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-style:normal;color:var(--minium)">${a.born} &ndash; ${a.died}, aged ${a.age}</span></div>
   <div class="yearn ${a.met?"met":"failed"}"><span class="lbl">${a.met?"What they wanted, they got":"What they wanted, they never got"}</span>${YEARN_TEXT[a.yearn]}</div>`;
  if(gen>=4){
    h+=`<div class="prose"><p>Four hands. The chronicle is closed and the ending of it can now be read.</p></div>
      <button class="turn" id="btnEnd">Read the ending</button></div>`;
    return h;
  }
  if(!kids.length){
    h+=`<div class="prose"><p>There is no heir of the body. The name does not end &mdash; names rarely do &mdash; but it passes sideways, to a cousin who was raised elsewhere and owes this valley nothing.</p>
      <p>Half of what was built goes with the change of household. That is what an heir actually is: not blood, but the person who already knows where everything is.</p></div>
      <button class="turn warn" id="btnCadet">Pass to the cadet branch</button></div>`;
    return h;
  }
  h+=`<div class="rubric">Who takes it up</div>
   <p class="small" style="margin-top:-4px;margin-bottom:14px">You are choosing your next twenty minutes. What they feel about you comes with them, and so do their traits.</p>`;
  kids.forEach((k,i)=>{
    const cls=k.bond>=65?"":(k.bond<=35?"bad":"cold");
    h+=`<button class="choice ${k.bond>=65?"tender":""}" data-heir="${i}">
      <span class="kx">${i+1}</span><strong>${k.name}</strong>${k.bastard?" <em>(natural child)</em>":""}
      <span class="hint">Born ${k.born}. ${(k.traits||[]).join(", ")||"Nothing remarkable yet."}
      &nbsp;·&nbsp; ${bondWord(k.bond)}</span></button>`;
  });
  h+=`</div>`;
  return h;
}
function bondWord(b){
  if(b>=80)return "Adores you";if(b>=65)return "Close to you";if(b>=50)return "Dutiful";
  if(b>=35)return "Distant";if(b>=20)return "Cold";return "Will not look at you";
}
function bindSuccession(){
  document.querySelectorAll("[data-heir]").forEach(b=>b.onclick=()=>{
    const k=heirCandidates()[+b.dataset.heir];MODE="play";succeed(k);save();render();
  });
  const c=el("btnCadet");if(c)c.onclick=()=>{MODE="play";succeed(null);save();render();};
  const e=el("btnEnd");if(e)e.onclick=()=>{computeEnding();MODE="ending";save();render();};
}

/* ---- ending ---- */
function endingScreen(){
  const e=S.ending;
  return `<div id="page">
   <div class="illum">${armsSVG(S.h.arms)}<div class="motto">&ldquo;${S.h.motto}&rdquo;</div></div>
   <div class="scene-eyebrow" style="text-align:center">${S.h.name} of ${S.h.seat} &middot; ${S.anc[0].born}&ndash;${e.year}</div>
   <h2 class="scene-title" style="text-align:center">${e.title}</h2>
   <div class="prose"><p>${e.body}</p>${e.bits.map(b=>`<p>${b}</p>`).join("")}</div>
   <div class="epitaph">${e.soul}</div>
   <div class="rubric">The four hands</div>
   ${S.anc.map(a=>`<div class="gencard"><div class="sig">${armsSVG(a.arms)}</div>
     <div class="bd"><div class="nm">${a.name} ${a.epithet}</div>
     <div class="ep">${a.epi}</div>
     <div class="dt">${a.born}&ndash;${a.died} &middot; ${a.met?"got what they wanted":"did not"}</div></div></div>`).join("")}
   <div class="hr"></div>
   <button class="turn" id="btnNewLine">Begin another house</button>
   <button class="turn ghost" id="btnReadChron" style="margin-top:10px">Read the whole chronicle</button>
  </div>`;
}
function bindEnding(){
  el("btnNewLine").onclick=()=>{wipe();S=null;MODE="title";render();window.scrollTo(0,0);};
  el("btnReadChron").onclick=()=>{S.tab="chronicle";save();render();window.scrollTo(0,0);};
}

/* ---- panels ---- */
function panel(t){
  if(t==="house")return panelHouse();
  if(t==="chronicle")return panelChron();
  return panelRealm();
}
function panelHouse(){
  const c=S.c,h=S.h;
  let x=`<div class="panel"><h2>The Arms</h2>
   <div class="illum">${armsSVG(h.arms)}<div class="motto">&ldquo;${h.motto}&rdquo;</div></div>
   <p class="small center">${armsBlazon(h.arms)}</p>
   <h2 style="margin-top:24px">The Estate</h2>
   <div class="kv"><span class="k">Standing</span><span class="v">${RANKWORD[h.rank]}${h.flags.cadet?" (cadet branch)":""}</span></div>
   <div class="kv"><span class="k">Holdings</span><span class="v">${h.holdings.map(i=>S.w.regions[i].name).join(", ")||"none"}</span></div>
   <div class="kv"><span class="k">Renown</span><span class="v">${h.standing}</span></div>
   <div class="kv"><span class="k">Coffers</span><span class="v">${h.coffers}${h.flags.indebted?" <em style='color:var(--minium)'>· in debt</em>":""}</span></div>
   <div class="kv"><span class="k">Levies</span><span class="v">${h.strength}</span></div>
   <div class="kv"><span class="k">Standing with ${S.w.faith.name}</span><span class="v">${h.piety}</span></div>`;
  if(!c)return x+"</div>";
  x+=`<h3>${c.name}</h3>
   <div class="yearn"><span class="lbl">What ${c.g==="f"?"she":"he"} wants, and will not say</span>${YEARN_TEXT[c.yearn]}</div>
   <div style="margin:12px 0 4px">${c.traits.map(t=>`<span class="trait ${TRAITS[t]?TRAITS[t].k:""}">${t}</span>`).join("")||"<span class='small'>No reputation yet.</span>"}</div>
   <p class="small">${c.traits.map(t=>TRAITS[t]?`<em>${t}</em> — ${TRAITS[t].d}`:"").filter(Boolean).join("<br>")}</p>
   <h2 style="margin-top:22px">The Household</h2>`;
  const people=[];
  if(c.spouse)people.push({name:c.spouse.name,rel:"married, of "+c.spouse.house,bond:c.spouse.bond,alive:c.spouse.alive});
  c.kin.forEach(k=>people.push({name:k.name,rel:k.rel,bond:k.bond,alive:k.alive}));
  c.kids.forEach(k=>people.push({name:k.name,rel:"child"+(k.bastard?", natural":""),bond:k.bond,alive:k.alive}));
  if(!people.length)x+=`<p class="small">Nobody yet.</p>`;
  people.forEach(p=>{
    const cls=p.bond>=65?"":(p.bond<=35?"bad":"cold");
    x+=`<div class="bond ${p.alive?"":"dead"}"><div class="who"><div class="nm">${p.name}</div><div class="rl">${p.rel}</div></div>
      <div class="meter ${cls}"><i style="width:${p.bond}%"></i></div></div>`;
  });
  if(S.anc.length){
    x+=`<h2 style="margin-top:24px">Those who came before</h2>`;
    S.anc.forEach(a=>{
      x+=`<div class="gencard"><div class="sig">${armsSVG(a.arms)}</div><div class="bd">
        <div class="nm">${a.name} ${a.epithet}</div><div class="ep">${a.epi}</div>
        <div class="dt">${a.born}&ndash;${a.died}</div></div></div>`;
    });
  }
  return x+"</div>";
}
function panelChron(){
  let x=`<div class="panel"><h2>The Chronicle of ${S.h.name}</h2>
   <p class="small">Kept at ${S.h.seat} in ${S.w.realm}, under ${S.w.faith.name}. Every line was earned.</p><div class="hr"></div>`;
  let lastGen=0;
  S.chron.forEach(e=>{
    if(e.g!==lastGen){lastGen=e.g;x+=`<h3>${["First","Second","Third","Fourth","Fifth"][e.g-1]} Hand</h3>`;}
    x+=`<div class="entry ${e.c}"><div class="yr">${e.y}</div><p>${e.t}</p></div>`;
  });
  if(!S.chron.length)x+=`<p class="small">Nothing yet. The first line is being written.</p>`;
  return x+"</div>";
}
function panelRealm(){
  const w=S.w;
  const thr=w.flags["threat_"+w.threat.id];
  let x=`<div class="panel"><h2>${w.realm}</h2>
   ${mapSVG(w)}
   <div class="legendrow"><span><i style="background:#a9791f"></i>yours</span><span><i style="background:#1f3a66"></i>the Crown</span>
   <span><i style="background:#a83420"></i>other houses</span><span><i style="background:rgba(42,32,24,.25)"></i>unheld</span></div>
   <div class="hr"></div>
   <div class="kv"><span class="k">The Crown</span><span class="v">King ${w.king} of ${w.kingHouse}</span></div>
   <div class="kv"><span class="k">The faith</span><span class="v">${cap(w.faith.name)}</span></div>
   <div class="kv"><span class="k">Your rival</span><span class="v">${w.rival.name} of ${w.rival.seat} <em style="color:${w.rival.att<0?"var(--minium)":"var(--verdigris)"}">${rivalWord(w.rival.att)}</em></span></div>
   <div class="kv"><span class="k">The year</span><span class="v">${w.year}</span></div>
   <h3>What is coming</h3>
   <p class="small">${thr?({triumph:"It came. This house held, and was raised for it.",endure:"It came. This house endured it, and paid.",broken:"It came, and broke over this house."})[thr]:(S.c&&S.c.gen>=2?w.threat.omen:"Nothing yet. There is always something.")}</p>
   <h3>Holdings</h3>`;
  S.h.holdings.forEach(i=>{const r=w.regions[i];
    x+=`<div class="kv"><span class="k">${r.name}</span><span class="v">${r.type}</span></div>`;});
  return x+"</div>";
}
function rivalWord(a){
  if(a<=-60)return "at open enmity";if(a<0)return "cold";if(a<30)return "correct";if(a<60)return "friendly";return "kin by marriage";
}
function bindPanel(){}

/* ---- nav + keys ---- */
document.querySelectorAll("#nav button").forEach(b=>{
  b.onclick=()=>{if(!S)return;S.tab=b.dataset.tab;save();render();window.scrollTo({top:0,behavior:"smooth"});};
});
document.addEventListener("keydown",e=>{
  if(MODE==="title")return;
  if(e.key>="1"&&e.key<="6"){
    const i=+e.key-1;
    const b=document.querySelectorAll("#page .choice")[i];if(b){b.click();e.preventDefault();}
  }
  if(e.key==="Enter"||e.key===" "){
    const n=el("btnNext");if(n){n.click();e.preventDefault();}
  }
});

/* ---- boot ---- */
(function boot(){
  if(load()&&S&&S.started){
    if(!S.finished&&MODE!=="succession"&&MODE!=="ending")MODE="play";
    render();
  } else {
    MODE="title";render();
  }
})();
</script>
</body>
</html>
