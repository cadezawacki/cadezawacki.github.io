  const p=S.pending;
  let h="";
  if(sc.kind==="illum")h+=`<div class="illum">${armsSVG(S.h.arms)}<div class="motto">&ldquo;${S.h.motto}&rdquo;</div></div>`;
  h+=`<div id="page">
    <div class="scene-eyebrow">${txt(sc.eyebrow,G,p.seed)}</div>
    <h2 class="scene-title">${txt(sc.title,p.kind==="legacy"?p.seed:G,p.seed)}</h2>`;

  if(p.form&&!p.form.done){
    h+=`<div class="prose">${txt(sc.text,G,p.seed)}</div><div class="rubric">${p.form.title||"A name"}</div>`;
    p.form.fields.forEach(f=>{
      h+=`<div class="field"><label>${f.label}</label><input id="f_${f.k}" maxlength="26" placeholder="${f.ph||""}" value="${f.val||""}"></div>`;
    });
    h+=`<button class="turn" id="btnForm">Set it down</button><p class="small center" style="margin-top:10px">Leave blank and the household will choose for you.</p></div>`;
    return h;
  }
  if(p.contest){
    h+=contestBlock(p.contest);
    if(p.contest.finished&&p.outcome==null)h+=`<button class="turn" id="btnSettle">See what it cost</button>`;

    h+=`</div>`;

  }
  if(p.outcome==null){
    h+=`<div class="prose">${txt(sc.text,G,p.seed)}</div>`;
    h+=sc.kind==="inter"?`<div class="rubric quiet"></div>`:`<div class="rubric">What you do</div>`;
    visibleChoices(sc).forEach((c,i)=>{
      const o=CFG.odds?oddsOf(c):null;
      h+=`<button class="choice ${c.cls||""}" data-i="${i}">
        <span class="kx">${i+1}</span>${txt(c.t,G,p.seed)}

        ${c.hint?`<span class="hint">${txt(c.hint,G,p.seed)}</span>`:""}
        ${o&&o.why?`<span class="hint why">Turns on ${o.why}.</span>`:""}</button>`;
    });
  } else {
    h+=outcomeBlock(p);
  }
  h+=`</div>`;

function outcomeBlock(p){
  let h=`<div id="outcome">`;
  if(p.roll){
    h+=`<div class="dieline ${p.roll.win?"good":"bad"}">
      <span class="die">${p.roll.die}</span>
      <span>Needed ${p.roll.need} or under on six${p.roll.label?" — "+p.roll.label:""}. Rolled ${p.roll.die}. <strong>${p.roll.win?"It holds.":"It does not."}</strong></span></div>`;
  }
  h+=`<div class="outcome-mark">And so</div><div class="prose">${p.outcome||"<p>It is done.</p>"}</div>`;
  if(CFG.deltas&&p.deltas&&p.deltas.length)
    h+=`<div class="deltas">${p.deltas.map(d=>`<span class="dl ${d.k}">${d.t}</span>`).join("")}</div>`;
  h+=`<button class="turn" id="btnNext">Turn the page</button></div>`;
  return h;
}
function contestBlock(c){
  let h=`<div class="contest">`;
  if(c.kind==="battle"){
    const yw=clamp(c.you.force*7,4,100), tw=clamp(c.them.force*7,4,100);
    h+=`<div class="crow"><span class="cn">${c.you.name}</span><div class="cbar"><i style="width:${yw}%"></i></div><span class="cv">${Math.max(0,c.you.force)}</span></div>
        <div class="crow"><span class="cn">${c.them.name}</span><div class="cbar them"><i style="width:${tw}%"></i></div><span class="cv">${Math.max(0,c.them.force)}</span></div>`;
    if(!c.finished)h+=`<div class="tell">${pick(TELLS[c.theirNext]||["They are doing something you cannot see."])}</div>`;
  } else {
    h+=`<div class="crow"><span class="cn">Their offer</span><div class="cbar"><i style="width:${clamp(c.price*10,6,100)}%"></i></div><span class="cv">${c.price}</span></div>
        <div class="crow"><span class="cn">Their patience</span><div class="cbar ${c.patience<=2?"them":""}"><i style="width:${clamp(c.patience*18,4,100)}%"></i></div><span class="cv">${Math.max(0,c.patience)}</span></div>`;
    if(!c.finished)h+=`<div class="tell">${c.patience<=2?"He has looked at the door twice.":"He is comfortable. He has all afternoon."}</div>`;
  }
  h+=`<div class="clog">${c.log.slice(-4).map(l=>`<div>${l}</div>`).join("")||"<div><em>Not yet begun.</em></div>"}</div>`;
  h+=`<div class="cround">${c.finished?"Finished":"Round "+c.round+" of "+c.maxR}</div>`;
  if(!c.finished){
    const acts=c.kind==="battle"
      ?TACTICS.battle.map(t=>({k:t.k,t:t.t})).concat([{k:"parley",t:"Call a parley",cls:"tender"}])
      :TACTICS.haggle.map(t=>({k:t.k,t:t.t})).concat([{k:"close",t:"Close at "+c.price,cls:"tender"},{k:"walk",t:"Walk away",cls:"risky"}]);
    acts.forEach((a,i)=>{h+=`<button class="choice ${a.cls||""}" data-act="${a.k}"><span class="kx">${i+1}</span>${a.t}</button>`;});
  }
  h+=`</div>`;
  return h;
}

  let h=`<div id="page"><div class="scene-eyebrow">The ${["First","Second","Third","Fourth"][gen-1]} Hand closes</div>
   <h2 class="scene-title">${a.name} ${a.epithet}</h2>

   <div class="yearn ${a.met?"met":"failed"}"><span class="lbl">${a.met?"What they wanted, they got":"What they wanted, they never got"}</span>${YEARN_TEXT[a.yearn]}</div>`;
  if(S.h.heirloom){
    const st=hl().state;
    h+=`<p class="small center" style="margin:-6px 0 16px">${cap(hlName())} is ${st==="held"?"in the chest, where it has always been":st==="pawned"?"still at the port, against a loan":st==="buried"?"under the undercroft, where only this family knows":st==="stolen"?"in another house's hall":"gone"}.</p>`;
  }
  if(typeof S.lastIncome==="number")
    h+=`<p class="small center" style="margin:0 0 16px">The land paid <strong>${S.lastIncome}</strong> into the chest between the hands.</p>`;
  if(gen>=4){
    h+=`<div class="prose"><p>Four hands. The chronicle is closed and the ending of it can now be read.</p></div>
      <button class="turn" id="btnEnd">Read the ending</button></div>`;
    return h;
  }
  if(!kids.length){
    if(!canCadet){
      h+=`<div class="prose"><p>There is no heir of the body, no cousin willing to take it on, and not enough left of this house to make the offer attractive to anyone.</p>
        <p>The holdings will go to creditors and the Crown. The name goes onto a slab and then goes out.</p></div>
        <button class="turn warn" id="btnDie">The house ends here</button></div>`;
      return h;
    }
    h+=`<div class="prose"><p>There is no heir of the body. The name does not end &mdash; names rarely do &mdash; but it passes sideways, to a cousin raised elsewhere who owes this valley nothing.</p>
      <p>Half of what was built goes with the change of household. That is what an heir actually is: not blood, but the person who already knows where everything is.</p></div>
      <button class="turn warn" id="btnCadet">Pass to the cadet branch</button></div>`;
    return h;
  }
  h+=`<div class="rubric">Who takes it up</div>
   <p class="small" style="margin-top:-4px;margin-bottom:14px">You are choosing your next twenty minutes. What they feel about you comes with them, and so do their traits.</p>`;
  kids.forEach((k,i)=>{
    h+=`<button class="choice ${k.bond>=65?"tender":""}" data-heir="${i}">
      <span class="kx">${i+1}</span><strong>${k.name}</strong>${k.bastard?" <em>(natural child)</em>":""}
      <span class="hint">Born ${k.born}. ${(k.traits||[]).join(", ")||"Nothing remarkable yet."}
      &nbsp;·&nbsp; ${bondWord(k.bond)}</span></button>`;
  });
  h+=`</div>`;
  return h;
}
function bondWord(b){
  if(b>=80)return "Adores you";if(b>=65)return "Close to you";if(b>=50)return "Dutiful";
  if(b>=35)return "Distant";if(b>=20)return "Cold";return "Will not look at you";
}

  if(!people.length)x+=`<p class="small">Nobody yet.</p>`;
  people.forEach(p=>{
    const cls=p.bond>=65?"":(p.bond<=35?"bad":"cold");
    x+=`<div class="bond ${p.alive?"":"dead"}"><div class="who"><div class="nm">${p.name}</div><div class="rl">${p.rel}</div></div>
      <div class="meter ${cls}"><i style="width:${p.bond}%"></i></div></div>`;
  });
  if(S.anc.length){
    x+=`<h2 style="margin-top:24px">Those who came before</h2>`;
    S.anc.forEach(a=>{
      x+=`<div class="gencard"><div class="sig">${armsSVG(a.arms)}</div><div class="bd">
        <div class="nm">${a.name} ${a.epithet}</div><div class="ep">${a.epi}</div>
        <div class="dt">${a.born}&ndash;${a.died}</div></div></div>`;
    });
  }
  return x+"</div>";
}
function panelChron(){
  let x=`<div class="panel"><h2>The Chronicle of ${S.h.name}</h2>
   <p class="small">Kept at ${S.h.seat} in ${S.w.realm}, under ${S.w.faith.name}. Later hands have written in the margins.</p><div class="hr"></div>`;
  let lastGen=0;
  S.chron.forEach((e,i)=>{
    if(e.g!==lastGen){lastGen=e.g;x+=`<h3>${["First","Second","Third","Fourth","Fifth"][e.g-1]} Hand</h3>`;}
    const notes=(S.marg||[]).filter(m=>m.on===i);
    x+=`<div class="entry ${e.c}"><div class="yr">${e.y}</div><p>${e.t}</p>`;
    notes.forEach(m=>{x+=`<div class="marg">${m.t} <span class="mh">&mdash; hand ${ROMAN[m.gen]}</span></div>`;});
    x+=`</div>`;
  });
  if(!S.chron.length)x+=`<p class="small">Nothing yet. The first line is being written.</p>`;
  return x+"</div>";
}
function panelRealm(){
  const w=S.w;
  const thr=w.flags["threat_"+w.threat.id];
  let x=`<div class="panel"><h2>${w.realm}</h2>
   ${mapSVG(w)}
   <div class="legendrow"><span><i style="background:#a9791f"></i>${S.h.name} (yours)</span><span><i style="background:#1f3a66"></i>the Crown</span>
   <span><i style="background:#a83420"></i>other houses</span><span><i style="background:rgba(42,32,24,.25)"></i>unheld</span></div>
   <div class="hr"></div>
   <h3>The houses</h3>
   <div class="kv"><span class="k">${S.h.name} <em>(yours)</em></span><span class="v">${S.h.holdings.length} holdings &middot; ${yourPower()} power</span></div>`;
  (w.houses||[]).forEach(h=>{
    x+=`<div class="kv ${h.dead?"dead":""}"><span class="k">${h.name} of ${h.seat} <em style="color:${h.att<0?"var(--minium)":"var(--verdigris)"}">${rivalWord(h.att)}</em></span>
      <span class="v">${h.dead?"gone":h.holdings.length+" holdings &middot; "+powerOf(h)+" power"}</span></div>`;
  });
  x+=`<div class="hr"></div>
   <div class="kv"><span class="k">The Crown</span><span class="v">King ${w.king} of ${w.kingHouse}</span></div>
   <div class="kv"><span class="k">The faith</span><span class="v">${cap(w.faith.name)}</span></div>
   <div class="kv"><span class="k">The year</span><span class="v">${w.year}</span></div>
   <h3>What is coming</h3>
   <p class="small">${thr?({triumph:"It came. This house held, and was raised for it.",endure:"It came. This house endured it, and paid.",broken:"It came, and broke over this house."})[thr]:(S.c&&S.c.gen>=2?w.threat.omen:"Nothing yet. There is always something.")}</p>
   <h3>The wider world</h3>`;
  const ev=(w.events||[]).slice(-8).reverse();
  if(!ev.length)x+=`<p class="small">No news has reached this valley yet.</p>`;
  ev.forEach(e=>{x+=`<div class="entry ${e.kind==="house"?"":"legend"}"><div class="yr">${e.y}</div><p>${e.t}</p></div>`;});
  x+=`<h3>Your holdings</h3>`;
  S.h.holdings.forEach(i=>{const r=w.regions[i];
    x+=`<div class="kv"><span class="k">${r.name}${r.raided?" <em style='color:var(--minium)'>&middot; burned</em>":""}</span><span class="v">${r.type} &middot; yields ${regionIncome(r)}</span></div>`;});
  return x+"</div>";
}
function rivalWord(a){
  if(a<=-60)return "at open enmity";if(a<0)return "cold";if(a<30)return "correct";if(a<60)return "friendly";return "kin by marriage";
}
function bindPanel(){if(S&&S.tab==="settings")bindSettings();}

/* ---- nav + keys ---- */
document.querySelectorAll("#nav button").forEach(b=>{
  b.onclick=()=>{if(!S)return;SND.wake();SND.click();CONFIRM="";TOAST="";
    S.tab=b.dataset.tab;save();render();window.scrollTo({top:0,behavior:"smooth"});};
});
document.addEventListener("keydown",e=>{
  if(MODE==="title")return;
  if(e.key>="1"&&e.key<="6"){
    const i=+e.key-1;
    const b=document.querySelectorAll("#page .choice")[i];if(b){b.click();e.preventDefault();}
  }
  if(e.key==="Enter"||e.key===" "){
    const n=el("btnNext")||el("btnSettle")||el("btnForm");if(n){n.click();e.preventDefault();}
  }
});

try{document.addEventListener("visibilitychange",()=>{
  if(document.hidden){SND.music(false);}else if(CFG.sound&&CFG.music){SND.music(true);}
});}catch(e){}

/* ---- boot ---- */
(function boot(){
  loadCfg();
  if(load()&&S&&S.started){
    if(!S.finished&&MODE!=="succession"&&MODE!=="ending")MODE="play";
    render();
  } else {
    MODE="title";render();
  }
})();
</script>
</body>
</html>
