{id:"p_court",phase:["prime"],w:3,when:G=>G.h.standing>=22,
 setup:G=>({court:placeName(),lord:G.npc("m").name}),
 eyebrow:G=>"The Court",title:G=>"Summoned to court",
 text:G=>P(`King ${G.w.king} keeps a court at ${G.v.court} and this year, for the first time, your name is on the list. It is at the bottom of the list. It is on the list.`)
 +P(`Three days of standing in good clothes in a cold room. On the second day ${G.v.lord}, who holds four times your land and none of your patience, tells a story at dinner in which your grandfather is the fool.`),
 choices:[
  {t:"Laugh loudest of all.",
   do:G=>{G.stat("cunning",2);G.hs("standing",4);G.trait("Guarded");G.hflag("courtFavour");
    return P(`You laugh, and then you improve the story with a detail of your own, and the table laughs harder, and ${G.v.lord} looks at you with the first real interest he has ever shown.`)
    +P(`You spend the rest of the week being useful to him. It costs you something you cannot itemise.`);}},
  {t:"Correct him, precisely, in front of everyone.",cls:"risky",
   do:G=>{G.trait("Iron-willed");G.hs("standing",G.c.stats.cunning>=5?6:-5);
    G.seed({type:"court_enemy",who:G.v.lord});
    G.chron(`${G.c.name} contradicted ${G.v.lord} at the King's table, and the table went quiet.`);
    return P(`You give the date, the field, the name of the man who actually ran, and you give it flatly, the way you would give a total.`)
    +P(`Half the table decides you are a fool. The other half decides you are dangerous. ${G.v.lord} decides both, and neither of you forgets it.`);}},
  {t:"Say nothing. Find the King's clerk instead.",
   do:G=>{G.stat("cunning",2);G.hs("standing",2);G.hflag("clerkFriend");
    return P(`The clerk is the only man at ${G.v.court} who knows where everything is written down. You spend two evenings talking to him about drainage.`)
    +P(`He is astonished that anyone has asked. Your name is spelled correctly in the Crown's book from that year forward, which is not nothing.`);}},
  {t:"Leave early. This is not where the land is.",
   do:G=>{G.hs("standing",-3);G.hs("coffers",2);G.trait("Content");G.bond("kin:1",6);
    return P(`You ride home in the rain and are back in your own hall before the third day's dinner is served.`)
    +P(`The lower meadow is ditched a month earlier than it would have been. No one at ${G.v.court} notices your absence. No one at ${G.v.court} notices much.`);}},
 ]},

{id:"p_war",phase:["prime"],w:3,when:G=>G.h.rank>=0,
 setup:G=>({front:placeName(),cap:G.npc("m").name}),
 eyebrow:G=>"The Levy",title:G=>"The King's summons",
 text:G=>P(`A rider comes with the King's seal. There is fighting at ${G.v.front} and every house that holds land is to send men in proportion to it.`)
 +P(`You have ${G.h.strength} companies you could call and about ${G.h.strength>3?"twice":"half"} that many men who would rather not go. ${G.v.cap}, who would command them, is waiting in the yard with his helmet under his arm and his opinion off his face.`),
 choices:[
  {t:"Go yourself, at the head of them.",cls:"risky",
   do:G=>{G.peril(2);G.flag("spilledBlood");
    const win=G.c.stats.iron+G.h.strength+G.ri(0,5)>=10;
    if(win){G.stat("iron",2);G.hs("standing",9);G.h.arms.augments.push({type:"canton",tinct:"gules",charge:"sword",metal:"or",blazon:"a canton gules charged with a sword or"});
     G.legend(`${G.c.name} held the line at ${G.v.front} when the flank broke, and was named in the King's own account of the day.`);
     return P(`The flank breaks at midday and you are what is left standing on it. You do not remember most of the afternoon. You remember the smell and a man saying your name.`)
     +P(`The King's account of the battle names four houses. Yours is one of them. You are permitted an augmentation to your arms, which is a way of saying: this happened, and it will keep happening on every shield your children carry.`);}
    G.hs("strength",-2);G.hs("standing",2);G.trait("Scarred");G.peril(2);
    G.chron(`${G.c.name} fought at ${G.v.front} and came home with fewer men than went.`,"grim");
    return P(`It is a rout, and you are in the middle of it, and the only decision you make all day is which direction to run and how many to bring with you.`)
    +P(`You bring back two thirds. In the years afterward you will be told this was creditable. You will not believe it.`);}},
  {t:G=>`Send ${G.v.cap} and the men. Stay behind.`,
   do:G=>{G.hs("strength",-1);G.hs("standing",1);G.flag("spilledBlood");
    if(G.chance(.4)){G.kill({name:G.v.cap,alive:true},"at "+G.v.front);G.hs("standing",1);G.trait("Guarded");
     return P(`They march. ${G.v.cap} does not come back, and eleven others do not come back, and the ones who do will not speak about the crossing at the ford.`)
     +P(`You did the sensible thing. You will do the sensible thing again. It gets easier, which is the part that troubles you.`);}
    return P(`They march, they fight adequately, and they come home thinner and louder. ${G.v.cap} says the King's marshal asked after you by name and did not receive a satisfying answer.`);}},
  {t:"Send silver instead of men.",when:G=>G.h.coffers>=4,
   do:G=>{G.hs("coffers",-4);G.hs("standing",-2);G.stat("coin",1);G.hflag("boughtOut");
    return P(`Scutage. Perfectly legal, perfectly resented. Your men stay on your fields and your neighbours' men do not come home.`)
    +P(`You will out-produce every house in this valley for a generation, and be invited to nothing.`);}},
  {t:"Refuse. Cite the boundary and the harvest.",cls:"risky",
   do:G=>{G.hs("standing",-10);G.hflag("crownSuspicion");G.trait("Iron-willed");
    G.chron(`${G.h.name} refused the King's summons in the year of ${G.v.front}, and the refusal was written down.`,"grim");
    return P(`You write a letter that is polite, detailed, legally sound, and unforgivable. Your steward asks you twice to reconsider.`)
    +P(`No army comes. Nothing comes. That is the punishment: for eleven years, when anything is given out, nothing comes.`);}},
 ]},

{id:"p_famine",phase:["prime"],w:2,when:G=>!G.hf("faminePast"),
 eyebrow:G=>"The Gate",title:G=>"Hungry people at the gate",
 text:G=>P(`They come up the road in ones and twos and then in a long thin line: people from the high country where the crop failed entirely. Sixty, perhaps eighty. They are not threatening anyone. They are simply standing where you can see them.`)
 +P(`Your granary holds enough for your own people through winter with a little to spare. A little.`),
 choices:[
  {t:"Open the granary.",cls:"tender",
   do:G=>{G.hs("coffers",-3);G.trait("Beloved");G.hs("standing",5);G.hflag("faminePast");G.hflag("openGate");
    G.legend(`In the hungry year, ${G.c.name} opened the granary at ${G.h.seat} and turned nobody away. Songs were made about it that outlived the singer.`);
    return P(`It runs out in February. You eat what everyone eats, which is not much, and two of your own household die of the cough that comes after.`)
    +P(`But nobody starves at your gate, and it is said in three valleys that they did not, and a hundred years from now people who cannot name your grandchildren will know that a lord at ${G.h.seat} once opened a granary.`);}},
  {t:"Feed them for three days, then move them on.",
   do:G=>{G.hs("coffers",-1);G.hs("standing",2);G.hflag("faminePast");G.trait("Guarded");
    return P(`Three days of bread and a road-warden to walk them to the county boundary. It is the answer a careful man gives and no one can fault it.`)
    +P(`One of them, an old woman, thanks you specifically and at length. You think about it for years.`);}},
  {t:"Bar the gate.",
   do:G=>{G.trait("Feared");G.hs("standing",-6);G.hflag("faminePast");G.hflag("barredGate");G.hs("coffers",1);
    G.chron(`${G.c.name} barred the gate at ${G.h.seat} in the hungry year. The line stood in the road for two days and then went elsewhere.`,"grim");
    return P(`They stand for two days. On the third morning they are gone, and the road is empty, and there is a smell that takes a week to leave.`)
    +P(`Your people eat well through winter. Your people also watched you do it, and they will remember that you can.`);}},
  {t:"Put them to work. Dig the new ditch.",when:G=>G.c.stats.cunning>=4,
   do:G=>{G.hs("coffers",-2);G.hs("standing",3);G.hflag("faminePast");G.land(1);G.flag("built");
    return P(`Eighty pairs of hands and a winter with nothing else to do. You feed them and they cut a drainage ditch two miles long through ground your grandfather called impossible.`)
    +P(`Half of them stay. The reclaimed ground is under plough within four years and it is, by any measure, the single best thing your family has ever done with a disaster.`);}},
 ]},

{id:"p_heretic",phase:["prime"],w:2,when:G=>!G.hf("heresyChoice"),
 setup:G=>({her:G.npc().name}),
 eyebrow:G=>"The Word",title:G=>"A preacher in the woods",
 text:G=>P(`${G.v.her} preaches in the beech woods above the mill to a crowd that has grown from nine to two hundred in a season. The doctrine is simple: that ${G.w.faith.god} speaks to everyone directly, that the ${G.w.faith.temple} is a wall built across a road, and that tithes are theft.`)
 +P(`The ${G.w.faith.cleric} has written to you twice. The second letter used the word <em>duty</em> four times.`),
 choices:[
  {t:"Take them. Hand them to the temple.",
   do:G=>{G.hs("piety",16);G.hs("standing",2);G.trait("Feared");G.hflag("heresyChoice");G.hflag("purged");
    G.seed({type:"martyr",who:G.v.her});
    G.chron(`${G.c.name} delivered the preacher ${G.v.her} to the ${G.w.faith.temple}, and what followed was not quick.`,"grim");
    return P(`It takes eleven men and one night. The ${G.w.faith.temple} is generous afterward — a remission of dues, a letter of commendation, a relic for your chapel.`)
    +P(`In the beech woods, for years, people leave small things at the foot of a particular tree. You have the tree cut down. They start leaving them at the stump.`);}},
  {t:"Let them preach. Say you never heard of it.",
   do:G=>{G.hs("piety",-10);G.stat("cunning",1);G.hflag("heresyChoice");G.hflag("tolerated");
    G.seed({type:"heresy_grows",who:G.v.her});
    return P(`You write back that the woods above the mill are, on inspection, outside your jurisdiction, which is a lie so thin it is practically a message.`)
    +P(`The crowd is four hundred by midsummer. They are polite to your riders. They pay their rents. They do not pay their tithes, and everybody knows exactly whose fault that is.`);}},
  {t:"Go and listen. Alone.",cls:"tender",
   do:G=>{G.stat("faith",2);G.stat("cunning",1);G.hflag("heresyChoice");G.hflag("heardPreacher");G.flag("foundTruth");
    G.seed({type:"heresy_grows",who:G.v.her});
    return P(`You stand at the back in a plain cloak for two hours. ${G.v.her} is not a madman. ${G.v.her} is the most persuasive person you have ever heard and knows exactly who you are.`)
    +P(`${SAID("&ldquo;You may take me whenever you like,&rdquo;")} they say afterward, quite pleasantly. ${SAID("&ldquo;I only ask that you do it having heard the argument. Most men prefer not to.&rdquo;")}`);}},
  {t:"Offer them protection — for a price.",when:G=>G.c.stats.coin>=4,
   do:G=>{G.hs("coffers",3);G.hs("piety",-8);G.trait("Shrewd");G.hflag("heresyChoice");G.hflag("tolerated");G.hflag("heresyPatron");
    G.seed({type:"heresy_grows",who:G.v.her});
    return P(`Two hundred people who have stopped paying tithes have, it turns out, a certain amount of money and a very strong preference for continuing to breathe.`)
    +P(`The arrangement is never written down. It funds your gatehouse, your stable, and eventually your reputation for solvency.`);}},
 ]},

{id:"p_plague_small",phase:["prime"],w:2,when:G=>!G.hf("sickHouse"),
 eyebrow:G=>"The Cough",title:G=>"Sickness in the village",
 text:G=>P(`It starts at the mill and it is in nine houses by the end of the week. It is not the great sickness people fear; it is the small kind, the kind that takes the old and the very young and leaves everyone else grey.`)
 +P(`Your physician — such as he is — says the well should be shut, the dead burned rather than buried, and the mill closed for a month. The village says the well is the only well.`),
 choices:[
  {t:"Do everything he says. All of it.",
   do:G=>{G.hs("coffers",-2);G.hs("standing",-2);G.hflag("sickHouse");G.hflag("physic");G.stat("cunning",1);
    return P(`You close the mill, shut the well, cart water for five weeks, and burn eleven bodies against the wishes of eleven families.`)
    +P(`The sickness stops. Nobody thanks you for it. Your physician writes down what he did, and that book will be in this house in a hundred years.`);}},
  {t:"Shut the well. Bury the dead properly.",
   do:G=>{G.hs("piety",6);G.hs("standing",2);G.hflag("sickHouse");G.peril(1);
    return P(`A compromise, which in matters of contagion means half a measure against a whole disease. It runs another six weeks and takes nineteen instead of nine.`)
    +P(`But they are buried in ground their mothers chose, with the words said over them, and the village holds together. There is more than one kind of arithmetic.`);}},
  {t:"Take the household and go to the hunting lodge.",
   do:G=>{G.hflag("sickHouse");G.hs("standing",-8);G.trait("Guarded");G.hs("coffers",-1);
    G.chron(`${G.c.name} withdrew to the lodge while the cough was in ${G.h.seat}, and returned when it had finished.`,"grim");
    return P(`Six weeks of clean air, good hunting, and an unbearable quiet at dinner.`)
    +P(`You come back to a village that has buried thirty-one people and arranged all of it themselves. They are perfectly correct to you. They are correct to you for the rest of your life.`);}},
  {t:"Nurse them yourself.",cls:"risky",
   do:G=>{G.peril(3);G.trait("Beloved");G.hs("standing",7);G.hs("piety",8);G.hflag("sickHouse");G.hflag("physic");
    G.legend(`${G.c.name} carried water in the sick houses of ${G.h.seat} with ${G.c.g==="f"?"her":"his"} own hands, which no lord in that country had done before or has done since.`);
    return P(`You carry water and you sit with people while they die and you learn the names of forty households you had known only as entries.`)
    +P(`You get it, of course. You are ill for three weeks and there is one night your steward will never describe to you. You survive it. Something in your chest does not.`);}},
 ]},

{id:"p_marriage_strain",phase:["prime"],w:3,when:G=>G.c.spouse&&G.c.spouse.alive,
 eyebrow:G=>"The Household",title:G=>`${G.c.spouse.name}`,
 text:G=>P(`It is not one thing. It is a hundred small ones, the way it always is. ${G.c.spouse.name} came to this house from ${G.c.spouse.house} with expectations, and this house has met about half of them.`)
 +P(`Tonight it comes out at last, in the solar, quietly, which is worse than shouting: ${SAID(`&ldquo;You speak to your steward more than you speak to me. You have never once asked what I wanted from any of it.&rdquo;`)}`),
 choices:[
  {t:"Ask. And then actually listen.",cls:"tender",
   do:G=>{G.bond("spouse",26);G.stat("cunning",1);G.flag("trueMarriage");
    return P(`It takes most of the night. What ${G.c.spouse.name} wants turns out to be specific, reasonable, and cheaper than a war: a say in the marriages, the west chamber for a library, and to be told things before the household is.`)
    +P(`You give all three. The house runs better within a year, and you have, without quite meaning to, acquired an ally who cannot be bought away from you.`);}},
  {t:"Say the house comes first. It does.",
   do:G=>{G.bond("spouse",-18);G.hs("standing",1);G.trait("Iron-willed");
    return P(`It is true, and you say it well, and it lands like a door closing.`)
    +P(`${G.c.spouse.name} runs the household impeccably for thirty years and tells you nothing that is not necessary. Your children learn, watching, exactly what a marriage is.`);}},
  {t:"Give them the ledgers. All of them.",
   do:G=>{G.bond("spouse",16);G.hs("coffers",2);G.stat("coin",1);
    return P(`${G.c.spouse.name} finds four errors in the first fortnight and a decade-old fraud in the second month, and pursues the miller's family with a thoroughness you would not have dared.`)
    +P(`The manor is a third richer in five years. Whether the marriage is better is a question you both agree not to open.`);}},
  {t:"Apologise, badly, and buy a gift.",
   do:G=>{G.hs("coffers",-1);G.bond("spouse",4);
    return P(`Silver-work from the port, and a bad apology on the stairs. It is accepted in the spirit in which it is offered, which is to say: noted, and filed.`);}},
 ]},

{id:"p_child_hard",phase:["prime"],w:3,when:G=>G.c.kids.length>0&&G.c.kids.some(k=>k.alive),
 setup:G=>({k:(S.c.kids.filter(k=>k.alive)[0]||{}).name}),
 eyebrow:G=>"The Nursery",title:G=>`${G.v.k}`,
 text:G=>P(`${G.v.k} is old enough now to disappoint you specifically rather than generally. This week it is the horse — ridden into the river at night on a wager, lamed, and now to be put down.`)
 +P(`${G.v.k} stands in the yard with the halter still in hand and will not say sorry, will not say anything, and is looking at you the way you once looked at your own father.`),
 choices:[
  {t:"Make them do it themselves.",
   do:G=>{G.bond("kid:0",-14);G.c.kids[0].traits.push("Guarded");G.stat("iron",1);
    return P(`You put the knife in their hand and stand there while it is done and do not let them turn away.`)
    +P(`It is a real lesson and it lands. They will be capable and cold and they will never once, in thirty years, ask you for anything.`);}},
  {t:"Do it yourself, and say nothing after.",cls:"tender",
   do:G=>{G.bond("kid:0",14);G.trait("Merciful");
    return P(`You take the halter, you send them inside, and you deal with it in the barn with the door shut.`)
    +P(`They watch from the window. They are forty years old before they understand what you did, and by then you are eleven years in the ground, and they tell their own child about it.`);}},
  {t:"Sell them the horse's worth in debt. Payable in work.",
   do:G=>{G.bond("kid:0",4);G.c.kids[0].traits.push("Shrewd");G.hs("coffers",1);
    return P(`Eleven shillings, at a rate, worked off in the accounts room every evening for two years.`)
    +P(`They hate it and they are extremely good at it, and by the end they can find a false entry faster than your steward.`);}},
  {t:"Beat them, as you were beaten.",
   do:G=>{G.bond("kid:0",-30);G.trait("Cruel");G.c.kids[0].traits.push("Haunted");
    G.seed({type:"cold_heir",who:G.v.k});
    return P(`It is over quickly. Your own father would have gone on longer.`)
    +P(`You tell yourself that. You will tell yourself that for the rest of your life, and it will get less useful every year.`);}},
 ]},

{id:"p_build",phase:["prime"],w:2,when:G=>G.h.coffers>=6&&!G.hf("builtSomething"),
 eyebrow:G=>"In Stone",title:G=>"Something that will stand",
 text:G=>P(`A mason comes through in the spring with a folding rule and a reputation, and stays a week, and by the end of it he has drawn three things on the back of a hide and left them on your table.`)
 +P(`You have the coin for one of them, once, and probably not again in your lifetime.`),
 choices:[
  {t:"A curtain wall and a gatehouse.",
   do:G=>{G.hs("coffers",-6);G.hs("strength",3);G.hflag("builtSomething");G.hflag("walls");G.flag("built");G.hs("standing",4);
    G.legend(`${G.c.name} walled ${G.h.seat} in stone. It took nine years and the wall is still there.`);
    return P(`Nine years, two masons, one collapse, and a great deal of money that could have been spent on almost anything else.`)
    +P(`Your grandchildren will not remember why the wall is there. They will simply be behind it when it matters.`);}},
  {t:G=>`A ${G.w.faith.temple} with a bell that can be heard in four valleys.`,
   do:G=>{G.hs("coffers",-5);G.hs("piety",22);G.hflag("builtSomething");G.hflag("chapel");G.flag("built");G.hs("standing",3);
    G.legend(`${G.c.name} raised the ${G.w.faith.temple} at ${G.h.seat} and hung a bell in it that could be heard in four valleys.`);
    return P(`The bell is cast in the port and dragged up the road on a sledge by thirty men in one day, and the day becomes a local holiday for two hundred years.`)
    +P(`The ${G.w.faith.cleric} weeps at the consecration. The ${G.w.faith.name} does not forget who paid.`);}},
  {t:"A bridge and a made road to the port.",
   do:G=>{G.hs("coffers",-6);G.stat("coin",2);G.hflag("builtSomething");G.hflag("road");G.flag("built");G.hs("coffers",3);
    G.legend(`${G.c.name} bridged the river and made the road to the coast, and the market at ${G.h.seat} doubled within a decade.`);
    return P(`It is the least romantic of the three and it makes more money than the other two would cost.`)
    +P(`Within a decade there is a market at ${G.h.seat} on two days a week, and merchants who have never heard your name know your bridge.`);}},
  {t:"Keep the coin. Stone is vanity.",
   do:G=>{G.hs("coffers",2);G.trait("Miserly");
    return P(`You thank the mason, feed him well, and send him on to a house with more money and less sense.`)
    +P(`The chest is heavier for it. There is nothing at ${G.h.seat} with your name cut into it, and there never will be.`);}},
 ]},

{id:"p_marriage_offer",phase:["prime"],w:2,when:G=>G.c.kids.filter(k=>k.alive).length>=1&&G.h.standing>=25,
 setup:G=>({k:(S.c.kids.filter(k=>k.alive)[0]||{name:"your eldest"}).name,h:houseName(),far:placeName()}),
 eyebrow:G=>"The Match",title:G=>`An offer for ${G.v.k}`,
 text:G=>P(`House ${G.v.h} of ${G.v.far} wants your eldest. They are richer than you, further away than you would like, and they have made it plain that the terms are the terms.`)
 +P(`${G.v.k} has been told. ${G.v.k} has views, and has come to your chamber to express them, and is standing very straight.`),
 choices:[
  {t:"Take the match. This is what the child is for.",
   do:G=>{G.hs("coffers",5);G.hs("standing",5);G.bond("kid:0",-24);
    G.seed({type:"distant_kin",who:G.v.h,house:G.v.far});
    G.chron(`${G.v.k} of ${G.h.name} was married into ${G.v.h} of ${G.v.far}. The dowry was spoken of for years.`);
    return P(`It is a very good match. Everyone says so, at length, at the wedding.`)
    +P(`${G.v.k} writes twice a year in a hand that gets more formal each time. You are a grandparent to children you meet three times.`);}},
  {t:"Refuse. Say the child chooses.",cls:"tender",
   do:G=>{G.hs("standing",-4);G.bond("kid:0",30);G.trait("Merciful");
    G.chron(`${G.h.name} refused the ${G.v.h} match and let the child choose, which was thought eccentric and possibly foolish.`);
    return P(`The refusal is polite and the insult is understood on both sides. ${G.v.h} marries elsewhere and prospers.`)
    +P(`${G.v.k} marries a local family of no consequence and is, by every account anyone bothers to write down, happy. There is no ledger entry for that.`);}},
  {t:"Counter: the match, but they come here.",when:G=>G.c.stats.cunning>=5,
   do:G=>{G.hs("coffers",3);G.hs("standing",3);G.bond("kid:0",6);G.stat("cunning",1);
    return P(`It takes four letters and a great deal of nerve to suggest that the smaller house should keep the child.`)
    +P(`They agree, because you have made it about the drainage rights at the river-mouth, which they want more than they want the marriage. ${G.v.k} stays. Everyone is mildly dissatisfied, which is what a good negotiation feels like.`);}},
 ]},

{id:"p_secret",phase:["prime"],w:2,when:G=>!G.f("foundTruth"),
 setup:G=>({old:G.npc().name}),
 eyebrow:G=>"The House",title:G=>"A locked chest",
 text:G=>P(`In clearing the old solar you find a chest under three generations of ruined tapestry, and in it: letters, a ledger in a hand you do not know, and a deed.`)
 +P(`${G.v.old}, the oldest servant in the house, goes white when she sees it and says, ${SAID("&ldquo;That was to be burned.&rdquo;")}`),
 choices:[
  {t:"Read all of it.",cls:"risky",
   do:G=>{G.flag("foundTruth");G.stat("cunning",2);
    const kind=G.pick(["theft","murder","bastard"]);
    G.hflag("secret_"+kind);
    if(kind==="theft"){G.hflag("landStolen");G.seed({type:"stolen_deed",who:G.w.rival.name});
      return P(`The deed is for the two best fields you hold, and it is not made out to your family. It was taken in a year of confusion by a man whose bones are under the chapel floor.`)
      +P(`You now know that a third of your income is theft. You will make a decision about that eventually. Tonight you put it back in the chest.`);}
    if(kind==="murder"){G.trait("Haunted");G.seed({type:"old_murder",who:G.v.old});
      return P(`The letters describe, without much emotion, the removal of an inconvenient cousin in a year when the succession was unclear. Your great-grandfather signed the arrangement in his own hand.`)
      +P(`You are sitting in a chair that was bought with that. You do not sleep properly again for a year.`);}
    G.hflag("bastardLine");G.seed({type:"other_branch",who:houseName()});
    return P(`There is another line. A child was acknowledged, provided for, and then very carefully written out — a whole branch of the family living forty miles away under a different name, who have, the ledger suggests, been paid to stay there since.`)
    +P(`The payments stopped two generations ago. Nobody has checked whether the family did.`);}},
  {t:"Burn it. Some things are load-bearing.",
   do:G=>{G.trait("Guarded");G.hs("standing",1);G.bond("kin:1",6);
    return P(`You burn it in the solar hearth, all of it, and stand there until it is ash and then break the ash with a poker.`)
    +P(`${G.v.old} watches from the door and, when it is done, says, ${SAID("&ldquo;Your father did the same. He read it first.&rdquo;")} You wish she had not told you that.`);}},
  {t:"Ask her what she knows.",cls:"tender",
   do:G=>{G.flag("foundTruth");G.bond("kin:1",4);G.stat("cunning",1);G.trait("Haunted");
    G.hflag("secret_told");
    return P(`She tells you for two hours in a flat voice, sitting down, which she has never done in your presence in her life.`)
    +P(`It is worse than the chest. The chest only had what someone thought worth writing. She has the rest, and now so do you, and she seems lighter afterward, and you do not.`);}},
 ]},

{id:"p_bandit",phase:["prime"],w:2,
 setup:G=>({b:G.npc("m").name,rd:placeName()}),
 eyebrow:G=>"The Road",title:G=>`The men on the ${G.v.rd} road`,
 text:G=>P(`Somebody is taking merchants on the road below ${G.v.rd}. Not killing them, mostly — taking a share and letting them go, which is clever, because a robbed merchant complains and a dead one brings soldiers.`)
 +P(`Your riders bring back a name: ${G.v.b}. He held land two valleys over until the Crown took it for arrears. He has forty men and, apparently, a sense of proportion.`),
 choices:[
  {t:"Hunt them down.",cls:"risky",
   do:G=>{G.peril(2);G.flag("spilledBlood");
    if(G.c.stats.iron+G.ri(0,6)>=7){G.hs("standing",6);G.hs("coffers",2);G.trait("Feared");
      G.chron(`${G.c.name} cleared the road below ${G.v.rd} and hanged ${G.v.b}.`);
      return P(`Three weeks in bad country and one very short fight in the rain. ${G.v.b} does not run, which you respect, and is hanged, which he expected.`)
      +P(`The road is safe for a generation. The merchants pay your toll cheerfully, having seen the alternative.`);}
    G.hs("strength",-1);G.trait("Scarred");G.peril(2);G.seed({type:"blood_debt",who:G.v.b,house:"the outlaws"});
    return P(`They know the country and you do not. You lose four men in an ambush at a ford and come home with a face that will need explaining for the rest of your life.`)
    +P(`${G.v.b} sends back your dead, cleaned and laid out, with a note that says only: <em>this was not my choosing either.</em>`);}},
  {t:"Buy him. Make him your man on the road.",
   do:G=>{G.hs("coffers",-2);G.hs("strength",2);G.stat("cunning",2);G.hflag("outlawPact");
    G.seed({type:"outlaw_ally",who:G.v.b});
    return P(`You meet him at a crossroads with six men each and it takes an hour. He wants land, eventually, and a name his sons can use.`)
    +P(`He takes your livery and your toll and keeps the road cleaner than the King's marshals ever did. It is not legal. It is not even slightly legal.`);}},
  {t:"Write to the Crown. Let it be their road.",
   do:G=>{G.hs("standing",-2);G.hs("coffers",-1);
    return P(`The Crown sends a serjeant and eleven men fourteen months later. By then ${G.v.b} has moved on and the merchants have started using the eastern route through ${G.w.rival.name}'s land.`)
    +P(`Your market takes nine years to recover. The lesson is filed under <em>things I will not do again</em>.`);}},
 ]},

{id:"p_sea",phase:["prime"],w:2,when:G=>!G.f("sawSea"),
 eyebrow:G=>"The Coast",title:G=>"Business at the port",
 text:G=>P(`There is wool to sell and the factor at the coast will pay a third more than the market at home, and somebody must ride down and argue about it for a week.`)
 +P(`It is four days each way. Your steward can go. Your steward has always gone.`),
 choices:[
  {t:"Go yourself.",cls:"tender",
   do:G=>{G.flag("sawSea");G.stat("coin",1);G.hs("coffers",2);
    G.chron(`${G.c.name} rode to the coast and stood a long time at the water, which the household found remarkable.`);
    return P(`You get a better price than the steward would have, because you are willing to walk away and he is not.`)
    +P(`And on the last morning you go down to the strand alone before dawn and stand in it up to the ankles. It is colder and larger and noisier than anything anyone told you. You are ${G.c.age} and you laugh out loud like a child, and there is nobody there to see it, which is the best part.`);}},
  {t:"Send the steward. There is too much here.",
   do:G=>{G.hs("coffers",1);G.bond("kin:1",6);
    return P(`He goes, he argues, he comes back with a fair price and a small gift for you that he bought with his own money.`)
    +P(`You never do go. It stays on the list of things you will do next year until the list stops mattering.`);}},
  {t:"Send your eldest. Let them see it.",when:G=>G.c.kids.some(k=>k.alive),
   do:G=>{G.hs("coffers",1);G.bond("kid:0",16);
    return P(`They come back three inches taller in their own estimation and full of opinions about ships.`)
    +P(`They describe the sea to you at dinner for two hours. You listen to all of it. It is not the same as going, and it is not nothing.`);}},
 ]},

{id:"p_kinreturn",phase:["prime"],w:2,when:G=>G.c.kin[0]&&G.c.kin[0].alive&&G.c.kin[0].bond<45,
 eyebrow:G=>"The Family",title:G=>`${G.c.kin[0].name} comes back`,
 text:G=>P(`Your ${G.c.kin[0].rel} left this house at nineteen after an argument that the household still refers to obliquely, and has been in ${placeName()} ever since, doing something with money that nobody has ever fully explained.`)
 +P(`Tonight they are at the gate with two horses, no servants, and the particular stillness of a person who has rehearsed a speech and lost it.`),
 choices:[
  {t:"Let them in. Say nothing about it.",cls:"tender",
   do:G=>{G.bond("kin:0",28);G.flag("forgiven");G.hs("coffers",1);
    G.chron(`${G.c.kin[0].name} returned to ${G.h.seat} and was taken in without a word said about the old business.`);
    return P(`You put them in the east chamber and have a plate sent up, and at breakfast you talk about the sheep.`)
    +P(`They stay eleven years and run the accounts better than anyone before or since. Neither of you ever mentions the argument. That, it turns out, was the entire gift.`);}},
  {t:"Make them say it first.",
   do:G=>{G.bond("kin:0",-8);G.trait("Iron-willed");
    return P(`You stand in the gateway with a lamp and you wait, and they get about half of it out, and then their voice goes, and then they get back on the horse.`)
    +P(`You are entirely within your rights. You hear of them twice more in your life, both times from other people.`);}},
  {t:"Let them in — and take their money into the house.",
   do:G=>{G.bond("kin:0",8);G.hs("coffers",5);G.stat("coin",1);G.hflag("kinCapital");
    return P(`They have more than you expected and a very clear idea of what they want in return: a room, a voice, and their name in the deeds.`)
    +P(`You give them two of the three. The house is richer. The dinners are tense in a new and more expensive way.`);}},
 ]},

{id:"p_justice",phase:["prime"],w:3,
 setup:G=>({m:G.npc("m").name,w:G.npc("f").name}),
 eyebrow:G=>"The Hall",title:G=>"You are the court",
 text:G=>P(`Twice a year you sit and the valley brings you its unbearable things. Today: ${G.v.m}, a cottar, has killed his neighbour with a hedging bill over a boundary of eleven feet. He does not deny it. He is thirty-one and has four children.`)
 +P(`The dead man's widow, ${G.v.w}, is in the hall, and so is everyone else, and every one of them is watching to learn what kind of place this is.`),
 choices:[
  {t:"Hang him. The law is the law.",
   do:G=>{G.trait("Just");G.hs("standing",3);G.flag("spilledBlood");
    G.chron(`${G.c.name} hanged ${G.v.m} for the killing at the hedge, and the valley thought it correct and cold.`);
    return P(`It is done at the ash tree the same afternoon. Nobody argues. Everybody watches.`)
    +P(`Four children go on the parish. The widow does not thank you; she says only that she supposes it is finished now. Your courts run clean for twenty years.`);}},
  {t:"Give everything he has to the widow. Exile him.",
   do:G=>{G.trait("Merciful");G.hs("standing",2);G.hs("piety",4);
    G.seed({type:"exile_returns",who:G.v.m});
    return P(`His strip, his beasts, his tools, and his name — all of it to ${G.v.w}, and him on the road by dark with what he can carry.`)
    +P(`The widow keeps her children fed. The valley argues about it for a decade. Somewhere out there, a man with nothing walks away from your gate and does not stop being alive.`);}},
  {t:"Take blood-price in silver. It is the old way.",
   do:G=>{G.hs("coffers",2);G.hs("standing",-3);G.trait("Shrewd");
    return P(`Forty shillings over seven years, sureties from his kin, and the whole matter closed with a payment schedule.`)
    +P(`It is the old law, and legal, and everyone in the hall understands perfectly that a life here can be had for forty shillings. They adjust their behaviour accordingly, in both directions.`);}},
  {t:"Ask the widow what she wants done.",cls:"tender",
   do:G=>{G.trait("Just");G.hs("standing",5);G.trait("Beloved");
    G.legend(`${G.c.name} put the judgement to the widow herself, which no lord in that valley had done, and the valley never entirely got over it.`);
    return P(`The hall makes a noise. ${G.v.w} stands there for a long time. Then she says she wants his land, and his labour, and him alive to do it, and she wants it said out loud that she chose.`)
    +P(`It is done exactly as she says. It becomes, within a generation, simply how things are done here — which is how law actually gets made.`);}},
 ]},

{id:"p_offer_land",phase:["prime"],w:2,when:G=>G.h.coffers>=5,
 setup:G=>({r:G.w.regions.filter(x=>!x.holder)[0]}),
 eyebrow:G=>"The Ledger",title:G=>"Land for sale",
 text:G=>P(`${G.v.r?G.v.r.name:"A neighbouring holding"} has come free — the last of its line died in the winter and the Crown will take a fine and pass it to whoever pays it.`)
 +P(`It is ${G.v.r?G.v.r.type:"marginal"} ground, four hours' ride, and it would cost you very nearly everything in the chest.`),
 choices:[
  {t:"Haggle the Crown's clerk down.",when:G=>!!G.v.r,
   odds:G=>({p:clamp(0.4+(G.c.stats.coin+G.c.stats.cunning)*0.04,.15,.9),why:"your Coin and your Guile against a bored official"}),
   do:G=>G.contest({kind:"haggle",resolveId:"landbuy",maxR:5,price:4,reserve:7,patience:5,
     them:{name:"the Crown's clerk"}})},
  {t:"Pay the asking price and be done.",when:G=>!!G.v.r,
   do:G=>{G.hs("coffers",-5);G.land(1);G.hs("standing",4);
    return P(`It is done in a room in the county town with a clerk and a wax seal, and it takes eleven minutes to buy something your family will hold for two hundred years.`);}},
  {t:"Buy it with borrowed money. Buy two.",when:G=>!!G.v.r,cls:"risky",
   do:G=>{G.hs("coffers",-4);G.land(2);G.hs("standing",6);G.hflag("indebted");
    G.seed({type:"debt_called",who:"the lenders"});
    return P(`You leverage everything you have against everything you might have, which is either the beginning of a great house or the end of a small one.`)
    +P(`The lenders are delighted. Delighted lenders are a specific and dangerous kind of friend.`);}},
  {t:"Leave it. Keep the chest full.",
   do:G=>{G.hs("coffers",1);G.trait("Content");
    return P(`Someone else buys it — ${G.w.rival.name}, as it happens, who did not have to think about it for as long as you did.`)
    +P(`You have a full chest and an accurate sense of your own limits, which is worth something and does not feed anyone.`);}},
 ]},

{id:"p_bastard",phase:["prime"],w:2,when:G=>G.c.spouse&&!G.f("bastardKnown"),
 setup:G=>({n:G.npc().name,ch:gname(chance(.5)?"m":"f")}),
 eyebrow:G=>"The Household",title:G=>"A child at the kitchen door",
 text:G=>P(`${G.v.n} worked in this house for two years and left, quietly, some time ago. She is at the kitchen door with a child of about four who has, unmistakably, your family's jaw.`)
 +P(`She wants nothing said and nothing given. She wants the child fed and taught letters. She has thought about this a great deal longer than you have.`),
 choices:[
  {t:"Take the child into the house openly.",cls:"risky",
   do:G=>{G.flag("bastardKnown");G.bond("spouse",-22);G.hs("piety",-6);G.hs("standing",-2);
    G.c.kids.push({name:G.v.ch,g:chance(.5)?"m":"f",born:G.w.year-4,bond:60,traits:["Guarded"],alive:true,bastard:true});
    G.seed({type:"bastard_grown",who:G.v.ch});
    G.chron(`${G.c.name} acknowledged a natural child, ${G.v.ch}, and raised ${G.c.g==="f"?"her":"him"} in the hall.`);
    return P(`You do it at dinner, in front of everyone, because doing it quietly would be worse.`)
    +P(`Your spouse does not speak to you for four months and never entirely forgives it. The child grows up in this hall, half-belonging, watching, and is the cleverest of all of them.`);}},
  {t:"Provide quietly. A cottage, a tutor, no name.",
   do:G=>{G.flag("bastardKnown");G.hs("coffers",-1);G.trait("Guarded");
    G.seed({type:"bastard_grown",who:G.v.ch,quiet:true});
    return P(`A cottage on the far edge of the holding, a stipend paid through your steward, and the priest to teach letters twice a week.`)
    +P(`You see the child four times in your life, always by accident, always briefly. Twice the child sees you.`);}},
  {t:"Deny it and send them away.",
   do:G=>{G.flag("bastardKnown");G.trait("Cruel");G.hs("standing",-1);
    G.seed({type:"bastard_grown",who:G.v.ch,angry:true});
    G.chron(`A woman came to ${G.h.seat} with a child and was turned away at the kitchen door. The kitchen remembered.`,"grim");
    return P(`It takes very little. A word to the steward and it is handled before you have finished your meal.`)
    +P(`The kitchen staff say nothing to you and everything to each other. The story survives you by ninety years.`);}},
 ]},

/* ---------------- TWILIGHT ---------------- */
{id:"t_reckon",phase:["twilight"],w:3,
 eyebrow:G=>"Twilight",title:G=>"An accounting",
 text:G=>P(`You are ${G.c.age}. The stairs have become a thing you plan for. The steward has begun bringing the ledgers to you rather than expecting you in the accounts room, and neither of you has mentioned it.`)
 +P(`There is time to do one more thing properly. Not two.`),
 choices:[
  {t:"Set the succession in order. Every field, every witness.",
   do:G=>{G.hs("standing",4);G.hflag("cleanSuccession");G.stat("cunning",1);
    return P(`Four days with a clerk and every tenant called to witness. Boundaries walked, dues written, the heir's rights recorded in three copies, one lodged with the ${G.w.faith.temple}.`)
    +P(`It is dull, expensive, and the single most valuable thing you do in your last decade. Nobody will ever thank you, because nothing will ever go wrong.`);}},
  {t:"Make peace with the one you wronged.",cls:"tender",
   do:G=>{G.flag("forgiven");G.bond("kin:0",25);if(G.c.spouse)G.bond("spouse",15);
    G.chron(`In ${G.c.g==="f"?"her":"his"} last years ${G.c.name} rode out to settle an old quarrel, and settled it.`);
    return P(`It takes a ride you should not be making at your age and a conversation that is, for the first fifteen minutes, unbearable.`)
    +P(`Then it is not unbearable. Then it is simply two people who are both old now, and one of them says the thing, and the other one accepts it, and outside somebody is chopping wood.`);}},
  {t:"Break your rival while you still have the strength.",when:G=>G.h.strength>=4||G.h.coffers>=8,
   do:G=>{G.hs("coffers",-3);G.hs("strength",-1);G.flag("spilledBlood");
    if(G.c.stats.cunning+G.h.strength+G.ri(0,5)>=11){G.hflag("rivalBroken");G.w.rival.att=-90;G.hs("standing",8);G.land(1);
      G.legend(`${G.c.name} broke ${G.w.rival.name} at last, in ${G.c.g==="f"?"her":"his"} sixtieth year, by patience and by law and not by the sword.`);
      return P(`Not a war. A lawsuit, three purchased debts, and a marriage blocked at exactly the right moment.`)
      +P(`${G.w.rival.name} sells the home farm within two years and is a tenant of yours within five. You are told they took it badly. You find you feel almost nothing, which is not what you expected.`);}
    G.hs("standing",-5);G.w.rival.att-=20;G.seed({type:"blood_debt",who:G.w.rival.name,house:G.w.rival.name});
    return P(`It goes wrong in the third month, publicly, and expensively, and you are too old to recover the ground.`)
    +P(`You have taught ${G.w.rival.name}'s heir exactly what you intended and exactly why, which is the worst possible bequest to leave your own.`);}},
  {t:"Write it all down. The truth, not the version.",
   do:G=>{G.stat("cunning",2);G.hflag("trueChronicle");G.flag("built");
    G.legend(`${G.c.name} wrote a chronicle of the house in ${G.c.g==="f"?"her":"his"} own hand, and did not flatter it.`);
    return P(`Eleven months, most evenings, in a hand that gets worse as it goes. You put in the theft. You put in the hanging. You put in the year you were wrong about the mill.`)
    +P(`Your heir will read it. Your heir will be furious. Your heir's heir will understand exactly what this family is, which is more than most houses ever get.`);}},
 ]},

{id:"t_body",phase:["twilight"],w:2,when:G=>G.c.peril>=3,
 eyebrow:G=>"Twilight",title:G=>"The physician is sent for",
 text:G=>P(`It has been coming for two winters and this winter it arrives: a weight in the chest, a hand that will not close properly in the mornings, a cough that empties the room.`)
 +P(`The physician is honest, which you asked for and now regret. Perhaps two years. Perhaps four, if you stop riding, stop drinking, and stop caring quite so much.`),
 choices:[
  {t:"Do exactly as he says.",
   do:G=>{G.c.peril=Math.max(0,G.c.peril-3);G.hs("standing",-1);G.note("The years buy you time");
    return P(`No horse, no wine, no winter travel, and a bland diet that your cook takes as a personal insult.`)
    +P(`It works. You get the four years. They are quiet years and you spend most of them indoors, and you get to see something you would otherwise have missed.`);}},
  {t:"Ride anyway.",cls:"risky",
   do:G=>{G.peril(2);G.trait("Iron-willed");G.hs("standing",2);
    return P(`You are out with the hounds within the fortnight and the household says nothing because there is nothing useful to say.`)
    +P(`If you are going to be dying, you would rather do it outside.`);}},
  {t:G=>`Send for the ${G.w.faith.cleric}.`,
   do:G=>{G.stat("faith",2);G.hs("piety",8);G.c.peril=Math.max(0,G.c.peril-1);
    return P(`He comes every week and mostly you talk about the weather and the state of the roof.`)
    +P(`Once, near the end, you ask him the question you have wanted to ask since you were fifteen. He gives you an honest answer and it is not the comforting one, and strangely that helps.`);}},
 ]},

{id:"t_grandchild",phase:["twilight"],w:2,when:G=>G.c.kids.some(k=>k.alive),
 setup:G=>({g:gname(chance(.5)?"m":"f")}),
 eyebrow:G=>"Twilight",title:G=>"A small person in the accounts room",
 text:G=>P(`Your grandchild ${G.v.g} is six and has discovered the accounts room, and specifically the tally-sticks, which make a very good sound when dropped.`)
 +P(`You should have them removed. Instead you find yourself sitting down on the floor, which is a considerable undertaking at your age, and which you will pay for tomorrow.`),
 choices:[
  {t:"Teach them the tally.",cls:"tender",
   do:G=>{G.bond("kid:0",10);G.stat("coin",1);G.hflag("taughtGrandchild");
    G.chron(`${G.c.name} taught ${G.v.g} to count on the sticks, sitting on the floor of the accounts room.`);
    return P(`They are quick. Frighteningly quick. By the third afternoon they have caught you in a deliberate error and are extremely pleased about it.`)
    +P(`Sixty years from now, an old person in this house will tell someone that they learned to count from their grandparent on the floor, and will not be able to explain why they are crying.`);}},
  {t:"Tell them about your father.",
   do:G=>{G.bond("kid:0",6);G.flag("toldTruth");
    return P(`You tell it badly and too long and they understand perhaps a tenth of it, and the tenth they understand is the part where you were frightened.`)
    +P(`That is the part that survives. That is always the part that survives.`);}},
  {t:"Have them taken out. There is work.",
   do:G=>{G.hs("coffers",1);G.trait("Guarded");
    return P(`The nurse comes and the room is quiet again and the column adds up correctly on the first attempt.`)
    +P(`You look at the door for slightly longer than you need to.`);}},
 ]},

{id:"t_last_land",phase:["twilight"],w:2,when:G=>G.h.coffers>=4,
 eyebrow:G=>"Twilight",title:G=>"What to do with the chest",
 text:G=>P(`There is money in the chest and you are unlikely to spend it. Everyone in the house knows this and nobody will raise it, so you raise it yourself at dinner and watch what happens to their faces.`),
 choices:[
  {t:G=>`Endow the ${G.w.faith.temple}. Prayers in perpetuity.`,
   do:G=>{G.hs("coffers",-4);G.hs("piety",20);G.hs("standing",3);G.hflag("endowed");
    return P(`A permanent chantry, two priests, and your name read aloud on a fixed day every year for as long as the institution stands.`)
    +P(`It stands a very long time. Longer than the house. There are people who will say your name in six hundred years who could not tell you a single fact about you.`);}},
  {t:"Bury it. Tell only the heir.",cls:"risky",
   do:G=>{G.hs("coffers",-2);G.hflag("buriedHoard");G.seed({type:"hoard",who:G.h.seat});
    return P(`Three nights, two men who are paid well and sent far away, and a mark on a beam that means nothing to anyone who does not already know.`)
    +P(`You tell your heir once, in detail, when they are sober. You do not write it down. That is either extremely wise or the stupidest thing you have ever done.`);}},
  {t:"Divide it among the household by years served.",cls:"tender",
   do:G=>{G.hs("coffers",-4);G.trait("Beloved");G.hs("standing",5);
    G.legend(`On ${G.c.g==="f"?"her":"his"} deathbed ${G.c.name} divided the chest among the household by years of service, down to the kitchen boy.`);
    return P(`The steward reads the list out. It takes an hour. The kitchen boy gets four shillings and a coat and does not understand for another decade what he was given.`)
    +P(`Your heir inherits a poorer house and a household that would go into fire for the name.`);}},
  {t:"Leave it. Let the heir decide.",
   do:G=>{G.hs("coffers",1);
    return P(`You close the lid and go to bed. It is, you tell yourself, their problem now, and you are surprised how much relief there is in that sentence.`);}},
 ]},
];
/* ================================================================
   ANCHORS — the fixed beams of every life
   ================================================================ */
const ANCHORS={

open:{id:"open",kind:"illum",
 eyebrow:G=>`The ${["First","Second","Third","Fourth","Fifth"][G.c.gen-1]} Hand`,
 title:G=>`${G.c.title} ${G.c.name} of ${G.h.name}`,
 text:G=>{
  const par=G.c.parentName?`child of ${G.c.parentName}`:`first of the name to hold anything at all`;
  const relic=G.c.gen===1?P(`There is one thing in this house older than the grant: ${hl().about}. Nobody has ever given it a name.`):"";
  return P(`Born in ${G.c.born}, ${par}. You are ${G.c.age} years old and this is where the chronicle picks you up.`)+relic
   +(G.c.traits.length?P(`They say of you already: ${G.c.traits.map(t=>`<em>${t.toLowerCase()}</em>`).join(", ")}.`):"")
   +`<div class="yearn"><span class="lbl">What you want, and will not say aloud</span>${YEARN_TEXT[G.c.yearn]}</div>`;
 },
 choices:[
  {t:"Take up the name.",when:G=>G.c.gen>1,do:G=>""},
  {t:G=>`Take up the name, and the ${hl().kind}.`,when:G=>G.c.gen===1,
   do:G=>G.form({title:"What is it called?",
     fields:[{k:"name",label:"This family's one inherited thing",ph:pick(["The Grant","Old Faith","Sixpence","Grandmother's Ring","The Notch","Quietly"])}],
     applyId:"heirloom"})},
 ]},

ascend:{id:"ascend",
 eyebrow:G=>"Succession",
 title:G=>G.c.gen===1?"The grant":"The funeral",
 setup:G=>({last:S.anc.length?S.anc[S.anc.length-1]:null}),
 text:G=>{
  if(G.c.gen===1)return P(`The parchment is smaller than you imagined a life could be written on. One manor at ${G.h.seat}, its mill, its wood, and the fishing in two miles of a river that floods.`)
   +P(`The Crown's man reads it aloud, misprononces your name, and rides on before noon. And that is it. You are a landed family now, at the bottom of a very tall ladder.`);
  const a=G.v.last;
  return P(`They bury ${a.name} on a day of thin rain with the whole valley standing in the churchyard, and afterward there is cold meat in the hall and forty people looking at you.`)
   +P(`<em>&ldquo;${a.epi}&rdquo;</em> — that is what will be cut into the stone. You chose none of it. You inherit all of it: the debts, the friendships, the way people flinch or don't when they hear this name.`);
 },
 choices:[
  {t:"Swear to continue exactly as they did.",when:G=>G.c.gen>1,
   do:G=>{G.hs("standing",3);G.hflag("continuity");
    const a=S.anc[S.anc.length-1];(a.traits||[]).slice(0,1).forEach(t=>G.trait(t));
    return P(`You say it in the hall with your hand on the ${G.w.faith.name}'s book, and the old servants weep, and the ones who disliked your parent go very still.`)
    +P(`You have just made a promise about a person you only partly knew. You will spend twenty years discovering exactly what you agreed to.`);}},
  {t:"Swear to do it differently.",when:G=>G.c.gen>1,
   do:G=>{G.hs("standing",-2);G.stat("cunning",1);G.hflag("break");G.trait("Ambitious");
    const a=S.anc[S.anc.length-1];
    G.chron(`At the burial of ${a.name}, the heir said plainly that the house would be run another way.`);
    return P(`You say it plainly and briefly and half the hall hears it as courage and half as an insult to a fresh grave.`)
    +P(`The steward resigns within the year. So do two of the tenants. So does the ${G.w.faith.cleric}'s goodwill. You are free, which is more expensive than it looks.`);}},
  {t:"Say nothing at all. Let them wonder.",when:G=>G.c.gen>1,
   do:G=>{G.trait("Guarded");G.stat("cunning",1);G.hs("standing",1);
    return P(`You thank them for coming. You ask after the roof at the mill. You go up early.`)
    +P(`By spring, everyone in the valley has decided what kind of lord you are, and every one of them has decided something different, and you find that this is extremely useful.`);}},
  {t:"Take it.",when:G=>G.c.gen===1,
   do:G=>{G.hs("standing",2);
    return P(`You sign where you are told. Your hand is steadier than you expected.`)
    +P(`That night you walk the whole boundary of it in the dark, which takes four hours, and you tell nobody you did it.`);}},
 ]},

marriage:{id:"marriage",
 eyebrow:G=>"The Match",title:G=>"A marriage must be made",
 setup:G=>{
  const c=[];
  const g=G.c.g==="m"?"f":"m";
  c.push({name:gname(g),g,house:G.pick([houseName(),houseName()]),kind:"rich",
   note:"A wool fortune and no land. Their father counts in tenths and their mother is worse.",
   dowry:6,std:1,str:0,arms:newArms(),bond:45,traits:["Shrewd"]});
  c.push({name:gname(g),g,house:G.w.rival.att<0?G.w.rival.name:houseName(),kind:"peace",
   note:"The old quarrel could end here. It could also come to live in your house.",
   dowry:2,std:5,str:2,arms:G.w.rival.arms,bond:30,traits:["Guarded"]});
  c.push({name:gname(g),g,house:"no house at all",kind:"love",
   note:G.pick(["The reeve's child, who you have known since the flooded field.",
                "A physician's daughter from the port with more education than either of you.",
                "Someone from this valley who makes you laugh, which nobody else has managed."]),
   dowry:0,std:-4,str:0,arms:null,bond:78,traits:["Beloved"]});
  return {c};
 },
 text:G=>P(`The household has been at this for a year: letters, visits, the careful mathematics of who is worth what. Three names are left on the table, and one of them is not really supposed to be.`)
  +P(`Whatever you choose, you will be sitting across from them at breakfast for the next forty years.`),
 choices:[
  {t:G=>`${G.v.c[0].name} of ${G.v.c[0].house}`,hint:G=>G.v.c[0].note,
   do:G=>wed(G,0)},
  {t:G=>`${G.v.c[1].name} of ${G.v.c[1].house}`,hint:G=>G.v.c[1].note,cls:"risky",
   do:G=>wed(G,1)},
  {t:G=>`${G.v.c[2].name}, of ${G.v.c[2].house}`,hint:G=>G.v.c[2].note,cls:"tender",
   do:G=>wed(G,2)},
  {t:"Marry no one.",hint:"There are other ways to have an heir. Most are worse.",
   do:G=>{G.trait("Guarded");G.hs("standing",-4);G.flag("unwed");
    G.chron(`${G.c.name} would not marry, and the household made its own arrangements about the succession.`);
    return P(`You tell the steward to burn the letters, and he does, and he asks once whether you are certain, and you say yes, and he never asks again.`)
    +P(`It is your life. It is also, in a house that is a hundred names long, a decision that everyone else has to live inside.`);}},
 ]},

children:{id:"children",
 eyebrow:G=>"The Nursery",title:G=>"Children",
 setup:G=>{
  const n=S.c.flags.unwed?(chance(.55)?1:0):ri(1,3);
  const kids=[];
  for(let i=0;i<n;i++){
   const g=chance(.5)?"m":"f";
   kids.push({name:gname(g),g,born:S.w.year-ri(1,4),bond:50,alive:true,
     traits:pickN(CHILD_TRAITS,ri(1,2))});
  }
  return {kids,n};
 },
 text:G=>{
  if(G.v.n===0)return P(`There are no children, and there will not be. The house knows it before you say it out loud; houses always do.`)
   +P(`Your steward begins, delicately, to talk about cousins. Somewhere in the next valley a boy who has never met you is being raised slightly differently because of it.`);
  const names=G.v.kids.map(k=>`<em>${k.name}</em>`).join(", ");
  return P(`${G.v.n===1?"A child":"Children"}: ${names}. ${G.v.n>1?"They are nothing like each other.":"There is only the one, and everyone is aware of it, all the time."}`)
   +P(`You have perhaps ten years of being listened to, and then they will be people, and you will have to negotiate. How this house raises children is a decision each generation makes freshly and pretends it did not.`);
 },
 choices:[
  {t:"Raise them hard. The world is harder.",when:G=>G.v.n>0,
   do:G=>{regKids(G);G.c.kids.forEach(k=>{k.bond=clamp(k.bond-15,0,100);if(!k.traits.includes("Guarded"))k.traits.push("Guarded");});
    G.c.childTraits=["Guarded"];
    return nameKidsForm(G,P(`Cold rooms, early rising, no favouritism shown even where it is felt. They are competent by twelve and unreachable by sixteen.`)
    +P(`It is how you were raised. You have told yourself it worked.`));}},
  {t:"Raise them close. Let them know you.",when:G=>G.v.n>0,cls:"tender",
   do:G=>{regKids(G);G.c.kids.forEach(k=>{k.bond=clamp(k.bond+22,0,100);});
    G.c.childTraits=["Content"];G.hs("standing",-1);
    return nameKidsForm(G,P(`They come to the accounts room. They come to the hall. They are in the way constantly and they know the names of every tenant by the time they are nine.`)
    +P(`Other houses find it undignified. Your children will be, whatever else, entirely certain that they were wanted.`));}},
  {t:"Raise the heir. The others as they come.",when:G=>G.v.n>1,
   do:G=>{regKids(G);G.c.kids[0].bond=clamp(G.c.kids[0].bond+18,0,100);
    for(let i=1;i<G.c.kids.length;i++){G.c.kids[i].bond=clamp(G.c.kids[i].bond-22,0,100);G.c.kids[i].traits.push("Ambitious");}
    G.seed({type:"bitter_sibling",who:G.c.kids[1].name});
    return nameKidsForm(G,P(`The eldest gets the tutor, the horse, and the hours. The others get the household, which is not nothing, and get told they are lucky, which is worse.`)
    +P(`The eldest will be well-prepared. The others will be watching, and they will be very good at it.`));}},
  {t:G=>`Send the second child to the ${G.w.faith.temple}.`,when:G=>G.v.n>1,
   do:G=>{regKids(G);G.hs("piety",14);G.c.kids[1].bond=clamp(G.c.kids[1].bond-10,0,100);G.c.kids[1].churched=true;
    G.seed({type:"church_kin",who:G.c.kids[1].name});
    return nameKidsForm(G,P(`It is the ordinary arrangement and it costs a donation and a great many tears at the gate.`)
    +P(`Twenty years on, that child will be somebody in the ${G.w.faith.name} — which is to say, a door into an institution that outlives kings.`));}},
  {t:"There is nothing to decide.",when:G=>G.v.n===0,
   do:G=>{G.hflag("noIssue");return P(`You put the question away in the drawer where you keep the things that cannot be solved by being good at your work.`);}},
 ]},

omen:{id:"omen",
 eyebrow:G=>"An Omen",title:G=>"Word from beyond the valley",
 text:G=>P(G.w.threat.omen)
  +P(`Nobody at your table takes it seriously except your steward, who takes everything seriously, and one old woman in the village who has been right twice.`)
  +P(`It will be years before it matters, if it ever does. Which means the preparing has to happen now, when it looks like waste.`),
 choices:[
  {t:"Fill the granaries. Buy grain and hold it.",
   do:G=>{G.hs("coffers",-3);G.hflag("stores");G.trait("Shrewd");
    return P(`You buy at the top of a good harvest, which every merchant in the county finds hilarious, and you build a second granary to hold it.`)
    +P(`For four years you look like a fool with a lot of old wheat.`);}},
  {t:"Bind your neighbours to you. Oaths, marriages, debts forgiven.",
   do:G=>{G.hs("coffers",-2);G.hs("standing",4);G.hflag("allies");
    return P(`Three dinners, one forgiven debt, and a marriage arranged between other people's children that you take credit for.`)
    +P(`You now have four houses who owe you something specific. Obligation is a wall you can build without stone.`);}},
  {t:"Arm and drill. Every man, every month.",
   do:G=>{G.hs("coffers",-2);G.hs("strength",3);G.hflag("drilled");G.stat("iron",1);
    return P(`Every able man, one day in thirty, in the meadow below the mill, with real spears and a man from the port who fought in a real war shouting at them.`)
    +P(`They resent it enormously. It costs a working day a month, forever, for something that has not happened.`);}},
  {t:"Nothing. It is a rumour and grain rots.",
   do:G=>{G.hs("coffers",2);G.trait("Content");
    return P(`You are, statistically, correct. Most omens are weather and gossip. The chest stays full and the fields stay worked and no one loses a day to drill.`)
