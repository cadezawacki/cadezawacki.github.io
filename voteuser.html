<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07090a">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Vote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07090a; --surface: #111617; --surface-2: #171e1f; --ink: #f2f5f5; --muted: #7d8a8a; --line: #222b2c;
  --teal: #19c3b1; --teal-deep: #0e8c80; --teal-ink: #021412;
  --gold: #e8bd4f; --silver: #c3cad0; --bronze: #cd8550;
  --gold-metal: linear-gradient(180deg, #f8dd8c 0%, #d9a83a 38%, #a9781c 100%);
  --silver-metal: linear-gradient(180deg, #f1f4f6 0%, #b5bdc4 40%, #79828a 100%);
  --bronze-metal: linear-gradient(180deg, #f0b588 0%, #c07a45 40%, #7e4522 100%);
  --cond: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif-condensed, sans-serif;
  --bevel: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--cond); font-size: 17px; line-height: 1.15;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  overscroll-behavior: none; overflow: hidden; -webkit-text-size-adjust: 100%;
}
/* stage lighting */
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none;
  background:
    radial-gradient(60% 42% at 50% 0%, rgba(25, 195, 177, .20), transparent 70%),
    radial-gradient(90% 50% at 50% 100%, rgba(25, 195, 177, .06), transparent 70%);
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
[hidden] { display: none !important; }

.screen {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top) + 14px) max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 14px) max(16px, env(safe-area-inset-left));
  max-width: 560px; margin: 0 auto;
}

/* ---------- ballot ---------- */
.race-name {
  font-size: 26px; font-weight: 800; text-align: center; text-transform: uppercase; letter-spacing: .06em;
  padding: 2px 0 12px; line-height: 1;
}
.race-name:empty { display: none; }

.podium { display: flex; align-items: flex-end; gap: 6px; padding-top: 4px; flex: none; position: relative; }
/* spotlight on the top step */
.podium::before {
  content: ""; position: absolute; left: 50%; top: -60px; bottom: 0; width: 70%; transform: translateX(-50%);
  background: linear-gradient(180deg, rgba(255, 236, 180, .10), rgba(255, 236, 180, 0) 85%);
  clip-path: polygon(38% 0, 62% 0, 100% 100%, 0 100%); pointer-events: none;
}
.step { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; position: relative; }
.p0 { --m: var(--gold); --metal: var(--gold-metal); }
.p1 { --m: var(--silver); --metal: var(--silver-metal); }
.p2 { --m: var(--bronze); --metal: var(--bronze-metal); }
.block {
  background: var(--metal); display: flex; align-items: flex-start; justify-content: center; padding-top: 4px;
  font-weight: 800; font-size: 44px; line-height: 1; color: rgba(10, 8, 4, .62);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), inset 0 -10px 18px rgba(0, 0, 0, .25);
  clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%, 0 8px);
}
.block sup { font-size: 15px; letter-spacing: .04em; margin-left: 1px; position: relative; top: 4px; vertical-align: top; }
.p0 .block { height: 86px; }
.p1 .block { height: 62px; }
.p2 .block { height: 44px; font-size: 36px; }

/* empty slot: corner brackets in the medal color */
.slot {
  height: 66px; position: relative; transition: transform .12s, background-color .12s;
  --t: 14px; --w: 2px;
  background:
    linear-gradient(var(--m), var(--m)) 0 0 / var(--t) var(--w),
    linear-gradient(var(--m), var(--m)) 0 0 / var(--w) var(--t),
    linear-gradient(var(--m), var(--m)) 100% 0 / var(--t) var(--w),
    linear-gradient(var(--m), var(--m)) 100% 0 / var(--w) var(--t),
    linear-gradient(var(--m), var(--m)) 0 100% / var(--t) var(--w),
    linear-gradient(var(--m), var(--m)) 0 100% / var(--w) var(--t),
    linear-gradient(var(--m), var(--m)) 100% 100% / var(--t) var(--w),
    linear-gradient(var(--m), var(--m)) 100% 100% / var(--w) var(--t),
    rgba(255, 255, 255, .025);
  background-repeat: no-repeat;
}
.slot.over { transform: scale(1.05); --t: 22px; background-color: color-mix(in srgb, var(--m) 16%, transparent); }
.slot .chip {
  position: absolute; inset: 0; height: auto; padding: 0 6px; font-size: 17px; font-weight: 700;
  background: linear-gradient(180deg, color-mix(in srgb, var(--m) 22%, var(--surface)), var(--surface));
  border: 0; border-top: 3px solid var(--m); color: #fff;
  box-shadow: 0 0 22px color-mix(in srgb, var(--m) 28%, transparent), inset 0 0 0 1px color-mix(in srgb, var(--m) 35%, transparent);
  clip-path: none;
}

.chip {
  height: 54px; padding: 0 12px; background: var(--surface); border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center; text-align: center;
  font-size: 18px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; line-height: 1.05;
  touch-action: none; cursor: grab; min-width: 0; position: relative;
  clip-path: polygon(0 0, calc(100% - var(--bevel)) 0, 100% var(--bevel), 100% 100%, 0 100%);
}
.chip::after {   /* bevel edge highlight */
  content: ""; position: absolute; right: 0; top: 0; width: calc(var(--bevel) * 1.42); height: 1px;
  background: var(--line); transform-origin: right top; transform: rotate(45deg) translateX(1px);
}
.slot .chip::after { display: none; }
.chip span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: break-word; hyphens: auto; }
.chip.lifted { opacity: .22; }
.pool.scrolls .chip { touch-action: pan-y; }

.ghost {
  position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; margin: 0;
  background: var(--surface-2); border-color: var(--teal); color: #fff;
  filter: drop-shadow(0 14px 22px rgba(0, 0, 0, .6)) drop-shadow(0 0 14px rgba(25, 195, 177, .35));
  transform-origin: center; will-change: transform;
}
.ghost.chip { clip-path: none; }
.ghost.chip::after { display: none; }

/* pool */
.pool-wrap { flex: 1 1 auto; min-height: 120px; position: relative; margin-top: 16px; transition: background-color .12s; }
.pool-wrap::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; z-index: 1;
  background: linear-gradient(90deg, transparent, var(--teal) 50%, transparent); opacity: .55;
}
.pool-wrap.over { background: rgba(25, 195, 177, .07); }
.pool {
  position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain; scrollbar-width: none; padding: 14px 0;
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; align-content: start;
}
.pool::-webkit-scrollbar { display: none; }
.pool.scrolls { padding-right: 14px; }
.rail { position: absolute; right: 2px; top: 14px; bottom: 14px; width: 3px; background: var(--line); pointer-events: none; }
.thumb { position: absolute; left: -1px; right: -1px; background: var(--teal); box-shadow: 0 0 8px rgba(25, 195, 177, .7); }
.fade { position: absolute; left: 0; right: 14px; height: 40px; pointer-events: none; transition: opacity .15s; }
.fade.bottom { bottom: 0; background: linear-gradient(to bottom, transparent, var(--bg)); }
.fade.top { top: 1px; background: linear-gradient(to top, transparent, var(--bg)); }

.cast, .btn {
  flex: none; height: 60px; width: 100%; background: var(--teal); color: var(--teal-ink);
  font-size: 24px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; padding-left: .22em;
  clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
  transition: background-color .2s, color .2s, transform .08s;
}
.cast { margin-top: 10px; position: relative; overflow: hidden; }
.cast:disabled { background: var(--surface-2); color: #3d4848; cursor: default; }
.cast:not(:disabled) { animation: ready .9s ease-out; }
.cast:not(:disabled)::after {
  content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .45), transparent);
  animation: sweep 2.8s ease-in-out .3s infinite;
}
@keyframes sweep { 0% { left: -60%; } 45%, 100% { left: 130%; } }
@keyframes ready { 0% { filter: brightness(1.8); } 100% { filter: none; } }
.cast:not(:disabled):active, .btn:active { transform: scale(.98); }

/* ---------- confirmation ---------- */
.center { justify-content: center; align-items: center; text-align: center; gap: 26px; }
.done-art { width: 230px; height: 196px; overflow: visible; }
.done-art .rays { transform-origin: 115px 78px; animation: turn 40s linear infinite; opacity: 0; animation-name: turn, fadein; animation-duration: 40s, .8s; animation-iteration-count: infinite, 1; animation-fill-mode: none, forwards; animation-delay: 0s, .4s; }
.done-art .frame, .done-art .tick { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .55s ease-out forwards; }
.done-art .tick { animation-delay: .45s; animation-duration: .3s; }
.done-art .bar { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: rise .45s cubic-bezier(.2, .9, .3, 1.2) forwards; }
.done-art .b1 { animation-delay: .1s; } .done-art .b0 { animation-delay: .2s; } .done-art .b2 { animation-delay: .3s; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes rise { to { transform: scaleY(1); } }
@keyframes turn { to { transform: rotate(360deg); } }
@keyframes fadein { to { opacity: 1; } }
.done-title { font-size: 40px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; line-height: .95; max-width: 320px; }
.done .btn {
  max-width: 320px; height: 56px; font-size: 20px; letter-spacing: .16em; background: transparent; color: var(--teal);
  clip-path: none; border: 2px solid var(--teal); position: relative;
}
.note { color: var(--muted); font-size: 20px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; }
.spinner { width: 30px; height: 30px; border: 3px solid var(--line); border-top-color: var(--teal); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition: none !important; } }
@media (max-height: 600px) {
  .race-name { font-size: 22px; padding-bottom: 8px; }
  .slot { height: 56px; } .chip { height: 46px; font-size: 16px; }
  .slot .chip { font-size: 15px; }
  .p0 .block { height: 58px; font-size: 36px; } .p1 .block { height: 42px; font-size: 30px; } .p2 .block { height: 30px; font-size: 24px; }
  .block sup { font-size: 12px; top: 2px; }
  .pool-wrap { margin-top: 12px; } .cast { height: 52px; font-size: 21px; }
}
</style>
</head>
<body>

<section class="screen center" id="s-loading"><div class="spinner"></div></section>

<section class="screen center" id="s-msg" hidden><p class="note" id="msg"></p></section>

<section class="screen" id="s-ballot" hidden>
  <h1 class="race-name" id="race-name"></h1>
  <div class="podium" id="podium"></div>
  <div class="pool-wrap" id="pool-wrap">
    <div class="pool" id="pool"></div>
    <div class="fade top"></div><div class="fade bottom"></div>
    <div class="rail" id="rail" hidden><div class="thumb" id="thumb"></div></div>
  </div>
  <button class="cast" id="cast" disabled>Cast vote</button>
</section>

<section class="screen center done" id="s-done" hidden>
  <svg class="done-art" viewBox="0 0 230 196" aria-hidden="true">
    <defs>
      <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8dd8c"/><stop offset=".4" stop-color="#d9a83a"/><stop offset="1" stop-color="#a9781c"/></linearGradient>
      <linearGradient id="g-silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f4f6"/><stop offset=".4" stop-color="#b5bdc4"/><stop offset="1" stop-color="#79828a"/></linearGradient>
      <linearGradient id="g-bronze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0b588"/><stop offset=".4" stop-color="#c07a45"/><stop offset="1" stop-color="#7e4522"/></linearGradient>
      <radialGradient id="g-glow"><stop offset="0" stop-color="#19c3b1" stop-opacity=".35"/><stop offset="1" stop-color="#19c3b1" stop-opacity="0"/></radialGradient>
    </defs>
    <circle cx="115" cy="78" r="92" fill="url(#g-glow)"/>
    <g class="rays" stroke="#19c3b1" stroke-opacity=".28" stroke-width="1.5">
      <path d="M115 -22V8M115 148v30M15 78h30M185 78h30M44 7l21 21M165 128l21 21M186 7l-21 21M65 128l-21 21"/>
    </g>
    <polygon class="frame" pathLength="1" points="96,32 134,32 161,59 161,97 134,124 96,124 69,97 69,59" fill="#0d1314" stroke="#19c3b1" stroke-width="4" stroke-linejoin="miter"/>
    <path class="tick" pathLength="1" d="M94 79 l14 14 l29 -31" fill="none" stroke="#19c3b1" stroke-width="9" stroke-linecap="square" stroke-linejoin="miter"/>
    <path class="bar b1" d="M47 168h44v28h-44z" fill="url(#g-silver)"/>
    <path class="bar b0" d="M93 156h44v40h-44z" fill="url(#g-gold)"/>
    <path class="bar b2" d="M139 176h44v20h-44z" fill="url(#g-bronze)"/>
  </svg>
  <h1 class="done-title">Your vote has been cast</h1>
  <button class="btn" id="change">Change my vote</button>
  <p class="note" id="closed-note" hidden>Voting is closed</p>
</section>

<script src="vote/core.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const screens = ['s-loading', 's-msg', 's-ballot', 's-done'];
  const show = (id) => screens.forEach((s) => { $(s).hidden = s !== id; });
  const message = (t) => { $('msg').textContent = t; show('s-msg'); };

  const link = V.decodeLink(location.hash.slice(1));
  if (!link || !link.u || !link.r || !link.k) { message('This link is incomplete. Scan the QR code again.'); return; }

  const RACE = V.racePath(link.r);
  const LOCAL = 'vote-race-' + link.r;

  let uid = V.store.get('vote-uid');
  if (!uid) {
    uid = crypto.randomUUID ? crypto.randomUUID() : V.rid(16);
    V.store.set('vote-uid', uid);
  }

  let entries = [];       // [{id, name}]
  let byId = new Map();
  let slots = 3;
  let picks = [];         // entry id or null, per podium place
  let order = [];         // pool display order (shuffled once per voter)
  let local = V.store.get(LOCAL) || {};

  const save = () => { local.draft = picks; V.store.set(LOCAL, local); };

  async function fetchLock() { return V.rest(link.u, RACE + '/lock'); }

  async function load() {
    let sealed, lock;
    try { [sealed, lock] = await Promise.all([V.rest(link.u, RACE + '/meta'), fetchLock()]); }
    catch { message('Can’t reach the server. Check your connection and reload.'); return; }
    if (!sealed) { message('This vote doesn’t exist anymore.'); return; }
    let meta;
    try { meta = await V.unseal(sealed, link.k); } catch { message('This link is invalid.'); return; }

    entries = (meta.entries || []).filter((e) => e && e.id && e.name);
    byId = new Map(entries.map((e) => [e.id, e]));
    slots = Math.min(3, entries.length);
    $('race-name').textContent = meta.name || '';
    document.title = meta.name || 'Vote';
    if (!slots) { message('Nothing to vote on yet.'); return; }

    // Stable per-voter shuffle so list position doesn't favor anyone.
    const known = (local.order || []).filter((id) => byId.has(id));
    const fresh = entries.map((e) => e.id).filter((id) => !known.includes(id));
    for (let i = fresh.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [fresh[i], fresh[j]] = [fresh[j], fresh[i]]; }
    order = known.concat(fresh);
    local.order = order;

    const clean = (arr) => {
      const out = Array(slots).fill(null), seen = new Set();
      (arr || []).slice(0, slots).forEach((id, i) => { if (byId.has(id) && !seen.has(id)) { out[i] = id; seen.add(id); } });
      return out;
    };
    picks = clean(local.draft || local.cast);
    save();
    buildPodium();
    render();

    if (local.cast) showDone(!!lock);
    else if (lock) message('Voting is closed');
    else show('s-ballot');
    requestAnimationFrame(updateRail);
  }

  // ---------- rendering ----------
  const chipHtml = (id) => `<div class="chip" data-id="${V.esc(id)}"><span>${V.esc(byId.get(id).name)}</span></div>`;

  function buildPodium() {
    // Visual order: silver, gold, bronze.
    const visual = slots === 3 ? [1, 0, 2] : slots === 2 ? [1, 0] : [0];
    $('podium').innerHTML = visual.map((p) =>
      `<div class="step p${p}"><div class="slot" data-slot="${p}"></div><div class="block">${p + 1}<sup>${['ST', 'ND', 'RD'][p]}</sup></div></div>`).join('');
  }

  function render() {
    document.querySelectorAll('.slot').forEach((el) => {
      const id = picks[+el.dataset.slot];
      el.innerHTML = id ? chipHtml(id) : '';
      el.classList.toggle('filled', !!id);
    });
    const placed = new Set(picks.filter(Boolean));
    $('pool').innerHTML = order.filter((id) => !placed.has(id)).map(chipHtml).join('');
    $('cast').disabled = picks.some((p) => !p);
    updateRail();
  }

  // Always-visible scroll indicator (iOS hides native scrollbars).
  const pool = $('pool');
  const fadeTop = document.querySelector('.fade.top'), fadeBottom = document.querySelector('.fade.bottom');
  function updateRail() {
    const { scrollHeight: sh, clientHeight: ch, scrollTop: st } = pool;
    const scrolls = sh > ch + 2;
    pool.classList.toggle('scrolls', scrolls);
    $('rail').hidden = !scrolls;
    fadeTop.style.opacity = scrolls && st > 4 ? 1 : 0;
    fadeBottom.style.opacity = scrolls && st + ch < sh - 4 ? 1 : 0;
    if (!scrolls) return;
    const track = $('rail').clientHeight;
    const h = Math.max(28, track * ch / sh);
    $('thumb').style.height = h + 'px';
    $('thumb').style.top = ((track - h) * st / (sh - ch)) + 'px';
  }
  pool.addEventListener('scroll', updateRail, { passive: true });
  addEventListener('resize', updateRail);

  // ---------- placing ----------
  function place(id, slot) {
    const from = picks.indexOf(id);
    const occupant = picks[slot];
    if (from === slot) return;
    if (from >= 0) picks[from] = occupant;   // podium -> podium swaps
    picks[slot] = id;                        // pool -> occupied slot bumps occupant back
    save(); render();
  }
  function unplace(id) {
    const i = picks.indexOf(id);
    if (i >= 0) { picks[i] = null; save(); render(); }
  }
  function tap(id) {
    if (picks.includes(id)) return unplace(id);
    const empty = picks.indexOf(null);
    if (empty >= 0) place(id, empty);
    else { const el = $('podium'); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
  }

  // ---------- drag ----------
  // Pointer events for everything; touch drags from a scrollable list start on
  // a sideways move or a short hold, so a vertical swipe still scrolls.
  let drag = null;
  const HOLD_MS = 170, SLOP = 7;

  document.addEventListener('pointerdown', (e) => {
    if (drag || (e.pointerType === 'mouse' && e.button !== 0)) return;
    const chip = e.target.closest('.chip');
    if (!chip) return;
    const inPool = !!chip.closest('.pool');
    drag = { id: chip.dataset.id, chip, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, pid: e.pointerId, started: false, target: null };
    if (inPool && pool.classList.contains('scrolls') && e.pointerType === 'touch') {
      drag.gated = true;
      drag.timer = setTimeout(() => drag && !drag.started && start(), HOLD_MS);
    }
  });

  function start() {
    const r = drag.chip.getBoundingClientRect();
    const g = drag.chip.cloneNode(true);
    g.classList.add('ghost');
    g.style.width = r.width + 'px'; g.style.height = r.height + 'px';
    drag.dx = drag.x0 - r.left; drag.dy = drag.y0 - r.top;
    document.body.appendChild(g);
    drag.ghost = g; drag.started = true;
    drag.chip.classList.add('lifted');
    if (navigator.vibrate) try { navigator.vibrate(8); } catch {}
    move();
  }

  function move() {
    const { ghost, x, y } = drag;
    ghost.style.transform = `translate(${x - drag.dx}px, ${y - drag.dy}px) scale(1.05)`;
    const hit = document.elementFromPoint(x, y);
    const t = hit && (hit.closest('.slot') || hit.closest('.pool-wrap'));
    if (t !== drag.target) {
      if (drag.target) drag.target.classList.remove('over');
      if (t) t.classList.add('over');
      drag.target = t;
    }
  }

  addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.pid) return;
    drag.x = e.clientX; drag.y = e.clientY;
    if (!drag.started) {
      const dx = Math.abs(drag.x - drag.x0), dy = Math.abs(drag.y - drag.y0);
      if (Math.max(dx, dy) < SLOP) return;
      if (drag.gated && dy > dx) return end();  // vertical swipe: let the list scroll
      clearTimeout(drag.timer);
      start();
    }
    e.preventDefault();
    move();
  }, { passive: false });

  // Once a drag is live, stop the browser from also scrolling.
  addEventListener('touchmove', (e) => { if (drag && drag.started) e.preventDefault(); }, { passive: false });

  function end(drop) {
    if (!drag) return;
    clearTimeout(drag.timer);
    const d = drag;
    drag = null;
    if (d.target) d.target.classList.remove('over');
    if (d.ghost) d.ghost.remove();
    d.chip.classList.remove('lifted');
    if (!drop) return;
    if (!d.started) return tap(d.id);
    if (d.target && d.target.classList.contains('slot')) place(d.id, +d.target.dataset.slot);
    else if (d.target) unplace(d.id);
  }
  addEventListener('pointerup', (e) => { if (drag && e.pointerId === drag.pid) end(true); });
  addEventListener('pointercancel', (e) => { if (drag && e.pointerId === drag.pid) end(false); });
  addEventListener('contextmenu', (e) => e.preventDefault());

  // ---------- cast ----------
  $('cast').addEventListener('click', async () => {
    const btn = $('cast');
    if (btn.disabled) return;
    btn.disabled = true;
    const label = btn.textContent;
    btn.textContent = 'Casting…';
    try {
      if (await fetchLock()) { local.draft = null; save(); return message('Voting is closed'); }
      const vote = picks.slice();
      await V.rest(link.u, RACE + '/votes/' + uid, 'PUT', { d: await V.seal({ r: vote }, link.k), t: V.SERVER_TIME });
      local.cast = vote; local.draft = null; V.store.set(LOCAL, local);
      showDone(false);
    } catch {
      btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake');
    } finally {
      btn.textContent = label;
      btn.disabled = picks.some((p) => !p);
    }
  });

  function showDone(closed) {
    $('change').hidden = closed;
    $('closed-note').hidden = !closed;
    const art = document.querySelector('.done-art');
    const fresh = art.cloneNode(true);   // restart the animation
    art.replaceWith(fresh);
    show('s-done');
  }

  $('change').addEventListener('click', async () => {
    const btn = $('change');
    btn.disabled = true;
    let lock = null;
    try { lock = await fetchLock(); } catch {}
    btn.disabled = false;
    if (lock) return showDone(true);
    picks = picks.map((_, i) => (local.cast && local.cast[i]) || null);
    save(); render();
    show('s-ballot');
    requestAnimationFrame(updateRail);
  });

  load();
})();
</script>
</body>
</html>
