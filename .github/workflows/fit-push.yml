# The Wire — ppc fitness push notifications, GitHub Actions entry point.
#
# The LIVE sender is the Cloudflare Worker in wire/ (every minute + instant
# pokes from the app). This workflow is manual-only now: use "Run workflow"
# to send a pass by hand or to dry-run the logic in the Actions log. It runs
# the same pass (tools/fit-push-core.mjs) as the Worker.
#
# Requires the VAPID_PRIVATE_KEY repository secret (Settings → Secrets and
# variables → Actions). Generate a pair with `node tools/vapid-keygen.mjs`;
# the public half lives in ppc.html (VAPID_PUB) and MUST come from the same
# pair. While the secret is missing the job runs in DRY_RUN mode.
name: fit-push
on:
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: fit-push
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save web-push@3
      - name: send
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          if [ -z "$VAPID_PRIVATE_KEY" ]; then
            echo "::warning title=The Wire is muted::VAPID_PRIVATE_KEY secret is not set — running in DRY_RUN mode. Generate a pair with 'node tools/vapid-keygen.mjs', put the public key in ppc.html and the private key in the repo's Actions secrets."
            export DRY_RUN=1
          fi
          node tools/fit-push.mjs
