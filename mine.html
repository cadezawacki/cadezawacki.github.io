/* ============================================
   §CSS-2 THEME MAPPING — game vars over the palette
   light = Minimal (default) · dark = Minimal dark · retro = Win3.1 homage
   ============================================ */
:root {
  --font-body: 'General Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
  --topbar-h: calc(52px + env(safe-area-inset-top));
  --m-radius: 12px;
  --m-radius-sm: 8px;
  --m-transition: 160ms cubic-bezier(0.16, 1, 0.3, 1);
}

html[data-theme="light"] {
  --m-bg: var(--mist-lightest);
  --m-bg2: var(--frost-base);
  --m-surface: var(--frost-lightest);
  --m-surface2: var(--frost-lighter);
  --m-surface3: var(--mist-lighter);
  --m-border: var(--mist-darker);
  --m-border-soft: var(--mist-base);
  --m-text: var(--charcoal-base);
  --m-text-muted: var(--steel-darker);
  --m-text-faint: var(--pewter-darker);
  --m-accent: var(--teal-base);
  --m-accent-hi: var(--azure-base);
  --m-accent-soft: var(--blue-lightest);
  --m-danger: var(--crimson-base);
  --m-danger-soft: #fbe4e4;
  --m-ok: var(--emerald-darker);
  --m-ok-soft: #dff3ec;
  --m-warn: var(--amber-darkest);
  --m-gold: var(--amber-base);
  --m-shadow-out: 6px 6px 14px rgba(158, 178, 186, 0.42), -6px -6px 14px rgba(255, 255, 255, 0.9);
  --m-shadow-out-sm: 3px 3px 8px rgba(158, 178, 186, 0.38), -3px -3px 8px rgba(255, 255, 255, 0.85);
  --m-shadow-in: inset 3px 3px 7px rgba(158, 178, 186, 0.35), inset -3px -3px 7px rgba(255, 255, 255, 0.9);
  --m-overlay: rgba(239, 243, 244, 0.72);
}

html[data-theme="dark"] {
  color-scheme: dark;
  --m-bg: var(--charcoal-darkest);
  --m-bg2: var(--charcoal-darker);
  --m-surface: var(--charcoal-base);
  --m-surface2: var(--charcoal-lighter);
  --m-surface3: var(--charcoal-lightest);
  --m-border: #3c3c4a;
  --m-border-soft: #33333f;
  --m-text: var(--mist-lightest);
  --m-text-muted: var(--pewter-base);
  --m-text-faint: var(--steel-base);
  --m-accent: var(--azure-base);
  --m-accent-hi: var(--azure-lightest);
  --m-accent-soft: rgba(31, 184, 205, 0.14);
  --m-danger: var(--crimson-lightest);
  --m-danger-soft: rgba(247, 61, 61, 0.14);
  --m-ok: var(--emerald-lightest);
  --m-ok-soft: rgba(51, 199, 152, 0.14);
  --m-warn: var(--amber-base);
  --m-gold: var(--amber-base);
  --m-shadow-out: 6px 6px 14px rgba(0, 0, 0, 0.5), -6px -6px 14px rgba(74, 74, 92, 0.28);
  --m-shadow-out-sm: 3px 3px 8px rgba(0, 0, 0, 0.45), -3px -3px 8px rgba(74, 74, 92, 0.24);
  --m-shadow-in: inset 3px 3px 7px rgba(0, 0, 0, 0.5), inset -3px -3px 7px rgba(74, 74, 92, 0.3);
  --m-overlay: rgba(20, 20, 24, 0.74);
}

html[data-theme="retro"] {
  --m-bg: #bdbdbd;
  --m-bg2: #c0c0c0;
  --m-surface: #c0c0c0;
  --m-surface2: #c8c8c8;
  --m-surface3: #d4d4d4;
  --m-border: #808080;
  --m-border-soft: #a0a0a0;
  --m-text: #000000;
  --m-text-muted: #333333;
  --m-text-faint: #5a5a5a;
  --m-accent: #000080;
  --m-accent-hi: #1084d0;
  --m-accent-soft: #d5e2f2;
  --m-danger: #ff0000;
  --m-danger-soft: #f3caca;
  --m-ok: #008000;
  --m-ok-soft: #cfe6cf;
  --m-warn: #808000;
  --m-gold: #ffd166;
  --m-shadow-out: none;
  --m-shadow-out-sm: none;
  --m-shadow-in: none;
  --m-overlay: rgba(192, 192, 192, 0.82);
  --m-radius: 0px;
  --m-radius-sm: 0px;
  --font-body: Tahoma, 'MS Sans Serif', 'Segoe UI', sans-serif;
}

/* ============================================
   §CSS-3 BASE & LAYOUT
   ============================================ */
html, body { height: 100%; overscroll-behavior: none; }
body {
  font-family: var(--font-body);
  background: var(--m-bg);
  color: var(--m-text);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: background 240ms ease;
}
button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 0.9rem; color: var(--m-text); }
::selection { background: var(--m-accent); color: #fff; }

#app { position: fixed; inset: 0; display: flex; flex-direction: column; }

/* ---- Top bar ---- */
#topbar {
  height: var(--topbar-h);
  padding: env(safe-area-inset-top) 10px 0 10px;
  display: flex; align-items: center; gap: 8px;
  background: var(--m-bg);
  position: relative; z-index: 30;
  flex: none;
}
html[data-theme="retro"] #topbar { border-bottom: 2px solid; border-color: #fff #808080 #808080 #fff; background: #c0c0c0; }
.brand { display: flex; align-items: baseline; gap: 2px; font-weight: 600; font-size: 1rem; letter-spacing: -0.01em; white-space: nowrap; }
.brand .dim { color: var(--m-text-faint); font-weight: 500; }
.topbar-spacer { flex: 1; min-width: 4px; }
#mode-chip {
  font-size: 0.68rem; font-weight: 600; color: var(--m-accent);
  background: var(--m-accent-soft); border-radius: 999px; padding: 3px 9px;
  white-space: nowrap; max-width: 130px; overflow: hidden; text-overflow: ellipsis;
}
html[data-theme="retro"] #mode-chip { border-radius: 0; border: 1px solid var(--m-border); }

.icon-btn {
  width: 38px; height: 38px; flex: none;
  display: grid; place-items: center;
  border-radius: var(--m-radius-sm);
  color: var(--m-text-muted);
  transition: var(--m-transition);
  position: relative;
}
.icon-btn:hover { color: var(--m-text); background: var(--m-surface2); }
.icon-btn svg { width: 20px; height: 20px; }
html[data-theme="retro"] .icon-btn { border: 2px solid; border-color: #fff #808080 #808080 #fff; background: #c0c0c0; width: 34px; height: 34px; }
html[data-theme="retro"] .icon-btn:active { border-color: #808080 #fff #fff #808080; }

/* ---- LCD counters + face ---- */
.hud-cluster { display: flex; align-items: center; gap: 8px; }
.lcd {
  font-family: var(--font-mono); font-weight: 500; font-size: 0.95rem;
  min-width: 62px; text-align: center; padding: 5px 8px;
  border-radius: var(--m-radius-sm);
  background: var(--m-surface);
  box-shadow: var(--m-shadow-in);
  color: var(--m-text);
  font-variant-numeric: tabular-nums;
  display: flex; align-items: center; justify-content: center; gap: 5px;
}
.lcd svg { width: 13px; height: 13px; opacity: 0.6; flex: none; }
.lcd.paused-blink { animation: lcdblink 1.1s step-end infinite; }
@keyframes lcdblink { 50% { color: var(--m-text-faint); } }
html[data-theme="retro"] .lcd {
  background: #000; color: #f00; border: 2px solid; border-color: #808080 #fff #fff #808080;
  letter-spacing: 1.5px; font-weight: 700; box-shadow: none;
}
html[data-theme="retro"] .lcd svg { display: none; }

#face-btn {
  width: 42px; height: 42px; flex: none;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--m-surface);
  box-shadow: var(--m-shadow-out-sm);
  font-size: 1.25rem; line-height: 1;
  transition: transform 120ms ease;
}
#face-btn:active { transform: scale(0.92); box-shadow: var(--m-shadow-in); }
html[data-theme="retro"] #face-btn { border-radius: 0; border: 3px solid; border-color: #fff #808080 #808080 #fff; box-shadow: none; background: #c0c0c0; width: 40px; height: 40px; }
html[data-theme="retro"] #face-btn:active { border-color: #808080 #fff #fff #808080; }

/* ---- Stage (board canvas) ---- */
#stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
#board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: default; }
#board.grabbing { cursor: grabbing; }
#stage.shake { animation: quake 500ms cubic-bezier(0.36, 0.07, 0.19, 0.97); }
@keyframes quake {
  10%, 90% { transform: translate(-2px, 1px); }
  20%, 80% { transform: translate(4px, -2px); }
  30%, 50%, 70% { transform: translate(-7px, 3px); }
  40%, 60% { transform: translate(6px, -3px); }
}
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 45; } /* above the board & end cards, below drawer/sheets */

/* ---- Zoom controls / board info ---- */
#zoomctl {
  position: absolute; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 8px; z-index: 20;
}
#zoomctl .icon-btn { background: var(--m-surface); box-shadow: var(--m-shadow-out-sm); color: var(--m-text-muted); }
#boardinfo {
  position: absolute; left: 12px; bottom: calc(14px + env(safe-area-inset-bottom));
  z-index: 20; display: flex; align-items: center; gap: 6px;
  font-size: 0.7rem; color: var(--m-text-muted);
  background: var(--m-surface); border-radius: 999px; padding: 6px 12px;
  box-shadow: var(--m-shadow-out-sm); max-width: min(62vw, 420px);
  cursor: pointer;
}
#boardinfo .stars { color: var(--m-warn); letter-spacing: 1px; }
#boardinfo .seed { font-family: var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#boardinfo .ng { color: var(--m-ok); font-weight: 600; }
#boardinfo .ng.guessy { color: var(--m-warn); }
html[data-theme="retro"] #boardinfo, html[data-theme="retro"] #zoomctl .icon-btn { border-radius: 0; border: 2px solid; border-color: #fff #808080 #808080 #fff; box-shadow: none; background: #c0c0c0; }

/* ---- Banners (resume / challenge / keyboard hint) ---- */
.banner {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  z-index: 25; display: flex; align-items: center; gap: 10px;
  background: var(--m-surface); border-radius: var(--m-radius);
  box-shadow: var(--m-shadow-out); padding: 10px 14px;
  font-size: 0.8rem; max-width: min(92vw, 480px);
  animation: bannerin 320ms cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes bannerin { from { opacity: 0; transform: translate(-50%, -14px); } }
.banner .b-txt { flex: 1; min-width: 0; }
.banner .b-txt b { font-weight: 600; }
.banner .b-sub { color: var(--m-text-muted); font-size: 0.72rem; margin-top: 1px; }
html[data-theme="retro"] .banner { border-radius: 0; border: 2px solid; border-color: #fff #808080 #808080 #fff; box-shadow: 3px 3px 0 rgba(0,0,0,0.25); }

/* ---- Buttons ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px 16px; border-radius: var(--m-radius-sm);
  font-size: 0.85rem; font-weight: 600;
  background: var(--m-surface); color: var(--m-text);
  box-shadow: var(--m-shadow-out-sm);
  transition: var(--m-transition);
  white-space: nowrap;
}
.btn:hover { color: var(--m-accent); }
.btn:active { box-shadow: var(--m-shadow-in); transform: translateY(1px); }
.btn.primary { background: var(--m-accent); color: #fff; }
.btn.primary:hover { color: #fff; filter: brightness(1.08); }
.btn.danger { color: var(--m-danger); }
.btn.small { padding: 6px 11px; font-size: 0.75rem; }
.btn.ghost { box-shadow: none; background: transparent; color: var(--m-text-muted); }
.btn.ghost:hover { background: var(--m-surface2); color: var(--m-text); }
.btn:disabled { opacity: 0.45; pointer-events: none; }
html[data-theme="retro"] .btn { border: 2px solid; border-color: #fff #808080 #808080 #fff; box-shadow: none; background: #c0c0c0; font-weight: 400; }
html[data-theme="retro"] .btn:active { border-color: #808080 #fff #fff #808080; transform: none; }
html[data-theme="retro"] .btn.primary { background: #000080; color: #fff; }

/* ---- Drawer nav ---- */
#scrim {
  position: fixed; inset: 0; z-index: 40; background: var(--m-overlay);
  opacity: 0; pointer-events: none; transition: opacity 200ms ease;
  backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
}
#scrim.open { opacity: 1; pointer-events: auto; }
#drawer {
  position: fixed; top: 0; bottom: 0; left: 0; z-index: 50;
  width: min(300px, 84vw);
  background: var(--m-surface);
  box-shadow: var(--m-shadow-out);
  transform: translateX(-105%);
  transition: transform 240ms cubic-bezier(0.16, 1, 0.3, 1);
  display: flex; flex-direction: column;
  padding: calc(14px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));
  overflow-y: auto;
}
#drawer.open { transform: translateX(0); }
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 8px 12px; }
.drawer-head .brand { font-size: 1.05rem; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 12px; border-radius: var(--m-radius-sm);
  font-size: 0.88rem; font-weight: 500; color: var(--m-text-muted);
  transition: var(--m-transition); width: 100%; text-align: left;
}
.nav-item:hover { background: var(--m-surface2); color: var(--m-text); }
.nav-item.active { color: var(--m-accent); background: var(--m-accent-soft); }
.nav-item svg { width: 18px; height: 18px; flex: none; }
.nav-item .n-badge { margin-left: auto; font-size: 0.62rem; font-weight: 700; background: var(--m-accent); color: #fff; border-radius: 999px; padding: 2px 7px; }
.nav-sep { height: 1px; background: var(--m-border-soft); margin: 8px 10px; flex: none; }
.drawer-foot { margin-top: auto; padding: 10px 8px 0; font-size: 0.68rem; color: var(--m-text-faint); display: flex; align-items: center; gap: 7px; }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--m-text-faint); flex: none; }
.sync-dot.connected { background: var(--m-ok); }
.sync-dot.connecting { background: var(--m-warn); animation: pulse 1.2s ease infinite; }
.sync-dot.error { background: var(--m-danger); }
@keyframes pulse { 50% { opacity: 0.35; } }
html[data-theme="retro"] #drawer { border-right: 2px solid; border-color: #fff #808080 #808080 #fff; box-shadow: none; }

/* ---- Sheets (panels) ---- */
#sheet-wrap {
  position: fixed; inset: 0; z-index: 60;
  display: none; align-items: flex-end; justify-content: center;
}
#sheet-wrap.open { display: flex; }
#sheet-scrim { position: absolute; inset: 0; background: var(--m-overlay); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
#sheet {
  position: relative; z-index: 1;
  width: 100%; max-width: 620px;
  max-height: calc(100% - 40px - env(safe-area-inset-top));
  background: var(--m-surface);
  border-radius: var(--m-radius) var(--m-radius) 0 0;
  box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.18);
  display: flex; flex-direction: column;
  animation: sheetup 260ms cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes sheetup { from { transform: translateY(40px); opacity: 0; } }
@media (min-width: 700px) {
  #sheet-wrap { align-items: center; }
  #sheet { border-radius: var(--m-radius); max-height: calc(100% - 80px); }
}
.sheet-head {
  display: flex; align-items: center; gap: 10px;
  padding: 16px 18px 12px; flex: none;
}
.sheet-head h2 { font-size: 1.05rem; font-weight: 600; flex: 1; letter-spacing: -0.01em; }
.sheet-body { overflow-y: auto; padding: 0 18px calc(20px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
html[data-theme="retro"] #sheet { border: 2px solid; border-color: #fff #808080 #808080 #fff; border-radius: 0; }
html[data-theme="retro"] .sheet-head { background: linear-gradient(90deg, #000080, #1084d0); color: #fff; padding: 6px 10px; margin: 2px; }
html[data-theme="retro"] .sheet-head h2 { font-size: 0.85rem; color: #fff; }
html[data-theme="retro"] .sheet-head .icon-btn { width: 24px; height: 24px; color: #000; }

/* ---- Form bits ---- */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 0.72rem; font-weight: 600; color: var(--m-text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
.field input[type="text"], .field input[type="number"], .field select, .field input[type="password"] {
  width: 100%; padding: 10px 12px;
  background: var(--m-bg2); border: 1px solid transparent;
  border-radius: var(--m-radius-sm);
  box-shadow: var(--m-shadow-in);
  outline: none; transition: var(--m-transition);
}
.field input:focus, .field select:focus { border-color: var(--m-accent); }
html[data-theme="retro"] .field input, html[data-theme="retro"] .field select { background: #fff; border: 2px solid; border-color: #808080 #fff #fff #808080; box-shadow: none; }
.field .hint { font-size: 0.7rem; color: var(--m-text-faint); margin-top: 5px; line-height: 1.45; }
.row { display: flex; gap: 10px; align-items: center; }
.row > * { flex: 1; min-width: 0; }
.row > .flex-none { flex: none; }

/* Segmented control */
.seg { display: flex; background: var(--m-bg2); border-radius: var(--m-radius-sm); padding: 3px; box-shadow: var(--m-shadow-in); gap: 2px; flex-wrap: wrap; }
.seg button {
  flex: 1; padding: 7px 8px; border-radius: calc(var(--m-radius-sm) - 3px);
  font-size: 0.76rem; font-weight: 600; color: var(--m-text-muted);
  transition: var(--m-transition); white-space: nowrap; min-width: 52px;
}
.seg button.on { background: var(--m-surface); color: var(--m-accent); box-shadow: var(--m-shadow-out-sm); }
html[data-theme="retro"] .seg { box-shadow: none; border: 1px solid var(--m-border); }
html[data-theme="retro"] .seg button.on { border: 2px solid; border-color: #808080 #fff #fff #808080; box-shadow: none; background: #d4d4d4; }

/* Toggle switch */
.toggle-row { display: flex; align-items: center; gap: 12px; padding: 10px 2px; }
.toggle-row .t-txt { flex: 1; min-width: 0; }
.toggle-row .t-title { font-size: 0.85rem; font-weight: 500; }
.toggle-row .t-sub { font-size: 0.7rem; color: var(--m-text-faint); margin-top: 1px; line-height: 1.4; }
.toggle { position: relative; width: 44px; height: 26px; flex: none; border-radius: 999px; background: var(--m-bg2); box-shadow: var(--m-shadow-in); transition: var(--m-transition); }
.toggle::after {
  content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
  border-radius: 50%; background: var(--m-surface); box-shadow: var(--m-shadow-out-sm);
  transition: var(--m-transition);
}
.toggle.on { background: var(--m-accent); }
.toggle.on::after { transform: translateX(18px); background: #fff; }
html[data-theme="retro"] .toggle { border-radius: 0; border: 2px solid; border-color: #808080 #fff #fff #808080; box-shadow: none; background: #fff; }
html[data-theme="retro"] .toggle::after { border-radius: 0; border: 1px solid #808080; }
html[data-theme="retro"] .toggle.on { background: #000080; }

/* Section titles inside sheets */
.sec-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--m-text-faint); margin: 20px 0 8px; }
.sec-title:first-child { margin-top: 6px; }

/* ---- Preset difficulty cards ---- */
.preset-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.preset-card {
  padding: 13px 14px; border-radius: var(--m-radius);
  background: var(--m-surface); box-shadow: var(--m-shadow-out-sm);
  text-align: left; transition: var(--m-transition);
  border: 1px solid transparent;
}
.preset-card:hover { border-color: var(--m-accent); }
.preset-card.on { border-color: var(--m-accent); background: var(--m-accent-soft); }
.preset-card .p-name { font-weight: 600; font-size: 0.9rem; }
.preset-card .p-sub { font-size: 0.7rem; color: var(--m-text-muted); margin-top: 2px; }
.preset-card .p-best { font-size: 0.68rem; color: var(--m-accent); margin-top: 5px; font-family: var(--font-mono); }
html[data-theme="retro"] .preset-card { border: 2px solid; border-color: #fff #808080 #808080 #fff; box-shadow: none; border-radius: 0; }
html[data-theme="retro"] .preset-card.on { background: #d5e2f2; }

/* ---- Leaderboard ---- */
.lb-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin: 0 -18px; padding-left: 18px; padding-right: 18px; scrollbar-width: none; }
.lb-tabs::-webkit-scrollbar { display: none; }
.lb-tab { flex: none; font-size: 0.72rem; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: var(--m-bg2); color: var(--m-text-muted); }
.lb-tab.on { background: var(--m-accent); color: #fff; }
html[data-theme="retro"] .lb-tab { border-radius: 0; border: 1px solid var(--m-border); }
.lb-list { margin-top: 6px; }
.lb-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: var(--m-radius-sm);
  font-size: 0.82rem;
}
.lb-row:nth-child(odd) { background: var(--m-bg2); }
.lb-row.me { outline: 1.5px solid var(--m-accent); }
.lb-rank { width: 26px; text-align: center; font-weight: 700; color: var(--m-text-faint); font-size: 0.78rem; flex: none; }
.lb-rank.r1 { color: var(--m-gold); } .lb-rank.r2 { color: var(--m-text-muted); } .lb-rank.r3 { color: var(--rust-lightest); }
.lb-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.lb-val { font-family: var(--font-mono); font-size: 0.78rem; color: var(--m-text-muted); flex: none; }
.lb-val b { color: var(--m-text); font-weight: 600; }
.lb-tag { font-size: 0.6rem; padding: 1px 6px; border-radius: 999px; background: var(--m-surface3); color: var(--m-text-muted); flex: none; }
.lb-empty { text-align: center; color: var(--m-text-faint); font-size: 0.8rem; padding: 26px 10px; line-height: 1.5; }

/* ---- Stats ---- */
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat-card { padding: 12px; border-radius: var(--m-radius); background: var(--m-bg2); box-shadow: var(--m-shadow-in); text-align: center; }
.stat-card .s-val { font-size: 1.15rem; font-weight: 700; font-family: var(--font-mono); color: var(--m-accent); }
.stat-card .s-lbl { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--m-text-faint); margin-top: 3px; }
.mini-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
.mini-table th { text-align: left; font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--m-text-faint); padding: 6px 8px; font-weight: 600; }
.mini-table td { padding: 7px 8px; border-top: 1px solid var(--m-border-soft); font-family: var(--font-mono); font-size: 0.74rem; }
.mini-table td:first-child { font-family: var(--font-body); font-weight: 500; }
.graph-canvas { width: 100%; height: 150px; border-radius: var(--m-radius-sm); background: var(--m-bg2); box-shadow: var(--m-shadow-in); }
.heat-canvas { width: 100%; border-radius: var(--m-radius-sm); background: var(--m-bg2); box-shadow: var(--m-shadow-in); }

/* ---- Overlays: pause / end ---- */
.center-overlay {
  position: absolute; inset: 0; z-index: 26;
  display: flex; align-items: center; justify-content: center;
  background: var(--m-overlay);
  backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
  animation: fadein 220ms ease;
  padding: 20px;
}
@keyframes fadein { from { opacity: 0; } }
.center-card {
  background: var(--m-surface); border-radius: var(--m-radius);
  box-shadow: var(--m-shadow-out); padding: 26px 26px 22px;
  width: min(430px, 94vw); max-height: 100%; overflow-y: auto;
  text-align: center;
  animation: cardpop 320ms cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes cardpop { from { transform: scale(0.92) translateY(12px); opacity: 0; } }
.center-card h2 { font-size: 1.35rem; letter-spacing: -0.02em; margin-bottom: 4px; }
.center-card .sub { color: var(--m-text-muted); font-size: 0.8rem; margin-bottom: 14px; }
.center-card .big-emoji { font-size: 2.6rem; margin-bottom: 8px; }
.end-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.end-stats .es { background: var(--m-bg2); border-radius: var(--m-radius-sm); padding: 9px 6px; box-shadow: var(--m-shadow-in); }
.end-stats .es b { display: block; font-family: var(--font-mono); font-size: 0.95rem; color: var(--m-accent); }
.end-stats .es span { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--m-text-faint); }
.end-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
.recap-verdict { font-size: 0.78rem; line-height: 1.5; background: var(--m-bg2); border-radius: var(--m-radius-sm); padding: 10px 12px; margin: 10px 0 2px; text-align: left; box-shadow: var(--m-shadow-in); }
.recap-verdict b { color: var(--m-danger); }
.recap-verdict.was-safe b { color: var(--m-warn); }
.recap-verdict.forced b { color: var(--m-ok); }
html[data-theme="retro"] .center-card { border-radius: 0; border: 2px solid; border-color: #fff #808080 #808080 #fff; }

/* ---- Toasts ---- */
#toasts { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: max-content; max-width: 92vw; }
.toast {
  background: var(--m-text); color: var(--m-bg);
  font-size: 0.78rem; font-weight: 500; padding: 9px 16px; border-radius: 999px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.22);
  animation: toastin 260ms cubic-bezier(0.16, 1, 0.3, 1);
  max-width: 92vw; text-align: center;
}
.toast.out { opacity: 0; transform: translateY(8px); transition: 300ms ease; }
@keyframes toastin { from { opacity: 0; transform: translateY(10px); } }
html[data-theme="retro"] .toast { border-radius: 0; }

/* ---- Story mode ---- */
.story-beat { font-size: 0.86rem; line-height: 1.65; color: var(--m-text); background: var(--m-bg2); border-left: 3px solid var(--m-accent); padding: 12px 14px; border-radius: 0 var(--m-radius-sm) var(--m-radius-sm) 0; margin: 10px 0; font-style: italic; }
.chapter-row { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: var(--m-radius-sm); transition: var(--m-transition); width: 100%; text-align: left; }
.chapter-row:hover { background: var(--m-surface2); }
.chapter-row .ch-num { width: 30px; height: 30px; border-radius: 50%; background: var(--m-bg2); box-shadow: var(--m-shadow-in); display: grid; place-items: center; font-size: 0.72rem; font-weight: 700; color: var(--m-text-muted); flex: none; }
.chapter-row.done .ch-num { background: var(--m-ok); color: #fff; box-shadow: none; }
.chapter-row.locked { opacity: 0.45; pointer-events: none; }
.chapter-row .ch-t { flex: 1; min-width: 0; }
.chapter-row .ch-title { font-weight: 600; font-size: 0.85rem; }
.chapter-row .ch-sub { font-size: 0.68rem; color: var(--m-text-faint); }

/* ---- Roguelike ---- */
.rogue-hud { display: flex; gap: 8px; margin-bottom: 12px; }
.rogue-stage-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--m-bg2); box-shadow: var(--m-shadow-in); }
.rogue-stage-dot.done { background: var(--m-ok); box-shadow: none; }
.rogue-stage-dot.cur { background: var(--m-accent); box-shadow: none; animation: pulse 1.4s ease infinite; }

/* ---- Tournament bracket ---- */
.bracket { display: flex; gap: 18px; overflow-x: auto; padding: 8px 2px 14px; }
.b-col { display: flex; flex-direction: column; justify-content: space-around; gap: 12px; min-width: 150px; }
.b-match { background: var(--m-bg2); border-radius: var(--m-radius-sm); box-shadow: var(--m-shadow-in); overflow: hidden; font-size: 0.76rem; }
.b-p { display: flex; justify-content: space-between; gap: 8px; padding: 7px 10px; }
.b-p + .b-p { border-top: 1px solid var(--m-border-soft); }
.b-p.win { background: var(--m-ok-soft); font-weight: 600; }
.b-p .b-s { font-family: var(--font-mono); color: var(--m-text-muted); }
.b-round-lbl { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--m-text-faint); text-align: center; }

/* ---- Keycap ---- */
.kbd { display: inline-block; font-family: var(--font-mono); font-size: 0.68rem; padding: 2px 7px; border-radius: 5px; background: var(--m-bg2); box-shadow: var(--m-shadow-out-sm); color: var(--m-text-muted); min-width: 24px; text-align: center; }
html[data-theme="retro"] .kbd { border: 1px solid var(--m-border); box-shadow: none; border-radius: 0; }

/* ---- Help ---- */
.help-block { font-size: 0.8rem; line-height: 1.6; color: var(--m-text-muted); }
.help-block h4 { font-size: 0.8rem; color: var(--m-text); margin: 14px 0 4px; }

/* ---- Login card ---- */

.login-msg { font-size: 0.75rem; color: var(--m-danger); min-height: 1.2em; text-align: center; margin-top: 8px; }

/* ---- Confetti burst helper (DOM sparkles for small celebrations) ---- */
@keyframes sparkfly { to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; } }

/* ---- Responsive topbar ---- */
@media (max-width: 560px) { #mode-chip { display: none; } }
@media (max-width: 470px) {
  .brand .dim { display: none; }
  .lcd { min-width: 54px; font-size: 0.85rem; padding: 5px 6px; }
}
@media (max-width: 392px) { #pause-btn { display: none; } }

.faint { color: var(--m-text-faint); }
.mono { font-family: var(--font-mono); }
.hidden { display: none !important; }
.spin { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

<script>
(() => {
'use strict';
/* ============================================
   §01 UTILITIES
   ============================================ */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// Tiny DOM builder: h('button.btn.primary', {onclick: fn, title: 'x'}, 'Go')
function h(tag, attrs, ...kids) {
  const [name, ...classes] = tag.split('.');
  const el = document.createElement(name || 'div');
  if (classes.length) el.className = classes.join(' ');
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null) continue;
    if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k in el && k !== 'list' && typeof v !== 'string') el[k] = v;
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(20)) {
    if (kid == null || kid === false) continue;
    el.appendChild(typeof kid === 'string' || typeof kid === 'number' ? document.createTextNode(String(kid)) : kid);
  }
  return el;
}

const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const throttle = (fn, ms) => {
  let last = 0, t = null;
  return (...a) => {
    const n = Date.now();
    if (n - last >= ms) { last = n; fn(...a); }
    else { clearTimeout(t); t = setTimeout(() => { last = Date.now(); fn(...a); }, ms - (n - last)); }
  };
};

function fmtTimeMs(ms, precise) {
  ms = Math.max(0, ms | 0);
  const cs = Math.floor((ms % 1000) / 10);
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const sec = s % 60;
  if (precise) return (m ? m + ':' + String(sec).padStart(2, '0') : String(sec)) + '.' + String(cs).padStart(2, '0') + 's';
  return m + ':' + String(sec).padStart(2, '0');
}
const fmtInt = n => (n == null || isNaN(n)) ? '—' : Math.round(n).toLocaleString();
const pct = v => Math.round(v * 100) + '%';

// UTC day key — daily challenges must agree across timezones.
function dayKeyUTC(d) {
  d = d || new Date();
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
}
const dayNum = ts => Math.floor(ts / 86400000);

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

/* ---- Seeded RNG (provably fair: board is a pure function of the seed) ---- */
// xmur3 string hash -> 4x32-bit state for mulberry32.
function xmur3(str) {
  let h1 = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h1 = Math.imul(h1 ^ str.charCodeAt(i), 3432918353);
    h1 = (h1 << 13) | (h1 >>> 19);
  }
  return () => {
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507);
    h1 = Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (h1 ^= h1 >>> 16) >>> 0;
  };
}
function mulberry32(a) {
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// rngFor('seed') -> deterministic [0,1) generator
function rngFor(seedStr) { return mulberry32(xmur3(String(seedStr))()); }
function randomSeed() {
  const words = ['dune', 'flux', 'echo', 'nova', 'iris', 'onyx', 'reef', 'vale', 'wisp', 'zeal', 'moss', 'fern', 'clay', 'mist', 'peak', 'cove'];
  const r = Math.random;
  return words[(r() * words.length) | 0] + '-' + words[(r() * words.length) | 0] + '-' + ((r() * 9000 + 1000) | 0);
}

// Short stable hash for leaderboard keys / spec fingerprints.
function hashStr(s) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < s.length; i++) {
    const ch = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(36) + (h1 >>> 0).toString(36);
}

/* ---- base64url JSON (unicode-safe) for share links ---- */
function b64urlEncode(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  let bin = '';
  for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64urlDecode(str) {
  try {
    const b = atob(String(str).replace(/-/g, '+').replace(/_/g, '/'));
    const bytes = new Uint8Array(b.length);
    for (let i = 0; i < b.length; i++) bytes[i] = b.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  } catch { return null; }
}
function bytesToB64(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return btoa(bin);
}
function b64ToBytes(str) {
  const b = atob(str);
  const bytes = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) bytes[i] = b.charCodeAt(i);
  return bytes;
}

/* ---- localStorage wrapper (quota/private-mode safe) ---- */
const store = {
  get(k) { try { return localStorage.getItem('mine-' + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('mine-' + k, v); return true; } catch { return false; } },
  remove(k) { try { localStorage.removeItem('mine-' + k); } catch {} },
  getJSON(k) { const raw = store.get(k); if (raw == null) return null; try { return JSON.parse(raw); } catch { return null; } },
  setJSON(k, v) { return store.set(k, JSON.stringify(v)); },
};

/* ---- Settings ---- */
const SETTINGS_DEFAULTS = {
  theme: 'auto',            // auto | light | dark | retro
  pack: 'auto',             // auto | modern | retro  (board art pack)
  anim: true,               // animations (we deliberately ignore prefers-reduced-motion)
  haptics: true,
  autoPause: true,          // pause when app loses focus
  autoFlag: false,          // auto-flag forced mines (off by default)
  allowUndo: false,         // 1 undo, mine hits only ("with undo" boards)
  noGuess: true,            // generate logic-solvable boards
  practice: false,          // no timer, nothing recorded
  kbHint: true,
  zoomBtns: true,
  ctl: {
    left: 'reveal', right: 'flag', middle: 'smart', dbl: 'none',
    tap: 'reveal', long: 'smartflag', dbltap: 'chord',
  },
  keys: { reveal: 'Space', flag: 'KeyF', chord: 'KeyC', question: 'KeyQ' },
};
const Settings = (() => {
  let data = Object.assign({}, SETTINGS_DEFAULTS, store.getJSON('settings') || {});
  data.ctl = Object.assign({}, SETTINGS_DEFAULTS.ctl, data.ctl || {});
  data.keys = Object.assign({}, SETTINGS_DEFAULTS.keys, data.keys || {});
  const subs = new Set();
  const persist = debounce(() => store.setJSON('settings', data), 150);
  return {
    get: k => k.includes('.') ? k.split('.').reduce((o, p) => o && o[p], data) : data[k],
    set(k, v) {
      if (k.includes('.')) {
        const parts = k.split('.');
        let o = data;
        for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]] = o[parts[i]] || {};
        o[parts[parts.length - 1]] = v;
      } else data[k] = v;
      persist();
      subs.forEach(fn => { try { fn(k, v); } catch (e) { console.error(e); } });
    },
    onChange(fn) { subs.add(fn); return () => subs.delete(fn); },
    all: () => data,
  };
})();

/* ---- Toasts / haptics ---- */
function showToast(msg, ms) {
  const wrap = $('toasts');
  if (!wrap) { console.log('[toast]', msg); return; }
  const t = h('div.toast', {}, msg);
  wrap.appendChild(t);
  while (wrap.children.length > 3) wrap.firstChild.remove();
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 350); }, ms || 2400);
}
function haptic(pattern) {
  if (!Settings.get('haptics')) return;
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch {}
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    try {
      const ta = h('textarea', { style: { position: 'fixed', opacity: 0 } });
      ta.value = text; document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch { return false; }
  }
}

/* ============================================
   §02 CRYPTO — byte-compatible with txt.html / ppc.html.
   Everything that leaves this device for Firebase goes through encryptText;
   the database only ever stores ciphertext.
   Wire format: base64( [magic CA DE 01 00][IV 12][AES-GCM(deflate-raw(text))] )
   Key: PBKDF2(password, salt 'cade.txt-salt', 100k iters, SHA-256) -> AES-GCM 256.
   ============================================ */
async function _compress(bytes) {
  const cs = new CompressionStream('deflate-raw');
  const writer = cs.writable.getWriter();
  writer.write(bytes);
  writer.close();
  const reader = cs.readable.getReader();
  const chunks = [];
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
  }
  let len = 0; for (const c of chunks) len += c.length;
  const out = new Uint8Array(len); let off = 0;
  for (const c of chunks) { out.set(c, off); off += c.length; }
  return out;
}
async function _decompress(bytes) {
  const ds = new DecompressionStream('deflate-raw');
  const writer = ds.writable.getWriter();
  writer.write(bytes);
  writer.close();
  const reader = ds.readable.getReader();
  const chunks = [];
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
  }
  let len = 0; for (const c of chunks) len += c.length;
  const out = new Uint8Array(len); let off = 0;
  for (const c of chunks) { out.set(c, off); off += c.length; }
  return new TextDecoder().decode(out);
}

// PBKDF2 is expensive (100k iterations) — memoize the derived key per password.
const _deriveKeyCache = new Map();
function deriveKey(password) {
  let p = _deriveKeyCache.get(password);
  if (p) return p;
  p = (async () => {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: enc.encode('cade.txt-salt'), iterations: 100000, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['encrypt', 'decrypt']
    );
  })();
  p.catch(() => { if (_deriveKeyCache.get(password) === p) _deriveKeyCache.delete(password); });
  if (_deriveKeyCache.size > 50) _deriveKeyCache.clear();
  _deriveKeyCache.set(password, p);
  return p;
}

const _CRYPT_MAGIC = [0xCA, 0xDE, 0x01, 0x00];
const _MAGIC_LEN = _CRYPT_MAGIC.length;

async function encryptText(text, password) {
  const key = await deriveKey(password);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const plainBytes = await _compress(new TextEncoder().encode(text));
  const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plainBytes);
  const combined = new Uint8Array(_MAGIC_LEN + iv.byteLength + ciphertext.byteLength);
  combined.set(_CRYPT_MAGIC, 0);
  combined.set(iv, _MAGIC_LEN);
  combined.set(new Uint8Array(ciphertext), _MAGIC_LEN + iv.byteLength);
  return bytesToB64(combined);
}

async function decryptText(encoded, password) {
  const key = await deriveKey(password);
  let combined;
  try { combined = b64ToBytes(encoded); } catch { return null; }
  let iv, ciphertext, isCompressed;
  const hasMagic = combined.length >= _MAGIC_LEN &&
    combined[0] === _CRYPT_MAGIC[0] && combined[1] === _CRYPT_MAGIC[1] &&
    combined[2] === _CRYPT_MAGIC[2] && combined[3] === _CRYPT_MAGIC[3];
  if (hasMagic) {
    iv = combined.slice(_MAGIC_LEN, _MAGIC_LEN + 12);
    ciphertext = combined.slice(_MAGIC_LEN + 12);
    isCompressed = true;
  } else if (combined[0] === 0x01) {
    iv = combined.slice(1, 13);
    ciphertext = combined.slice(13);
    isCompressed = true;
  } else {
    iv = combined.slice(0, 12);
    ciphertext = combined.slice(12);
    isCompressed = false;
  }
  try {
    const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
    if (isCompressed) return await _decompress(new Uint8Array(decrypted));
    return new TextDecoder().decode(decrypted);
  } catch {
    return null;
  }
}
/* ============================================
   §03 CONNECT GATE — same scheme as ppc.html.
   The page ships two ciphertexts of the Firebase database URL; either access
   word decodes one. The gate is anti-spam, not high security. A raw
   https://*.firebaseio.com URL pasted directly also works (txt.html style),
   so the page runs against any database.
   Generated by tools/mine-make-login.mjs — regenerate there if the URL or a
   word changes.
   Identity beyond that is a naive, trusted username — no password, no oauth,
   by design (a handful of local players).

  'yt4BACliOsCpBGuQmkKF8uaz8HlSNGBqQWz1kKAHVde4LLEBw4oOqXVSpvCC2F5yrjkz/EnAK6nK0F501watxxuYo7BVC9U3BcMyFF0=',
  'yt4BACjpTmIaep08srDL8AgrOx7i4j38zJQKPkDYZBKVu9DEBn38l+jH5iNlntBnMyxSPi1/tiBDFf631UBjG0OFy5S8Ri1JToUhU+A=',

  url: '',          // firebase database URL (decrypted or pasted)
  encKey: '',       // shared data key, derived from the URL
  name: '',         // display username (naive identity)
  get on() { return !!Cloud.url; },
  get userKey() {

// Accepts an access word OR a pasted firebase URL. Returns true on success.
async function tryConnect(raw) {
  const input = String(raw || '').trim();
  if (!input) return false;
  if (FB_URL_RE.test(input.toLowerCase())) {
    _finalizeCloud(input.toLowerCase());
    return true;
  }
  const word = input.toLowerCase();
  for (const ct of LOGIN_CTS) {
    const dec = await decryptText(ct, word);
    if (dec && FB_URL_RE.test(dec)) {
      _finalizeCloud(dec);
      return true;
    }
  }
  return false;
}

function setUsername(name) {
  const clean = String(name || '').trim().slice(0, 20);
  if (!clean) return false;
  Cloud.name = clean;
  store.set('user', clean);
  const foot = $('user-foot');
  if (foot) foot.textContent = clean;
  return true;
}

function cloudDisconnect() {
  Cloud.url = '';
  Cloud.encKey = '';
  store.remove('fb-url');
  teardownFirebase();
  setSyncUI('', 'Sync off');
}

function restoreCloudSession() {
  const savedUrl = store.get('fb-url');
  if (savedUrl && FB_URL_RE.test(savedUrl)) {
    Cloud.url = savedUrl.replace(/\/+$/, '');
    Cloud.encKey = Cloud.url + '|mine1';
  }
  const savedUser = store.get('user');
  if (savedUser) Cloud.name = savedUser;

/* ============================================
   §04 FIREBASE CORE — sync only at defined points.
   No realtime listeners: the game reads/writes on demand (daily fetch,
   leaderboard view, game finish) and drops the socket after a short idle,
   so practicing / pausing never touches the network. Failed writes queue
   locally and flush on reconnect.
   Data lives under rooms/__mine so the existing DB rules cover it.
   ============================================ */
const MINE_BASE = 'rooms/__mine';
let db = null;
let _fbApp = null;
let _fbAppSeq = 0;
let _fbIdleTimer = null;
let _fbBusy = 0;

function setSyncUI(status, text) {
  const dot = $('sync-dot');
  if (dot) dot.className = 'sync-dot' + (status ? ' ' + status : '');
  const foot = $('sync-foot');
  if (foot) foot.textContent = text || '';
}

function teardownFirebase() {
  clearTimeout(_fbIdleTimer);
  if (_fbApp) { try { _fbApp.delete().catch(() => {}); } catch {} }
  _fbApp = null;
  db = null;
}

function ensureDb() {
  if (!Cloud.on) throw new Error('not connected');
  if (typeof firebase === 'undefined' || typeof firebase.initializeApp !== 'function' || typeof firebase.database !== 'function') {
    throw new Error('sync library not loaded (offline?) — try again once online');
  }
  if (db) return db;
  const appName = 'mine-' + (++_fbAppSeq);
  const app = firebase.initializeApp({ databaseURL: Cloud.url }, appName);
  try {
    db = firebase.database(app);
  } catch (e) {
    try { app.delete().catch(() => {}); } catch {}
    throw e;
  }
  _fbApp = app;
  return db;
}

function _fbScheduleIdle() {
  clearTimeout(_fbIdleTimer);
  _fbIdleTimer = setTimeout(() => {
    if (_fbBusy > 0) { _fbScheduleIdle(); return; }
    if (db) { try { db.goOffline(); } catch {} }
    setSyncUI('', 'Idle');
  }, 25000);
}

// Run one sync operation: connect on demand, 12s timeout, then idle out.
async function fbOp(label, fn) {
  const database = ensureDb();
  try { database.goOnline(); } catch {}
  _fbBusy++;
  setSyncUI('connecting', 'Syncing…');
  try {
    const out = await withTimeout(fn(database), 15000, label);
    setSyncUI('connected', 'Synced');
    return out;
  } catch (e) {
    setSyncUI(navigator.onLine ? 'error' : '', navigator.onLine ? 'Sync error' : 'Offline');
    throw e;
  } finally {
    _fbBusy--;
    _fbScheduleIdle();
  }
}

const ref = (database, rel) => database.ref(MINE_BASE + '/' + rel);

// Encrypted node helpers — every value stored on Firebase is ciphertext.
async function encGet(rel) {
  return fbOp('read ' + rel, async database => {
    const snap = await ref(database, rel).once('value');
    const val = snap.val();
    if (typeof val !== 'string') return null;
    const dec = await decryptText(val, Cloud.encKey);
    if (dec == null) return null;
    try { return JSON.parse(dec); } catch { return null; }
  });
}
async function encGetChildren(rel) {
  // returns {childKey: decodedObj} for one level of encrypted children
  return fbOp('read ' + rel, async database => {
    const snap = await ref(database, rel).once('value');
    const val = snap.val();
    if (!val || typeof val !== 'object') return {};
    const out = {};
    for (const [k, v] of Object.entries(val)) {
      if (typeof v !== 'string') continue;
      const dec = await decryptText(v, Cloud.encKey);
      if (dec == null) continue;
      try { out[k] = JSON.parse(dec); } catch {}
    }
    return out;
  });
}
async function encSet(rel, obj) {
  const enc = await encryptText(JSON.stringify(obj), Cloud.encKey);
  return fbOp('write ' + rel, database => ref(database, rel).set(enc));
}

/* ---- Offline queue: finished games sync when the network returns ---- */
const PENDING_KEY = 'pending-sync';
function queuePending(op) {
  const q = store.getJSON(PENDING_KEY) || [];
  q.push(op);
  while (q.length > 120) q.shift();
  store.setJSON(PENDING_KEY, q);
  setSyncUI('', 'Queued (offline)');
}
let _flushing = false;
async function flushPending() {
  if (_flushing || !Cloud.on || !navigator.onLine) return;
  const q = store.getJSON(PENDING_KEY) || [];
  if (!q.length) return;
  _flushing = true;
  try {
    while (q.length) {
      const op = q[0];
      await runSyncOp(op);           // throws on failure -> stop, keep queue
      q.shift();
      store.setJSON(PENDING_KEY, q);
    }
    showToast('Offline results synced');
  } catch {} finally {
    _flushing = false;
  }
}
window.addEventListener('online', () => { flushPending().catch(() => {}); });
/* ============================================

    '00001110000',
    '00001110000',
    '11111111111',
    '01111111110',
    '00111111100',
    '00111111100',
    '01111011110',
    '01110001110',
    '11000000011',
    '10000000001',
  ],
  invader: [

    '00010001000',
    '00111111100',
    '01101110110',
    '11111111111',
    '10111111101',
    '10100000101',
    '00011011000',

const SHAPES = {

  circle:    { label: 'Circle', kind: 'fn', aw: 1, ah: 1,

  diamond:   { label: 'Diamond', kind: 'fn', aw: 1, ah: 1,
               fn: (u, v) => Math.abs(u - 0.5) + Math.abs(v - 0.5) <= 0.5 },
  ring:      { label: 'Ring', kind: 'fn', aw: 1, ah: 1,
               fn: (u, v) => { const d = (u - 0.5) ** 2 + (v - 0.5) ** 2; return d <= 0.25 && d >= 0.055; } },
  heart:     { label: 'Heart', kind: 'fn', aw: 1, ah: 0.92,
               fn: (u, v) => {
                 const x = (u - 0.5) * 2.45, y = (0.42 - v) * 2.45 + 0.28;
                 const a = x * x + y * y - 1;
                 return a * a * a - x * x * y * y * y <= 0;

  swiss:     { label: 'Swiss cheese', kind: 'fn', aw: 1, ah: 1, seeded: true,
               fn: (u, v, ctx) => {

  skull:     { label: 'Skull', kind: 'px', px: SHAPE_PX.skull },
  cat:       { label: 'Cat', kind: 'px', px: SHAPE_PX.cat },

  invader:   { label: 'Invader', kind: 'px', px: SHAPE_PX.invader },

function shapeAccepts(sh, u, v, ctx) {

// Suggested board dims for a shape at a size notch (so pixel art stays crisp).
function shapeDims(sh, notch) {
  const def = SHAPES[sh] || SHAPES[''];
  if (def.kind === 'px') {
    const k = [2, 3, 4][notch] || 2;
    return { w: def.px[0].length * k, h: def.px.length * k };
  }
  const base = [[14, 14], [20, 20], [28, 28]][notch] || [14, 14];

function buildGrid(spec) {
  const g = spec.g || 'sq';
  const w = Math.max(2, spec.w | 0), hh = Math.max(2, spec.h | 0);
  const torus = g === 'sq' && !!spec.t && !spec.sh;
  const sh = spec.sh || '';
  const ctx = { seed: spec.s || '', w, h: hh };
  let raw = [];   // {cx, cy, verts, c, r}

  if (g === 'sq') {
    for (let r = 0; r < hh; r++) {
      for (let c = 0; c < w; c++) {
        if (sh && !shapeAccepts(sh, (c + 0.5) / w, (r + 0.5) / hh, ctx)) continue;
        raw.push({
          cx: c + 0.5, cy: r + 0.5, c, r,
          verts: [[c, r], [c + 1, r], [c + 1, r + 1], [c, r + 1]],
        });
      }
    }
  } else if (g === 'hex') {
    const R = HEX_R;
    for (let r = 0; r < hh; r++) {
      for (let c = 0; c < w; c++) {
        if (sh && !shapeAccepts(sh, (c + 0.5 * (r & 1) + 0.5) / (w + 0.5), (r + 0.5) / hh, ctx)) continue;
        const cx = SQRT3 * R * (c + 0.5 * (r & 1)) + SQRT3 * R * 0.5;
        const cy = 1.5 * R * r + R;
        const verts = [];
        for (let k = 0; k < 6; k++) {
          const a = Math.PI / 180 * (60 * k - 30);
          verts.push([cx + R * Math.cos(a), cy + R * Math.sin(a)]);
        }
        raw.push({ cx, cy, c, r, verts });
      }
    }
  } else if (g === 'tri') {
    const s = TRI_S, hw = s / 2, ht = s * SQRT3 / 2;
    for (let r = 0; r < hh; r++) {
      for (let c = 0; c < w; c++) {
        if (sh && !shapeAccepts(sh, (c + 1) / (w + 1), (r + 0.5) / hh, ctx)) continue;
        const up = ((c + r) & 1) === 0;
        const verts = up
          ? [[c * hw, (r + 1) * ht], [(c + 2) * hw, (r + 1) * ht], [(c + 1) * hw, r * ht]]
          : [[c * hw, r * ht], [(c + 2) * hw, r * ht], [(c + 1) * hw, (r + 1) * ht]];
        const cx = (verts[0][0] + verts[1][0] + verts[2][0]) / 3;
        const cy = (verts[0][1] + verts[1][1] + verts[2][1]) / 3;

  const KS = 6; // key resolution: 1/6 world unit; min distinct-vertex gap is ~0.5
  const keyOf = (x, y) => {
    let kx = Math.round(x * KS), ky = Math.round(y * KS);
    if (torus) {
      const mx = w * KS, my = hh * KS;
      kx = ((kx % mx) + mx) % mx;
      ky = ((ky % my) + my) % my;

    return kx + ',' + ky;

    const vmap = new Map();
    cellsArr.forEach((cell, i) => {
      for (const [x, y] of cell.verts) {
        const k = keyOf(x, y);
        let list = vmap.get(k);
        if (!list) vmap.set(k, list = []);
        list.push(i);
      }
    });
    const sets = cellsArr.map(() => new Set());
    for (const list of vmap.values()) {
      for (let a = 0; a < list.length; a++) {
        for (let b = 0; b < list.length; b++) {
          if (list[a] !== list[b]) sets[list[a]].add(list[b]);
        }
      }

    return sets.map(s => [...s]);
  };

  let nbrs = buildNbrs(raw);

  // ---- Keep only the largest connected component (masks can split boards) ----
  if (sh) {
    const seen = new Int32Array(raw.length).fill(-1);
    let bestComp = -1, bestSize = 0, compCount = 0;
    for (let i = 0; i < raw.length; i++) {
      if (seen[i] !== -1) continue;
      const comp = compCount++;
      let size = 0;
      const stack = [i];
      seen[i] = comp;
      while (stack.length) {
        const cur = stack.pop();
        size++;
        for (const nb of nbrs[cur]) if (seen[nb] === -1) { seen[nb] = comp; stack.push(nb); }
      }
      if (size > bestSize) { bestSize = size; bestComp = comp; }
    }
    if (compCount > 1) {
      const keep = [];
      const remap = new Int32Array(raw.length).fill(-1);
      for (let i = 0; i < raw.length; i++) {
        if (seen[i] === bestComp) { remap[i] = keep.length; keep.push(raw[i]); }
      }
      raw = keep;
      nbrs = buildNbrs(raw);
    }
  }

  // ---- Finalize cells + bbox ----
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const cells = raw.map((cell, i) => {
    for (const [x, y] of cell.verts) {
      if (x < x0) x0 = x; if (y < y0) y0 = y;
      if (x > x1) x1 = x; if (y > y1) y1 = y;
    }
    return { i, cx: cell.cx, cy: cell.cy, c: cell.c, r: cell.r, up: cell.up, verts: cell.verts, nbrs: nbrs[i] };
  });

  return {
    cells,
    bbox: { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 },
    torus,
    grid: g,
    hit: buildSpatialIndex(cells),

}

/* ---- Hit testing ---- */
function pointInPoly(px, py, verts) {
  let inside = false;
  for (let i = 0, j = verts.length - 1; i < verts.length; j = i++) {
    const xi = verts[i][0], yi = verts[i][1], xj = verts[j][0], yj = verts[j][1];
    if ((yi > py) !== (yj > py) && px < ((xj - xi) * (py - yi)) / (yj - yi) + xi) inside = !inside;
