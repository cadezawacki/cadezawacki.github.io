function connectPrompt(body, why) {
  body.appendChild(h('div.lb-empty', {}, why || 'Connect to sync scores with the others.'));
  const input = h('input', { type: 'text', placeholder: 'access word · or paste a firebase URL', spellcheck: false, autocomplete: 'off' });
  const msg = h('div.login-msg');
  const nameIn = h('input', { type: 'text', placeholder: 'your name (shown on boards)', value: Cloud.name || '', maxlength: 20 });
  body.appendChild(h('div.login-glyph', {}, '🔐'));
  body.appendChild(fieldRow('Access', input));
  body.appendChild(fieldRow('Username', nameIn, 'Naive by design: no password — this crew trusts each other.'));
  body.appendChild(msg);
  body.appendChild(h('div.row', {}, h('button.btn.primary', {
    onclick: async ev => {
      const btn = ev.currentTarget;
      btn.disabled = true; btn.textContent = 'checking…';
      const ok = await tryConnect(input.value);
      btn.disabled = false; btn.textContent = 'Connect';
      if (!ok) { msg.textContent = 'That\'s not it'; haptic(30); return; }
      if (!setUsername(nameIn.value)) { msg.textContent = 'Pick a name first'; return; }
      setSyncUI('', 'Idle');
      showToast('Connected as ' + Cloud.name);
      try { await CloudGame.pullProfile(); } catch {}
      flushPending().catch(() => {});
      openPanel(currentPanel || 'ranks');
    },
  }, 'Connect')));
}

let currentPanel = null;
let currentLb = 'alltime';
function panelRanks(body) {
  if (!Cloud.on || !Cloud.userKey) { connectPrompt(body, 'Leaderboards live on the shared board. Connect once and your finished games sync automatically — even ones finished offline.'); return; }
  const tabs = h('div.lb-tabs');
  const list = h('div.lb-list');
  const boards = [
    ['alltime', 'All-time'], ['alltime-undo', 'With undo'],
    ['easy', 'Easy'], ['medium', 'Medium'], ['hard', 'Hard'], ['extreme', 'Extreme'],
    ['daily:' + dayKeyUTC(), 'Today'], ['rogue', 'Rogue'],
  ];
  if (G && G.spec.st != null && !boards.some(b => b[0] === 'seed:' + specFingerprint(G.spec))) {
    boards.push(['seed:' + specFingerprint(G.spec), 'This board']);
  }
  const load = async id => {
    currentLb = id;
    [...tabs.children].forEach(t => t.classList.toggle('on', t.dataset.v === id));
    list.innerHTML = '';
    list.appendChild(h('div.lb-empty', {}, 'Fetching…'));
    try {
      const rows = await CloudGame.fetchLeaderboard(id);
      list.innerHTML = '';
      if (!rows.length) { list.appendChild(h('div.lb-empty', {}, 'Nobody yet. Be the first name on this board.')); return; }
      renderLbRows(list, id, rows);
    } catch (e) {
      list.innerHTML = '';
      list.appendChild(h('div.lb-empty', {}, navigator.onLine ? 'Could not fetch — try again.' : 'Offline — leaderboards need a connection.'));
    }
  };
  for (const [id, label] of boards) {
    tabs.appendChild(h('button.lb-tab', { dataset: { v: id }, onclick: () => load(id) }, label));
  }
  body.appendChild(tabs);
  body.appendChild(list);
  load(boards.some(b => b[0] === currentLb) ? currentLb : 'alltime');
}
function renderLbRows(list, id, rows) {
  const timeBoard = LB_TIME_BOARDS.has(id);
  rows.forEach((row, idx) => {
    const isMe = row.key === Cloud.userKey;
    list.appendChild(h('div.lb-row' + (isMe ? '.me' : ''), {},
      h('span.lb-rank' + (idx < 3 ? '.r' + (idx + 1) : ''), {}, idx < 3 ? ['🥇', '🥈', '🥉'][idx] : String(idx + 1)),
      h('span.lb-name', {}, row.u || row.key),
      row.un > 0 ? h('span.lb-tag', {}, row.un + ' undo') : null,
      id === 'rogue' ? h('span.lb-tag', {}, (row.w || 0) + ' stages') : (row.w === 0 ? h('span.lb-tag', {}, 'partial') : null),
      h('span.lb-val', {}, timeBoard
        ? h('b', {}, fmtTimeMs(row.t, true))
        : [h('b', {}, fmtInt(row.s)), ' · ' + fmtTimeMs(row.t || 0, true)]),
    ));
  });
}

/* ============================================
   Panel: DAILY
   ============================================ */
function panelDaily(body) {
  const dateKey = dayKeyUTC();
  const done = dailyDoneInfo(dateKey);
  body.appendChild(h('div.sec-title', {}, 'Today · ' + dateKey + ' (UTC)'));
  body.appendChild(h('div', { style: { fontSize: '0.82rem', lineHeight: 1.55, color: 'var(--m-text-muted)', marginBottom: '10px' } },
    'One board, identical for every player, fresh every UTC midnight. Shapes, hexes, wraps — the field decides.'));
  if (done) {
    body.appendChild(h('div.end-stats', {},
      h('div.es', {}, h('b', {}, done.won ? fmtTimeMs(done.t, true) : '✕'), h('span', {}, done.won ? 'your time' : 'boom')),
      h('div.es', {}, h('b', {}, fmtInt(done.s)), h('span', {}, 'score')),
      h('div.es', {}, h('b', {}, done.un || 0), h('span', {}, 'undos')),
    ));
  }
  body.appendChild(h('div.row', { style: { margin: '8px 0 18px' } },
    h('button.btn.primary', { onclick: () => { playDaily().catch(e => showToast('Daily fetch failed — ' + e.message)); } },
      done ? 'Play it again (practice)' : 'Play today\'s challenge'),
  ));

  if (!Cloud.on || !Cloud.userKey) { connectPrompt(body, 'Connect to fetch the shared daily seed, post your score and see the loss heatmap.'); return; }

  const list = h('div.lb-list');
  body.appendChild(h('div.sec-title', {}, 'Today\'s scores'));
  body.appendChild(list);
  const heatWrap = h('div');
  body.appendChild(heatWrap);
  (async () => {
    try {
      const rows = await CloudGame.fetchLeaderboard('daily:' + dateKey);
      list.innerHTML = '';
      if (!rows.length) list.appendChild(h('div.lb-empty', {}, 'No scores yet today.'));
      else renderLbRows(list, 'daily:' + dateKey, rows);
    } catch { list.innerHTML = ''; list.appendChild(h('div.lb-empty', {}, 'Could not fetch scores.')); }
    // heatmap of where players died, below the scores
    try {
      const points = await CloudGame.fetchHeat(dateKey);
      heatWrap.appendChild(h('div.sec-title', {}, 'Where it went wrong'));
      if (!points.length) { heatWrap.appendChild(h('div.lb-empty', {}, 'No losses recorded today — flawless crowd.')); return; }
      const counts = new Map();
      for (const pt of points) counts.set(pt.i, (counts.get(pt.i) || 0) + 1);
      const cv = h('canvas.heat-canvas');
      const legend = h('div.hint', { style: { textAlign: 'center', marginTop: '6px' } });
      heatWrap.appendChild(cv);
      heatWrap.appendChild(legend);
      let spec = dailySpecFor(dateKey);
      const cached = store.getJSON('daily-spec:' + dateKey);
      if (cached && cached.spec) spec = cached.spec;
      requestAnimationFrame(() => drawBoardHeatmap(cv, spec, counts, { legendEl: legend }));
      // fatal move-number histogram
      const buckets = [['1–5', 0], ['6–15', 0], ['16–40', 0], ['41+', 0]];
      for (const pt of points) {
        const n = pt.n || 0;
        if (n <= 5) buckets[0][1]++; else if (n <= 15) buckets[1][1]++; else if (n <= 40) buckets[2][1]++; else buckets[3][1]++;
      }
      const maxB = Math.max(1, ...buckets.map(b => b[1]));
      const hist = h('div', { style: { display: 'flex', gap: '8px', alignItems: 'flex-end', height: '74px', margin: '12px 4px 2px' } });
      for (const [label, v] of buckets) {
        hist.appendChild(h('div', { style: { flex: 1, textAlign: 'center' } },
          h('div', { style: { height: Math.round(v / maxB * 50) + 'px', background: 'var(--m-danger)', opacity: v ? 0.75 : 0.15, borderRadius: '4px 4px 0 0', minHeight: '3px' } }),
          h('div', { style: { fontSize: '0.6rem', color: 'var(--m-text-faint)', marginTop: '3px' } }, label),
          h('div', { style: { fontSize: '0.62rem', fontWeight: 700 } }, String(v)),
        ));
      }
      heatWrap.appendChild(h('div.hint', { style: { marginTop: '10px' } }, 'Fatal move number:'));
      heatWrap.appendChild(hist);
    } catch {}
  })();
}

function trnScoreOf(doc, round, name) {
  const slot = (doc.results || {})[round] || {};
  for (const entry of Object.values(slot)) {
    if ((entry.u || '').toLowerCase() === name.toLowerCase()) return entry;
  }
  return null;
}
function trnCombined(doc, name, uptoRound) {
  let total = 0;
  for (let r = 0; r <= uptoRound; r++) {
    const e = trnScoreOf(doc, r, name);
    if (e) total += e.s || 0;
  }
  return total;
}
function openTrnView(doc) {
  openSheet(doc.name, body => {
    body.appendChild(h('div.hint', { style: { marginBottom: '10px' } },
      'Code ', h('span.mono', {}, doc.id), ' — share it so others can join. Each round is one seeded board (identical for everyone); bracket matchups are decided by combined score through that round.'));
    // rounds: play buttons
    body.appendChild(h('div.sec-title', {}, 'Rounds'));
    doc.rounds.forEach((round, r) => {
      const my = Cloud.name ? trnScoreOf(doc, r, Cloud.name) : null;
      body.appendChild(h('div.toggle-row', {},
        h('div.t-txt', {},
          h('div.t-title', {}, 'Round ' + (r + 1) + (my ? ' — ' + fmtInt(my.s) + ' pts' : '')),
          h('div.t-sub', {}, specDescribe(round.spec))),
        h('button.btn.small' + (my ? '' : '.primary'), {
          onclick: () => {
            closeSheet(); closeDrawer();
            newGame(round.spec, { mode: 'trn', trn: { id: doc.id }, round: r });
          },
        }, my ? 'Replay' : 'Play'),
      ));
    });
    // bracket
    body.appendChild(h('div.sec-title', {}, 'Bracket'));
    body.appendChild(renderBracket(doc));
    body.appendChild(h('div.row', { style: { marginTop: '12px' } },
      h('button.btn', { onclick: async () => { try { const fresh = await CloudGame.trnFetch(doc.id); if (fresh) openTrnView(fresh); } catch { showToast('Refresh failed'); } } }, 'Refresh results'),
      h('button.btn.flex-none', { onclick: () => copyText(location.origin + location.pathname + '#t=' + doc.id).then(ok => showToast(ok ? 'Link copied' : 'Copy failed')) }, 'Share link'),
    ));
  });
}
function renderBracket(doc) {
  // single elimination over seeding order; matchup winner = higher combined
  // score through that bracket tier's round (ties -> earlier seed)
  const wrap = h('div.bracket');
  let field = doc.players.slice();
  const size = Math.pow(2, Math.ceil(Math.log2(Math.max(2, field.length))));
  while (field.length < size) field.push(null);   // byes
  let tier = 0;
  while (field.length >= 2) {
    const col = h('div.b-col');
    col.appendChild(h('div.b-round-lbl', {}, field.length === 2 ? 'Final' : 'Round of ' + field.length));
    const next = [];
    const roundIdx = Math.min(tier, doc.rounds.length - 1);
    for (let k = 0; k < field.length; k += 2) {
      const A = field[k], B = field[k + 1];
      const sa = A ? trnCombined(doc, A, roundIdx) : -1;
      const sb = B ? trnCombined(doc, B, roundIdx) : -1;
      const decided = (A && B && (trnScoreOf(doc, roundIdx, A) || trnScoreOf(doc, roundIdx, B))) || !A || !B;
      const winner = !B ? A : !A ? B : (sb > sa ? B : A);
      next.push(decided ? winner : null);
      col.appendChild(h('div.b-match', {},
        h('div.b-p' + (decided && winner === A && A ? '.win' : ''), {}, h('span', {}, A || '—'), h('span.b-s', {}, A && sa >= 0 ? fmtInt(sa) : '')),
        h('div.b-p' + (decided && winner === B && B ? '.win' : ''), {}, h('span', {}, B || 'bye'), h('span.b-s', {}, B && sb >= 0 ? fmtInt(sb) : '')),
      ));
    }
    wrap.appendChild(col);
    field = next;
    tier++;
    if (tier > 6) break;
  }
  // champion column
  const champ = field[0];
  const col = h('div.b-col');
  col.appendChild(h('div.b-round-lbl', {}, 'Champion'));
  col.appendChild(h('div.b-match', {}, h('div.b-p' + (champ ? '.win' : ''), {}, h('span', {}, champ || 'TBD'), h('span.b-s', {}, champ ? '👑' : ''))));
  wrap.appendChild(col);
  return wrap;
}

const ACTION_OPTIONS = [
  ['reveal', 'Reveal'], ['flag', 'Flag'], ['chord', 'Chord'], ['question', '? mark'],
  ['smart', 'Smart: chord / ?'], ['smartflag', 'Smart: chord / flag'], ['none', 'Nothing'],
];
function actionSelect(slot) {
  const sel = h('select', {},
    ...ACTION_OPTIONS.map(([v, label]) => h('option', { value: v, selected: Settings.get('ctl.' + slot) === v || null }, label)));
  sel.onchange = () => Settings.set('ctl.' + slot, sel.value);
  return sel;
}
function keyCapture(action) {
  const btn = h('button.btn.small', {}, prettyKey(Settings.get('keys.' + action)));
  btn.onclick = () => {
    btn.textContent = 'press a key…';
    const onKey = e => {
      e.preventDefault();
      window.removeEventListener('keydown', onKey, true);
      if (e.code !== 'Escape') Settings.set('keys.' + action, e.code);
      btn.textContent = prettyKey(Settings.get('keys.' + action));
    };
    window.addEventListener('keydown', onKey, true);
  };
  return btn;
}

  body.appendChild(h('div.help-block', {
    html: `
<h4>The game</h4>
Open every safe tile. Numbers count the mines they touch — on squares that's up to 8 neighbors, on hexes 6, on triangles 12 (edges and corners both count). Flag what you're sure of; the mine counter ticks down per flag.
<h4>Controls right now</h4>
Mouse: <b>left</b> ${esc(label(ctl.left))} · <b>right</b> ${esc(label(ctl.right))} · <b>middle</b> ${esc(label(ctl.middle))}.
Touch: <b>tap</b> ${esc(label(ctl.tap))} · <b>hold</b> ${esc(label(ctl.long))} · <b>double-tap</b> ${esc(label(ctl.dbltap))}.

<h4>Chording</h4>
Press a revealed number whose flags already satisfy it: the remaining neighbors open at once. If instead its hidden neighbors <i>must</i> all be mines, the same press flags them.
<h4>Fair boards</h4>
Boards are grown from a seed — same seed, same board, for anyone, anywhere. With the no-guess guarantee on, the generator re-deals (deterministically) until pure logic can clear the board. The ★ rating estimates how deep that logic goes: ★ trivial counting, ★★ subset tricks, ★★★ case analysis, ★★★★+ endgame counting. Your first click is always safe — except on shared/challenge boards, which fix a marked starting tile instead so everyone digs the identical field.
<h4>Score & rating</h4>
Score = difficulty × progress<sup>1.5</sup> × speed bonus — so a fast loss deep into a hard board still counts. Difficulty grows with mines, density, grid type and the ★ rating. The skill rating is ELO-style against the board's difficulty, driven by solve <i>efficiency</i> (3BV/s), not raw time.
<h4>Undo</h4>
Off by default, for purists. When on: one undo per game, only on a mine hit — and your result moves to the "with undo" leaderboard.
<h4>Offline & sync</h4>
The game installs into the offline cache (art included) and runs with zero network. Connecting is optional: one access word unlocks the shared database for leaderboards, the daily, and tournaments. Everything uploaded is encrypted in your browser first — the server only stores ciphertext. Syncs happen only on daily fetch, leaderboard views, and game finish; results finished offline queue and send later.
<h4>Daily</h4>
One board per UTC day, identical for all players. Lose, and the tile that got you joins the day's communal heat-map — see where everyone else went out, below the scores.

function showEndCard(won, canUndo) {
  if (!G) return;
  const card = $('end-card');
  card.innerHTML = '';
  const timeMs = Math.round(G.timeMs);
  const shown = G.result || Object.assign(buildResult(won, timeMs), { pending: true });
  const r = shown;

  if (won) {
    card.appendChild(h('div.big-emoji', {}, G.meta.mode === 'story' ? '🗺️' : '🎉'));
    card.appendChild(h('h2', {}, winTitle()));
    const bestT = r.preset ? Stats.bestTimeFor(r.preset) : null;
    const isBest = r.preset && r.undos === 0 && bestT != null && timeMs <= bestT && !G.practice;
    card.appendChild(h('p.sub', {}, G.practice ? 'Practice — nothing recorded, everything learned.'
      : isBest ? '★ New personal best on ' + PRESETS[r.preset].label + '!'
      : specDescribe(G.spec)));
  } else {
    card.appendChild(h('div.big-emoji', {}, '💥'));
    card.appendChild(h('h2', {}, canUndo ? 'Boom — but wait' : 'Boom.'));
    card.appendChild(h('p.sub', {}, canUndo ? 'You have one undo (mine hits only). Use it?' : lossSub()));
  }

  card.appendChild(h('div.end-stats', {},
    h('div.es', {}, h('b', {}, G.practice ? '∞' : fmtTimeMs(timeMs, true)), h('span', {}, 'time')),
    h('div.es', {}, h('b', {}, fmtInt(r.score)), h('span', {}, 'score')),
    won
      ? h('div.es', {}, h('b', {}, (r.eff || 0).toFixed(2)), h('span', {}, '3bv/s'))
      : h('div.es', {}, h('b', {}, pct(r.progress || 0)), h('span', {}, 'cleared')),
  ));

  if (!won && G.recap && !canUndo) {
    const rec = G.recap;
    const cls = rec.fatalWasProvenMine ? '' : rec.safeAvailable > 0 ? ' was-safe' : ' forced';
    const txt = rec.fatalWasProvenMine
      ? ['That tile was ', h('b', {}, 'provably a mine'), ' — the numbers had it fenced in.']
      : rec.safeAvailable > 0
        ? [h('b', {}, rec.safeAvailable + ' provably safe tile' + (rec.safeAvailable === 1 ? '' : 's')), ' were available when you clicked — the logic was there.']
        : ['No safe move was provable — a ', h('b', {}, 'forced guess'), '. Bad luck, not bad logic.'];
    card.appendChild(h('div.recap-verdict' + cls.replace(' ', '.'), {}, ...txt,
      h('div.hint', { style: { marginTop: '5px' } }, 'All mines are shown on the board; misplaced flags are crossed out.')));
  }

  if (!G.practice && r.ratingAfter) {
    card.appendChild(h('div.hint', { style: { marginBottom: '4px' } }, 'skill rating → ' + Math.round(r.ratingAfter)));
  }

  // mode-specific center piece
  if (r.mode === 'rogue') {
    if (r.rogueNext) card.appendChild(h('div.recap-verdict', {}, 'Stage cleared! +', h('b', {}, fmtInt(r.rogueGained)), ' pts — run total ', h('b', {}, fmtInt(r.rogueTotal)), '.'));
    if (r.rogueOver) card.appendChild(h('div.recap-verdict', {}, 'Run over after ' + r.rogueStages + ' cleared stage' + (r.rogueStages === 1 ? '' : 's') + ' — final ', h('b', {}, fmtInt(r.rogueTotal)), ' pts.', r.rogueBest ? ' ★ New best run!' : ''));
  }
  if (r.mode === 'story' && won && STORY[G.meta.chapter]) {
    card.appendChild(h('div.story-beat', { style: { textAlign: 'left' } }, STORY[G.meta.chapter].outro));
  }
  if (r.mode === 'challenge' && G.meta.challenge) {
    const ch = G.meta.challenge;
    const beatTime = won && ch.t && timeMs < ch.t;
    const beatScore = (r.score || 0) > (ch.s || 0);
    card.appendChild(h('div.recap-verdict' + (beatTime || beatScore ? '.was-safe' : ''), {},
      esc(ch.by) + ': ' + fmtTimeMs(ch.t || 0, true) + ' · ' + fmtInt(ch.s) + ' pts — you: ' + (won ? fmtTimeMs(timeMs, true) : 'boom') + ' · ' + fmtInt(r.score) + ' pts. ',
      h('b', {}, beatTime ? 'You beat their time! 🏁' : beatScore ? 'You out-scored them!' : 'They still lead — again?')));
  }
  if (r.mode === 'daily') {
    card.appendChild(h('div.hint', { style: { margin: '4px 0' } }, won ? 'Come back after UTC midnight for the next one.' : 'Your fatal tile joined today\'s heat-map. Tomorrow is a new field.'));
  }
  if (r.mode === 'trn' && G.meta.trn) {
    card.appendChild(h('div.hint', { style: { margin: '4px 0' } }, 'Score submitted to the bracket.'));
  }

  // actions
  const actions = h('div.end-actions');
  if (canUndo) {
    actions.appendChild(h('button.btn.primary', { onclick: undoMineHit }, '↶ Undo (1 left)'));
    actions.appendChild(h('button.btn', {
      onclick: () => { finalizeGame(false); showEndCard(false, false); },
    }, 'Accept the boom'));
  } else if (r.mode === 'rogue' && r.rogueNext) {
    actions.appendChild(h('button.btn.primary', { onclick: () => { const run = Rogue.run(); if (run) Rogue.playStage(run); } }, 'Next stage →'));
    actions.appendChild(h('button.btn', { onclick: () => { hideOverlays(); openPanel('rogue'); } }, 'Run details'));
  } else if (r.mode === 'story' && won && G.meta.chapter + 1 < STORY.length) {
    actions.appendChild(h('button.btn.primary', { onclick: () => Story.play(G.meta.chapter + 1) }, 'Next chapter →'));
    actions.appendChild(h('button.btn', { onclick: retrySameBoard }, 'Replay'));
  } else if (r.mode === 'trn' && G.meta.trn) {
    actions.appendChild(h('button.btn.primary', {
      onclick: async () => { hideOverlays(); try { const doc = await CloudGame.trnFetch(G.meta.trn.id); if (doc) openTrnView(doc); } catch { openPanel('trn'); } },
    }, 'Open bracket'));
    actions.appendChild(h('button.btn', { onclick: retrySameBoard }, 'Replay round'));
  } else {
    actions.appendChild(h('button.btn.primary', { onclick: restartFresh }, won ? 'New board' : 'Try a new board'));
    if (!won) actions.appendChild(h('button.btn', { onclick: retrySameBoard }, 'Retry this board'));
    if (won && !G.practice) actions.appendChild(h('button.btn', {
      onclick: () => copyText(challengeLinkFor(r)).then(ok => showToast(ok ? 'Challenge link copied — send it!' : 'Copy failed')),
    }, 'Challenge a friend'));
  }
  actions.appendChild(h('button.btn.ghost', { onclick: () => { $('end-overlay').classList.add('hidden'); showSummaryBanner(); } }, 'Examine board'));
  card.appendChild(actions);
  $('end-overlay').classList.remove('hidden');

  function winTitle() {
    const t = ['Cleared!', 'Swept clean.', 'Not a scratch.', 'Flawless field.'];
    return t[(G.moveCount + timeMs) % t.length];
  }
  function lossSub() {
    return G.fatal && G.recap && G.recap.fatalWasProvenMine ? 'The numbers tried to warn you.' : specDescribe(G.spec);
  }
}

function handleHashRoute() {
  const hash = location.hash || '';
  try {
    if (hash.startsWith('#s=')) {
      const data = b64urlDecode(hash.slice(3));
      if (data && data.spec) {
        newGame(data.spec, { mode: 'classic' });
        showRouteBanner('Shared board', 'seed ' + data.spec.s + ' — the marked tile is your safe start');
        return true;
      }
    } else if (hash.startsWith('#c=')) {
      const data = b64urlDecode(hash.slice(3));
      if (data && data.spec) {
        newGame(data.spec, { mode: 'challenge', challenge: { by: data.by, t: data.t, s: data.s } });
        showRouteBanner((data.by || 'Someone') + ' challenges you', (data.w ? fmtTimeMs(data.t || 0, true) + ' · ' : '') + fmtInt(data.s) + ' pts — beat it');
        return true;
      }
    } else if (hash.startsWith('#t=')) {
      const code = hash.slice(3).trim().toLowerCase();
      if (code) {
        (async () => {
          if (!Cloud.on || !Cloud.userKey) { openPanel('trn'); showToast('Connect to open tournament ' + code); return; }
          try { const doc = await CloudGame.trnFetch(code); if (doc) openTrnView(doc); else showToast('No tournament ' + code); }
          catch { showToast('Could not fetch tournament'); }
        })();
        return false;   // still start a normal board underneath
      }
    } else if (hash === '#daily') {
      playDaily().catch(() => {});
      return true;
    }
  } catch (e) { console.error('route', e); }
  return false;
}
function showRouteBanner(title, sub) {
  const wrap = $('banners');
  wrap.innerHTML = '';
  const b = h('div.banner', {},
    h('div.b-txt', {}, h('b', {}, title), h('div.b-sub', {}, sub)),
    h('button.icon-btn', { onclick: () => b.remove(), 'aria-label': 'Dismiss', style: { width: '28px', height: '28px' } },
      h('span', { html: '&times;', style: { fontSize: '1.1rem' } })),
  );
  wrap.appendChild(b);
  setTimeout(() => { if (b.parentElement) b.remove(); }, 14000);
}

function boot() {
  applyThemeAll();
  Renderer.init();
  Input.init();
  restoreCloudSession();
  refreshDailyBadge();

  /* topbar & chrome wiring */
  $('menu-btn').onclick = openDrawer;
  $('drawer-close').onclick = closeDrawer;
  $('scrim').onclick = closeDrawer;
  $('sheet-close').onclick = closeSheet;
  $('sheet-scrim').onclick = closeSheet;
  document.querySelectorAll('.nav-item').forEach(el => { el.onclick = () => { openPanel(el.dataset.nav); }; });
  $('settings-btn').onclick = () => openPanel('settings');
  $('pause-btn').onclick = togglePause;
  $('resume-btn').onclick = resumeGame;
  $('pause-new-btn').onclick = () => { openPanel('play'); };
  $('face-btn').onclick = () => { haptic(8); restartFresh(); };
  $('boardinfo').onclick = openBoardInfo;
  $('zoom-in').onclick = () => { const { W, H } = Renderer.canvasSize(); Renderer.zoomAt(W / 2, H / 2, 1.3); };
  $('zoom-out').onclick = () => { const { W, H } = Renderer.canvasSize(); Renderer.zoomAt(W / 2, H / 2, 0.77); };
  $('zoom-fit').onclick = () => Renderer.fitCamera();
  $('end-overlay').addEventListener('click', e => { if (e.target === e.currentTarget) { $('end-overlay').classList.add('hidden'); showSummaryBanner(); } });

  /* auto-pause & crash-safe saves */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      saveNow();
      if (Settings.get('autoPause') && G && G.status === 'play') pauseGame();
    }
  });
  window.addEventListener('pagehide', saveNow);
  window.addEventListener('blur', () => {
    if (!Settings.get('autoPause')) return;
    setTimeout(() => { if (!document.hasFocus() && G && G.status === 'play') pauseGame(); }, 250);
  });
  window.addEventListener('hashchange', () => { handleHashRoute(); });

  /* first board: route link > saved game > last spec */
  const routed = handleHashRoute();
  if (!routed) {
    const saved = loadSavedGame();
    if (saved && resumeFromSave(saved)) {
      showToast('Game restored — right where you left it');
    } else {
      const last = store.getJSON('last-spec');
      startClassic(last || { g: 'sq', w: PRESETS.medium.w, h: PRESETS.medium.h, m: PRESETS.medium.m, ng: 1 });
    }
  }

  /* flush anything finished offline last session */
  if (Cloud.on && navigator.onLine) setTimeout(() => flushPending().catch(() => {}), 4000);

  // debug / poke-around surface
  window.MINE = {
    get G() { return G; }, Settings, Cloud, Stats, Renderer, CloudGame,
    newGame, buildGrid, solveBoard, generateBoardSync, deduceVisible, calc3BV,
    dailySpecFor, Rogue, Story, STORY, PRESETS, SHAPES,
    encryptText, decryptText, specFingerprint, shareLinkForSpec,
    actReveal, actFlag, actChord, actQuestion, undoMineHit,
    pauseGame, resumeGame, restartFresh, retrySameBoard, openPanel,
    timerElapsed, saveNow, playDaily, applyThemeAll, centerCellOf, canonicalSpec,
  };
}
boot();
})();
</script>

<script>
// Service Worker registration (txt.html / ppc.html pattern)
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(reg => {
    if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
    reg.addEventListener('updatefound', () => {
      const newSW = reg.installing;
      if (!newSW) return;
      newSW.addEventListener('statechange', () => {
        if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
          newSW.postMessage('SKIP_WAITING');
        }
      });
    });
  }).catch(() => {});
  window.addEventListener('online', () => {
    if (navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage('REFRESH_CACHE');
    }
  });
}
</script>
