}
function buildSpatialIndex(cells) {
  const BS = 2; // bucket size in world units
  const map = new Map();
  cells.forEach(cell => {
    let bx0 = Infinity, by0 = Infinity, bx1 = -Infinity, by1 = -Infinity;
    for (const [x, y] of cell.verts) {
      if (x < bx0) bx0 = x; if (y < by0) by0 = y;
      if (x > bx1) bx1 = x; if (y > by1) by1 = y;
    }
    for (let bx = Math.floor(bx0 / BS); bx <= Math.floor(bx1 / BS); bx++) {
      for (let by = Math.floor(by0 / BS); by <= Math.floor(by1 / BS); by++) {
        const k = bx + ',' + by;
        let list = map.get(k);
        if (!list) map.set(k, list = []);
        list.push(cell.i);
      }
    }
  });
  return {
    query(x, y) {
      const list = map.get(Math.floor(x / BS) + ',' + Math.floor(y / BS));
      if (!list) return -1;
      for (const i of list) {
        if (pointInPoly(x, y, cells[i].verts)) return i;
      }
      return -1;
    },
    bucketsFor(x0, y0, x1, y1) {
      const out = new Set();
      for (let bx = Math.floor(x0 / BS); bx <= Math.floor(x1 / BS); bx++) {
        for (let by = Math.floor(y0 / BS); by <= Math.floor(y1 / BS); by++) {
          const list = map.get(bx + ',' + by);
          if (list) for (const i of list) out.add(i);
        }
      }
      return out;
    },
  };
}
/* ============================================
   §06 GENERATION, SOLVER & FAIRNESS
   Boards are a pure function of (spec, start cell): provably fair — share
   the seed and everyone gets the identical board. When the no-guess
   guarantee is on, deterministic sub-seeds are tried until the logic solver
   can clear the board without guessing; the winning sub-seed is part of the
   derivation, so shared boards agree everywhere.
   The same deduction engine powers generation, the loss recap ("was that
   click actually forced?") and the complexity rating.
   ============================================ */

function placeMines(rngFn, N, m, forbidden) {
  const allowed = [];
  for (let i = 0; i < N; i++) if (!forbidden.has(i)) allowed.push(i);
  const mines = new Uint8Array(N);
  const count = Math.min(m, allowed.length);
  for (let k = 0; k < count; k++) {
    const j = k + Math.floor(rngFn() * (allowed.length - k));
    const tmp = allowed[k]; allowed[k] = allowed[j]; allowed[j] = tmp;
    mines[allowed[k]] = 1;
  }
  return mines;
}

function computeAdj(cells, mines) {
  const adj = new Uint8Array(cells.length);
  for (const cell of cells) {
    let n = 0;
    for (const nb of cell.nbrs) if (mines[nb]) n++;
    adj[cell.i] = n;
  }
  return adj;
}

/* ---- Deduction engine ----
   st codes: 0 = unknown · 1 = revealed number · 2 = proven mine · 4 = proven safe (number unknown)
   One pass tries tiers in order and returns the first that yields progress:
   tier 1  trivial counts       (satisfied / saturated numbers)
   tier 2  subset elimination   (1-2 pattern and friends)
   tier 3  component enumeration (bounded case analysis on a frontier island)
   tier 4  global mine counting  (endgame: the remaining-mines total decides)
*/
function deducePass(cells, st, constraints, remainingMines, unknownCount, caps) {
  const safe = [], mine = [];
  const mark = (arr, i, seen) => { if (!seen.has(i)) { seen.add(i); arr.push(i); } };
  const seenS = new Set(), seenM = new Set();

  // tier 1: trivial
  for (const con of constraints) {
    if (con.m === 0) for (const i of con.cells) mark(safe, i, seenS);
    else if (con.m === con.cells.length) for (const i of con.cells) mark(mine, i, seenM);
  }
  if (safe.length || mine.length) return { safe, mine, tier: 1 };

  // tier 2: subset elimination — for pairs A ⊆ B: (B−A) holds (B.m − A.m) mines
  const byCell = new Map();
  constraints.forEach((con, ci) => {
    for (const i of con.cells) {
      let list = byCell.get(i);
      if (!list) byCell.set(i, list = []);
      list.push(ci);
    }
  });
  const cellSets = constraints.map(c => new Set(c.cells));
  for (let a = 0; a < constraints.length; a++) {
    const A = constraints[a];
    // candidate supersets: constraints sharing A's first cell
    const cands = byCell.get(A.cells[0]) || [];
    for (const b of cands) {
      if (b === a) continue;
      const B = constraints[b];
      if (B.cells.length <= A.cells.length) continue;
      let subset = true;
      for (const i of A.cells) if (!cellSets[b].has(i)) { subset = false; break; }
      if (!subset) continue;
      const dm = B.m - A.m;
      const diff = B.cells.filter(i => !cellSets[a].has(i));
      if (dm === 0) for (const i of diff) mark(safe, i, seenS);
      else if (dm === diff.length) for (const i of diff) mark(mine, i, seenM);
    }
  }
  if (safe.length || mine.length) return { safe, mine, tier: 2 };

  // tier 3: enumerate small connected constraint components
  const compCap = caps.compCap;
  const compOf = new Map();       // frontier cell -> component id
  const comps = [];               // [{vars:[], cons:[]}]
  {
    const conComp = new Int32Array(constraints.length).fill(-1);
    for (let c0 = 0; c0 < constraints.length; c0++) {
      if (conComp[c0] !== -1) continue;
      const id = comps.length;
      const comp = { vars: [], cons: [] };
      comps.push(comp);
      const stack = [c0];
      conComp[c0] = id;
      while (stack.length) {
        const ci = stack.pop();
        comp.cons.push(ci);
        for (const cellI of constraints[ci].cells) {
          if (!compOf.has(cellI)) { compOf.set(cellI, id); comp.vars.push(cellI); }
          for (const cj of byCell.get(cellI)) {
            if (conComp[cj] === -1) { conComp[cj] = id; stack.push(cj); }
          }
        }
      }
    }
  }
  let enumUsed = false;
  for (const comp of comps) {
    if (comp.vars.length > compCap) continue;
    enumUsed = true;
    const res = enumerateComponent(comp.vars, comp.cons.map(ci => constraints[ci]), caps.solCap);
    if (!res) continue;   // blown solution cap — inconclusive
    for (let v = 0; v < comp.vars.length; v++) {
      if (res.mineCount[v] === 0) mark(safe, comp.vars[v], seenS);
      else if (res.mineCount[v] === res.solutions) mark(mine, comp.vars[v], seenM);
    }
  }
  if (safe.length || mine.length) return { safe, mine, tier: 3, enumUsed };

  // tier 4: global counting — cheap bounds, then full frontier enumeration
  // with the exact remaining-mines total and interior feasibility.
  const frontier = [...compOf.keys()];
  const interior = unknownCount - frontier.length;
  if (remainingMines === 0) {
    for (let i = 0; i < st.length; i++) if (st[i] === 0) mark(safe, i, seenS);
    if (safe.length) return { safe, mine, tier: 4 };
  }
  if (remainingMines === unknownCount && unknownCount > 0) {
    for (let i = 0; i < st.length; i++) if (st[i] === 0) mark(mine, i, seenM);
    if (mine.length) return { safe, mine, tier: 4 };
  }
  if (frontier.length > 0 && frontier.length <= caps.globalCap) {
    const allCons = constraints;
    const res = enumerateComponent(frontier, allCons, caps.solCap, {
      minTotal: Math.max(0, remainingMines - interior),
      maxTotal: remainingMines,
    });
    if (res && res.solutions > 0) {
      for (let v = 0; v < frontier.length; v++) {
        if (res.mineCount[v] === 0) mark(safe, frontier[v], seenS);
        else if (res.mineCount[v] === res.solutions) mark(mine, frontier[v], seenM);
      }
      // interior deduction: if every valid frontier assignment uses ALL
      // remaining mines, interior is safe; if every assignment leaves
      // exactly `interior` mines over, interior is all mines.
      if (interior > 0) {
        if (res.maxMines === res.minMines) {
          const leftover = remainingMines - res.minMines;
          if (leftover === 0) {
            for (let i = 0; i < st.length; i++) if (st[i] === 0 && !compOf.has(i)) mark(safe, i, seenS);
          } else if (leftover === interior) {
            for (let i = 0; i < st.length; i++) if (st[i] === 0 && !compOf.has(i)) mark(mine, i, seenM);
          }
        }
      }
      if (safe.length || mine.length) return { safe, mine, tier: 4 };
    }
  }
  return { safe, mine, tier: 0 };
}

// Enumerate mine assignments over `vars` satisfying `cons`; returns per-var
// mine counts across all solutions, or null if the solution cap blew.
function enumerateComponent(vars, cons, solCap, totalBound) {
  const V = vars.length;
  const varIdx = new Map(vars.map((v, i) => [v, i]));
  // constraint views over local var indices
  const cviews = cons.map(c => ({
    idx: c.cells.map(i => varIdx.get(i)).filter(i => i !== undefined),
    m: c.m,
    outside: c.cells.filter(i => !varIdx.has(i)).length,
  })).filter(c => c.idx.length > 0);
  // per-var: constraints touching it
  const touch = Array.from({ length: V }, () => []);
  cviews.forEach((c, ci) => c.idx.forEach(v => touch[v].push(ci)));
  const assigned = new Int8Array(V).fill(-1);
  const cAssigned = new Int32Array(cviews.length);   // assigned cells per constraint
  const cMines = new Int32Array(cviews.length);      // assigned mines per constraint
  const mineCount = new Int32Array(V);
  let solutions = 0, minMines = Infinity, maxMines = -Infinity, aborted = false;

  // order vars to touch constraints early (simple heuristic: by first constraint)
  const order = [...Array(V).keys()].sort((a, b) => (touch[a][0] ?? 99999) - (touch[b][0] ?? 99999));

  function dfs(pos, minesSoFar) {
    if (aborted) return;
    if (solutions > solCap) { aborted = true; return; }
    if (totalBound && minesSoFar > totalBound.maxTotal) return;
    if (pos === V) {
      if (totalBound && minesSoFar < totalBound.minTotal) return;
      solutions++;
      if (minesSoFar < minMines) minMines = minesSoFar;
      if (minesSoFar > maxMines) maxMines = minesSoFar;
      for (let v = 0; v < V; v++) if (assigned[v] === 1) mineCount[v]++;
      return;
    }
    const v = order[pos];
    for (const val of [0, 1]) {
      assigned[v] = val;
      let ok = true;
      for (const ci of touch[v]) {
        cAssigned[ci]++;
        cMines[ci] += val;
        const c = cviews[ci];
        const slack = c.idx.length - cAssigned[ci];       // unassigned cells in this constraint
        const need = c.m - cMines[ci];                    // mines still needed here
        // `outside` cells (not in this component) can hold at most `outside` mines
        if (need < 0 || need > slack + c.outside) ok = false;
      }
      if (ok) dfs(pos + 1, minesSoFar + val);
      for (const ci of touch[v]) { cAssigned[ci]--; cMines[ci] -= val; }
      assigned[v] = -1;
      if (aborted) return;
    }
  }
  dfs(0, 0);
  if (aborted) return null;
  return { solutions, mineCount, minMines: minMines === Infinity ? 0 : minMines, maxMines: maxMines === -Infinity ? 0 : maxMines };
}

/* ---- Full-board logic solve (generation + rating) ---- */
function solveBoard(cells, mines, adj, startIdx, caps) {
  caps = Object.assign({ compCap: 18, globalCap: 20, solCap: 20000, maxPasses: 6000 }, caps || {});
  const N = cells.length;
  const st = new Uint8Array(N);
  let revealedSafe = 0;
  let totalMines = 0;
  for (let i = 0; i < N; i++) if (mines[i]) totalMines++;
  const safeTotal = N - totalMines;

  const reveal = i => {
    // BFS zero-expansion using the true board
    const stack = [i];
    while (stack.length) {
      const cur = stack.pop();
      if (st[cur] === 1 || mines[cur]) continue;
      st[cur] = 1;
      revealedSafe++;
      if (adj[cur] === 0) for (const nb of cells[cur].nbrs) if (st[nb] !== 1) stack.push(nb);
    }
  };
  if (mines[startIdx]) return { solved: false, progress: 0, tierMax: 0, enumSteps: 0 };
  reveal(startIdx);

  let tierMax = 1, enumSteps = 0, passes = 0;
  for (;;) {
    if (revealedSafe >= safeTotal) return { solved: true, progress: 1, tierMax, enumSteps };
    if (++passes > caps.maxPasses) break;
    // build constraints from revealed numbers
    const constraints = [];
    let knownMines = 0, unknownCount = 0;
    for (let i = 0; i < N; i++) {
      if (st[i] === 2) knownMines++;
      else if (st[i] === 0) unknownCount++;
    }
    for (let i = 0; i < N; i++) {
      if (st[i] !== 1 || adj[i] === 0) continue;
      const unk = [];
      let flagged = 0;
      for (const nb of cells[i].nbrs) {
        if (st[nb] === 0) unk.push(nb);
        else if (st[nb] === 2) flagged++;
      }
      if (unk.length) constraints.push({ cells: unk, m: adj[i] - flagged });
    }
    const res = deducePass(cells, st, constraints, totalMines - knownMines, unknownCount, caps);
    if (res.tier === 0) break;
    if (res.tier > tierMax) tierMax = res.tier;
    if (res.tier >= 3) enumSteps++;
    for (const i of res.mine) if (st[i] === 0) st[i] = 2;
    for (const i of res.safe) if (st[i] === 0) reveal(i);
  }
  return { solved: false, progress: revealedSafe / Math.max(1, safeTotal), tierMax, enumSteps };
}

/* ---- What does the CURRENT visible position prove? (loss recap, hints) ----
   Works only from what the player could see: revealed numbers + total mine
   count. Returns everything provable at this moment.
*/
function deduceVisible(game) {
  const { cells, adj, state } = game;
  const N = cells.length;
  const st = new Uint8Array(N);       // 0 unknown, 1 revealed, 2 proven mine, 4 proven safe
  for (let i = 0; i < N; i++) if (state[i] === 1) st[i] = 1;
  const provenSafe = new Set(), provenMine = new Set();
  const caps = { compCap: 16, globalCap: 18, solCap: 12000 };
  for (let pass = 0; pass < 400; pass++) {
    const constraints = [];
    let knownMines = 0;
    for (let i = 0; i < N; i++) if (st[i] === 2) knownMines++;
    for (let i = 0; i < N; i++) {
      if (st[i] !== 1 || adj[i] === 0) continue;
      const unk = [];
      let sure = 0;
      for (const nb of cells[i].nbrs) {
        if (st[nb] === 2) sure++;
        else if (st[nb] === 0) unk.push(nb);
        // st==4 (proven safe, unopened): not a mine, drops out of the constraint
      }
      if (unk.length) constraints.push({ cells: unk, m: adj[i] - sure });
    }
    let realUnknown = 0;
    for (let i = 0; i < N; i++) if (st[i] === 0) realUnknown++;
    const res = deducePass(cells, st, constraints, game.minesTotal - knownMines, realUnknown, caps);
    if (res.tier === 0) break;
    let changed = false;
    for (const i of res.mine) if (st[i] === 0) { st[i] = 2; provenMine.add(i); changed = true; }
    for (const i of res.safe) if (st[i] === 0) { st[i] = 4; provenSafe.add(i); changed = true; }
    if (!changed) break;
  }
  return { provenSafe, provenMine };
}

/* ---- 3BV (minimum clicks to clear) ---- */
function calc3BV(cells, mines, adj) {
  const N = cells.length;
  const covered = new Uint8Array(N);
  let bv = 0;
  for (let i = 0; i < N; i++) {
    if (mines[i] || adj[i] !== 0 || covered[i]) continue;
    bv++;                        // one opening
    const stack = [i];
    covered[i] = 1;
    while (stack.length) {
      const cur = stack.pop();
      for (const nb of cells[cur].nbrs) {
        if (covered[nb] || mines[nb]) continue;
        covered[nb] = 1;
        if (adj[nb] === 0) stack.push(nb);
      }
    }
  }
  for (let i = 0; i < N; i++) {
    if (!mines[i] && !covered[i]) bv++;
  }
  return Math.max(1, bv);
}

/* ---- Board generation (deterministic, no-guess aware) ---- */
function genTries(N) {
  if (N <= 220) return 120;
  if (N <= 600) return 90;
  if (N <= 1600) return 120;   // ~1.5ms/attempt: extreme finds a fair deal in <200ms
  if (N <= 4000) return 30;
  return 8;
}
function generateBoardSync(spec, grid, startIdx) {
  const cells = grid.cells;
  const N = cells.length;
  const forbidden = new Set([startIdx, ...cells[startIdx].nbrs]);
  // never forbid so much that the mines can't fit
  const m = clamp(spec.m | 0, 1, Math.max(1, N - forbidden.size));
  const noGuess = spec.ng !== 0;
  const tries = noGuess ? genTries(N) : 1;
  let best = null;
  for (let a = 0; a < tries; a++) {
    const rng = rngFor(String(spec.s) + '|' + a);
    const mines = placeMines(rng, N, m, forbidden);
    const adj = computeAdj(cells, mines);
    if (!noGuess) {
      return { mines, adj, minesTotal: m, analysis: { guessFree: false, checked: false, tierMax: 0, enumSteps: 0, attempt: a } };
    }
    const res = solveBoard(cells, mines, adj, startIdx);
    if (res.solved) {
      return { mines, adj, minesTotal: m, analysis: { guessFree: true, checked: true, tierMax: res.tierMax, enumSteps: res.enumSteps, attempt: a } };
    }
    if (!best || res.progress > best.progress) {
      best = { mines, adj, progress: res.progress, tierMax: res.tierMax, enumSteps: res.enumSteps, attempt: a };
    }
  }
  return {
    mines: best.mines, adj: best.adj, minesTotal: m,
    analysis: { guessFree: false, checked: true, tierMax: best.tierMax, enumSteps: best.enumSteps, attempt: best.attempt, progress: best.progress },
  };
}

function complexityStars(analysis, N, m) {
  const density = m / Math.max(1, N);
  let stars = 1;
  const t = analysis.tierMax || 1;
  if (t >= 2) stars = 2;
  if (t >= 3) stars = 3;
  if (t >= 4) stars = 4;
  if ((analysis.enumSteps || 0) > 10) stars++;
  if (density > 0.22) stars++;
  return clamp(stars, 1, 5);
}
/* ============================================
   §07 GAME STATE & RULES
   ============================================ */
const ST_HIDDEN = 0, ST_REVEALED = 1, ST_FLAG = 2, ST_Q = 3;

const PRESETS = {
  easy:    { label: 'Easy',    g: 'sq', w: 9,  h: 9,  m: 10 },
  medium:  { label: 'Medium',  g: 'sq', w: 16, h: 16, m: 40 },
  hard:    { label: 'Hard',    g: 'sq', w: 30, h: 16, m: 99 },
  extreme: { label: 'Extreme', g: 'sq', w: 40, h: 22, m: 190 },
};

function canonicalSpec(spec) {
  return {
    g: spec.g || 'sq', w: spec.w | 0, h: spec.h | 0, m: spec.m | 0,
    t: spec.t ? 1 : 0, sh: spec.sh || '', s: String(spec.s || ''),
    st: spec.st == null ? null : spec.st | 0, ng: spec.ng === 0 ? 0 : 1,
  };
}
function specFingerprint(spec) { return hashStr(JSON.stringify(canonicalSpec(spec))); }
function presetKeyFor(spec) {
  for (const [k, p] of Object.entries(PRESETS)) {
    if (spec.g === p.g && spec.w === p.w && spec.h === p.h && spec.m === p.m && !spec.t && !spec.sh) return k;
  }
  return null;
}
function specDescribe(spec) {
  const gname = { sq: 'Square', hex: 'Hex', tri: 'Triangle' }[spec.g || 'sq'];
  const bits = [spec.w + '×' + spec.h + ' ' + gname, spec.m + ' mines'];
  if (spec.t) bits.push('torus');
  if (spec.sh) bits.push(SHAPES[spec.sh] ? SHAPES[spec.sh].label.toLowerCase() : spec.sh);
  return bits.join(' · ');
}

let G = null;   // the current game

function newGame(spec, meta) {
  meta = meta || { mode: 'classic' };
  spec = canonicalSpec(spec);
  if (!spec.s) spec.s = randomSeed();
  const grid = buildGrid(spec);
  const N = grid.cells.length;
  spec.m = clamp(spec.m, 1, Math.max(1, N - 10));
  if (spec.st != null && (spec.st < 0 || spec.st >= N)) spec.st = 0;
  G = {
    spec, meta, grid, cells: grid.cells, N,
    state: new Uint8Array(N),
    mines: null, adj: null,
    minesTotal: spec.m, safeTotal: N - spec.m,
    status: 'idle',
    timeMs: 0, runningSince: null,
    moves: [], moveCount: 0,
    revealedSafe: 0, flags: 0,
    undosUsed: 0, fatal: null, recap: null,
    bv3: null, analysis: null, stars: 0,
    practice: meta.practice != null ? meta.practice : Settings.get('practice'),
    allowUndo: meta.allowUndo != null ? meta.allowUndo : Settings.get('allowUndo'),
    generated: false, generating: false,
    finalized: false,
    startHint: spec.st,
  };
  hideOverlays();
  const banners = $('banners');
  if (banners) banners.innerHTML = '';
  Renderer.setGame(G);
  Renderer.fitCamera();
  updateHUD();
  updateModeChip();
  updateBoardInfo();
  setFace('🙂');
  store.remove('save');
  // Shared/challenge boards are pre-generated so the fixed start is honored.
  if (spec.st != null) ensureGenerated(spec.st).then(() => { Renderer.requestDraw(); updateHUD(); });
  return G;
}

async function ensureGenerated(startIdx) {
  if (!G || G.generated) return true;
  if (G.generating) return false;
  G.generating = true;
  const heavy = G.N > 2200 && G.spec.ng !== 0;
  if (heavy) {
    showToast('Carving a fair board…');
    await new Promise(r => setTimeout(r, 30));  // let the toast paint
  }
  const game = G;
  const out = generateBoardSync(game.spec, game.grid, startIdx);
  if (G !== game) return false;                 // a new game replaced us mid-generation
  G.genStart = startIdx;                        // remembered so "retry this board" can rebuild it
  G.mines = out.mines;
  G.adj = out.adj;
  G.minesTotal = out.minesTotal;
  G.safeTotal = G.N - out.minesTotal;
  G.analysis = out.analysis;
  G.bv3 = calc3BV(G.cells, G.mines, G.adj);
  G.stars = complexityStars(out.analysis, G.N, out.minesTotal);
  G.generated = true;
  G.generating = false;
  updateBoardInfo();
  return true;
}

/* ---- timer ---- */
function timerElapsed() { return G ? G.timeMs + (G.runningSince ? performance.now() - G.runningSince : 0) : 0; }
function timerStart() { if (G && !G.runningSince) G.runningSince = performance.now(); }
function timerStop() { if (G && G.runningSince) { G.timeMs += performance.now() - G.runningSince; G.runningSince = null; } }

/* ---- moves & autosave (crash-safe: every move, debounced) ---- */
function postMove(act, i) {
  if (!G) return;
  G.moveCount++;
  G.moves.push({ t: Math.round(timerElapsed()), a: act, i });
  if (G.moves.length > 4000) G.moves.splice(0, G.moves.length - 4000);
  scheduleSave();
  updateHUD();
}

function saveNow() {
  if (!G) return;
  if (G.status === 'won' || G.status === 'lost') { store.remove('save'); return; }
  if (!G.generated && G.moveCount === 0) return;   // nothing worth saving yet
  const blob = {
    v: 1, ts: Date.now(),
    spec: G.spec, meta: G.meta,
    timeMs: Math.round(timerElapsed()),
    state: bytesToB64(G.state),
    mines: G.generated ? bytesToB64(G.mines) : null,
    minesTotal: G.minesTotal,
    undosUsed: G.undosUsed, moveCount: G.moveCount,
    moves: G.moves.slice(-800),
    analysis: G.analysis, bv3: G.bv3, stars: G.stars,
    practice: G.practice, allowUndo: G.allowUndo,
  };
  store.setJSON('save', blob);
}
const scheduleSave = debounce(saveNow, 250);

function loadSavedGame() {
  const blob = store.getJSON('save');
  if (!blob || blob.v !== 1 || !blob.spec) return null;
  return blob;
}

function resumeFromSave(blob) {
  try {
    newGame(blob.spec, blob.meta || { mode: 'classic' });
    G.timeMs = blob.timeMs || 0;
    G.undosUsed = blob.undosUsed || 0;
    G.moveCount = blob.moveCount || 0;
    G.moves = Array.isArray(blob.moves) ? blob.moves : [];
    G.practice = !!blob.practice;
    G.allowUndo = !!blob.allowUndo;
    if (blob.mines) {
      G.mines = b64ToBytes(blob.mines);
      if (G.mines.length !== G.N) throw new Error('save mismatch');
      G.adj = computeAdj(G.cells, G.mines);
      G.minesTotal = blob.minesTotal || G.mines.reduce((a, b) => a + b, 0);
      G.safeTotal = G.N - G.minesTotal;
      G.analysis = blob.analysis || { guessFree: false, checked: false };
      G.bv3 = blob.bv3 || calc3BV(G.cells, G.mines, G.adj);
      G.stars = blob.stars || 1;
      G.generated = true;
      const st = b64ToBytes(blob.state);
      if (st.length === G.N) G.state = st;
      G.revealedSafe = 0; G.flags = 0;
      for (let i = 0; i < G.N; i++) {
        if (G.state[i] === ST_REVEALED && !G.mines[i]) G.revealedSafe++;
        if (G.state[i] === ST_FLAG) G.flags++;
      }
      G.status = G.moveCount > 0 ? 'pause' : 'idle';
      if (G.status === 'pause') showPauseOverlay(true);
    }
    updateHUD();
    updateBoardInfo();
    Renderer.requestDraw();
    return true;
  } catch (e) {
    console.error('resume failed', e);
    store.remove('save');
    return false;
  }
}

/* ---- core actions ---- */
function cellActionable() {
  return G && G.status !== 'won' && G.status !== 'lost' && !G.generating;
}

function revealFlood(i) {
  // BFS with rings so the renderer can stagger the cascade like a wave
  const order = [];
  const dist = new Map([[i, 0]]);
  const queue = [i];
  while (queue.length) {
    const cur = queue.shift();
    if (G.state[cur] === ST_REVEALED || G.state[cur] === ST_FLAG || G.mines[cur]) continue;
    G.state[cur] = ST_REVEALED;
    G.revealedSafe++;
    order.push({ i: cur, d: dist.get(cur) });
    if (G.adj[cur] === 0) {
      for (const nb of G.cells[cur].nbrs) {
        if (G.state[nb] !== ST_REVEALED && G.state[nb] !== ST_FLAG && !dist.has(nb)) {
          dist.set(nb, dist.get(cur) + 1);
          queue.push(nb);
        }
      }
    }
  }
  return order;
}

async function actReveal(i) {
  if (!cellActionable()) return;
  if (G.status === 'pause') { resumeGame(); return; }
  const s = G.state[i];
  if (s === ST_FLAG || s === ST_REVEALED) return;
  if (!G.generated) {
    const startIdx = G.spec.st != null ? G.spec.st : i;
    const ok = await ensureGenerated(startIdx);
    if (!ok || !G.generated) return;
  }
  if (G.status === 'idle') { G.status = 'play'; timerStart(); startTimerLoop(); }
  if (G.mines[i]) { mineHit(i); return; }
  const order = revealFlood(i);
  postMove('r', i);
  Renderer.animateReveal(order, i);
  if (Settings.get('autoFlag')) autoFlagPass(order);
  checkWin();
}

function actFlag(i) {
  if (!cellActionable()) return;
  if (G.status === 'pause') { resumeGame(); return; }
  const s = G.state[i];
  if (s === ST_REVEALED) return;
  if (!G.generated) {
    // flagging before the first reveal is legal — board isn't generated yet,
    // but the flag itself doesn't need the mines
  }
  if (s === ST_FLAG) { G.state[i] = ST_HIDDEN; G.flags--; }
  else { if (s === ST_Q) { /* q -> flag */ } G.state[i] = ST_FLAG; G.flags++; }
  haptic(12);
  postMove('f', i);
  Renderer.popCell(i);
  if (G.status === 'idle' && G.generated) { G.status = 'play'; timerStart(); startTimerLoop(); }
}

function actQuestion(i) {
  if (!cellActionable()) return;
  if (G.status === 'pause') { resumeGame(); return; }
  const s = G.state[i];
  if (s === ST_REVEALED) return;
  if (s === ST_Q) G.state[i] = ST_HIDDEN;
  else { if (s === ST_FLAG) G.flags--; G.state[i] = ST_Q; }
  postMove('q', i);
  Renderer.popCell(i);
}

function actChord(i) {
  if (!cellActionable()) return;
  if (G.status === 'pause') { resumeGame(); return; }
  if (!G.generated || G.state[i] !== ST_REVEALED || G.adj[i] === 0) return;
  let flags = 0;
  const hidden = [];
  for (const nb of G.cells[i].nbrs) {
    const s = G.state[nb];
    if (s === ST_FLAG) flags++;
    else if (s === ST_HIDDEN || s === ST_Q) hidden.push(nb);
  }
  if (!hidden.length) return;
  if (flags === G.adj[i]) {
    // reveal all unflagged neighbors
    let hit = -1;
    const allOrder = [];
    for (const nb of hidden) {
      if (G.mines[nb]) { hit = nb; break; }
      if (G.state[nb] !== ST_REVEALED) allOrder.push(...revealFlood(nb));
    }
    postMove('c', i);
    if (allOrder.length) Renderer.animateReveal(allOrder, i);
    if (hit >= 0) { mineHit(hit); return; }
    if (Settings.get('autoFlag')) autoFlagPass(allOrder);
    checkWin();
  } else if (flags + hidden.length === G.adj[i]) {
    // the remaining neighbors must all be mines: flag them
    for (const nb of hidden) {
      if (G.state[nb] === ST_Q) G.state[nb] = ST_HIDDEN;
      if (G.state[nb] !== ST_FLAG) { G.state[nb] = ST_FLAG; G.flags++; Renderer.popCell(nb); }
    }
    haptic(12);
    postMove('c', i);
  } else {
    Renderer.pulseNeighbors(i);
  }
}

// Optional QoL: flag neighbors that are trivially forced (numbers whose
// remaining hidden neighbors all must be mines). Runs only around new reveals.
function autoFlagPass(order) {
  if (!G || !G.generated) return;
  const candidates = new Set();
  for (const o of order) {
    candidates.add(o.i);
    for (const nb of G.cells[o.i].nbrs) candidates.add(nb);
  }
  let any = false;
  for (const i of candidates) {
    if (G.state[i] !== ST_REVEALED || G.adj[i] === 0) continue;
    let flags = 0;
    const hidden = [];
    for (const nb of G.cells[i].nbrs) {
      const s = G.state[nb];
      if (s === ST_FLAG) flags++;
      else if (s === ST_HIDDEN || s === ST_Q) hidden.push(nb);
    }
    if (hidden.length && flags + hidden.length === G.adj[i]) {
      for (const nb of hidden) {
        if (G.state[nb] === ST_Q) G.state[nb] = ST_HIDDEN;
        G.state[nb] = ST_FLAG; G.flags++; any = true; Renderer.popCell(nb);
      }
    }
  }
  if (any) updateHUD();
}

/* ---- losing, undo, winning ---- */
function mineHit(i) {
  G.state[i] = ST_REVEALED;
  G.fatal = { i, moveNum: G.moveCount + 1 };
  postMove('x', i);
  timerStop();
  G.status = 'lost';
  setFace('😵');
  haptic([90, 40, 160]);
  Renderer.explode(i);
  // What did the visible position actually prove before this click?
  const st = G.state[i];
  G.state[i] = ST_HIDDEN;
  let recap = null;
  try {
    const ded = deduceVisible(G);
    recap = {
      fatalWasProvenMine: ded.provenMine.has(i),
      safeAvailable: ded.provenSafe.size,
      provenSafe: [...ded.provenSafe].slice(0, 400),
      provenMine: [...ded.provenMine].slice(0, 400),
    };
  } catch (e) { console.error(e); }
  G.state[i] = st;
  G.recap = recap;
  saveNow();
  const canUndo = G.allowUndo && G.undosUsed < 1;
  if (!canUndo) finalizeGame(false);
  setTimeout(() => showEndCard(false, canUndo), Settings.get('anim') ? 850 : 60);
}

function undoMineHit() {
  if (!G || G.status !== 'lost' || !G.fatal || !G.allowUndo || G.undosUsed >= 1 || G.finalized) return;
  G.state[G.fatal.i] = ST_HIDDEN;
  G.undosUsed++;
  G.status = 'play';
  G.fatal = null;
  G.recap = null;
  hideOverlays();
  setFace('🙂');
  timerStart();
  startTimerLoop();
  postMove('u', -1);
  Renderer.requestDraw();
  showToast('Undone — that one stays buried (1/1 used)');
}

function checkWin() {
  if (!G || G.status !== 'play' || !G.generated) return;
  if (G.revealedSafe < G.safeTotal) return;
  timerStop();
  G.status = 'won';
  // dress the board: every mine gets its flag
  for (let i = 0; i < G.N; i++) {
    if (G.mines[i] && G.state[i] !== ST_FLAG) { G.state[i] = ST_FLAG; G.flags++; }
  }
  setFace('😎');
  haptic([25, 30, 25, 30, 60]);
  finalizeGame(true);
  Renderer.winSweep();
  updateHUD();
  setTimeout(() => showEndCard(true, false), Settings.get('anim') ? 1050 : 60);
}

function finalizeGame(won) {
  if (!G || G.finalized) return;
  G.finalized = true;
  store.remove('save');
  stopTimerLoop();
  const timeMs = Math.round(timerElapsed());
  const result = buildResult(won, timeMs);
  G.result = result;
  if (!G.practice) {
    try { Stats.record(result); } catch (e) { console.error(e); }
    try { CloudGame.submitResult(result); } catch (e) { console.error(e); }
  }
  try { ModeHooks.onFinish(result); } catch (e) { console.error(e); }
}

/* ---- pause / auto-pause ---- */
function pauseGame() {
  if (!G || G.status !== 'play') return;
  timerStop();
  G.status = 'pause';
  setFace('😴');
  saveNow();
  showPauseOverlay(false);
  updateHUD();
}
function resumeGame() {
  if (!G || G.status !== 'pause') return;
  G.status = 'play';
  timerStart();
  startTimerLoop();
  setFace('🙂');
  $('pause-overlay').classList.add('hidden');
  Renderer.requestDraw();
  updateHUD();
}
function togglePause() {
  if (!G) return;
  if (G.status === 'play') pauseGame();
  else if (G.status === 'pause') resumeGame();
}

/* ---- HUD ---- */
let _timerLoop = null;
function startTimerLoop() {
  if (_timerLoop) return;
  _timerLoop = setInterval(() => {
    if (!G || G.status !== 'play') { stopTimerLoop(); return; }
    const el = $('time-lcd');
    if (el) el.textContent = G.practice ? '∞' : fmtTimeMs(timerElapsed());
  }, 250);
}
function stopTimerLoop() { clearInterval(_timerLoop); _timerLoop = null; }

function updateHUD() {
  const minesEl = $('mines-left');
  if (minesEl && G) {
    const left = (G.minesTotal || 0) - (G.flags || 0);
    minesEl.textContent = String(Math.max(-99, left)).padStart(3, '0').replace('-0', '-');
  }
  const timeEl = $('time-lcd');
  if (timeEl && G) {
    timeEl.textContent = G.practice ? '∞' : fmtTimeMs(timerElapsed());
    timeEl.parentElement.classList.toggle('paused-blink', G.status === 'pause');
  }
  const pauseBtn = $('pause-btn');
  if (pauseBtn && G) {
    pauseBtn.style.visibility = (G.status === 'play' || G.status === 'pause') ? 'visible' : 'hidden';
  }
}
function setFace(f) { const el = $('face-btn'); if (el) el.textContent = f; }

function updateModeChip() {
  const el = $('mode-chip');
  if (!el || !G) return;
  const m = G.meta.mode;
  const label =
    m === 'daily' ? 'Daily · ' + (G.meta.dailyKey || '') :
    m === 'rogue' ? 'Rogue · stage ' + ((G.meta.rogue && G.meta.rogue.stage) || 1) :
    m === 'story' ? 'Story · ch.' + ((G.meta.chapter | 0) + 1) :
    m === 'challenge' ? 'Challenge' :
    m === 'trn' ? 'Tournament R' + ((G.meta.round | 0) + 1) :
    (presetKeyFor(G.spec) ? PRESETS[presetKeyFor(G.spec)].label : 'Custom');
  el.textContent = label + (G.practice ? ' · practice' : '');
}

function updateBoardInfo() {
  if (!G) return;
  const stars = $('bi-stars'), ng = $('bi-ng'), seed = $('bi-seed');
  if (stars) stars.textContent = G.generated ? '★'.repeat(G.stars) + '☆'.repeat(Math.max(0, 5 - G.stars)) : '★…';
  if (ng) {
    const a = G.analysis;
    if (!G.generated) { ng.textContent = ''; }
    else if (a && a.guessFree) { ng.textContent = 'no-guess ✓'; ng.className = 'ng'; }
    else if (a && a.checked) { ng.textContent = 'may need guesses'; ng.className = 'ng guessy'; }
    else { ng.textContent = 'unchecked'; ng.className = 'ng guessy'; }
  }
  if (seed) seed.textContent = G.spec.s;
}

function hideOverlays() {
  const p = $('pause-overlay'), e = $('end-overlay');
  if (p) p.classList.add('hidden');
  if (e) e.classList.add('hidden');
}
function showPauseOverlay(fromResume) {
  const p = $('pause-overlay');
  if (!p) return;
  $('pause-sub').textContent = fromResume
    ? 'Welcome back — your game was restored right where you left it.'
    : 'The timer is frozen. The board is hidden — no peeking.';
  p.classList.remove('hidden');
}
/* ============================================
   §08 RENDERER — virtualized canvas board.
   Only cells inside the viewport are drawn (spatial buckets), with a
   low-detail mode when zoomed far out, so huge boards stay smooth. All art
   that can be swapped lives in mine/assets/<pack>/ — the renderer falls
   back to built-in vector drawing if an asset is missing.
   ============================================ */
const ASSET_PACKS = { modern: 'mine/assets/modern/', retro: 'mine/assets/retro/' };
const ASSET_FILES = ['flag', 'mine', 'boom', 'question'];

const NUM_COLORS = {
  light: ['', '#1094A7', '#0F9768', '#C91717', '#573C7D', '#933D23', '#17697A', '#2A2A32', '#6C2834', '#0F5367', '#7E2F18', '#041A1F', '#3F2323'],
  dark:  ['', '#59CEE0', '#33C798', '#F73D3D', '#9F84C7', '#D26949', '#35B4C5', '#D5DDDF', '#BC6274', '#3CC3D6', '#FFBA80', '#EFF3F4', '#F2D4D3'],
  retro: ['', '#0000ff', '#008000', '#ff0000', '#000080', '#800000', '#008080', '#000000', '#808080', '#000060', '#600000', '#006060', '#404040'],
};
const BOARD_PALETTES = {
  light: {
    bg: '#EFF3F4', hidden: '#FAFCFC', hiddenHover: '#FFFFFF',
    bevelLight: 'rgba(255,255,255,0.95)', bevelDark: 'rgba(158,178,186,0.55)',
    revealed: '#E2E8E9', revealedBevelDark: 'rgba(158,178,186,0.4)', revealedBevelLight: 'rgba(255,255,255,0.75)',
    line: '#D5DDDF', fatalBg: '#F3C1C1', mineBg: '#E9DFE0', flagWrongX: '#C91717',
    startRing: '#20808D', cursor: '#1FB8CD', numbers: NUM_COLORS.light,
    inset: 0.93, gapLine: false, sunkenLine: 'rgba(116,136,140,0.35)',
    press: '#E8EDEE', torusEdge: 'rgba(32,128,141,0.5)',
    confetti: ['#1FB8CD', '#17A778', '#FFD166', '#7B5EA7', '#F73D3D', '#20808D', '#FFBA80'],
  },
  dark: {
    bg: '#141418', hidden: '#33333F', hiddenHover: '#3C3C4A',
    bevelLight: 'rgba(122,122,148,0.4)', bevelDark: 'rgba(0,0,0,0.55)',
    revealed: '#1F1F25', revealedBevelDark: 'rgba(0,0,0,0.5)', revealedBevelLight: 'rgba(122,122,148,0.22)',
    line: '#2A2A32', fatalBg: '#5c2323', mineBg: '#3a2c31', flagWrongX: '#F73D3D',
    startRing: '#1FB8CD', cursor: '#59CEE0', numbers: NUM_COLORS.dark,
    inset: 0.93, gapLine: false, sunkenLine: 'rgba(0,0,0,0.4)',
    press: '#26262E', torusEdge: 'rgba(31,184,205,0.5)',
    confetti: ['#1FB8CD', '#33C798', '#FFD166', '#9F84C7', '#F73D3D', '#59CEE0', '#FFBA80'],
  },
  retro: {
    bg: '#bdbdbd', hidden: '#c0c0c0', hiddenHover: '#c8c8c8',
    bevelLight: '#ffffff', bevelDark: '#808080',
    revealed: '#c0c0c0', revealedBevelDark: '#808080', revealedBevelLight: '#c0c0c0',
    line: '#808080', fatalBg: '#ff0000', mineBg: '#c0c0c0', flagWrongX: '#ff0000',
    startRing: '#000080', cursor: '#000080', numbers: NUM_COLORS.retro,
    inset: 1.0, gapLine: true, sunkenLine: '#808080',
    press: '#c0c0c0', torusEdge: 'rgba(0,0,128,0.6)',
    confetti: ['#ff0000', '#0000ff', '#008000', '#ffff00', '#ff00ff', '#00ffff'],
  },
};

const Renderer = (() => {
  let canvas = null, ctx = null, dpr = 1, W = 0, H = 0;
  let fx = null, fxCtx = null;
  let game = null;
  let pal = BOARD_PALETTES.light;
  let assetPack = 'modern';
  const assets = { modern: {}, retro: {} };

  const cam = { x: 0, y: 0, scale: 48 };  // world top-left offset + px per world unit
  let minScale = 4, maxScale = 200;
  let inertiaV = null;                     // {vx, vy} px/frame
  let hoverI = -1, cursorI = -1;
  let pressed = new Set();

  // animation registry
  const revealAnims = new Map();           // i -> {t0, dur}
  let flagPops = new Map();                // i -> t0
  let pulseCells = null;                   // {cells:[], t0}
  let boomFx = null;                       // {x, y, t0, parts:[...]}
  let sweepFx = null;                      // {t0, cx, cy, maxR}
  let confetti = null;                     // [{x,y,vx,vy,rot,vr,c,w,h,phase}]
  let rafId = null, needsDraw = false;

  /* ---- assets ---- */
  function loadAssets() {
    for (const [pack, base] of Object.entries(ASSET_PACKS)) {
      for (const name of ASSET_FILES) {
        const img = new Image();
        img.decoding = 'async';
        img.onload = () => requestDraw();
        img.onerror = () => {};
        img.src = base + name + '.svg';
        assets[pack][name] = img;
      }
    }
  }
  function assetFor(name) {
    const img = assets[assetPack] && assets[assetPack][name];
    return img && img.complete && img.naturalWidth > 0 ? img : null;
  }

  /* ---- theme ---- */
  function applyTheme(themeName, packName) {
    pal = BOARD_PALETTES[themeName] || BOARD_PALETTES.light;
    assetPack = packName === 'auto' ? (themeName === 'retro' ? 'retro' : 'modern') : packName;
    if (game) precomputeCells();       // inset differs per theme (retro tiles touch)
    requestDraw();
  }

  /* ---- setup ---- */
  function init() {
    canvas = $('board');
    ctx = canvas.getContext('2d', { alpha: false });
    fx = $('fx');
    fxCtx = fx.getContext('2d');
    loadAssets();
    resize();
    window.addEventListener('resize', resize);
  }
  function resize() {
    if (!canvas) return;
    dpr = Math.min(3, window.devicePixelRatio || 1);
    const rect = canvas.parentElement.getBoundingClientRect();
    W = Math.max(1, rect.width);
    H = Math.max(1, rect.height);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    fx.width = Math.round(window.innerWidth * dpr);
    fx.height = Math.round(window.innerHeight * dpr);
    if (game) clampCamera();
    requestDraw();
  }

  /* ---- geometry precompute per game ---- */
  function setGame(g) {
    game = g;
    revealAnims.clear(); flagPops.clear();
    pulseCells = null; boomFx = null; sweepFx = null;
    pressed = new Set(); hoverI = -1; cursorI = -1;
    if (!g) return;
    precomputeCells();
  }
  function precomputeCells() {
    const k = pal.inset;
    for (const cell of game.cells) {
      // inradius: min distance center -> edge
      let rIn = Infinity;
      const v = cell.verts;
      for (let i = 0; i < v.length; i++) {
        const [x1, y1] = v[i], [x2, y2] = v[(i + 1) % v.length];
        const dx = x2 - x1, dy = y2 - y1;
        const len = Math.hypot(dx, dy) || 1;
        const d = Math.abs((cell.cx - x1) * dy - (cell.cy - y1) * dx) / len;
        if (d < rIn) rIn = d;
      }
      cell.rIn = rIn;
      // inset polygon for the tile-with-gap look (retro tiles touch: k = 1)
      cell.iverts = v.map(([x, y]) => [cell.cx + (x - cell.cx) * k, cell.cy + (y - cell.cy) * k]);
      // bevel edge classification vs light from top-left
      cell.lightE = []; cell.darkE = [];
      for (let i = 0; i < v.length; i++) {
        const a = cell.iverts[i], b = cell.iverts[(i + 1) % v.length];
        const nx = (b[1] - a[1]), ny = -(b[0] - a[0]);      // outward-ish normal
        // ensure normal points away from center
        const ox = (a[0] + b[0]) / 2 - cell.cx, oy = (a[1] + b[1]) / 2 - cell.cy;
        const flip = nx * ox + ny * oy < 0 ? -1 : 1;
        const dot = flip * (nx * -0.707 + ny * -0.707);
        (dot > 0 ? cell.lightE : cell.darkE).push([a, b]);
      }
    }
  }

  /* ---- camera ---- */
  function fitCamera() {
    if (!game) return;
    const bb = game.grid.bbox;
    const pad = 24;
    const sc = Math.min((W - pad * 2) / bb.w, (H - pad * 2) / bb.h);
    cam.scale = clamp(sc, 2, 92);
    minScale = Math.min(cam.scale * 0.5, 6);
    maxScale = 220;
    cam.x = bb.x0 - (W / cam.scale - bb.w) / 2;
    cam.y = bb.y0 - (H / cam.scale - bb.h) / 2;
    requestDraw();
  }
  function clampCamera() {
    if (!game) return;
    const bb = game.grid.bbox;
    const viewW = W / cam.scale, viewH = H / cam.scale;
    const margX = Math.max(viewW * 0.6, 2), margY = Math.max(viewH * 0.6, 2);
    cam.x = clamp(cam.x, bb.x0 - margX, bb.x1 + margX - viewW);
    cam.y = clamp(cam.y, bb.y0 - margY, bb.y1 + margY - viewH);
  }
  function zoomAt(sx, sy, factor) {
    const wx = cam.x + sx / cam.scale, wy = cam.y + sy / cam.scale;
    cam.scale = clamp(cam.scale * factor, minScale, maxScale);
    cam.x = wx - sx / cam.scale;
    cam.y = wy - sy / cam.scale;
    clampCamera();
    requestDraw();
  }
  function panBy(dx, dy) {
    cam.x -= dx / cam.scale;
    cam.y -= dy / cam.scale;
    clampCamera();
    requestDraw();
  }
  function startInertia(vx, vy) {
    if (Math.hypot(vx, vy) < 1.5) return;
    inertiaV = { vx, vy };
    requestDraw();
  }
  function stopInertia() { inertiaV = null; }
  function screenToWorld(sx, sy) { return [cam.x + sx / cam.scale, cam.y + sy / cam.scale]; }
  function cellAtScreen(sx, sy) {
    if (!game) return -1;
    const [wx, wy] = screenToWorld(sx, sy);
    return game.grid.hit.query(wx, wy);
  }

  /* ---- animation entry points ---- */
  function animateReveal(order, originI) {
    if (!Settings.get('anim') || order.length === 0) { requestDraw(); return; }
    const t0 = performance.now();
    // wave: delay by BFS ring distance, slight per-cell jitter for a natural feel
    for (const o of order) {
      const jitter = (xmur3(o.i + ':' + t0)() % 100) / 100 * 24;
      revealAnims.set(o.i, { t0: t0 + Math.min(o.d * 26, 900) + jitter, dur: 230 });
    }
    requestDraw();
  }
  function popCell(i) {
    if (!Settings.get('anim')) { requestDraw(); return; }
    flagPops.set(i, performance.now());
    requestDraw();
  }
  function pulseNeighbors(i) {
    if (!game) return;
    pulseCells = { cells: [i, ...game.cells[i].nbrs], t0: performance.now() };
    haptic(8);
    requestDraw();
  }
  function explode(i) {
    const cell = game.cells[i];
    const stage = $('stage');
    if (stage && Settings.get('anim')) {
      stage.classList.remove('shake');
      void stage.offsetWidth;
      stage.classList.add('shake');
      setTimeout(() => stage.classList.remove('shake'), 550);
    }
    if (!Settings.get('anim')) { requestDraw(); return; }
    const parts = [];
    const rng = Math.random;
    for (let k = 0; k < 30; k++) {
      const a = rng() * Math.PI * 2;
      const sp = 2 + rng() * 8;
      parts.push({
        x: cell.cx, y: cell.cy,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3,
        r: 0.05 + rng() * 0.13,
        c: [pal.numbers[3], '#2A2A32', pal.confetti[2], pal.numbers[5]][k % 4],
        life: 1,
      });
    }
    boomFx = { i, t0: performance.now(), parts };
    requestDraw();
  }
  function winSweep() {
    if (!game) return;

      t0: performance.now(),
      cx: (bb.x0 + bb.x1) / 2, cy: (bb.y0 + bb.y1) / 2,
      maxR: Math.hypot(bb.w, bb.h) / 2 + 1,

    requestDraw();

  function spawnConfetti() {

    const vw = window.innerWidth, count = clamp(Math.round(vw / 7), 90, 220);
    for (let k = 0; k < count; k++) {

        x: Math.random() * vw,
        y: -30 - Math.random() * window.innerHeight * 0.6,
        vx: (Math.random() - 0.5) * 2.2,
        vy: 2.2 + Math.random() * 3.6,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.28,
        c: pal.confetti[k % pal.confetti.length],

    }

  }

  function setHover(i) { if (hoverI !== i) { hoverI = i; requestDraw(); } }

  /* ---- draw helpers ---- */
  function poly(vs) {

    ctx.moveTo((vs[0][0] - cam.x) * cam.scale, (vs[0][1] - cam.y) * cam.scale);

    ctx.strokeStyle = color;
    ctx.lineWidth = w;

      ctx.moveTo((a[0] - cam.x) * cam.scale, (a[1] - cam.y) * cam.scale);

    }

  }
  function drawAsset(name, cx, cy, size, alpha) {
    const img = assetFor(name);
    const sx = (cx - cam.x) * cam.scale, sy = (cy - cam.y) * cam.scale;
    const px = size * cam.scale;
    ctx.save();
    if (alpha != null) ctx.globalAlpha = alpha;
    if (img) {
      ctx.drawImage(img, sx - px / 2, sy - px / 2, px, px);

        ctx.beginPath(); ctx.moveTo(sx - px * 0.12, sy - px * 0.42); ctx.lineTo(sx - px * 0.12, sy + px * 0.42); ctx.stroke();
        ctx.fillStyle = pal.numbers[3];
        ctx.beginPath(); ctx.moveTo(sx - px * 0.12, sy - px * 0.42); ctx.lineTo(sx + px * 0.38, sy - px * 0.2); ctx.lineTo(sx - px * 0.12, sy + 0.02 * px); ctx.closePath(); ctx.fill();

    case 'reveal': actReveal(i); break;
    case 'flag': actFlag(i); break;
    case 'chord': actChord(i); break;
    case 'question': actQuestion(i); break;
    case 'smart': (G.state[i] === ST_REVEALED ? actChord : actQuestion)(i); break;
    case 'smartflag': (G.state[i] === ST_REVEALED ? actChord : actFlag)(i); break;
  }

const Input = (() => {
  let canvas = null;
  const pointers = new Map();       // id -> {x, y, sx, sy, t0, button, type, moved}
  let mode = null;                  // null | 'pan' | 'pinch'

      mode = 'pinch';

        dist: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y),
        scale: Renderer.scale,
        mx: (pts[0].x + pts[1].x) / 2, my: (pts[0].y + pts[1].y) / 2,

      Renderer.setPressed(null);

    }

          if (G.status === 'play' || G.status === 'idle') setFace('😮');

          const set = new Set();
          for (const nb of G.cells[i].nbrs) if (G.state[nb] === ST_HIDDEN || G.state[nb] === ST_Q) set.add(nb);

    if (mode === 'pinch' && pointers.size >= 2) {
      const pts = [...pointers.values()];
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      const mx = (pts[0].x + pts[1].x) / 2, my = (pts[0].y + pts[1].y) / 2;
      if (pinchStart && pinchStart.dist > 12) {
        const target = pinchStart.scale * (dist / pinchStart.dist);
        Renderer.zoomAt(mx, my, target / Renderer.scale);
      }
      Renderer.panBy(mx - (pinchStart ? pinchStart.mx : mx), my - (pinchStart ? pinchStart.my : my));
      if (pinchStart) { pinchStart.mx = mx; pinchStart.my = my; }
      return;
    }

    const slop = p.type === 'touch' ? SLOP_TOUCH : SLOP_MOUSE;
    if (!p.moved && Math.hypot(x - p.sx, y - p.sy) > slop) {
      p.moved = true;
      if (!longFired) { clearLong(); }
      mode = 'pan';
      canvas.classList.add('grabbing');
      Renderer.setPressed(null);
      if (G && (G.status === 'play' || G.status === 'idle')) setFace('🙂');
    }
    if (mode === 'pan') Renderer.panBy(dx, dy);
  }

  function onPointerUp(e) {
    const p = pointers.get(e.pointerId);
    pointers.delete(e.pointerId);
    Renderer.setPressed(null);
    if (G && (G.status === 'play' || G.status === 'idle')) setFace('🙂');
    if (!p) return;

    if (mode === 'pinch') {
      if (pointers.size < 2) { mode = pointers.size === 1 ? 'pan' : null; pinchStart = null; suppressUntil = performance.now() + 150; }
      return;
    }
    clearLong();
    if (mode === 'pan') {
      if (pointers.size === 0) {
        mode = null;
        canvas.classList.remove('grabbing');
        // inertia from recent velocity
        if (velSamples.length >= 2) {
          const a = velSamples[0], b = velSamples[velSamples.length - 1];
          const dt = Math.max(1, b.t - a.t);
          Renderer.startInertia((b.x - a.x) / dt * 16, (b.y - a.y) / dt * 16);
        }
      }
      return;
    }
    if (longFired) { longFired = false; return; }
    if (performance.now() < suppressUntil) return;
    if (!G) return;

    const i = cellAt(e);
    if (i < 0) return;
    if (G.status === 'pause') { resumeGame(); return; }

    if (p.type === 'touch') {
      const nowT = performance.now();
      const dblAct = Settings.get('ctl.dbltap');
      if (dblAct && dblAct !== 'none' && lastTap.i === i && nowT - lastTap.t < DBL_MS && G.state[i] === ST_REVEALED) {
        lastTap = { i: -1, t: 0 };
        runAction(dblAct, i);
        return;
      }
      lastTap = { i, t: nowT };
      runAction(Settings.get('ctl.tap'), i);
    } else {
      const map = { 0: 'left', 1: 'middle', 2: 'right' };
      const slot = map[p.button];
      if (!slot) return;
      const nowT = performance.now();
      const dblAct = Settings.get('ctl.dbl');
      if (p.button === 0 && dblAct && dblAct !== 'none' && lastTap.i === i && nowT - lastTap.t < DBL_MS) {
        lastTap = { i: -1, t: 0 };
        runAction(dblAct, i);
        return;
      }
      if (p.button === 0) lastTap = { i, t: nowT };
      runAction(Settings.get('ctl.' + slot), i);
    }
  }

  function onPointerCancel(e) {
    pointers.delete(e.pointerId);
    clearLong();
    Renderer.setPressed(null);
    if (pointers.size === 0) { mode = null; canvas.classList.remove('grabbing'); }
  }

  function onWheel(e) {
    e.preventDefault();
    const [x, y] = canvasPos(e);
    const factor = Math.exp(-e.deltaY * (e.ctrlKey ? 0.008 : 0.0016));
    Renderer.zoomAt(x, y, factor);
  }

  /* ---- keyboard play ---- */
  function cursorOrCenter() {
    let cur = Renderer.getCursor();
    if (cur >= 0 && G && cur < G.N) return cur;
    if (!G) return -1;
    const { W, H } = Renderer.canvasSize();
    const [wx, wy] = Renderer.screenToWorld(W / 2, H / 2);
    let best = -1, bestD = Infinity;
    for (const cell of G.cells) {
      const d = (cell.cx - wx) ** 2 + (cell.cy - wy) ** 2;
      if (d < bestD) { bestD = d; best = cell.i; }
    }
    return best;
  }
  function moveCursor(dx, dy) {
    if (!G) return;
    let cur = cursorOrCenter();
    if (cur < 0) return;
    const c = G.cells[cur];
    let best = -1, bestScore = Infinity;
    for (const cell of G.cells) {
      if (cell.i === cur) continue;
      const ex = cell.cx - c.cx, ey = cell.cy - c.cy;
      const dist = Math.hypot(ex, ey);
      if (dist < 1e-6) continue;
      const dot = (ex * dx + ey * dy) / dist;
      if (dot < 0.45) continue;                       // must be roughly that direction
      const perp = Math.abs(ex * dy - ey * dx);       // sideways drift penalty
      const score = dist + perp * 1.6;
      if (score < bestScore) { bestScore = score; best = cell.i; }
    }
    if (best >= 0) {
      Renderer.setCursor(best);
      ensureCursorVisible(best);
    }
  }
  function ensureCursorVisible(i) {
    const cell = G.cells[i];
    const { W, H } = Renderer.canvasSize();
    const sx = (cell.cx - Renderer.cam.x) * Renderer.scale;
    const sy = (cell.cy - Renderer.cam.y) * Renderer.scale;
    const M = 60;
    let dx = 0, dy = 0;
    if (sx < M) dx = M - sx; else if (sx > W - M) dx = W - M - sx;
    if (sy < M) dy = M - sy; else if (sy > H - M) dy = H - M - sy;
    if (dx || dy) Renderer.panBy(dx, dy);
  }

  function onKeyDown(e) {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const sheetOpen = $('sheet-wrap').classList.contains('open');
    if (e.key === 'Escape') {
      if (sheetOpen) { closeSheet(); return; }
      if ($('drawer').classList.contains('open')) { closeDrawer(); return; }
      if (G && G.status === 'play') pauseGame();
      else if (G && G.status === 'pause') resumeGame();
      return;
    }
    if (sheetOpen) return;
    const keys = Settings.get('keys');
    const code = e.code;
    let handled = true;
    if (code === 'ArrowLeft') moveCursor(-1, 0);
    else if (code === 'ArrowRight') moveCursor(1, 0);
    else if (code === 'ArrowUp') moveCursor(0, -1);
    else if (code === 'ArrowDown') moveCursor(0, 1);
    else if (code === keys.reveal) { const c = cursorOrCenter(); if (c >= 0) { Renderer.setCursor(c); runAction('reveal', c); } }
    else if (code === keys.flag) { const c = cursorOrCenter(); if (c >= 0) { Renderer.setCursor(c); runAction('flag', c); } }
    else if (code === keys.chord) { const c = cursorOrCenter(); if (c >= 0) { Renderer.setCursor(c); runAction('chord', c); } }
    else if (code === keys.question) { const c = cursorOrCenter(); if (c >= 0) { Renderer.setCursor(c); runAction('question', c); } }
    else if (code === 'KeyP') togglePause();
    else if (code === 'KeyN') restartFresh();
    else if (code === 'Equal' || code === 'NumpadAdd') { const { W, H } = Renderer.canvasSize(); Renderer.zoomAt(W / 2, H / 2, 1.25); }
    else if (code === 'Minus' || code === 'NumpadSubtract') { const { W, H } = Renderer.canvasSize(); Renderer.zoomAt(W / 2, H / 2, 0.8); }
    else if (code === 'Digit0') Renderer.fitCamera();
    else handled = false;
    if (handled) e.preventDefault();
  }

  function init() {
    canvas = $('board');
    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', onPointerCancel);
    canvas.addEventListener('pointerleave', () => Renderer.setHover(-1));
    canvas.addEventListener('wheel', onWheel, { passive: false });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('dblclick', e => e.preventDefault());
    window.addEventListener('keydown', onKeyDown);
  }
  return { init };
})();
/* ============================================
   §10 SCORING, SKILL RATING & STATS
   Solve score works even on a loss: difficulty × progress^1.5 × speed bonus.
   Skill rating is ELO-style vs the board's difficulty, driven by solve
   EFFICIENCY (3BV/s), not raw time.
   ============================================ */
function gridMult(spec) {
  let k = spec.g === 'tri' ? 1.1 : spec.g === 'hex' ? 0.95 : 1.0;
  if (spec.t) k += 0.15;
  if (spec.sh) k += 0.05;
  return k;
}
function difficultyPoints(spec, N, minesTotal, stars) {
  const density = minesTotal / Math.max(1, N);
  return minesTotal * (1 + 3 * density) * gridMult(spec) * (1 + 0.1 * ((stars || 1) - 1));
}
function computeScore(game, won, timeMs) {
  const N = game.N, m = game.minesTotal;
  const D = difficultyPoints(game.spec, N, m, game.stars);
  const progress = won ? 1 : clamp(game.revealedSafe / Math.max(1, game.safeTotal), 0, 1);
  const timeSec = Math.max(1, timeMs / 1000);
  const bvDone = (game.bv3 || 1) * progress;
  const bvps = bvDone / timeSec;
  const speedBonus = 0.9 * clamp(bvps / 0.5, 0, 2);
  const score = Math.round(D * Math.pow(progress, 1.5) * (1 + speedBonus) * 10);
  return { score, bvps: Math.round(bvps * 1000) / 1000, D: Math.round(D), progress: Math.round(progress * 1000) / 1000 };
}

function buildResult(won, timeMs) {
  const sc = computeScore(G, won, timeMs);
  return {
    ts: Date.now(), won: !!won, timeMs,
    mode: G.meta.mode || 'classic',
    spec: canonicalSpec(G.spec),
    fp: specFingerprint(G.spec),
    preset: presetKeyFor(G.spec),
    score: sc.score, eff: sc.bvps, progress: sc.progress, D: sc.D,
    stars: G.stars, bv3: G.bv3, guessFree: !!(G.analysis && G.analysis.guessFree),
    undos: G.undosUsed, moves: G.moveCount,
    practice: !!G.practice,
    dailyKey: G.meta.dailyKey || null,
    challengeOf: G.meta.challenge ? G.meta.challenge.by : null,
    trn: G.meta.trn || null, round: G.meta.round,
    rogue: G.meta.rogue || null, chapter: G.meta.chapter,
    fatal: G.fatal ? { i: G.fatal.i, moveNum: G.fatal.moveNum } : null,
  };
}

/* ---- rating ---- */
function boardEloRating(D) { return 600 + 400 * Math.log10(1 + D / 25); }

const Stats = (() => {
  function profile() {
    const p = store.getJSON('profile') || {};
    if (!p.rating) p.rating = 1000;
    if (!Array.isArray(p.games)) p.games = [];
    if (!p.created) p.created = Date.now();
    return p;
  }
  function save(p) { p.updated = Date.now(); store.setJSON('profile', p); }

  function record(result) {
    if (result.practice) return;
    const p = profile();
    // ELO-ish update driven by solve efficiency
    const B = boardEloRating(result.D);
    const R = p.rating;
    const E = 1 / (1 + Math.pow(10, (B - R) / 400));
    const A = result.won
      ? 0.5 + 0.5 * clamp(result.eff / 0.55, 0, 1)
      : 0.45 * clamp(result.progress, 0, 1);
    const K = p.games.length < 20 ? 40 : 24;
    p.rating = Math.round((R + K * (A - E)) * 10) / 10;
    result.ratingAfter = p.rating;
    // compact history entry
    p.games.push({
      ts: result.ts, w: result.won ? 1 : 0, t: result.timeMs, s: result.score,
      d: result.preset || (result.mode !== 'classic' ? result.mode : 'custom'),
      m: result.mode, e: result.eff, u: result.undos, st: result.stars,
      fp: result.fp, r: p.rating, dk: result.dailyKey || undefined,
    });
    if (p.games.length > 500) p.games.splice(0, p.games.length - 500);
    save(p);
    return p;
  }

  function aggregates(p) {
    p = p || profile();
    const per = {};   // diff -> {plays, wins, bestT, sumT, winT}
    let streak = 0, bestStreak = 0;
    for (const gm of p.games) {
      const d = gm.d || 'custom';
      const a = per[d] || (per[d] = { plays: 0, wins: 0, bestT: null, sumT: 0, winT: 0, bestS: 0 });
      a.plays++;
      if (gm.s > a.bestS) a.bestS = gm.s;
      if (gm.w) {
        a.wins++;
        a.sumT += gm.t;
        a.winT++;
        if (gm.u === 0 && (a.bestT == null || gm.t < a.bestT)) a.bestT = gm.t;
        streak++;
        if (streak > bestStreak) bestStreak = streak;
      } else streak = 0;
    }
    const totals = { plays: p.games.length, wins: p.games.filter(g => g.w).length };
    return { per, totals, streak, bestStreak, rating: p.rating };
  }

  function bestTimeFor(presetKey) {
    const p = profile();
    let best = null;
    for (const gm of p.games) {
      if (gm.d === presetKey && gm.w && gm.u === 0 && (best == null || gm.t < best)) best = gm.t;
    }
    return best;
  }

  // merge a cloud profile copy into local (union by timestamp)
  function mergeRemote(remote) {
    if (!remote || !Array.isArray(remote.games)) return profile();
    const p = profile();
    const seen = new Set(p.games.map(gm => gm.ts + ':' + (gm.fp || '')));
    let added = 0;
    for (const gm of remote.games) {
      const k = gm.ts + ':' + (gm.fp || '');
      if (!seen.has(k)) { p.games.push(gm); seen.add(k); added++; }
    }
    if (added) {
      p.games.sort((a, b) => a.ts - b.ts);
      if (p.games.length > 500) p.games.splice(0, p.games.length - 500);
      // rating: trust whichever copy played more recently
      if ((remote.updated || 0) > (p.updated || 0) && remote.rating) p.rating = remote.rating;
      save(p);
    }
    return p;
  }

  function exportForCloud() {
    const p = profile();
    return { n: Cloud.name, rating: p.rating, games: p.games.slice(-220), updated: p.updated || Date.now() };
  }

  return { profile, record, aggregates, bestTimeFor, mergeRemote, exportForCloud, save };
})();

/* ---- graph rendering (history trend, rating) ---- */
function themeVar(name, fallback) {
  try {
    const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;
  } catch { return fallback; }
}
function drawTrendGraph(canvasEl, points, opts) {
  // points: [{x: ts, y: value}], opts: {yFmt, color, fillHint}
  const dpr2 = Math.min(3, window.devicePixelRatio || 1);
  const rect = canvasEl.getBoundingClientRect();
  const w = Math.max(50, rect.width), hgt = Math.max(50, rect.height);
  canvasEl.width = w * dpr2; canvasEl.height = hgt * dpr2;
  const c = canvasEl.getContext('2d');
  c.setTransform(dpr2, 0, 0, dpr2, 0, 0);
  c.clearRect(0, 0, w, hgt);
  const accent = opts.color || themeVar('--m-accent', '#20808D');
  const faint = themeVar('--m-text-faint', '#96AAAE');
  if (!points || points.length < 2) {
    c.fillStyle = faint;
    c.font = '12px General Sans, sans-serif';
    c.textAlign = 'center';
    c.fillText(points && points.length === 1 ? 'One game so far — play more for a trend' : 'No games yet', w / 2, hgt / 2);
    return;
  }
  const pad = { l: 42, r: 10, t: 12, b: 20 };
  const xs = points.map(pt => pt.x), ys = points.map(pt => pt.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (y1 - y0 < 1e-9) { y0 -= 1; y1 += 1; }
  const yr = (y1 - y0) * 0.12;
  y0 -= yr; y1 += yr;
  const X = x => pad.l + (x - x0) / Math.max(1, x1 - x0) * (w - pad.l - pad.r);
  const Y = y => hgt - pad.b - (y - y0) / (y1 - y0) * (hgt - pad.t - pad.b);
  // gridlines
  c.strokeStyle = themeVar('--m-border-soft', '#D5DDDF');
  c.lineWidth = 1;
  c.fillStyle = faint;
  c.font = '10px JetBrains Mono, monospace';
  c.textAlign = 'right';
  for (let k = 0; k <= 3; k++) {
    const yv = y0 + (y1 - y0) * k / 3;
    const yy = Y(yv);
    c.beginPath(); c.moveTo(pad.l, yy); c.lineTo(w - pad.r, yy); c.stroke();
    c.fillText(opts.yFmt ? opts.yFmt(yv) : Math.round(yv), pad.l - 6, yy + 3);
  }
  // x labels: first + last date
  c.textAlign = 'left';
  c.fillText(new Date(x0).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }), pad.l, hgt - 6);
  c.textAlign = 'right';
  c.fillText(new Date(x1).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }), w - pad.r, hgt - 6);
  // line
  c.strokeStyle = accent;
  c.lineWidth = 2;
  c.lineJoin = 'round';
  c.beginPath();
  points.forEach((pt, k) => { const xx = X(pt.x), yy = Y(pt.y); k ? c.lineTo(xx, yy) : c.moveTo(xx, yy); });
  c.stroke();
  // soft fill
  c.globalAlpha = 0.12;
  c.lineTo(X(x1), hgt - pad.b);
  c.lineTo(X(x0), hgt - pad.b);
  c.closePath();
  c.fillStyle = accent;
  c.fill();
  c.globalAlpha = 1;
  // dots
  c.fillStyle = accent;
  for (const pt of points) {
    c.beginPath(); c.arc(X(pt.x), Y(pt.y), 2.6, 0, Math.PI * 2); c.fill();
  }
}

/* ---- loss heatmap over an actual board silhouette ---- */
function drawBoardHeatmap(canvasEl, spec, counts, opts) {
  // counts: Map(cellIndex -> weight)
  const grid = buildGrid(canonicalSpec(spec));
  const dpr2 = Math.min(3, window.devicePixelRatio || 1);
  const rect = canvasEl.getBoundingClientRect();
  const w = Math.max(60, rect.width);
  const aspect = grid.bbox.h / Math.max(0.001, grid.bbox.w);
  const hgt = clamp(w * aspect, 60, 340);
  canvasEl.style.height = hgt + 'px';
  canvasEl.width = w * dpr2; canvasEl.height = hgt * dpr2;
  const c = canvasEl.getContext('2d');
  c.setTransform(dpr2, 0, 0, dpr2, 0, 0);
  c.clearRect(0, 0, w, hgt);
  const pad = 8;
  const sc = Math.min((w - pad * 2) / grid.bbox.w, (hgt - pad * 2) / grid.bbox.h);
  const ox = (w - grid.bbox.w * sc) / 2 - grid.bbox.x0 * sc;
  const oy = (hgt - grid.bbox.h * sc) / 2 - grid.bbox.y0 * sc;
  let maxW = 0;
  counts.forEach(v => { if (v > maxW) maxW = v; });
  const base = themeVar('--m-border-soft', '#D5DDDF');
  for (const cell of grid.cells) {
    const v = counts.get(cell.i) || 0;
    c.beginPath();
    cell.verts.forEach(([x, y], k) => {
      const px = x * sc + ox, py = y * sc + oy;
      k ? c.lineTo(px, py) : c.moveTo(px, py);
    });
    c.closePath();
    if (v > 0 && maxW > 0) {
      const t = v / maxW;
      c.fillStyle = 'rgba(201,23,23,' + (0.16 + 0.72 * t).toFixed(3) + ')';
    } else {
      c.fillStyle = base;
    }
    c.fill();
    if (sc > 5) { c.strokeStyle = 'rgba(0,0,0,0.08)'; c.lineWidth = 0.5; c.stroke(); }
  }
  if (opts && opts.legendEl) {
    opts.legendEl.textContent = maxW > 0 ? 'darkest red = ' + maxW + (maxW === 1 ? ' loss' : ' losses') : 'no recorded losses yet';
  }
}
/* ============================================
   §11 CLOUD GAME DATA — every node is ciphertext (encryptText).
   Layout under rooms/__mine :
     lb/<boardId>/<userKey>   one best entry per player per board
     daily/<yyyy-mm-dd>       the day's board spec (get-or-create, last wins)
     heat/<yyyy-mm-dd>/<user> that player's daily loss points [{i, n}]
     players/<userKey>        profile snapshot (rating + recent games)
     trn/<code>               tournament doc (read-merge-write)
   Sync happens ONLY at: daily fetch, leaderboard view, game finish,
   tournament actions. Never while playing or paused.
   ============================================ */
const LB_TIME_BOARDS = new Set(['easy', 'medium', 'hard', 'extreme']);
function lbLabel(id) {
  if (id === 'alltime') return 'All-time · no undo';
  if (id === 'alltime-undo') return 'All-time · with undo';
  if (id === 'rogue') return 'Roguelike runs';
  if (LB_TIME_BOARDS.has(id)) return PRESETS[id].label + ' · best time';
  if (id.startsWith('daily:')) return 'Daily · ' + id.slice(6);
  if (id.startsWith('seed:')) return 'Seed ' + id.slice(5);
  return id;
}
function lbBetter(id, a, b) {
  // is a better than b on this board?
  if (!b) return true;
  if (LB_TIME_BOARDS.has(id)) return (a.t || 1e12) < (b.t || 1e12);
  if (a.s !== b.s) return (a.s || 0) > (b.s || 0);
  return (a.t || 1e12) < (b.t || 1e12);
}
function lbSort(id, rows) {
  rows.sort((a, b) => {
    if (LB_TIME_BOARDS.has(id)) return (a.t || 1e12) - (b.t || 1e12);
    if ((b.s || 0) !== (a.s || 0)) return (b.s || 0) - (a.s || 0);
    return (a.t || 1e12) - (b.t || 1e12);
  });
  return rows;
}

const CloudGame = (() => {

  function submitResult(result) {
    if (result.practice) return;
    if (!Cloud.on || !Cloud.userKey) return;      // playing anonymously: local stats only
    const ops = [];
    const base = { u: Cloud.name, t: result.timeMs, s: result.score, ts: result.ts, un: result.undos, eff: result.eff, w: result.won ? 1 : 0 };
    // score boards (undo split)
    ops.push({ k: 'lb', id: result.undos > 0 ? 'alltime-undo' : 'alltime', e: base });
    // preset time boards: clean wins only
    if (result.won && result.undos === 0 && result.preset && result.mode === 'classic') {
      ops.push({ k: 'lb', id: result.preset, e: base });
    }
    // daily
    if (result.mode === 'daily' && result.dailyKey) {
      ops.push({ k: 'lb', id: 'daily:' + result.dailyKey, e: base });
      if (!result.won && result.fatal) {
        ops.push({ k: 'heat', date: result.dailyKey, pt: { i: result.fatal.i, n: result.fatal.moveNum, ts: result.ts } });
      }
    }
    // shared-seed / challenge boards
    if (result.mode === 'challenge' || (result.mode === 'classic' && result.spec.st != null)) {
      ops.push({ k: 'lb', id: 'seed:' + result.fp, e: base });
    }
    // profile snapshot rides along on every finish
    ops.push({ k: 'prof' });
    processOps(ops);
  }

  async function processOps(ops) {
    for (let idx = 0; idx < ops.length; idx++) {
      try {
        await runSyncOpInner(ops[idx]);
      } catch (e) {
        // network/offline: queue this and the rest for reconnect
        for (let j = idx; j < ops.length; j++) queuePending(ops[j]);
        return;
      }
    }
  }

  async function runSyncOpInner(op) {
    if (!Cloud.on || !Cloud.userKey) throw new Error('not connected');
    if (op.k === 'lb') {
      const rel = 'lb/' + op.id + '/' + Cloud.userKey;
      const cur = await encGet(rel);
      if (lbBetter(op.id, op.e, cur)) await encSet(rel, op.e);
    } else if (op.k === 'heat') {
      const rel = 'heat/' + op.date + '/' + Cloud.userKey;
      const cur = (await encGet(rel)) || [];
      cur.push(op.pt);
      while (cur.length > 12) cur.shift();
      await encSet(rel, cur);
    } else if (op.k === 'prof') {
      const rel = 'players/' + Cloud.userKey;
      const remote = await encGet(rel);
      if (remote) Stats.mergeRemote(remote);
      await encSet(rel, Stats.exportForCloud());
    } else if (op.k === 'trnres') {
      await trnSubmitInner(op.id, op.round, op.res);
    }
  }

  async function fetchLeaderboard(id) {
    const raw = await encGetChildren('lb/' + id);
    const rows = Object.entries(raw).map(([key, v]) => Object.assign({ key }, v));
    return lbSort(id, rows);
  }

  async function fetchDaily(dateKey, createSpec) {
    const cacheKey = 'daily-spec:' + dateKey;
    const cached = store.getJSON(cacheKey);
    if (cached) return cached;
    let doc = null;
    try { doc = await encGet('daily/' + dateKey); } catch (e) {
      // offline: fall back to the deterministic local spec so play still works
      if (createSpec) return { spec: createSpec, local: true };
      throw e;
    }
    if (!doc && createSpec) {
      doc = { spec: createSpec, by: Cloud.name || 'anon', ts: Date.now() };
      try { await encSet('daily/' + dateKey, doc); } catch {}
    }
    if (doc && doc.spec) store.setJSON(cacheKey, doc);
    return doc;
  }

  async function fetchHeat(dateKey) {
    const raw = await encGetChildren('heat/' + dateKey);
    const points = [];
    for (const [user, arr] of Object.entries(raw)) {
      if (Array.isArray(arr)) for (const pt of arr) points.push({ u: user, i: pt.i, n: pt.n });
    }
    return points;
  }

  async function pullProfile() {
    if (!Cloud.on || !Cloud.userKey) return null;
    const remote = await encGet('players/' + Cloud.userKey);
    if (remote) Stats.mergeRemote(remote);
    return remote;
  }

  /* ---- tournaments ---- */
  function trnCode() {
    return uid().slice(-5).replace(/[^a-z0-9]/gi, 'x').toLowerCase();
  }
  async function trnCreate(name, players, roundsCount, presetBase) {
    const id = trnCode();
    const rounds = [];
    for (let r = 0; r < roundsCount; r++) {
      const p = PRESETS[presetBase] || PRESETS.medium;
      const variants = [
        { g: 'sq', w: p.w, h: p.h, m: p.m },
        { g: 'hex', w: p.w, h: p.h, m: Math.round(p.m * 0.9) },
        { g: 'sq', w: p.w, h: p.h, m: p.m, t: 1 },
        { g: 'tri', w: Math.round(p.w * 1.4), h: p.h, m: p.m },
        { g: 'sq', w: p.w, h: p.h, m: p.m, sh: 'ring' },
      ];
      const spec = canonicalSpec(Object.assign({}, variants[r % variants.length], {
        s: 'trn-' + id + '-r' + (r + 1), ng: 1,
      }));
      // fixed start cell so every player gets the identical opening
      const grid = buildGrid(spec);
      spec.st = centerCellOf(grid);
      spec.m = clamp(spec.m, 1, Math.max(1, grid.cells.length - 10));
      rounds.push({ spec });
    }
    const doc = { id, name: String(name || 'Tournament').slice(0, 40), players: players.slice(0, 16), rounds, results: {}, ts: Date.now(), by: Cloud.name || '' };
    await encSet('trn/' + id, doc);
    const mine = store.getJSON('my-trns') || [];
    if (!mine.includes(id)) { mine.push(id); store.setJSON('my-trns', mine); }
    return doc;
  }
  async function trnFetch(id) {
    const doc = await encGet('trn/' + id);
    if (doc) {
      const mine = store.getJSON('my-trns') || [];
      if (!mine.includes(id)) { mine.push(id); store.setJSON('my-trns', mine); }
      store.setJSON('trn-cache:' + id, doc);
    }
    return doc;
  }
  async function trnSubmitInner(id, round, res) {
    const doc = await encGet('trn/' + id);
    if (!doc) throw new Error('tournament missing');
    doc.results = doc.results || {};
    const slot = doc.results[round] || (doc.results[round] = {});
    const prev = slot[Cloud.userKey];
    if (!prev || (res.s || 0) > (prev.s || 0)) {
      slot[Cloud.userKey] = Object.assign({ u: Cloud.name, ts: Date.now() }, res);
      await encSet('trn/' + id, doc);
    }
    store.setJSON('trn-cache:' + id, doc);
    return doc;
  }
  async function trnSubmit(id, round, res) {
    const op = { k: 'trnres', id, round, res };
    try { await runSyncOpInner(op); } catch { queuePending(op); }
  }

  return { submitResult, fetchLeaderboard, fetchDaily, fetchHeat, pullProfile, trnCreate, trnFetch, trnSubmit, runSyncOpInner };
})();

// the queue's executor (referenced by flushPending in §04)
async function runSyncOp(op) { return CloudGame.runSyncOpInner(op); }

function centerCellOf(grid) {
  const bb = grid.bbox;
  const cx = (bb.x0 + bb.x1) / 2, cy = (bb.y0 + bb.y1) / 2;
  let best = 0, bestD = Infinity;
  for (const cell of grid.cells) {
    const d = (cell.cx - cx) ** 2 + (cell.cy - cy) ** 2;
    if (d < bestD) { bestD = d; best = cell.i; }
  }
  return best;
}

/* ---- Daily challenge: identical for everyone, no central server.
   The spec is a pure function of the UTC date, so even simultaneous
   creators write identical docs ("last wins" is invisible). ---- */
function dailySpecFor(dateKey) {
  const rnd = rngFor('daily:' + dateKey);
  const dow = new Date(dateKey + 'T12:00:00Z').getUTCDay();
  const weekend = dow === 0 || dow === 6;
  const menu = [
    { g: 'sq', w: 16, h: 16, density: 0.16 },
    { g: 'hex', w: 15, h: 13, density: 0.15 },
    { g: 'sq', w: 20, h: 14, density: 0.17, t: 1 },
    { g: 'tri', w: 26, h: 10, density: 0.15 },
    { g: 'sq', sh: 'heart', density: 0.15 },
    { g: 'sq', sh: 'skull', density: 0.16 },
    { g: 'sq', sh: 'ring', density: 0.16 },
    { g: 'sq', sh: 'cat', density: 0.15 },
    { g: 'sq', sh: 'star', density: 0.15 },
    { g: 'sq', sh: 'invader', density: 0.15 },
    { g: 'hex', sh: 'circle', w: 17, h: 15, density: 0.15 },
    { g: 'sq', sh: 'swiss', w: 18, h: 18, density: 0.15 },
  ];
  const pick = Object.assign({}, menu[Math.floor(rnd() * menu.length)]);
  if (!pick.w) {
    const dims = shapeDims(pick.sh, weekend ? 2 : 1);
    pick.w = dims.w; pick.h = dims.h;
  } else if (weekend) {
    pick.w = Math.round(pick.w * 1.25);
    pick.h = Math.round(pick.h * 1.25);
  }
  const spec = canonicalSpec({ g: pick.g, w: pick.w, h: pick.h, m: 10, t: pick.t || 0, sh: pick.sh || '', s: 'daily:' + dateKey, ng: 1 });
  const grid = buildGrid(spec);
  spec.m = Math.max(4, Math.round(grid.cells.length * (pick.density || 0.16)));
  spec.st = centerCellOf(grid);
  return spec;
}
function dailyDoneInfo(dateKey) { return store.getJSON('daily-done:' + dateKey); }
function refreshDailyBadge() {
  const badge = $('daily-badge');
  if (badge) badge.classList.toggle('hidden', !!dailyDoneInfo(dayKeyUTC()));
}
async function playDaily() {
  const dateKey = dayKeyUTC();
  const localSpec = dailySpecFor(dateKey);
  let spec = localSpec;
  if (Cloud.on) {
    try {
      const doc = await CloudGame.fetchDaily(dateKey, localSpec);
      if (doc && doc.spec) spec = canonicalSpec(doc.spec);
    } catch { /* offline: deterministic local spec matches what anyone would create */ }
  }
  closeSheet(); closeDrawer();
  newGame(spec, { mode: 'daily', dailyKey: dateKey });
}

/* ---- Roguelike: chained boards, escalating difficulty, run-based ---- */
const Rogue = {
  run() { return store.getJSON('rogue-run'); },
  best() { return store.getJSON('rogue-best'); },
  stageSpec(runSeed, stage) {
    const rnd = rngFor(runSeed + '|stage' + stage);
    const size = Math.round(7 + stage * 1.35 + rnd() * 2);
    const density = Math.min(0.21, 0.115 + stage * 0.0085);
    let g = 'sq', sh = '', t = 0;
    if (stage >= 3) {
      const roll = rnd();
      if (roll < 0.2) g = 'hex';
      else if (roll < 0.35) g = 'tri';
      else if (roll < 0.47 && stage >= 5) t = 1;
      else if (roll < 0.62 && stage >= 4) sh = ['ring', 'diamond', 'swiss', 'circle'][Math.floor(rnd() * 4)];
    }
    const w = g === 'tri' ? Math.round(size * 1.7) : size;
    const spec = canonicalSpec({ g, w, h: size, m: 10, t, sh, s: runSeed + '-s' + stage, ng: 1 });
    const grid = buildGrid(spec);
    spec.m = Math.max(3, Math.round(grid.cells.length * density));
    return spec;
  },
  mult(stage) { return 1 + 0.15 * (stage - 1); },
  start() {
    const run = { runSeed: 'rogue-' + randomSeed(), stage: 1, score: 0, startedTs: Date.now(), stages: [] };
    store.setJSON('rogue-run', run);
    Rogue.playStage(run);
  },
  playStage(run) {
    const spec = Rogue.stageSpec(run.runSeed, run.stage);
    closeSheet(); closeDrawer();
    newGame(spec, { mode: 'rogue', rogue: { stage: run.stage, runSeed: run.runSeed } });
  },
  onFinish(result) {
    const run = Rogue.run();
    if (!run || !result.rogue || result.rogue.runSeed !== run.runSeed) return;
    if (result.won) {
      const gained = Math.round(result.score * Rogue.mult(run.stage));
      run.score += gained;
      run.stages.push({ stage: run.stage, t: result.timeMs, s: gained });
      run.stage++;
      store.setJSON('rogue-run', run);
      result.rogueGained = gained;
      result.rogueTotal = run.score;
      result.rogueNext = true;
    } else {
      const partial = Math.round(result.score * Rogue.mult(run.stage) * 0.35);
      const total = run.score + partial;
      const best = Rogue.best();
      const isBest = !best || total > best.score;
      if (isBest) store.setJSON('rogue-best', { score: total, stages: run.stage - 1, ts: Date.now() });
      store.remove('rogue-run');
      result.rogueTotal = total;
      result.rogueOver = true;
      result.rogueBest = isBest;
      result.rogueStages = run.stage - 1;
      if (Cloud.on && Cloud.userKey && total > 0) {
        CloudGame.runSyncOpInner({ k: 'lb', id: 'rogue', e: { u: Cloud.name, t: Date.now() - run.startedTs, s: total, ts: Date.now(), un: 0, eff: run.stage - 1, w: run.stage - 1 } })
          .catch(() => queuePending({ k: 'lb', id: 'rogue', e: { u: Cloud.name, t: Date.now() - run.startedTs, s: total, ts: Date.now(), un: 0, eff: run.stage - 1, w: run.stage - 1 } }));
      }
    }
  },
};
