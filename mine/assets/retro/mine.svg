<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- classic mine: black ball, straight spikes, single white glint -->
  <rect x="30" y="4" width="4" height="56" fill="#000000"/>
  <rect x="4" y="30" width="56" height="4" fill="#000000"/>
  <g shape-rendering="auto">
    <line x1="13" y1="13" x2="51" y2="51" stroke="#000000" stroke-width="4"/>
    <line x1="51" y1="13" x2="13" y2="51" stroke="#000000" stroke-width="4"/>
    <circle cx="32" cy="32" r="16" fill="#000000"/>
  </g>
  <rect x="24" y="24" width="7" height="7" fill="#ffffff"/>
</svg>
