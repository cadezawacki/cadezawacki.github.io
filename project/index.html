<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f9598">
  <meta name="description" content="Cade.project — habit, goal, and task tracker">
  <title>Cade.project</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%230f9598' d='M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z'/></svg>">
  <link rel="stylesheet" href="styles.css">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%230f9598' d='M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z'/></svg>">
</head>
<body>

  <!-- ═══ MENUBAR ═══
       Mirrors Cade.txt: logo, action menus, the scope pill, the tab strip,
       then status on the right. Actions live in menus, navigation lives in
       tabs, and the pill says which world you are in — one row, one job per
       region, instead of an eleven-item rail competing with in-page controls. -->
  <header class="menubar">
    <a class="menubar-logo" href="../" title="Back to Cade's Tools" aria-label="Back to Cade's Tools">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
      </svg>
      <span class="menubar-logo-text">Cade.project</span>
    </a>

    <!-- New -->
    <div class="menu-wrap">
      <button class="menu-trigger" data-menu="new">New</button>
      <div class="menu-dropdown" id="menu-new">
        <button class="menu-item" onclick="App.menuAction('openNewEntry','task')"><span>Task</span><kbd>Ctrl+N</kbd></button>
        <button class="menu-item" onclick="App.menuAction('openNewEntry','goal')"><span>Goal</span><span></span></button>
        <button class="menu-item" onclick="App.menuAction('openNewEntry','habit')"><span>Habit</span><span></span></button>
        <button class="menu-item" onclick="App.menuAction('openNewEntry','reminder')"><span>Reminder</span><span></span></button>
        <div class="menu-separator"></div>
        <button class="menu-item" onclick="App.menuAction('openProjectModal')"><span>Project</span><span></span></button>
        <button class="menu-item" onclick="App.menuAction('openNewSubproject')" title="Also creates the matching room in Cade.txt"><span>Sub-project…</span><span></span></button>
        <div class="menu-separator"></div>
        <button class="menu-item" onclick="App.menuAction('addScratchFromMenu')"><span>Scratch Idea…</span><span></span></button>
        <button class="menu-item" onclick="App.menuAction('openPasteImport')"><span>Paste Tasks…</span><span></span></button>
      </div>
    </div>

    <!-- View -->
    <div class="menu-wrap">
      <button class="menu-trigger" data-menu="view">View</button>
      <div class="menu-dropdown" id="menu-view">
        <button class="menu-item" onclick="App.menuAction('switchTab','today')"><span>Today</span><span></span></button>
        <button class="menu-item" onclick="App.menuAction('switchTab','projects')"><span>Projects</span><span></span></button>
        <button class="menu-item" onclick="App.menuAction('switchTab','habits')"><span>Habits</span><span></span></button>
        <button class="menu-item" onclick="App.menuAction('switchTab','planner')"><span>Planner</span><span></span></button>
        <button class="menu-item" onclick="App.menuAction('switchTab','insights')"><span>Insights</span><span></span></button>
        <button class="menu-item" onclick="App.menuAction('switchTab','history')"><span>History</span><span></span></button>
        <div class="menu-separator"></div>
        <button class="menu-item" onclick="App.menuAction('switchTab','focus')"><span>Focus Matrix</span><span></span></button>
        <button class="menu-item" onclick="App.menuAction('switchTab','scratch')"><span>Scratchpad</span><span></span></button>
        <button class="menu-item" onclick="App.menuAction('switchTab','health')"><span>Health</span><span></span></button>
        <button class="menu-item" onclick="App.menuAction('switchTab','tools')"><span>Tools</span><span></span></button>
        <div class="menu-separator"></div>
        <button class="menu-item" onclick="App.menuAction('openSearch')"><span>Search &amp; Commands</span><kbd>Ctrl+K</kbd></button>
        <button class="menu-item" onclick="App.menuAction('toggleTheme')"><span id="themeMenuLabel">Theme</span><span></span></button>
      </div>
    </div>

    <!-- Track -->
    <div class="menu-wrap">
      <button class="menu-trigger" data-menu="track">Track</button>
      <div class="menu-dropdown" id="menu-track">
        <button class="menu-item" onclick="App.menuAction('openShutdown')"><span>Shutdown Review…</span><span></span></button>
        <div class="menu-separator"></div>
        <button class="menu-item" onclick="App.menuAction('openTimer')"><span>Timer</span><span></span></button>
        <button class="menu-item" onclick="App.menuAction('stopAllTimers')"><span>Stop All Timers</span><span></span></button>
        <div class="menu-separator"></div>
        <button class="menu-item" onclick="App.menuAction('openQuickLog')"><span>Quick Log</span><span></span></button>
        <button class="menu-item" onclick="App.menuAction('openCalorieLog')"><span>Log Food…</span><span></span></button>
        <div class="menu-separator"></div>
        <button class="menu-item" onclick="App.menuAction('openDailyReview')"><span>Daily Review</span><span></span></button>
        <button class="menu-item" onclick="App.menuAction('openAutoPlan')"><span>Auto-plan Day…</span><span></span></button>
      </div>
    </div>

    <!-- Data -->
    <div class="menu-wrap">
      <button class="menu-trigger" data-menu="data">Data</button>
      <div class="menu-dropdown" id="menu-data">
        <button class="menu-item" onclick="App.menuAction('openSyncConfig')"><span>Firebase Sync…</span><span></span></button>
        <button class="menu-item" onclick="App.menuAction('openBridgePanel')" title="Rooms and workspaces shared with Cade.txt"><span>Cade.txt Link…</span><span></span></button>
        <div class="menu-separator"></div>
        <button class="menu-item" onclick="App.menuAction('openManageProjects')"><span>Manage Projects…</span><span></span></button>
        <button class="menu-item" onclick="App.menuAction('openManageTags')"><span>Manage Tags…</span><span></span></button>
        <button class="menu-item" onclick="App.menuAction('openManageShortcuts')"><span>Quick Shortcuts…</span><span></span></button>
        <button class="menu-item" onclick="App.menuAction('openTrash')"><span>Trash…</span><span></span></button>
        <div class="menu-separator"></div>
        <button class="menu-item" onclick="App.menuAction('exportForLLM')"><span>Copy for LLM</span><span></span></button>
        <button class="menu-item" onclick="App.menuAction('exportData')"><span>Export Backup</span><span></span></button>
        <button class="menu-item" onclick="App.menuAction('importData')"><span>Import Backup…</span><span></span></button>
        <div class="menu-separator"></div>
        <button class="menu-item" onclick="App.menuAction('switchTab','settings')"><span>Preferences</span><span></span></button>
        <button class="menu-item" onclick="App.menuAction('hardRefresh')"><span>Refresh App &amp; Cache</span><span></span></button>
      </div>
    </div>

    <!-- Narrow screens: all four menus in one sheet -->
    <button class="menu-trigger menu-more" id="menuMore" aria-label="Menu" title="Menu">⋯</button>

    <!-- Workspace pill (active project scope + switcher) -->
    <div class="ws-pill-wrap">
      <button class="ws-pill" id="wsPill" type="button" title="Switch workspace" onclick="App.toggleWorkspaceMenu(event)">
        <span class="ws-pill-dot"></span>
        <span class="ws-pill-name">All Projects</span>
        <span class="ws-pill-caret">▾</span>
      </button>
      <div class="ws-dropdown" id="wsDropdown"></div>
    </div>

    <!-- View tabs (desktop) / view select (mobile) -->
    <nav class="view-tabs" id="viewTabs"></nav>
    <div class="view-mobile-select" id="viewMobileSelect"></div>

    <div class="menubar-spacer"></div>

    <div class="menubar-actions">
      <button class="timer-indicator" id="timerIndicator" style="display:none;" onclick="Timers.openPanel()" aria-label="Timers running — open timer window" title="Timers running — click to open"></button>
      <button class="icon-btn" id="searchBtn" aria-label="Search and commands (Ctrl+K)" title="Search &amp; commands — Ctrl K"><i data-lucide="search" style="width:18px;height:18px"></i></button>
      <div id="syncStatus" class="sync-dot offline" style="display:none;" title="Sync: disconnected" aria-label="Sync status" onclick="App.openSyncConfig()"></div>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme"></button>
    </div>
  </header>

  <!-- ═══ MOBILE MENU SHEET (filled from the four dropdowns) ═══ -->
  <div class="menu-sheet" id="menuSheet"></div>

  <!-- ═══ SUB-PROJECT TABS ═══
       The rooms of the active workspace, exactly as Cade.txt lists them.
       Empty sub-projects stay hidden unless something was finished there
       today, so the strip shows work rather than history. -->
  <nav class="sub-tabs" id="subTabs" style="display:none;"></nav>

  <!-- ═══ MAIN CONTENT ═══ -->
  <main class="main-content" id="mainContent">
    <!-- Views rendered here by JS -->
  </main>

  <!-- ═══ FAB ═══ -->
  <button class="fab" id="fabBtn" aria-label="Add new"><i data-lucide="plus" style="width:24px;height:24px"></i></button>

  <!-- ═══ MODAL ROOT ═══ -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-dialog" id="modalDialog">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">New Entry</h2>
        <button class="icon-btn" id="modalClose" aria-label="Close"><i data-lucide="x" style="width:18px;height:18px"></i></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <!-- ═══ FLOATING TIMER WINDOW (no overlay — app stays usable) ═══ -->
  <div class="slide-panel" id="slidePanel">
    <div class="slide-panel-header">
      <h2 class="modal-title" id="panelTitle">Timer</h2>
      <button class="icon-btn" id="panelClose" aria-label="Close — timers keep running" title="Close — timers keep running"><i data-lucide="x" style="width:18px;height:18px"></i></button>
    </div>
    <div class="slide-panel-body" id="panelBody"></div>
  </div>

  <!-- ═══ TOAST ═══ -->
  <div class="toast" id="toast"></div>

  <!-- ═══ SCRIPTS ═══ -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="state.js"></script>
  <script src="sync.js"></script>
  <script src="bridge.js"></script>
  <script src="charts.js"></script>
  <script src="timers.js"></script>
  <script src="palette.js"></script>
  <script src="app.js"></script>
</body>
</html>
